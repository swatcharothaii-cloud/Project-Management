  /* Safety net for the full-bleed (100vw) Purchasing Plan table wrap below:
     on a desktop browser with a classic (non-overlay) scrollbar, 100vw is
     measured against the initial containing block, which includes the
     scrollbar's own width, so a 100vw-wide element can end up a few pixels
     wider than the actually-visible viewport and add a stray horizontal
     scrollbar to the whole page. Clipping it here costs nothing (nothing in
     this app relies on horizontal page overflow) and keeps that always off. */
  overflow-x:hidden;
}

.linklike{background:none;border:none;padding:0;font:inherit;color:var(--purple-600);text-decoration:underline;cursor:pointer}

/* Column widths come from the <colgroup> in the markup (14 physical
   columns). table-layout:fixed makes each column's width exactly match its
   <col>, independent of cell content -- including the colspan="14" body
   row used for category headers, which now correctly sums the 14 columns'
   widths instead of being sized by content. */
.mp-table th.mp-th-group{text-align:center;background:var(--purple-50);color:var(--purple-700)}

/* ROOT CAUSE of the category-row width bug, finally found: this rule used
   a blanket :last-child selector meant only for the actions column of a
   normal data row, but the category header row's <td colspan="14"> is
   ALSO its <tr>'s last (and only) child, so it matched too. Switching that
   cell's display from table-cell to flex takes it out of the table layout
   algorithm entirely, so instead of spanning all 14 columns it shrinks to
   fit its own content (~45px) - reproducing at every combination of
   colgroup/nth-child widths and single/double header rows that was tested.
   Scoped with :not(.mp-cat-row td) so only real data rows get the flex
   actions cell. */
.mp-table tbody tr:not(.mp-cat-row) td:last-child{display:flex;gap:5px;flex-wrap:wrap}

.mp-procure-dot.idle{background:var(--purple-500)}
.mp-procure-dot.mps-order{background:var(--amber-500)}

/* ---------- Master Plan: full-bleed breakout ----------
   main{} centers content at max-width:1180px, which is right for every
   other screen but leaves distracting blank margins beside a wide
   table+timeline. This one screen breaks out to the actual viewport width
   (the classic negative-margin trick: 50% of the centered parent minus 50%
   of the viewport cancels the parent's own centering) while keeping its own
   side padding so content still isn't flush against the browser edge. */
.mp-full-bleed{width:100vw;margin-left:calc(-50vw + 50%);margin-right:calc(-50vw + 50%);padding:0 18px;box-sizing:border-box}
@media(max-width:900px){.mp-full-bleed{padding:0 10px}}

/* ---------- Master Plan: Gantt chart (the single, merged table+timeline view) ---------- */
.gantt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gantt-toolbar .hint{font-size:11.5px;color:var(--ink-300)}
/* A second, synced horizontal scrollbar placed above the chart -- the real
   one lives at the bottom of .gantt-outer, which on a long BOQ can be
   hundreds of rows down and out of reach without scrolling the whole page
   first. This bar's own content is a 1px-tall spacer exactly as wide as the
   chart, so its native scrollbar thumb is proportioned to match, and
   wireMasterPlan() mirrors scrollLeft between the two in both directions. */
.gantt-topscroll,.table-topscroll{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:6px}
.gantt-topscroll>div,.table-topscroll>div{height:1px}
/* Full-bleed, self-scrolling wide-table panel (currently used by the
   Purchasing Plan screen) -- same "own bounded height + sticky header"
   technique as .gantt-outer above, applied to a plain <table> instead of the
   Gantt's div-grid. margin-left/right:calc(50% - 50vw) is the standard
   "break out of a centered max-width container" trick: 50% resolves against
   this element's own containing block (main's centered 1180px box) while
   50vw resolves against the real viewport, so the difference re-centers a
   100vw-wide element on the viewport regardless of how narrow or offset its
   parent is -- letting the table use the full window width instead of being
   squeezed into main's max-width:1180px column. The topscroll bar above the
   table gets the exact same full-bleed treatment so the two stay aligned. */
.pp-wrap,.pp-wrap-topscroll{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);box-sizing:border-box;padding-left:18px;padding-right:18px}
.pp-wrap{max-height:calc(100vh - 220px);overflow-y:auto}
.pp-table thead th{position:sticky;top:0;z-index:5}
.gantt-scroll-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-700);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gantt-scroll-btn:hover{background:var(--surface-2)}
/* overflow-x:auto here (needed for the horizontal date-scroll) forces
   overflow-y to also become a real scroll container per the CSS spec's
   "overflow computed value" rule -- you can't have one axis auto and the
   other visible, the visible one gets promoted to auto too. That's exactly
   what a sticky header inside this element needs anyway: position:sticky
   only pins relative to its nearest ancestor that actually scrolls, so a
   header can't stay "stuck" against the page scroll while living inside a
   non-scrolling wrapper. Giving this element its own bounded height turns
   it into a self-contained, independently-scrolling panel (the way a
   spreadsheet or Excel-style frozen-header grid works) so the sticky header
   row below has a real scroll context to pin against. */
.gantt-outer{overflow:auto;max-height:calc(100vh - 220px);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:16px;background:var(--surface)}
.gantt-inner{position:relative}
.gantt-deps-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.gantt-row{display:flex}
.gantt-label-col{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;font-size:12px;display:flex;flex-direction:column;justify-content:center;flex-shrink:0;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Item row grid: task name+sub, start, end, days, [order date | delivery
   date | status -- the purchasing-plan columns folded in from the old
   separate "table" view], progress%. */
.gantt-label-col.item-cols{display:grid;grid-template-columns:1fr 92px 92px 30px 92px 92px 98px 58px;column-gap:6px;align-items:center}
.gantt-label-col.item-cols>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;color:var(--ink-500)}
.gantt-label-col.item-cols .gl-name-cell{display:flex;align-items:center;gap:8px;min-width:0}
.gantt-label-col.item-cols .gl-taskwrap{min-width:0;overflow:hidden}
.gantt-label-col.item-cols .gl-task{font-size:12px;color:var(--ink-900);display:flex;align-items:flex-start;gap:4px}
.gantt-label-col.item-cols .gl-task-name{min-width:0;flex:1;white-space:normal;overflow-wrap:break-word;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gantt-label-col.item-cols .gl-task .mp-status-dot,.gantt-label-col.item-cols .gl-task .mp-procure-dot{margin-top:4px;flex-shrink:0}
.gantt-label-col.item-cols .gl-sub{font-size:9.5px;color:var(--ink-300);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:16px}
.gantt-label-col.item-cols .gl-num{font-family:var(--font-mono);text-align:center}
.gl-mini-input,.gl-mini-select{font-size:10.5px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--surface);width:100%;box-sizing:border-box;color:var(--ink-700);font-family:var(--font-mono)}
.gl-mini-select{font-family:var(--font-body,inherit);padding:2px 1px}
input.gl-mini-input[type="date"]{min-width:0}
input.gl-mini-input[type="date"]::-webkit-datetime-edit{padding:0}
input.gl-mini-input[type="date"]::-webkit-calendar-picker-indicator{padding:2px;margin-left:2px}
.gl-mini-input:hover,.gl-mini-select:hover{border-color:var(--purple-400,var(--purple-500))}
.gl-mini-input:focus,.gl-mini-select:focus{outline:2px solid var(--purple-100,var(--purple-50));border-color:var(--purple-500)}
.gl-mini-badge{font-size:9px!important;padding:1px 5px!important;border-radius:999px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%;box-sizing:border-box}
.gl-progress-wrap{position:relative}
.gl-progress-input{padding-right:15px!important;text-align:right}
.gl-progress-input::-webkit-inner-spin-button,.gl-progress-input::-webkit-outer-spin-button{margin-left:2px}
.gl-pct{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--ink-400);pointer-events:none}
.gantt-header-row .gantt-label-col{display:grid;grid-template-columns:1fr 92px 92px 30px 92px 92px 98px 58px;column-gap:6px;align-items:center;font-size:10px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.02em}
.gantt-header-row .gantt-label-col>div{text-align:center;white-space:nowrap;overflow:hidden}
.gantt-header-row .gantt-label-col>div:first-child{text-align:left}
/* Pin the header row (task-column titles + month/day timeline strip) to the
   top of .gantt-outer's own scroll pane (see the comment on .gantt-outer)
   so it stays in view while scrolling down a long BOQ -- without it, once
   you scroll past the top there's no way to tell which date column a bar
   lines up with, or what each left-hand column means. z-index:10 sits above
   ordinary rows/bars (z-index 0-3) scrolling underneath, but below the
   page's own topbar/tabbar (39-40) and any modal (90+).
   IMPORTANT: sticky must go on .gantt-header-row itself, not on its two
   column children. A sticky box is constrained to stay within its own
   containing block -- normally its immediate parent's box -- and for
   .gantt-label-col/.gantt-timeline-col that parent is .gantt-header-row,
   which is exactly as tall as they are (42px). With zero extra height in
   the parent there's no room for the "stay behind while the box scrolls
   away" trick to ever manifest, so top:0 silently does nothing and the
   header just scrolls off like any other row. Putting it on the row
   instead makes its containing block .gantt-inner -- hundreds of px tall,
   holding every other row below it -- which is exactly the room sticky
   needs. .gantt-label-col keeps its own separate position:sticky;left:0
   (set on every row, not just this one) for the horizontal freeze; that
   still composes correctly once the row itself is pinned vertically,
   giving the usual spreadsheet "frozen corner" behaviour. */
.gantt-header-row{position:sticky;top:0;z-index:10;background:var(--surface)}
.gantt-cat-label{background:var(--surface-2);font-family:var(--font-display);font-weight:600;color:var(--ink-700);font-size:12.5px;padding:0 10px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:4px}
.gantt-timeline-col{position:relative;flex-shrink:0;box-sizing:border-box}
.gantt-row:not(.gantt-header-row):not(.gantt-cat-row) .gantt-timeline-col{height:60px;border-bottom:1px solid var(--line-soft)}
.gantt-row:not(.gantt-header-row):not(.gantt-cat-row) .gantt-label-col{height:60px;border-bottom:1px solid var(--line-soft)}
.gantt-cat-row .gantt-timeline-col,.gantt-cat-row .gantt-label-col{height:28px;background:var(--surface-2)}
.gantt-header-row .gantt-timeline-col{height:58px}
.gantt-header-row .gantt-label-col{height:58px;border-bottom:1px solid var(--line)}
.gantt-months{display:flex;height:22px;box-sizing:border-box}
.gantt-month-band{flex-shrink:0;font-size:11px;font-weight:600;color:var(--ink-500);text-align:center;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;box-sizing:border-box}
/* Day-of-week letters (จ/อ/พ/พฤ/ศ/ส/อา), one strip below the month band and
   above the day-of-month numbers -- weekend cells get the same tint as the
   day-number row below them plus red text, so Saturday/Sunday reads clearly
   before the reader even gets to the numbers or the bars underneath. */
.gantt-weekdays{display:flex;height:16px;box-sizing:border-box}
.gantt-weekday-cell{flex-shrink:0;font-size:9px;font-weight:600;color:var(--ink-500);text-align:center;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);box-sizing:border-box}
.gantt-weekday-cell.weekend{background:var(--weekend-tint);color:var(--coral-600)}
.gantt-days{display:flex;height:20px;box-sizing:border-box}
.gantt-daycell{flex-shrink:0;font-size:9.5px;color:var(--ink-300);text-align:center;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);box-sizing:border-box}
.gantt-daycell.weekend{background:var(--weekend-tint)}
.gantt-bar{position:absolute;top:18px;height:24px;border-radius:6px;overflow:visible;cursor:grab;box-shadow:var(--shadow-sm);display:flex;align-items:center;touch-action:none}
.gantt-bar.dragging{cursor:grabbing;box-shadow:0 4px 14px rgba(20,18,36,.28);z-index:3;opacity:.92}
.gantt-bar.on-track{background:var(--blue-500)}
.gantt-bar.near-due{background:var(--amber-500)}
.gantt-bar.overdue{background:var(--coral-500)}
.gantt-bar.done{background:var(--mint-500)}
.gantt-bar-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.32);border-radius:6px;overflow:hidden}
.gantt-bar-resize{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.gantt-bar-resize.left{left:-2px}
.gantt-bar-resize.right{right:-2px}
.gantt-bar-resize::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:12px;border-radius:2px;background:rgba(255,255,255,.85);opacity:0;transition:opacity .12s}
.gantt-bar:hover .gantt-bar-resize::after,.gantt-bar.dragging .gantt-bar-resize::after{opacity:1}
.gantt-bar-label{position:relative;z-index:1;color:#fff;font-size:11px;font-weight:600;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.3);pointer-events:none}
.gantt-bar-label-outside{position:absolute;top:18px;height:24px;display:flex;align-items:center;font-size:11px;color:var(--ink-700);white-space:nowrap}
.gantt-nodate-placeholder{position:absolute;top:18px;left:10px;height:24px;display:flex;align-items:center;font-size:10.5px;color:var(--ink-300);font-style:italic;white-space:nowrap}
.gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--coral-500);z-index:3;pointer-events:none}

.empty{
  border:1.5px dashed var(--line);border-radius:var(--radius-md);
  padding:34px 20px;text-align:center;color:var(--ink-500);font-size:13.5px;
}
.empty .ic{font-size:30px;margin-bottom:8px;display:block}

.stat{display:flex;flex-direction:column;gap:4px}
.stat .num{font-family:var(--font-mono);font-weight:600;font-size:24px;color:var(--ink-900)}
.stat .lbl{font-size:12px;color:var(--ink-500);font-weight:600}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink-900);color:var(--surface);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:80;opacity:0;
  transition:opacity .25s ease, transform .25s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed;inset:0;background:rgba(20,18,36,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:22px 22px 0 0;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow-lg)}
@media(min-width:720px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:var(--radius-lg)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-500)}

/* ---------- Photo grid ---------- */
.photo-drop{
  border:1.5px dashed var(--purple-100);border-radius:var(--radius-md);background:var(--purple-50);
  padding:22px;text-align:center;color:var(--purple-700);cursor:pointer;font-size:13.5px;font-weight:600;
}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo-item{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.photo-item img{width:100%;height:98px;object-fit:cover;display:block}
.photo-item input,.photo-item select{border:none;border-top:1px solid var(--line);border-radius:0;font-size:10.5px;padding:5px 7px;background:var(--surface);width:100%;display:block}
.photo-item .rm{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(20,18,36,.62);color:#fff;border:none;font-size:12px;line-height:1}
.photo-pdf-icon{height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:28px;background:var(--surface-2);color:var(--ink-500)}
/* Full-screen single-photo viewer opened by tapping a thumbnail in the
   reference-photo gallery modal. Sits above .modal-bg (z-index:90) since it
   opens from inside that modal and must cover it; closing the lightbox drops
   back to the gallery grid rather than closing the whole modal. */
.lightbox-overlay{position:fixed;inset:0;background:rgba(10,9,20,.92);z-index:95;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;box-sizing:border-box}
.lightbox-overlay img{max-width:100%;max-height:calc(100% - 50px);object-fit:contain;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg)}
.lightbox-close{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lightbox-close:hover{background:rgba(255,255,255,.22)}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lightbox-nav:hover{background:rgba(255,255,255,.22)}
.lightbox-nav.prev{left:16px}
.lightbox-nav.next{right:16px}
.lightbox-count{color:rgba(255,255,255,.75);font-size:12.5px;margin-top:12px;font-family:var(--font-mono)}
.photo-pdf-name{font-size:9.5px;padding:0 6px;text-align:center;word-break:break-word;line-height:1.2;max-height:2.4em;overflow:hidden}
.photo-drop.drag-over{background:var(--purple-100,var(--purple-50));border-color:var(--purple-500)}
.progressline{height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--purple-600)}

/* ---------- Request detail modal: two-column layout (info+table left, large photos right) ---------- */
.dt-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;margin-top:12px}
.dt-photos{display:flex;flex-direction:column;gap:12px}
.dt-photo-item{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line);background:var(--surface-2);box-shadow:var(--shadow-sm)}
.dt-photo-item img{width:100%;height:auto;max-height:340px;object-fit:contain;display:block;background:#000}
.dt-photo-cap{padding:8px 10px;font-size:11.5px;color:var(--ink-500);border-top:1px solid var(--line)}
.dt-photo-pdf{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.dt-photo-pdf .ic{font-size:26px}
.dt-photo-pdf .nm{font-size:12px;font-weight:600;word-break:break-word}
.dt-photo-empty{border:1.5px dashed var(--line);border-radius:var(--radius-md);padding:22px 10px;text-align:center;color:var(--ink-300);font-size:12px}
@media(max-width:820px){.dt-layout{grid-template-columns:1fr}.dt-photo-item img{max-height:220px}}

/* ---------- Per-line photo attachment (material request form) ---------- */
.rq-line-row3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.rq-line-photo-btn{font-size:11px;font-weight:600;color:var(--purple-700);background:var(--purple-50);border:1px solid var(--purple-100);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.rq-line-photo-strip{display:flex;gap:6px;flex-wrap:wrap}
.rq-line-thumb{position:relative;width:40px;height:40px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.rq-line-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rq-line-thumb.pdf{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-500)}
.rq-line-thumb .rm{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:rgba(20,18,36,.7);color:#fff;border:none;font-size:9px;line-height:1}

/* ---------- Dashboard ---------- */
.kpi{padding:18px}
.kpi .num{font-size:28px}
.svcurve{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-500)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* ---------- Report ---------- */
#reportPrintable{background:#fff;color:#1E1B31;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.rp-preview{background:#fff;color:#1E1B31;border-radius:var(--radius-lg);overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);max-height:65vh}
.rp-head{background:linear-gradient(135deg,#4F46E5,#6366F1);color:#fff;padding:26px 26px 22px}
.rp-head .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.rp-head h1{font-size:20px;margin-top:6px;font-family:'Kanit',sans-serif}
.rp-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 20px;padding:18px 26px;background:#EEF2FF;font-size:12.5px;border-bottom:1px solid #E3E1F0}
.rp-meta b{display:block;color:#4F46E5;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.rp-section{padding:20px 26px;border-bottom:1px solid #E3E1F0}
.rp-section:last-child{border-bottom:none}
.rp-section h3{font-size:13.5px;color:#4F46E5;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-family:'Kanit',sans-serif}
.rp-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rp-summary .box{background:#F7F8FE;border:1px solid #E3E1F0;border-radius:14px;padding:14px}
.rp-summary .box .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px}
.rp-photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rp-photogrid figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid #E3E1F0}
.rp-photogrid img{width:100%;height:110px;object-fit:cover;display:block}
.rp-photogrid figcaption{font-size:10.5px;padding:6px 8px;background:#F7F8FE;color:#3E3A57}
.rp-pdf-figure{display:flex;flex-direction:column}
.rp-pdf-icon{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:38px;background:#F7F8FE}
.rp-foot{padding:16px 26px;font-size:11px;color:#6B6784;display:flex;justify-content:space-between;background:#F7F8FE}

/* ---------- Role switcher ---------- */
.role-switch{
  display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:4px;
}
.role-switch button{
  border:none;background:none;color:rgba(255,255,255,.78);font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:999px;white-space:nowrap;
}
.role-switch button.active{background:#fff;color:var(--purple-700)}
.role-note{font-size:11.5px;color:var(--ink-500);display:flex;align-items:center;gap:6px;background:var(--purple-50);border:1px solid var(--purple-100);padding:8px 12px;border-radius:var(--radius-sm)}

/* ---------- Language switcher ---------- */
.lang-switch{
  display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:4px;
}
.lang-switch button{
  border:none;background:none;color:rgba(255,255,255,.78);font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:999px;white-space:nowrap;
}
.lang-switch button.active{background:#fff;color:var(--purple-700)}

/* ---------- Daily log: meta strip + mini rows (progress entries) ---------- */
.meta-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--purple-700);font-weight:700;margin-bottom:2px}
.mini-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.mini-row .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini-row .txt .t1{font-weight:600;font-size:13px;color:var(--ink-900)}
.mini-row .txt .t2{font-size:11.5px;color:var(--ink-500)}

/* ---------- Badges: approval states ---------- */
.badge.pending{background:var(--amber-50);color:var(--amber-600)}
.badge.approved{background:var(--mint-50);color:var(--mint-600)}
.badge.rejected{background:var(--coral-50);color:var(--coral-600)}
.badge.scheduled{background:var(--blue-50);color:var(--blue-600)}
.badge.duesoon{background:var(--amber-50);color:var(--amber-600)}
.badge.warn{background:var(--amber-50);color:var(--amber-600)}
/* Manual BOQ-item order status (Master Plan & BOQ, items with no linked request) */
.badge.mps-order{background:var(--amber-50);color:var(--amber-600)}
.badge.mps-payment{background:var(--purple-50);color:var(--purple-700)}
.badge.mps-delivery{background:var(--blue-50);color:var(--blue-600)}
.badge.mps-cancelled{background:var(--coral-50);color:var(--coral-600)}
/* Purchasing Plan (แผนสั่งของ) order/payment status vocabulary -- its own
   5-state order status (incl. "no need to order" for labor/service lines)
   and separate payment-status axis, kept visually distinct from the Master
   Plan chart's mps-* set above even though a couple of colors repeat. */
.badge.pp-not-ordered{background:var(--amber-50);color:var(--amber-600)}
.badge.pp-shipping{background:var(--blue-50);color:var(--blue-600)}
.badge.pp-ordered{background:var(--mint-50);color:var(--mint-600)}
.badge.pp-cancelled{background:var(--coral-50);color:var(--coral-600)}
.badge.pp-noneed{background:var(--surface-2);color:var(--ink-500)}
.badge.pp-pay-pending{background:var(--amber-50);color:var(--amber-600)}
.badge.pp-pay-paid{background:var(--mint-50);color:var(--mint-600)}
.badge.pp-pay-cancelled{background:var(--coral-50);color:var(--coral-600)}
/* Color the order/payment <select> itself (not just a badge) so a row's
   status reads at a glance while still being a plain, immediately-editable
   dropdown -- no extra click into a separate "edit" mode needed. */
select.pp-status-select{border-radius:6px;font-weight:600;font-size:12.5px}
select.pp-status-select.pp-not-ordered,select.pp-status-select.pp-pay-pending{background:var(--amber-50);color:var(--amber-600);border-color:var(--amber-500)}
select.pp-status-select.pp-shipping{background:var(--blue-50);color:var(--blue-600);border-color:var(--blue-500)}
select.pp-status-select.pp-ordered,select.pp-status-select.pp-pay-paid{background:var(--mint-50);color:var(--mint-600);border-color:var(--mint-500)}
select.pp-status-select.pp-cancelled,select.pp-status-select.pp-pay-cancelled{background:var(--coral-50);color:var(--coral-600);border-color:var(--coral-500)}
select.pp-status-select.pp-noneed{background:var(--surface-2);color:var(--ink-500)}
.pp-table tr.pp-row-overdue td{background:var(--coral-50)}
.pp-table tr.pp-row-duesoon td{background:var(--amber-50)}
.pp-table input,.pp-table select{font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-700);box-sizing:border-box;width:100%}
/* table-layout:auto (inherited from .budget-table) sizes every column to its
   unwrapped content width and only wraps when the table itself is squeezed
   -- but .pp-wrap scrolls horizontally, so it never squeezes and nothing
   ever wraps, which is exactly why the table needed a scrollbar at all.
   table-layout:fixed instead takes the widths declared below on the header
   cells as the real column widths (proportionally stretched or shrunk to
   fill the table's own width, so the whole 17-column table always fits
   whatever the viewport is) and wraps/truncates cell content to match --
   the actual fix for "every item fits within one page width". Each
   input/select is width:100% of its <td> above so it always matches its
   column exactly, with a single source of truth (the widths below) instead
   of two numbers that can drift apart. */
.pp-table{table-layout:fixed;width:100%}
.pp-table th,.pp-table td{padding:6px 8px}
/* Header labels are long Thai phrases with no spaces to break on, so plain
   white-space:normal doesn't wrap them -- overflow-wrap:anywhere forces a
   break inside the column instead of stretching it. The item-name column
   (2nd) gets the same treatment on its body cells so long names wrap onto
   multiple lines instead of forcing the column (and the whole table) wider
   -- this replaces the inherited .budget-table td:nth-child(3) rule, which
   was written for the Budget screen's own 3rd column and was landing on
   this table's Unit column instead. */
.pp-table th{white-space:normal;overflow-wrap:anywhere;line-height:1.3;vertical-align:bottom;font-size:11.5px}
.pp-table td:nth-child(1),.pp-table th:nth-child(1){white-space:nowrap;width:3.4%}
.pp-table td:nth-child(2),.pp-table th:nth-child(2){white-space:normal;overflow-wrap:anywhere;width:15.4%}
.pp-table td:nth-child(3),.pp-table th:nth-child(3){white-space:nowrap;width:3.6%}
.pp-table td:nth-child(4),.pp-table th:nth-child(4){width:5.8%}
.pp-table td:nth-child(5),.pp-table th:nth-child(5){width:5.8%}
.pp-table td:nth-child(6),.pp-table th:nth-child(6){width:9.6%}
.pp-table td:nth-child(7),.pp-table th:nth-child(7){white-space:nowrap;width:5.4%}
.pp-table td:nth-child(8),.pp-table th:nth-child(8){width:8.8%}
.pp-table td:nth-child(9),.pp-table th:nth-child(9){width:5%}
.pp-table td:nth-child(10),.pp-table th:nth-child(10){white-space:nowrap;width:5.4%}
.pp-table td:nth-child(11),.pp-table th:nth-child(11){white-space:nowrap;width:6.8%}
.pp-table td:nth-child(12),.pp-table th:nth-child(12){width:5.8%}
.pp-table td:nth-child(13),.pp-table th:nth-child(13){width:7.2%}
.pp-table td:nth-child(14),.pp-table th:nth-child(14){width:10.4%}
.pp-table td:nth-child(15),.pp-table th:nth-child(15){width:5.6%}
.pp-table td:nth-child(16),.pp-table th:nth-child(16){width:7.6%}
.pp-table td:nth-child(17),.pp-table th:nth-child(17){width:8.4%}
.pp-table select{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-table .badge{white-space:nowrap;padding:3px 8px;font-size:11px}
.pp-table .budget-cat-row td{white-space:nowrap}

/* ---------- Kanban ----------
   The 4 status columns are a fixed set (not a variable-length list), so they
   sit inside one shared .card -- like every other page in the app -- and
   split it into even compartments with a hairline divider between them,
   instead of floating loose on the page background with room to sprawl on
   wide screens. Below 900px there usually isn't room for 4 columns side by
   side without squeezing each one too narrow to read, so they stack into
   one column and the divider becomes a bottom rule instead. */
.kanban-card{padding:14px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.kcol{display:flex;flex-direction:column;gap:8px;padding:0 12px;min-width:0}
.kcol:first-child{padding-left:2px}
.kcol:last-child{padding-right:2px}
.kcol:not(:last-child){border-right:1px solid var(--line)}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;border-bottom:1px solid var(--line)}
.kcol-head b{font-family:var(--font-display);font-size:12.5px}
.kcol-head .count{font-size:11px;background:var(--surface-2,var(--surface));border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:700;color:var(--ink-500)}
.kcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);
  border-left:3px solid var(--line);
}
.kcard:hover{border-color:var(--purple-500)}
.kcard.pending{border-left-color:var(--amber-500)}
.kcard.approved{border-left-color:var(--mint-500)}
.kcard.rejected{border-left-color:var(--coral-500)}
.kcard.scheduled{border-left-color:var(--blue-500)}
.kcard .reqno{font-family:var(--font-mono);font-size:11px;color:var(--ink-300)}
.kcard .title{font-weight:600;font-size:13px;line-height:1.35}
.kcard .meta{font-size:11px;color:var(--ink-500)}
.empty-col{border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;color:var(--ink-300);font-size:11.5px}
@media (max-width:900px){
  .kanban{grid-template-columns:1fr;gap:16px}
  .kcol{padding:0;border-right:none!important}
  .kcol:not(:last-child){padding-bottom:14px;border-bottom:1px solid var(--line)}
}

/* ---------- Request detail / timeline ---------- */
.rq-lines{display:flex;flex-direction:column;gap:8px}
.rq-line-card{border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:8px;background:var(--surface)}
.rq-line-row{display:grid;grid-template-columns:1.6fr .7fr .7fr 1fr auto;gap:8px;align-items:center}
@media(max-width:640px){.rq-line-row{grid-template-columns:1fr 1fr;}.rq-line-row input{width:100%}}
.rq-line-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
@media(max-width:640px){.rq-line-row2{grid-template-columns:1fr}}
.rq-line-row2 select{font-size:12.5px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl-step:last-child{border-bottom:none}
.tl-dot{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.tl-dot.done{background:var(--mint-50);border-color:var(--mint-500)}
.tl-dot.rej{background:var(--coral-50);border-color:var(--coral-500)}
.tl-dot.wait{background:var(--amber-50);border-color:var(--amber-500)}
.tl-body b{font-size:12.5px;display:block}
.tl-body span{font-size:11.5px;color:var(--ink-500)}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn.approve{background:linear-gradient(135deg,var(--mint-500),var(--mint-600));color:#fff}
.btn.reject{background:linear-gradient(135deg,var(--coral-500),var(--coral-600));color:#fff}
.btn.schedule{background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.split{grid-template-columns:.9fr 1.3fr}}

@media print{
  body *{visibility:hidden}
  #reportPrintable,#reportPrintable *{visibility:visible}
  /* .screen's "rise" entrance animation (see .screen{animation:rise...})
     finishes on transform:none, but with animation-fill-mode:both still
     holding it there, some browsers compute that as an explicit identity
     matrix rather than the literal keyword "none" -- and *any* computed
     transform on an ancestor, even a no-op one, makes it the containing
     block for a position:absolute/fixed descendant. That silently made
     #reportPrintable position itself relative to .screen (which still sits
     below the now-hidden topbar/tabbar in normal flow) instead of the
     actual page top, printing with a large dead gap above the report no
     matter how small @page's own margin was set. Killing the animation for
     print removes that stray containing block so top:0 means the real top.
  */
  .screen{animation:none!important;transform:none!important}
  #reportPrintable{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:none;border-radius:0}
  @page{size:auto;margin:5mm}
  /* Note: the bigger gap some browsers still show above/below the page --
     the one with the page title/URL/date/page-number printed in it -- is
     the browser's own "Headers and footers" print option, not page margin.
     CSS/@page cannot turn that off; it's a checkbox in the print dialog's
     "More settings" that the person printing controls on their end. */
  /* The on-screen report is spaced for comfortable reading, which was
     overflowing onto a second printed page even for a fairly short day's
     entries (the default browser print margin alone is ~19mm/side, on top
     of this generous padding). These overrides only kick in when printing
     -- !important is needed since several of the sizes below are set as
     inline styles at render time in reportBodyHtml(). A very long day
     (many workforce rows, entries, or photos) can still spill onto a
     second page -- that's real content, not something to shrink away --
     but a typical day's report now fits on one. */
  #reportPrintable .rp-head{padding:12px 16px 10px!important}
  #reportPrintable .rp-head img{width:30px!important;height:30px!important}
  #reportPrintable .rp-head .tag{font-size:8.5px!important}
  #reportPrintable .rp-head h1{font-size:15px!important;margin-top:3px!important}
  #reportPrintable .rp-company-info{font-size:10px!important;margin-top:5px!important;line-height:1.35!important}
  #reportPrintable .rp-meta{padding:8px 16px!important;gap:4px 14px!important;font-size:10.5px!important}
  #reportPrintable .rp-meta b{font-size:9px!important;margin-bottom:0!important}
  #reportPrintable .rp-section{padding:8px 16px!important;page-break-inside:avoid}
  #reportPrintable .rp-section h3{font-size:11px!important;margin-bottom:6px!important}
  #reportPrintable .rp-section p{font-size:10.5px!important;line-height:1.4!important}
  #reportPrintable table{font-size:10.5px!important}
  #reportPrintable th,#reportPrintable td{padding:4px 7px!important}
  #reportPrintable .rp-photogrid{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
  #reportPrintable .rp-photogrid img{height:130px!important}
  #reportPrintable .rp-photogrid figcaption{font-size:8.5px!important;padding:3px 5px!important}
  #reportPrintable .rp-foot{padding:6px 16px!important;font-size:9px!important}
}
.exported-wrap{margin-top:10px;text-align:center}
.exported-wrap img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.exported-wrap p{font-size:11.5px;color:var(--ink-500);margin-top:8px}

@media (max-width:640px){
  .topbar{padding:12px 14px;gap:8px}
  .topbar .status-pill{display:none}
  .topbar .brand .txt span{display:none}
  .topbar .lang-switch,.topbar .role-switch{gap:2px;padding:3px}
  .topbar .lang-switch button,.topbar .role-switch button{padding:5px 8px;font-size:11px}
  main{padding:16px 12px 90px}
  .rp-head,.rp-meta,.rp-section,.rp-foot{padding-left:16px;padding-right:16px}
}
@media (max-width:400px){
  .topbar .brand .mark{width:32px;height:32px}
  .topbar .brand .txt b{font-size:13.5px}
}

/* Master Plan / BOQ table -> stacked cards on narrow screens, so long item
   names and 7 data columns never force horizontal scrolling. */
@media (max-width:760px){
  .mp-wrap{overflow-x:visible;border:none;border-radius:0}
  .mp-table, .mp-table tbody{display:block;width:100%}
  .mp-table thead{display:none}
  .mp-table tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;padding:4px 14px;box-shadow:var(--shadow-sm)}
  .mp-table td{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;white-space:normal;text-align:right;border-bottom:1px solid var(--line);padding:9px 0;width:auto!important}
  .mp-table tr td:last-child{border-bottom:none}
  .mp-table td[data-label]:not([data-label=""])::before{content:attr(data-label);flex:none;color:var(--ink-500);font-size:12px;text-align:left;padding-top:1px}
  .mp-table td:first-child{justify-content:center;padding:12px 0}
  .mp-table td.mp-name-cell{text-align:left;justify-content:flex-start;font-weight:600}
  .mp-table td:last-child{justify-content:flex-end;gap:8px}
  .mp-table tr.mp-cat-row{display:block;background:none;border:none;box-shadow:none;padding:0;margin:18px 2px 8px}
  .mp-table tr.mp-cat-row td{display:block;background:var(--purple-50);color:var(--purple-700);border:none;border-radius:var(--radius-sm);padding:9px 12px}
  .mp-table tr.mp-cat-row td::before{content:none}
}
</style>

// is what makes cloud sync possible without touching hundreds of call

/* ============================= CLOUD SYNC (Firestore: project + company data) =============================
   Firestore doc shape mirrors the localStorage shape exactly, split into:
     meta/settings          -- { contractor, contractors, approvers } (company-wide, not per-project)
     projects/{projectId}   -- one doc per project, the same shape state.projects[] already uses
   role/lang stay device-local only (localStorage), same as before -- those
   are personal UI preferences, not shared business data.

   Echo prevention: every push records the exact JSON it sent in
   lastPushedMetaJSON / lastPushedProjectJSON, keyed by project id. When our
   own write round-trips back through onSnapshot, the incoming JSON matches
   what we just sent, so applyCloudMeta/applyCloudProject recognize it as an
   echo and skip re-applying it (which would otherwise be a harmless no-op
   render, but also the mechanism that would turn a real remote change loop
   into an infinite one if something upstream ever double-fired).

   Startup race (real incident, now fixed): bootstrap() runs synchronously
   and calls saveData() several times while seeding this device's local
   copy (demo data / the built-in Richmond project template) -- BEFORE
   initCloudSync() has had a chance to check whether Firestore already has
   real shared data. Firestore's very first read on a cold connection can
   easily take longer than the 700ms debounce below, especially over a
   slow/high-latency link. If it does, the debounced push fires first and
   pushes this device's freshly-seeded local placeholder -- which does NOT
   match the real shared project -- straight over the real documents via
   .set(), silently destroying real data (this happened twice in
   production: a whole batch of real material requests got overwritten
   back to "trashed" because that's what happened to be true in the stale
   local copy at that moment). The fix: cloudSyncReady stays false until
   initCloudSync()'s first read has resolved (or definitively failed), and
   scheduleCloudPush() refuses to arm the push timer until then -- saveData()
   still saves locally right away either way, only the network push waits. */
let cloudPushTimer = null;
let lastPushedMetaJSON = null;
let lastPushedProjectJSON = {}; // projectId -> last JSON we pushed/received for it
let pendingSafeRerender = false;
let cloudSyncReady = false; // true once initCloudSync()'s first read resolves/fails
let pushPendingWhenReady = false; // a saveData() happened before we knew it was safe to push
function scheduleCloudPush(){
  if(!cloudSyncReady){ pushPendingWhenReady = true; return; }
  if(cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushStateToCloud, 700);
}
async function pushStateToCloud(){
  try{
    const metaJSON = JSON.stringify({contractor:state.contractor, contractors:state.contractors, approvers:state.approvers});
    if(metaJSON !== lastPushedMetaJSON){
      lastPushedMetaJSON = metaJSON;
      await cloudDb.collection('meta').doc('settings').set(JSON.parse(metaJSON));
    }
    for(const p of state.projects){
      const json = JSON.stringify(p);
      if(lastPushedProjectJSON[p.id] === json) continue;
      lastPushedProjectJSON[p.id] = json;
      await cloudDb.collection('projects').doc(p.id).set(p);
    }
  }catch(e){ /* offline -- next saveData() call (or the next app load) will retry */ }
}
// A remote change arriving mid-keystroke would otherwise yank focus out from
// under whatever the user is typing (render() rebuilds the whole DOM). This
// defers the re-render until no input/textarea/select is focused, checking
// every 1.5s -- good enough for the rare case of two people editing at once,
// without the complexity of a real per-field merge.
function safeRerender(){
  const isTyping = ()=>{ const ae=document.activeElement; return ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName); };
  if(!isTyping()){ render(); return; }
  if(pendingSafeRerender) return;
  pendingSafeRerender = true;
  const retry = ()=>{
    if(isTyping()){ setTimeout(retry,1500); return; }
    pendingSafeRerender = false;
    render();
  };
  setTimeout(retry,1500);
}
function applyCloudMeta(data){
  if(!data) return;
  const json = JSON.stringify(data);
  if(json === lastPushedMetaJSON) return; // our own write echoing back
  lastPushedMetaJSON = json;
  state.contractor = data.contractor || state.contractor;
  state.contractors = data.contractors || state.contractors;
  state.approvers = data.approvers || state.approvers;
  saveDataLocalOnly();
  safeRerender();
}
function applyCloudProject(id,data){
  const json = JSON.stringify(data);
  if(lastPushedProjectJSON[id] === json) return; // our own write echoing back
  lastPushedProjectJSON[id] = json;
  const idx = state.projects.findIndex(p=>p.id===id);
  if(idx>=0) state.projects[idx] = data; else state.projects.push(data);
  saveDataLocalOnly();
  safeRerender();
}
function removeCloudProject(id){
  if(!state.projects.find(p=>p.id===id)) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  delete lastPushedProjectJSON[id];
  saveDataLocalOnly();
  safeRerender();
}
// Deleting a project locally only ever removed it from state.projects --
// pushStateToCloud() only .set()s docs still present in that array, it never
// .delete()s ones that dropped out, so the Firestore doc for a "deleted"
// project was left behind and would silently reappear (via applyCloudProject)
// on the next fresh load / another device's initCloudSync(). Call this
// alongside the local removal so the doc actually goes away for good.
function deleteCloudProject(id){
  delete lastPushedProjectJSON[id];
  if(!cloudDb) return;
  cloudDb.collection('projects').doc(id).delete().catch(()=>{ /* offline -- best effort, nothing else to retry from here */ });
}
// Runs once after the very first (local/offline) render so the UI paints
// instantly on every load, then "catches up" to the shared cloud copy a
// moment later once it arrives -- and stays live via onSnapshot from then on.
async function initCloudSync(){
  if(!cloudDb){ cloudSyncReady = true; return; } // Firebase never loaded/initialized -- stay local-only, silently
  try{
    const metaSnap = await cloudDb.collection('meta').doc('settings').get();
    const projSnap = await cloudDb.collection('projects').get();
    // We now know whether Firestore already holds real shared data -- from
    // this point on it's safe to let scheduleCloudPush() actually push (see
    // the big comment above cloudSyncReady's declaration for why this has
    // to happen before, not after, deciding which branch below runs).
    cloudSyncReady = true;
    if(!metaSnap.exists && projSnap.empty){
      // Nobody has synced anything yet -- this device's current state
      // (freshly seeded demo/Richmond data, most likely) becomes the shared
      // starting point that every other device will pull from.
      await pushStateToCloud();
    } else {
      if(metaSnap.exists){
        const data = metaSnap.data();
        lastPushedMetaJSON = JSON.stringify(data);
        state.contractor = data.contractor || state.contractor;
        state.contractors = data.contractors || state.contractors;
        state.approvers = data.approvers || state.approvers;
      }
      if(!projSnap.empty){
        const cloudProjects = [];
        projSnap.forEach(doc=>{ lastPushedProjectJSON[doc.id]=JSON.stringify(doc.data()); cloudProjects.push(doc.data()); });
        state.projects = cloudProjects;
      }
      saveDataLocalOnly();
      render();
    }
  }catch(e){ /* offline on first load, or Firestore unreachable -- keep working on local data */ }
  cloudSyncReady = true; // still true if the try block threw before reaching the line above
  if(pushPendingWhenReady){ pushPendingWhenReady = false; scheduleCloudPush(); }
  cloudDb.collection('meta').doc('settings').onSnapshot(
    snap=>{ if(snap.exists) applyCloudMeta(snap.data()); },
    ()=>{ /* listener error (e.g. offline) -- local data keeps working */ }
  );
  cloudDb.collection('projects').onSnapshot(
    qs=>{ qs.docChanges().forEach(change=>{
      if(change.type==='removed') removeCloudProject(change.doc.id);
      else applyCloudProject(change.doc.id, change.doc.data());
    }); },
    ()=>{ /* listener error (e.g. offline) -- local data keeps working */ }
  );
}

/* ============================= STORAGE (photos: Firestore + local IndexedDB cache) =============================
   Photos used to live ONLY in this browser's IndexedDB, which is why a
   photo one person attached (BOQ reference gallery, Daily Log, material
   requests) was invisible to anyone else opening the same link from a
   different device -- IndexedDB never leaves the browser it was written in.
   Firestore's 'photos' collection (one small document per photo, keyed by
   the same id this app already generates with uid()) is now the real,
   shared source of truth; IndexedDB is kept as a same-shape local cache so
   photos already seen on this device still show up instantly and while
   offline. Every call site (idbPut/idbGet/idbDelete) is untouched -- only
   what happens inside these three functions changed. */
let _dbp=null;
function idb(){
  if(_dbp) return _dbp;
  _dbp = new Promise((resolve,reject)=>{
    const req = indexedDB.open('sitepulse_photos',1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('photos');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbp;
}
async function idbCachePut(id,dataUrl){
  try{
    const db = await idb();
    await new Promise((res,rej)=>{
      const tx=db.transaction('photos','readwrite');
      tx.objectStore('photos').put(dataUrl,id);
      tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
    });
  }catch(e){ /* local cache is best-effort only */ }
}
async function idbCacheGet(id){
  try{
    const db = await idb();
    return await new Promise((res,rej)=>{
      const tx=db.transaction('photos','readonly');
      const r=tx.objectStore('photos').get(id);
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
  }catch(e){ return undefined; }
}
async function idbCacheDelete(id){
  try{
    const db = await idb();
    await new Promise((res)=>{
      const tx=db.transaction('photos','readwrite');
      tx.objectStore('photos').delete(id);
      tx.oncomplete=()=>res(true);
    });
  }catch(e){ /* best-effort */ }
}
// Firestore is the shared copy every device reads from; IndexedDB is just
// this device's fast/offline cache of it, mirrored on every write and read.
async function idbPut(id,dataUrl){
  await idbCachePut(id,dataUrl); // so this device sees it immediately even if offline
  try{
    await cloudDb.collection('photos').doc(id).set({dataUrl, updatedAt:Date.now()});
    return true;
  }catch(e){
    toast(tf('รูปนี้บันทึกไว้ในเครื่องนี้เท่านั้น (ยังไม่ขึ้นระบบกลาง) — ลองใหม่ตอนสัญญาณอินเทอร์เน็ตดีขึ้น','Saved on this device only for now (not synced yet) -- try again once you have a better connection'));
    return true; // local cache write already succeeded, so callers still proceed normally
  }
}
async function idbGet(id){
  try{
    const snap = await cloudDb.collection('photos').doc(id).get();
    if(snap.exists){
      const dataUrl = snap.data().dataUrl;
      idbCachePut(id,dataUrl); // keep local cache warm for offline use
      return dataUrl;
    }
  }catch(e){ /* offline or blocked -- fall through to local cache below */ }
  return await idbCacheGet(id);
}
async function idbDelete(id){
  await idbCacheDelete(id);
  try{ await cloudDb.collection('photos').doc(id).delete(); }catch(e){ /* best-effort */ }
}

/* ============================= IMAGE COMPRESSION ============================= */
function compressImage(file, maxDim, quality){
  maxDim = maxDim||1280; quality = quality==null?0.62:quality;
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataUrlKind(dataUrl){
  if(!dataUrl) return 'file';
  if(dataUrl.indexOf('data:image/')===0) return 'image';
  if(dataUrl.indexOf('data:application/pdf')===0) return 'pdf';
  return 'file';
}

// Field-worker restricted link: opening the app with #field&project=<id> in the
// URL locks the whole UI to that project's Daily Log screen only -- no other
// tab, and no other project, is reachable. This is a UX-level lock (the app
// has no server/auth), meant for handing a simple "just fill today's report"
// link to a site contractor.
const FIELD_MODE = location.hash.replace('#','').split('&').includes('field');
function fieldProjectIdFromHash(){
  const parts = location.hash.replace('#','').split('&');
  const m = parts.find(s=> s.indexOf('project=')===0);
  return m ? decodeURIComponent(m.slice('project='.length)) : null;
}
function fieldLink(projectId){
  return location.origin + location.pathname + location.search + '#field&project=' + encodeURIComponent(projectId);
}
// Direct project link: opening the app with #open&project=<id> in the URL
// skips the "All Projects" hub and lands straight inside that project's
// dashboard, with the normal full UI (every tab, role switch, etc.) --
// unlike the field link above, nothing is locked down. This is just a
// bookmark/share-friendly shortcut into a specific project for people who
// already have full access (PM, procurement, etc.), not a restricted link.
const OPEN_PROJECT_MODE = !FIELD_MODE && location.hash.replace('#','').split('&').includes('open');
function projectLink(projectId){
  return location.origin + location.pathname + location.search + '#open&project=' + encodeURIComponent(projectId);
}
// Approval link: opening the app with #approve&project=<id>&req=<reqId> jumps
// straight to that project's Purchasing & Approval page with the specific
// request's detail modal already open -- so a supervisor can be handed a
// link (LINE, email, etc.) that goes right to the one request needing their
// decision, instead of having to find it themselves. Like the open-project
// link above, nothing about the UI is restricted; the existing approver PIN
// check on the approve/reject buttons is still the actual gate.
const APPROVE_LINK_MODE = !FIELD_MODE && location.hash.replace('#','').split('&').includes('approve');
function approveLinkReqIdFromHash(){
  const parts = location.hash.replace('#','').split('&');
  const m = parts.find(s=> s.indexOf('req=')===0);
  return m ? decodeURIComponent(m.slice('req='.length)) : null;
}
function approveLink(projectId, reqId){
  return location.origin + location.pathname + location.search + '#approve&project=' + encodeURIComponent(projectId) + '&req=' + encodeURIComponent(reqId);
}

  // already had saved data before this project existed.
  if(!state.projects.find(p=>p.id==='richmond-2602')){
    state.projects.push(richmondProject());
    saveData();
  }

  // already had saved projects, so any project loaded from an older save is
  // missing the field entirely -- backfill an empty array so every push/read
  // against P().costLog is always safe, without ever touching real data.
  {
    let addedCostLog=false;
    state.projects.forEach(p=>{ if(!Array.isArray(p.costLog)){ p.costLog=[]; addedCostLog=true; } });
    if(addedCostLog) saveData();
  }

  // seeded before itemCode/unitPrice existed as fields, so installs with
  // data saved before those fields shipped are missing them on every item.
  // Backfill both from the reference contract BOQ, matched by item id --

  // clobbers a price the user has since entered or edited by hand. Cheap
  // and safe to re-run on every load (no-ops once every item is filled).
  {

      const ref = richmondProject();

    if(proj){ state.currentProjectId = proj.id; state.view='project'; state.tab='dashboard'; }
  } else if(APPROVE_LINK_MODE){

    // one request's detail modal open. If this browser's local copy of the
    // project hasn't caught up to the request yet (e.g. it was created on
    // another device), the modal simply stays closed until cloud sync
    // delivers it moments later -- detailModalHtml() already no-ops when
    // procureDetailId doesn't resolve to a request yet.

/* ============================= CALC ENGINE ============================= */
// boq/logs are accepted as optional explicit params so the Hub and Overview
// screens can compute a summary for *any* project, not just the one open in
// P(). Every call from inside a project screen omits them and falls back to
// the currently open project via P().
function dailyTarget(item){
  const days = daysBetween(item.startDate,item.endDate)+1;
  return item.qtyTotal / Math.max(days,1);
}
function plannedCumAt(item,dateStr){
  const days = daysBetween(item.startDate,item.endDate)+1;
  const elapsed = clamp(daysBetween(item.startDate,dateStr)+1,0,days);
  return elapsed<=0 ? 0 : elapsed*dailyTarget(item);
}
function actualCumAt(item,dateStr,logs){
  logs = logs || P().logs;
  let sum=0;
  for(const log of logs){
    if(log.date>dateStr) continue;
    for(const e of log.entries) if(e.itemId===item.id) sum += Number(e.actualQty)||0;
  }
  return sum;
}
function todayQtyFor(item,dateStr,logs){
  logs = logs || P().logs;
  const log = logs.find(l=>l.date===dateStr);
  if(!log) return 0;
  return log.entries.filter(e=>e.itemId===item.id).reduce((s,e)=>s+(Number(e.actualQty)||0),0);
}
function itemLoggedDates(item,logs){
  logs = logs || P().logs;
  const set=[];
  for(const log of logs){ if(log.entries.some(e=>e.itemId===item.id)) set.push(log.date); }
  return set.sort();
}
function itemPrediction(item, asOf, logs){
  logs = logs || P().logs;
  const dates = itemLoggedDates(item,logs).filter(d=>d<=asOf);
  const actual = actualCumAt(item,asOf,logs);
  const remaining = Math.max(item.qtyTotal - actual,0);
  if(remaining<=0){
    const lastDate = dates.length? dates[dates.length-1] : item.startDate;
    return {finishDate:lastDate, burnRate:null, done:true};
  }
  if(dates.length===0) return {finishDate:item.endDate, burnRate:null, done:false};
  const span = Math.max(daysBetween(dates[0],asOf)+1,1);
  const burnRate = actual/span;
  if(burnRate<=0) return {finishDate:null, burnRate:0, done:false};
  const daysNeeded = Math.ceil(remaining/burnRate);
  return {finishDate: addDays(asOf,daysNeeded), burnRate, done:false};
}
function itemStatus(item,asOf,logs){
  logs = logs || P().logs;
  const planned = plannedCumAt(item,asOf), actual = actualCumAt(item,asOf,logs);
  if(planned<=0 && actual<=0) return 'idle';
  return actual+1e-9 >= planned ? 'ok' : 'bad';
}
function projectSummary(asOf, boq, logs){
  boq = boq || P().boq; logs = logs || P().logs;
  if(boq.length===0) return null;
  let plannedPct=0, actualPct=0, n=0;
  let contractEnd=null, predictedEnd=null, anyPrediction=false;
  for(const item of boq){
    const total = item.qtyTotal||1;
    plannedPct += clamp(plannedCumAt(item,asOf)/total,0,1);
    actualPct += clamp(actualCumAt(item,asOf,logs)/total,0,1);
    n++;
    if(!contractEnd || item.endDate>contractEnd) contractEnd=item.endDate;
    const pred = itemPrediction(item,asOf,logs);
    if(pred.finishDate){ anyPrediction=true; if(!predictedEnd || pred.finishDate>predictedEnd) predictedEnd=pred.finishDate; }
  }
  plannedPct = n? (plannedPct/n)*100 : 0;
  actualPct = n? (actualPct/n)*100 : 0;
  const delta = actualPct - plannedPct;
  const delayDays = (predictedEnd && contractEnd) ? daysBetween(contractEnd,predictedEnd) : null;
  return {plannedPct,actualPct,delta,contractEnd,predictedEnd,delayDays,anyPrediction};
}

/* ============================= BOQ IMPORT (new-project attach) ============================= */
// Lets "New project" optionally attach a BOQ file/paste and pre-fill the
// project's boq[] instead of starting empty. Everything funnels into one
// shared shape -- boqImport.rows (array of string arrays) -- regardless of
// source (pasted table, CSV, Excel, PDF text layer), then one column-mapping
// + preview UI (in projectModalHtml) lets the user confirm/fix the guess
// before creating the project. This is a static site with no backend, so
// Excel and PDF parsing load their libraries from a CDN on demand (only when
// that file type is actually used) rather than bundling them unconditionally.
function parseNumLoose(s){
  if(s==null) return null;
  const t = String(s).replace(/[,\s]/g,'').replace(/บาท|บ\.|฿/g,'').trim();
  if(t===''||t==='-') return null;
  const n = parseFloat(t);
  return isNaN(n)? null : n;
}
function parseCsvLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','||c===';'){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parseDelimitedText(text){
  const lines = text.replace(/\r\n?/g,'\n').split('\n').filter(l=>l.trim()!=='');
  const useTab = lines.some(l=>l.includes('\t'));
  return lines.map(l=> useTab? l.split('\t').map(s=>s.trim()) : parseCsvLine(l));
}
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[data-dyn-src="${src}"]`)){
      const existing = document.querySelector(`script[data-dyn-src="${src}"]`);
      if(existing.dataset.loaded==='1') resolve(); else existing.addEventListener('load',()=>resolve());
      return;
    }
    const s=document.createElement('script');
    s.src=src; s.dataset.dynSrc=src;
    s.onload=()=>{ s.dataset.loaded='1'; resolve(); };
    s.onerror=()=>reject(new Error('โหลดไลบรารีไม่สำเร็จ (ต้องใช้อินเทอร์เน็ต)'));
    document.head.appendChild(s);
  });
}
async function parseXlsxFile(file){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = window.XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
  return rows.map(r=> r.map(c=> String(c==null?'':c).trim())).filter(r=> r.some(c=>c!==''));
}
async function parsePdfFile(file){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let totalChars=0;
  const allLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    totalChars += content.items.reduce((s,it)=>s+(it.str||'').length,0);
    const items = content.items.map(it=>({str:it.str, x:it.transform[4], y:it.transform[5]})).filter(it=>it.str.trim()!=='');
    items.sort((a,b)=> b.y-a.y || a.x-b.x);
    let curY=null, curLine=[];
    const lines=[];
    const TOL=3;
    items.forEach(it=>{
      if(curY===null || Math.abs(it.y-curY)>TOL){ if(curLine.length) lines.push(curLine); curLine=[it]; curY=it.y; }
      else curLine.push(it);
    });
    if(curLine.length) lines.push(curLine);
    lines.forEach(line=>{
      line.sort((a,b)=>a.x-b.x);
      const cells=[]; let cur=''; let lastX=null;
      line.forEach(it=>{
        if(lastX!==null && (it.x-lastX)>10){ cells.push(cur.trim()); cur=''; }
        cur += (cur?' ':'') + it.str;
        lastX = it.x + it.str.length*3;
      });
      if(cur.trim()) cells.push(cur.trim());
      if(cells.length) allLines.push(cells);
    });
  }
  const avgCharsPerPage = pdf.numPages? totalChars/pdf.numPages : 0;
  return {rows:allLines, avgCharsPerPage, numPages:pdf.numPages};
}
function guessBoqColumns(headerRow){
  const norm = s => String(s||'').toLowerCase().replace(/[()]/g,'').trim();
  const h = (headerRow||[]).map(norm);
  const find = (keywords)=>{ for(let i=0;i<h.length;i++){ if(keywords.some(k=>h[i].includes(k))) return i; } return -1; };
  return {
    code: find(['รหัส','item id','item code','code','wbs','no.','no ','ลำดับ']),
    name: find(['รายการ','description','item name','name','งาน','material','วัสดุ']),
    unit: find(['หน่วย','unit']),
    qty: find(['ปริมาณ','qty','quantity','จำนวน']),
    price: find(['ราคาต่อหน่วย','ราคา/หน่วย','unit price','unit cost','ราคา','price','cost']),
  };
}
function defaultBoqImportMapping(rows){
  const header = rows[0]||[];
  const guess = guessBoqColumns(header);
  // A confident guess needs at least name+qty found in what looks like a
  // real header row (not the first data row) -- otherwise assume there's no
  // header and fall back to the most common column order.
  const looksLikeHeader = guess.name>=0 && (guess.qty>=0 || guess.price>=0);
  if(looksLikeHeader) return {hasHeader:true, mapping:guess};
  const w = (rows[0]||[]).length;
  return {hasHeader:false, mapping:{code: w>4?0:-1, name: w>4?1:0, unit: w>4?2:1, qty: w>4?3:2, price: w>4?4:3}};
}
function boqImportParsedItems(){
  if(!boqImport || !boqImport.rows || !boqImport.rows.length) return [];
  const {rows, hasHeader, mapping} = boqImport;
  const dataRows = hasHeader? rows.slice(1) : rows;
  const items=[];
  dataRows.forEach(r=>{
    const name = mapping.name>=0? (r[mapping.name]||'').trim() : '';
    if(!name) return;
    const qty = mapping.qty>=0? parseNumLoose(r[mapping.qty]) : null;
    const price = mapping.price>=0? parseNumLoose(r[mapping.price]) : null;
    items.push({
      itemCode: mapping.code>=0? (r[mapping.code]||'').trim() : '',
      name,
      unit: mapping.unit>=0? (r[mapping.unit]||'').trim() : '',
      qtyTotal: qty!=null? qty : 1,
      unitPrice: price,
    });
  });
  return items;
}
function buildBoqFromImport(){
  const items = boqImportParsedItems();
  if(!items.length) return [];
  const start = todayStr();
  return items.map(it=> ({
    id: uid(), itemCode: it.itemCode||'', name: it.name, zone:'', category:'',
    qtyTotal: it.qtyTotal, unit: it.unit||tf('หน่วย','unit'), unitPrice: it.unitPrice,
    startDate: start, endDate: addDays(start,7), actualStartDate:'', actualEndDate:'',
    notes:'', team:'', leader:'', manpower:'', workType:'', allowedHours:'', dependsOn:[], refPhotoIds:[]
  }));
}

function wireProjectModal(){
  const bg=$('#proj-modal-bg'); if(!bg) return;
  $('#proj-modal-close').onclick = closeProjectModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeProjectModal(); });

  // final save, like every other modal in this app) -- but the BOQ-import
  // controls below call render() mid-edit (to refresh the preview table),
  // which rebuilds the whole modal from projectDraft. Without syncing first,
  // that render would silently blank out whatever the user already typed.
  const syncProjectFields = ()=>{
    const nameEl=$('#pm-name'), zoneEl=$('#pm-zone');
    if(nameEl) projectDraft.name = nameEl.value;
    if(zoneEl) projectDraft.zone = zoneEl.value;
  };
  const applyParsedRows = (rows)=>{
    if(!rows.length){ boqImport = {rows:[], warning:tf('ไม่พบข้อมูลตาราง','No table data found')}; return; }
    const def = defaultBoqImportMapping(rows);

  if(parseBtn) parseBtn.onclick = ()=>{

    if(!text || !text.trim()){ toast(tf('กรุณาวางข้อมูลก่อน','Please paste some data first')); return; }
    syncProjectFields();
    applyParsedRows(parseDelimitedText(text));
    render();
  };
  const fileInput = $('#boq-file-input');
  if(fileInput) fileInput.onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const fname = file.name.toLowerCase();
    syncProjectFields();
    boqImport = {loading:true, rows:[], hasHeader:true, mapping:{code:-1,name:-1,unit:-1,qty:-1,price:-1}, warning:''};
    render();
    try{
      if(fname.endsWith('.csv')){
        applyParsedRows(parseDelimitedText(await file.text()));
      } else if(fname.endsWith('.xlsx') || fname.endsWith('.xls')){
        applyParsedRows(await parseXlsxFile(file));
      } else if(fname.endsWith('.pdf')){
        const res = await parsePdfFile(file);
        if(res.avgCharsPerPage < 15){
          boqImport = {rows:[], warning: tf('ไฟล์ PDF นี้ดูเหมือนเป็นภาพสแกน (ไม่มีข้อความให้คัดลอก) ระบบดึงข้อมูลอัตโนมัติไม่ได้ กรุณาวางข้อมูลด้วยตนเองในช่องด้านบนแทน หรือแปลงไฟล์เป็น Excel/CSV ก่อน','This PDF looks like a scanned image (no extractable text) -- automatic extraction isn’t possible. Please paste the data into the box above instead, or convert the file to Excel/CSV first.')};
        } else {
          applyParsedRows(res.rows);
        }
      } else {
        toast(tf('รองรับเฉพาะไฟล์ .csv, .xlsx, .xls, .pdf','Only .csv, .xlsx, .xls, .pdf files are supported'));
        boqImport = null;
      }
    }catch(err){
      boqImport = {rows:[], warning: tf('เกิดข้อผิดพลาดขณะอ่านไฟล์ (ต้องใช้อินเทอร์เน็ตเพื่อโหลดตัวอ่านไฟล์ครั้งแรก): ','Error reading file (an internet connection is needed the first time, to load the file reader): ')+((err&&err.message)||err)};
    }
    render();
  };
  const hdrChk = $('#boq-has-header');
  if(hdrChk) hdrChk.onchange = ()=>{ syncProjectFields(); boqImport.hasHeader = hdrChk.checked; render(); };
  ['code','name','unit','qty','price'].forEach(field=>{
    const sel = $('#boq-map-'+field);
    if(sel) sel.onchange = ()=>{ syncProjectFields(); boqImport.mapping[field] = parseInt(sel.value,10); render(); };
  });
  $('#pm-save').onclick = ()=>{
    const name=$('#pm-name').value.trim(), zone=$('#pm-zone').value.trim();
    if(!name){ toast(tf('กรุณาระบุชื่อโครงการ','Please enter a project name')); return; }
    if(editingProjectId==='new'){
      const importedBoq = buildBoqFromImport();
      state.projects.push({id:uid(), name, zone, boq:importedBoq, logs:[], materialRequests:[], costLog:[], inspectionReports:[], createdAt:new Date().toISOString()});
      saveData(); closeProjectModal();
      toast(importedBoq.length? tf('สร้างโปรเจ็คใหม่แล้ว พร้อม BOQ ','Project created with a BOQ of ')+importedBoq.length+tf(' รายการ',' items') : tf('สร้างโปรเจ็คใหม่แล้ว','Project created'));
    } else {
      const pr=state.projects.find(p=>p.id===editingProjectId);
      Object.assign(pr,{name,zone});
      saveData(); closeProjectModal(); toast(tf('บันทึกโปรเจ็คแล้ว','Project saved'));
    }

// Master roster of contractors/crews, shared across every project (state.contractors).
// "Linked" work history is auto-derived by matching a contractor's name against
// the team names typed into each project's Daily Log workforce entries -- no
// duplicate data entry needed as long as the names match.
function contractorLinkedStats(name){
  const n = (name||'').trim();
  if(!n) return {days:0, headcount:0, lastDate:null, projects:[]};
  let days=0, headcount=0, lastDate=null;
  const projSet = new Set();
  state.projects.forEach(pr=>{
    (pr.logs||[]).forEach(l=>{
      const rows = (l.workforce||[]).filter(w=> (w.team||'').trim()===n);
      if(rows.length){
        days++;
        headcount += rows.reduce((s,w)=> s+(Number(w.count)||0),0);
        if(!lastDate || l.date>lastDate) lastDate=l.date;
        projSet.add(pr.name || tf('(ไม่มีชื่อโปรเจ็ค)','(untitled project)'));
      }
    });
  });
  return {days, headcount, lastDate, projects:Array.from(projSet)};
}

function renderOverview(){
  const asOf = todayStr();
  const rows = state.projects.map(pr=> ({pr, summary: pr.boq.length? projectSummary(asOf, pr.boq, pr.logs) : null}));
  const withData = rows.filter(r=>r.summary);
  const aheadCount = withData.filter(r=>r.summary.delta>=0).length;
  const behindCount = withData.filter(r=>r.summary.delta<0).length;
  const avgActual = withData.length? withData.reduce((s,r)=>s+r.summary.actualPct,0)/withData.length : 0;
  const tableRows = rows.map(({pr,summary})=>{
    if(!summary){
      return `<tr>
        <td>${escapeHtml(pr.name||tf('(ไม่มีชื่อโปรเจ็ค)','(untitled project)'))}</td>
        <td class="tabular">-</td><td class="tabular">-</td><td><span class="badge idle">⏳ ${tf('ยังไม่มีข้อมูล','No data')}</span></td><td class="tabular">-</td>
        <td><button class="btn ghost sm" data-open-project="${pr.id}">${tf('เปิด','Open')}</button></td>
      </tr>`;
    }
    const st = summary.delta>=0?'ok':'bad';
    return `<tr>
      <td>${escapeHtml(pr.name||tf('(ไม่มีชื่อโปรเจ็ค)','(untitled project)'))}${pr.zone?` <span class="sub" style="font-weight:400">(${escapeHtml(pr.zone)})</span>`:''}</td>
      <td class="tabular">${fmtNum(summary.plannedPct,1)}%</td>
      <td class="tabular">${fmtNum(summary.actualPct,1)}%</td>
      <td><span class="badge ${st}">${st==='ok'? '🟢 '+tf('เร็วกว่า/ตรงแผน','Ahead / on plan') : '🔴 '+tf('ล่าช้า','Behind')} ${fmtNum(Math.abs(summary.delta),1)}%</span></td>
      <td class="tabular">${summary.anyPrediction? fmtDate(summary.predictedEnd) : tf('รอข้อมูล','Pending data')}</td>
      <td><button class="btn ghost sm" data-open-project="${pr.id}">${tf('เปิด','Open')}</button></td>
    </tr>`;
  }).join('');
  return `
  <div class="page-head"><div><h2>${tf('ภาพรวมทุกโปรเจ็ค','All-Project Overview')}</h2><div class="sub">${tf('สรุปสถานะรวมของทุกโปรเจ็คที่กำลังดำเนินการ อัปเดตล่าสุด','Combined status of every active project, updated')} ${fmtDate(asOf)}</div></div></div>
  ${state.projects.length===0? `<div class="empty"><span class="ic">📈</span>${tf('ยังไม่มีโปรเจ็ค กลับไปหน้าโปรเจ็คทั้งหมดเพื่อสร้างโปรเจ็คแรก','No projects yet -- go to All Projects to create your first one')}</div>` : `
  <div class="grid cols-auto">
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('โปรเจ็คทั้งหมด','Total projects')}</span><span class="num">${state.projects.length}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('เร็วกว่า/ตรงตามแผน','Ahead / on plan')}</span><span class="num" style="color:var(--mint-600)">${aheadCount}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('ล่าช้ากว่าแผน','Behind plan')}</span><span class="num" style="color:var(--coral-600)">${behindCount}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('ความคืบหน้าเฉลี่ยจริง','Avg. actual progress')}</span><span class="num">${fmtNum(avgActual,1)}%</span></div></div>
  </div>
  <div class="card">
    <b style="font-family:var(--font-display)">${tf('ตารางเปรียบเทียบแต่ละโปรเจ็ค','Project comparison')}</b>
    <div class="table-wrap" style="margin-top:12px"><table>
      <thead><tr><th>${tf('โปรเจ็ค','Project')}</th><th>${tf('ตามแผน','Planned')}</th><th>${tf('ทำได้จริง','Actual')}</th><th>${tf('สถานะ','Status')}</th><th>${tf('คาดเสร็จ','Est. finish')}</th><th></th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table></div>
  </div>`}
  `;
}
