// Natural/numeric compare for BOQ item codes like "5.2" vs "5.10" -- a plain
// string compare would put "5.10" before "5.2" (lexicographic '1' < '2'),
// which doesn't match the real BOQ document's own numbering. Splits each
// code on '.' and compares part-by-part as numbers; a shorter code (e.g.
// "5", a category header line) sorts before its own sub-items ("5.1"). Items
// with no code at all are handled by the caller, not here.
function compareBoqCode(a,b){
  const pa = String(a).split('.').filter(s=>s!=='');
  const pb = String(b).split('.').filter(s=>s!=='');
  const len = Math.max(pa.length, pb.length);
  for(let i=0;i<len;i++){
    if(pa[i]===undefined) return -1;
    if(pb[i]===undefined) return 1;
    const na = parseFloat(pa[i]), nb = parseFloat(pb[i]);
    if(isNaN(na) || isNaN(nb)){ const c = pa[i].localeCompare(pb[i]); if(c) return c; continue; }
    if(na!==nb) return na-nb;
  }
  return 0;
}
// Groups BOQ items by category (app's own fixed category order first, then
// any custom categories in first-seen order), and -- within each category --
// sorts by the item's own itemCode (the real BOQ document's line number, e.g.
// "5.1", "5.2", "5.10") rather than leaving them in whatever order they were
// added/imported in. This is the single shared function behind both the
// Master Plan & BOQ screen and the Budget screen, so sorting here is what
// keeps their item order (and the "No." each independently counts off)
// identical to each other and to the source BOQ -- items without any code
// keep their original relative order and sort after every coded item in the
// same category (Array#sort is stable, so a plain "has code?" comparison is
// enough to push them to the end without disturbing their own order).
function boqCategoryGroups(boq){
  const used = Array.from(new Set(boq.map(i=>i.category||'').filter(Boolean)));
  const extra = used.filter(c=>!BOQ_CATEGORIES.includes(c));
  const order = BOQ_CATEGORIES.concat(extra);
  const sortByCode = (items)=> items.slice().sort((a,b)=>{
    const ca = a.itemCode||'', cb = b.itemCode||'';
    if(!ca && !cb) return 0;
    if(!ca) return 1;
    if(!cb) return -1;
    return compareBoqCode(ca,cb);
  });
  const groups = order.map(cat=>({cat, items:sortByCode(boq.filter(i=>(i.category||'')===cat))})).filter(g=>g.items.length);
  const uncategorized = boq.filter(i=>!i.category);
  if(uncategorized.length) groups.push({cat:'', items:sortByCode(uncategorized)});
  return groups;
}
const SCHEDULE_STATUS_LABEL = {
  'on-track': ['อยู่ในแผน','On track'],
  'near-due': ['ใกล้ครบกำหนด','Near due'],
  'overdue': ['เกินกำหนด','Overdue'],
  'done': ['เสร็จแล้ว','Done']
};
function itemScheduleStatus(item){
  const progress = (item.progress==null || item.progress==='')? 0 : Number(item.progress);
  if(progress>=100) return 'done';
  if(!item.endDate) return 'on-track';
  const daysLeft = daysBetween(todayStr(), item.endDate); // endDate - today; negative = past due
  if(daysLeft<0) return 'overdue';
  if(daysLeft<=3) return 'near-due';
  return 'on-track';
}
// ---------- Procurement linkage for Master Plan rows (order/delivery date + status) ----------
// Finds the most relevant material request tied to this BOQ item (matched via
// lines[].taskId) so the Master Plan table/Gantt can show a live-linked order
// date, delivery date and colored status without any re-entry -- the source
// of truth stays the Purchasing & Approval screen's materialRequests array.
// When several requests reference the same item, prefer the furthest-along
// status (scheduled > approved > pending > rejected), then the newest.
function itemProcureInfo(item){
  const reqs = (P().materialRequests||[]).filter(r=> !r.trashed && (r.lines||[]).some(l=>l.taskId===item.id));
  if(!reqs.length) return null;
  const rank = {scheduled:3, approved:2, pending:1, rejected:0};
  reqs.sort((a,b)=> (rank[b.status]||0)-(rank[a.status]||0) || (b.createdAt||'').localeCompare(a.createdAt||''));
  const best = reqs[0];
  const line = best.lines.find(l=>l.taskId===item.id);
  return {
    request: best,
    status: best.status,
    deliveryDate: (best.procurement && best.procurement.deliveryDate) || null,
    neededDate: line? line.neededDate : null
  };
}
// Target order date: 5 days before the item's planned start date, so there is
// a lead-time reminder even before any material request has been created yet.
function itemOrderDate(item){ return item.startDate? addDays(item.startDate,-5) : ''; }
// ---- Purchasing Plan (แผนสั่งของ) helpers ----
// Need-on-site date is simply the item's own Master Plan start date -- the
// purchasing plan doesn't keep a separate copy of it, so the two screens can
// never drift out of sync with each other.
function ppNeedOnSiteDate(item){ return item.startDate || ''; }
// Order-by date = need-on-site date minus this item's own lead time (days).
// Most items never get a supplier-specific lead time filled in, so rather
// than silently going blank (and the alert column along with it -- see
// ppAlertStatus below), items with no lead time entered fall back to a
// standard 5-day default. Entering an actual lead time for an item always
// overrides the default.
const PP_DEFAULT_LEAD_DAYS = 5;
function ppOrderByDate(item){
  const need = ppNeedOnSiteDate(item);
  if(!need) return '';
  const hasLt = item.ppLeadTimeDays!=null && item.ppLeadTimeDays!=='';
  const lt = hasLt ? Number(item.ppLeadTimeDays) : PP_DEFAULT_LEAD_DAYS;
  return addDays(need,-lt);
}
// Alert only fires for items still sitting at "not ordered" -- once an item
// is ordered/shipping/cancelled/marked no-need, there is nothing left to
// chase, so the alert column goes quiet for it. 'overdue' = order-by date
// already passed; 'duesoon' = within 3 days of it.
function ppAlertStatus(item){
  const status = item.ppOrderStatus || 'not_ordered';
  if(status!=='not_ordered') return '';
  const orderBy = ppOrderByDate(item);
  if(!orderBy) return '';
  const today = todayStr();
  if(orderBy<today) return 'overdue';
  if(daysBetween(today,orderBy)<=3) return 'duesoon';
  return '';
}
function fmtMonthYear(dateStr){
  const d = parseYMD(dateStr);
  return state.lang==='en' ? (ENMONTHS[d.getMonth()]+' '+d.getFullYear()) : (THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543));
}
// Compact day/month numeric date for the narrow Gantt table columns -- e.g.
// "26/8" -- deliberately plain-numeric (no month name/year) so it fits.
function fmtDateShort(dateStr){
  const d = parseYMD(dateStr);
  return d.getDate()+'/'+(d.getMonth()+1);
}
function ganttDayWidth(totalDays){
  if(totalDays<=21) return 36;
  if(totalDays<=45) return 26;
  if(totalDays<=90) return 16;
  if(totalDays<=180) return 10;
  return 6;
}

// Draws an orthogonal "elbow" connector from a predecessor bar's right edge
// to a successor bar's left edge (classic finish-to-start Gantt dependency
// line), routed via a short horizontal stub so it reads clearly even when
// the two rows are far apart vertically or the successor sits to the left
// of the predecessor (out-of-order dates -- still drawn, just crosses back).
function ganttElbowPath(x1,y1,x2,y2){
  const stub = 10;
  const midX = x1+stub;
  if(Math.abs(y1-y2)<1) return `M ${x1} ${y1} L ${x2} ${y2}`;
  const kneeX = Math.max(midX, x2-stub);
  return `M ${x1} ${y1} L ${kneeX} ${y1} L ${kneeX} ${y2} L ${x2} ${y2}`;
}
// Renders the whole Master Plan & BOQ timeline as a horizontally-scrollable
// Gantt chart: a sticky multi-column task table (name/start/end/duration/
// assignee/progress) on the left, a day-scaled timeline with month/day
// header bands on the right, one bar per dated BOQ item (colored by the
// same schedule-status used in the table view) with a translucent
// progress-fill overlay, a "today" marker line, and finish-to-start
// dependency connector arrows drawn from an item's predecessor(s) (set via
// the "Predecessor tasks" field in the item editor).
//
// This is the ONE Master Plan & BOQ view (the old separate "table" mode was
// retired in favor of merging its columns in here -- see procureCellsHtml()
// and the item-cols grid below): every BOQ item is shown, not just dated
// ones -- an item without both a start and end date still gets a full row
// (name, team, purchasing-plan fields, edit/delete) with an italic "no
// date yet" placeholder in place of a timeline bar, since it has no span to
// draw. The day-scale itself is still computed only from items that DO have
// dates, so one un-dated item can't collapse the whole timeline down to a
// meaningless single-day width; if literally nothing is dated yet, the
// scale falls back to a one-day window centered on today so the chart still
// renders (every row will then show the "no date" placeholder). Category
// grouping respects mpExpandedCats (same collapse/expand state the old
// table view used) so a long BOQ isn't forced fully open at all times.
function ganttChartHtml(groups){
  const allDatedItems = groups.flatMap(g=>g.items).filter(i=>i.startDate && i.endDate);
  const today = todayStr();
  let minDate, maxDate;
  if(allDatedItems.length){
    minDate = allDatedItems.reduce((m,i)=> i.startDate<m? i.startDate : m, allDatedItems[0].startDate);
    maxDate = allDatedItems.reduce((m,i)=> i.endDate>m? i.endDate : m, allDatedItems[0].endDate);
    minDate = addDays(minDate,-1);
    maxDate = addDays(maxDate,1);
  } else {
    minDate = today; maxDate = today;
  }
  const totalDays = daysBetween(minDate,maxDate)+1;
  const dayW = ganttDayWidth(totalDays);
  const totalW = totalDays*dayW;
  const labelW = 918;
  const showTodayLine = today>=minDate && today<=maxDate;
  const todayOffset = daysBetween(minDate,today)*dayW;

  // Clear day-divider gridlines behind the bars, so a row far down the list
  // can still be read against the date scale without scrolling back up to
  // the header to count columns. Drawn as two background layers on
  // .gantt-inner (itself otherwise transparent) rather than per-row DOM
  // nodes: a background always paints beneath every child regardless of
  // z-index, so this can't accidentally cover a bar or the dependency-arrow
  // overlay, and category rows' own opaque background already hides it
  // where it isn't wanted. A thin repeating line every dayW px marks each
  // day boundary; a second repeating gradient (one 7-day tile, offset to
  // match minDate's weekday) tints weekend day-columns, matching the same
  // weekend shading already used in the header's own day-cell row.
  const dayLineLayer = `repeating-linear-gradient(to right, var(--line-soft) 0, var(--line-soft) 1px, transparent 1px, transparent ${dayW}px)`;
  const dow0 = parseYMD(minDate).getDay(); // 0=Sun..6=Sat -- weekday of the day at x=0 in the pattern
  let weekendLayer = 'none';
  {
    const stops = []; let cursor = 0;
    for(let i=0;i<7;i++){
      const dow = (dow0+i)%7;
      if(dow!==0 && dow!==6) continue;
      const s = i*dayW, e = (i+1)*dayW;
      if(s>cursor) stops.push(`transparent ${cursor}px`, `transparent ${s}px`);
      stops.push(`var(--weekend-tint) ${s}px`, `var(--weekend-tint) ${e}px`);
      cursor = e;
    }
    if(stops.length){
      if(cursor<7*dayW) stops.push(`transparent ${cursor}px`, `transparent ${7*dayW}px`);
      weekendLayer = `repeating-linear-gradient(to right, ${stops.join(', ')})`;
    }
  }
  const dayGridStyle = `background-image:${dayLineLayer},${weekendLayer};background-position:${labelW}px 0,${labelW}px 0`;

  const months=[];
  let cursor=minDate;
  while(cursor<=maxDate){
    const d = parseYMD(cursor);
    const monthStart = fmtYMD(new Date(d.getFullYear(),d.getMonth(),1));
    const monthEndRaw = fmtYMD(new Date(d.getFullYear(),d.getMonth()+1,0));
    const bandStart = monthStart<minDate? minDate : monthStart;
    const bandEnd = monthEndRaw>maxDate? maxDate : monthEndRaw;
    months.push({label:fmtMonthYear(bandStart), width:(daysBetween(bandStart,bandEnd)+1)*dayW});
    cursor = addDays(bandEnd,1);
  }
  const showDayLabel = dayW>=14;
  const dayLabelEvery = dayW>=14? 1 : (dayW>=8? 7 : 14);
  let dayTicks='', weekdayTicks='';
  for(let i=0;i<totalDays;i++){
    const d = parseYMD(addDays(minDate,i));
    const dow = d.getDay();
    const isWeekend = (dow===0||dow===6);
    const showLabel = showDayLabel || (i%dayLabelEvery===0);
    dayTicks += `<div class="gantt-daycell${isWeekend?' weekend':''}" style="width:${dayW}px">${showLabel? `<span>${d.getDate()}</span>` : ''}</div>`;
    weekdayTicks += `<div class="gantt-weekday-cell${isWeekend?' weekend':''}" style="width:${dayW}px">${showLabel? tf(THAI_DOW[dow],EN_DOW[dow]) : ''}</div>`;
  }

  // Build rows top-to-bottom while tracking each item's vertical center in
  // px, so the dependency-arrow SVG overlay (built afterward) can connect
  // exact row positions regardless of how many category groups precede them.
  let y = GANTT_HEADER_H;
  const itemCenterY = {};
  const rowsHtml = groups.map(g=>{
    const key = g.cat || '__uncategorized__';
    const expanded = mpExpandedCats.has(key);
    const label = g.cat? escapeHtml(g.cat) : tf('ไม่ระบุหมวดหมู่','Uncategorized');
    const catHeader = `<div class="gantt-row gantt-cat-row" data-toggle-cat="${escapeHtml(key)}" style="cursor:pointer">

      <div class="gantt-timeline-col" style="width:${totalW}px"></div>

    y += GANTT_CAT_ROW_H;
    if(!expanded) return catHeader;
    const itemRows = g.items.map(item=>{
      const status = itemScheduleStatus(item);
      const statusLabel = tf(SCHEDULE_STATUS_LABEL[status][0], SCHEDULE_STATUS_LABEL[status][1]);
      const progress = (item.progress==null || item.progress==='')? 0 : Number(item.progress);
      const hasDates = !!(item.startDate && item.endDate);
      const days = hasDates? daysBetween(item.startDate,item.endDate)+1 : null;
      const subParts = [item.team, item.leader].filter(Boolean);
      const sub = (item.zone? '📍 '+item.zone : '') + (subParts.length? (item.zone?' · ':'')+subParts.join(' · ') : '');
      const { orderCell, deliveryCell, statusCell, procStatusKey } = procureCellsHtml(item);
      const orderDate = itemOrderDate(item);
      const procureInfo = itemProcureInfo(item);
      const procStatusLabel = procureInfo? STATUS_LABEL[procureInfo.status] : (item.procureStatusManual? escapeHtml(tf((MP_PROCURE_STATUS_DEFS.find(s=>s.v===item.procureStatusManual)||{}).th||'', (MP_PROCURE_STATUS_DEFS.find(s=>s.v===item.procureStatusManual)||{}).en||'')) : tf('ยังไม่ได้สั่งของ','Not ordered'));
      const title = `${item.name}${item.team? ' · '+tf('ทีม','Team')+' '+item.team : ''} · ${hasDates? fmtDate(item.startDate)+' - '+fmtDate(item.endDate) : tf('ยังไม่ระบุวันที่','No dates set')} · ${statusLabel} · ${progress}% · ${tf('สั่งของภายใน','Order by')} ${orderDate? fmtDate(orderDate) : '-'}${procureInfo && procureInfo.deliveryDate? ' · '+tf('ส่งของ','Delivery')+' '+fmtDate(procureInfo.deliveryDate) : ''} · ${procStatusLabel}`;
      itemCenterY[item.id] = y + GANTT_ITEM_ROW_H/2;

      let timelineInner;
      if(hasDates){
        const offset = daysBetween(minDate,item.startDate)*dayW;

            <div class="gantt-bar-fill" style="width:${clamp(progress,0,100)}%"></div>

      } else {
        timelineInner = `<span class="gantt-nodate-placeholder" data-edit-item="${item.id}">${tf('ยังไม่ระบุวันที่ — กดแก้ไขเพื่อกำหนดวันเริ่ม/สิ้นสุด','No dates yet -- click edit to set start/end')}</span>`;
      }
      // Reference-photo thumbnail box for this row -- data-mp-thumb is an <img>
      // that refreshMasterPlanThumbs() (called from wireMasterPlan) fills in

      // opens the full gallery when photos already exist (data-open-gallery),

      // doesn't (data-quick-attach) -- both handlers already live in
      // wireMasterPlan, this box is what was missing to reach them.
      const thumbPhotoIds = item.refPhotoIds||[];
      const hasThumb = thumbPhotoIds.length>0;
      const thumbBox = `<div class="mp-thumb" data-stop-card-open ${hasThumb? `data-open-gallery="${item.id}"` : `data-quick-attach="${item.id}"`} title="${tf('ภาพชุดงาน','Reference photos')}">

      </div>`;
      return `<div class="gantt-row">
        <div class="gantt-label-col item-cols" style="width:${labelW}px" data-edit-item="${item.id}">
          <div class="gl-name-cell">
            ${thumbBox}

          </div>
          <div data-stop-card-open><input type="date" class="gl-mini-input" data-date-item="${item.id}" data-date-field="startDate" value="${item.startDate||''}" title="${tf('วันเริ่ม (แก้ไขได้)','Start date (editable)')}"></div>
          <div data-stop-card-open><input type="date" class="gl-mini-input" data-date-item="${item.id}" data-date-field="endDate" value="${item.endDate||''}" title="${tf('วันสิ้นสุด (แก้ไขได้)','End date (editable)')}"></div>
          <div class="gl-num">${hasDates? days+tf('ว','d') : '-'}</div>

          ${deliveryCell}
          ${statusCell}
          <div class="gl-progress-wrap" data-stop-card-open><input type="number" min="0" max="100" step="5" class="gl-mini-input gl-progress-input" data-progress-item="${item.id}" value="${progress}" title="${tf('ความคืบหน้า (แก้ไขได้)','Progress (editable)')}"><span class="gl-pct">%</span></div>
        </div>
        <div class="gantt-timeline-col" style="width:${totalW}px">
          ${timelineInner}
        </div>
      </div>`;
    }).join('');
    return catHeader + itemRows;
  }).join('');
  const contentH = y;

  const edges=[];
  const allItems = groups.flatMap(g=>g.items);
  allItems.forEach(item=>{
    if(!item.startDate || !item.endDate) return;
    (item.dependsOn||[]).forEach(predId=>{
      if(predId===item.id) return;
      const pred = allItems.find(i=>i.id===predId);
      if(!pred || !pred.startDate || !pred.endDate || itemCenterY[predId]==null || itemCenterY[item.id]==null) return;
      const predOffset = daysBetween(minDate,pred.startDate)*dayW;
      const predWidth = Math.max((daysBetween(pred.startDate,pred.endDate)+1)*dayW,10);
      const succOffset = daysBetween(minDate,item.startDate)*dayW;
      edges.push({x1:labelW+predOffset+predWidth, y1:itemCenterY[predId], x2:labelW+succOffset, y2:itemCenterY[item.id]});
    });
  });
  // Dependency lines were previously a 1.5px var(--ink-300) (a pale grey
  // that reads almost as background noise on a chart already full of
  // colored bars) -- bumped to a bolder purple with a bigger arrowhead and a
  // halo/outline under the stroke so the "finish here -> start there" link
  // reads clearly at a glance, per the request for a clearer done->next flow.
  const depsSvg = edges.length? `
  <svg class="gantt-deps-svg" width="${labelW+totalW}" height="${contentH}">
    <defs>
      <marker id="gantt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" style="fill:var(--purple-600)"></path>
      </marker>
    </defs>
    ${edges.map(e=>`<path d="${ganttElbowPath(e.x1,e.y1,e.x2,e.y2)}" style="fill:none;stroke:#fff;stroke-width:4;stroke-linejoin:round"></path>`).join('')}
    ${edges.map(e=>`<path d="${ganttElbowPath(e.x1,e.y1,e.x2,e.y2)}" style="fill:none;stroke:var(--purple-600);stroke-width:2;stroke-linejoin:round" marker-end="url(#gantt-arrow)"></path>`).join('')}
  </svg>` : '';

  return `
  <div class="gantt-toolbar">
    <button class="gantt-scroll-btn" id="gantt-scroll-left" title="${tf('เลื่อนซ้าย','Scroll left')}">◀</button>
    <button class="gantt-scroll-btn" id="gantt-scroll-right" title="${tf('เลื่อนขวา','Scroll right')}">▶</button>
    <button class="btn ghost sm" id="gantt-scroll-today">📍 ${tf('วันนี้','Today')}</button>
    <span class="hint">${tf('เลื่อนแนวนอนเพื่อดูวันที่/เดือนอื่น','Scroll horizontally to see other dates/months')}</span>
  </div>
  <div class="gantt-topscroll" id="gantt-topscroll"><div style="width:${labelW+totalW}px"></div></div>
  <div class="gantt-outer" id="gantt-scroll-container">
    <div class="gantt-inner" style="width:${labelW+totalW}px;${dayGridStyle}" data-day-w="${dayW}" data-min-date="${minDate}">
      ${depsSvg}
      ${showTodayLine? `<div class="gantt-today-line" style="left:${labelW+todayOffset}px" title="${tf('วันนี้','Today')}"></div>` : ''}
      <div class="gantt-row gantt-header-row">
        <div class="gantt-label-col" style="width:${labelW}px">
          <div>${tf('รายการงาน','Task')}</div>
          <div>${tf('เริ่ม','Start')}</div>
          <div>${tf('สิ้นสุด','End')}</div>
          <div>${tf('วัน','Dur')}</div>
          <div>${tf('สั่งของ','Order')}</div>
          <div>${tf('ส่งของ','Delivery')}</div>
          <div>${tf('สถานะ','Status')}</div>
          <div>%</div>
        </div>
        <div class="gantt-timeline-col" style="width:${totalW}px">
          <div class="gantt-months">${months.map(m=>`<div class="gantt-month-band" style="width:${m.width}px">${m.label}</div>`).join('')}</div>
          <div class="gantt-weekdays">${weekdayTicks}</div>
          <div class="gantt-days">${dayTicks}</div>
        </div>
      </div>
      ${rowsHtml}
    </div>
  </div>`;
}

// together (same duration), or its left/right edge dragged to resize just
// one end -- either way the เริ่ม/สิ้นสุด (start/end) columns and the bar's
// own position update together since they're both driven off item.startDate
// / item.endDate. Pure mouse events (no drag library): visual feedback is a
// direct style tweak on the dragged bar during the move, the real state
// (and a full re-render) only happens once on mouseup. ganttJustDragged
// swallows the synthetic click that always follows a real drag's mouseup,
// so a drag never also pops the item-edit modal open.
function wireGanttBarDrag(){
  const ganttInner = $('.gantt-inner');
  if(!ganttInner) return;
  const dayW = Number(ganttInner.dataset.dayW)||0;
  if(!dayW) return;
  $$('[data-drag-item]').forEach(bar=>{
    const itemId = bar.dataset.dragItem;
    const outsideLabel = bar.parentElement ? bar.parentElement.querySelector(`.gantt-bar-label-outside`) : null;
    const beginDrag = (e, mode)=>{
      if(e.button!==undefined && e.button!==0) return; // left mouse button only
      const it = P().boq.find(i=>i.id===itemId);
      if(!it || !it.startDate || !it.endDate) return;
      e.preventDefault(); e.stopPropagation();
      const startX = e.clientX;
      const origLeft = parseFloat(bar.style.left)||0;
      const origWidth = parseFloat(bar.style.width)||0;
      const origStart = it.startDate, origEnd = it.endDate;
      let moved = false;
      bar.classList.add('dragging');
      if(outsideLabel) outsideLabel.style.visibility = 'hidden';
      const onMove = (ev)=>{
        const dx = ev.clientX - startX;
        if(Math.abs(dx)>3) moved = true;
        if(mode==='move'){
          bar.style.left = (origLeft+dx)+'px';
        } else if(mode==='resize-start'){
          let newLeft = Math.min(origLeft+dx, origLeft+origWidth-dayW);
          bar.style.left = newLeft+'px';
          bar.style.width = (origLeft+origWidth-newLeft)+'px';
        } else if(mode==='resize-end'){
          const newWidth = Math.max(origWidth+dx, dayW);
          bar.style.width = newWidth+'px';
        }
      };
      const onUp = (ev)=>{
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        bar.classList.remove('dragging');
        if(!moved) return; // a plain click -- let the normal [data-edit-item] handler open the edit modal
        // Browsers only synthesize a trailing 'click' after mouseup when the
        // pointer barely moved -- a real multi-pixel drag like this one
        // usually fires no click at all, so the flag below is a safety net
        // for the borderline case, not something to rely on. Auto-clear it
        // on the next tick so it can never leak into a later, unrelated
        // click if no trailing click actually arrives to consume it.
        ganttJustDragged = true;
        setTimeout(()=>{ ganttJustDragged = false; }, 0);
        const dayDelta = Math.round((ev.clientX-startX)/dayW);
        if(dayDelta===0) return;
        if(mode==='move'){
          it.startDate = addDays(origStart, dayDelta);
          it.endDate = addDays(origEnd, dayDelta);
        } else if(mode==='resize-start'){
          let newStart = addDays(origStart, dayDelta);
          if(newStart>it.endDate) newStart = it.endDate;
          it.startDate = newStart;
        } else if(mode==='resize-end'){
          let newEnd = addDays(origEnd, dayDelta);
          if(newEnd<it.startDate) newEnd = it.startDate;
          it.endDate = newEnd;
        }
        saveData(); render(); toast(tf('อัปเดตวันที่แล้ว','Dates updated'));
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
    bar.addEventListener('mousedown', (e)=>{
      const edge = e.target.closest('[data-resize-edge]');
      if(edge){ beginDrag(e, edge.dataset.resizeEdge==='start' ? 'resize-start' : 'resize-end'); return; }
      beginDrag(e, 'move');
    });
  });
}

let galleryLightboxKeyHandler=null; // tracks the current document keydown listener so wireGalleryLightbox() can swap it out instead of stacking a new one on every render (it's called from wireGalleryModal() on every re-render, including every prev/next click)
function wireGalleryLightbox(){
  if(galleryLightboxKeyHandler){ document.removeEventListener('keydown', galleryLightboxKeyHandler); galleryLightboxKeyHandler=null; }
  const overlay = $('#gallery-lightbox');
  if(!overlay) return;
  const close = ()=>{ galleryLightboxIndex=null; render(); };
  $('#lightbox-close').onclick = close;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  const prev = $('#lightbox-prev');
  if(prev) prev.onclick = ()=>{ galleryLightboxIndex = (galleryLightboxIndex-1+galleryPhotoDataCache.length)%galleryPhotoDataCache.length; render(); };
  const next = $('#lightbox-next');
  if(next) next.onclick = ()=>{ galleryLightboxIndex = (galleryLightboxIndex+1)%galleryPhotoDataCache.length; render(); };
  galleryLightboxKeyHandler = (e)=>{
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft' && prev) prev.onclick();
    else if(e.key==='ArrowRight' && next) next.onclick();
  };
  document.addEventListener('keydown', galleryLightboxKeyHandler);
}
async function refreshGalleryPhotos(){

  const cards=[]; const dataList=[];

  ];

    tf('งานโครงสร้าง','Structure'),

  ];
}
function severityInfo(v){ return SEVERITY.find(s=>s.v===v) || SEVERITY[1]; }
function categoriesInBoq(boq){
  const used = Array.from(new Set(boq.map(i=>i.category||'').filter(Boolean)));
  const extra = used.filter(c=>!BOQ_CATEGORIES.includes(c));
  return BOQ_CATEGORIES.filter(c=>used.includes(c)).concat(extra);
}
// Single-line label used to search/pick a BOQ item by typing (Daily Log's
// progress-entry composer, see renderDailyLog()/wireDailyLog() below) --
// combines the item code, name and category into one string so a user can
// find an item by any of the three without first drilling into a category
// filter. Doubles as the exact-match key used to resolve typed text back to
// a real item id, so keep this the single source of truth for that format
// rather than re-formatting it ad hoc at each call site.
function boqItemSearchLabel(item){
  return `${item.itemCode? item.itemCode+' ' : ''}${item.name}${item.category? ' — '+item.category : ''}`;
}
// Renders a "done so far" quantity as a % of an item's total planned qty,
// for both the Daily Log composer's live hint and the report/mini-row
// display of entries[].actualQty (see the note above renderDailyLog()'s
// itemHint for why actualQty is what's stored, %  is just how it's shown).
// A % over 999 almost always means a legacy/mistaken entry -- actualQty
// entered as a raw quantity under the old (pre-%) input, or a typo -- so
// rather than silently clamping the number down to a suspicious-looking
// flat "999%" (which reads as a hardcoded bug, especially when several
// rows all show the exact same value), this shows it honestly as ">999%"
// so it's obviously a data outlier worth checking, not a real precise figure.
function pctOfLabel(actualQty, qtyTotal){
  const pct = qtyTotal? (Number(actualQty)||0)/qtyTotal*100 : 0;
  if(pct<0) return '0%';
  if(pct>999) return '>999%';
  return fmtNum(pct,1)+'%';
}

function ensureDailyDraft(){
  const date = state.selectedLogDate;
  if(dailyDraft && dailyDraft.date===date) return;
  const existing = P().logs.find(l=>l.date===date);
  dailyDraft = {
    date,
    weather: existing ? (existing.weather||'') : '',
    workforce: existing ? (existing.workforce||[]).map(w=>({...w})) : [],
    entries: existing ? (existing.entries||[]).map(e=>({...e})) : [],
    issues: existing ? (existing.issues && existing.issues.length ? existing.issues.map(i=>({...i})) : (existing.note ? [{type:tf('อื่นๆ','Other'),detail:existing.note,severity:'amber'}] : [])) : [],
    deliveryNote: existing ? (existing.deliveryNote||'') : '',
  };
  dailyEntryDraft = {itemSearch:'', itemId:'', qty:'', note:''};
}
function syncDailyDraftFromDom(){
  if(!dailyDraft) return;
  const g = (sel)=>{ const el=$(sel); return el?el.value:undefined; };
  const w=g('#log-weather'); if(w!==undefined) dailyDraft.weather=w;
  const dn=g('#log-delivery'); if(dn!==undefined) dailyDraft.deliveryNote=dn;
  $$('[data-wf]').forEach(inp=>{ const row=dailyDraft.workforce[Number(inp.dataset.idx)]; if(row) row[inp.dataset.wf]=inp.value; });
  $$('[data-issue]').forEach(inp=>{ const row=dailyDraft.issues[Number(inp.dataset.idx)]; if(row) row[inp.dataset.issue]=inp.value; });
  const isv=g('#de-item-search'); if(isv!==undefined) dailyEntryDraft.itemSearch=isv;
  const q=g('#de-qty'); if(q!==undefined) dailyEntryDraft.qty=q;
  const n=g('#de-note'); if(n!==undefined) dailyEntryDraft.note=n;
}

/* ---- Daily / weekly / monthly log summary (aggregated from proj.logs) ---- */
function sumLogsRange(arr){
  let headcount=0, entries=0, photos=0, issues=0;
  arr.forEach(l=>{
    headcount += (l.workforce||[]).reduce((s,w)=> s+(Number(w.count)||0), 0);
    entries += (l.entries||[]).length;
    photos += (l.photoIds||[]).length;
    issues += (l.issues||[]).length;
  });
  return {days:arr.length, headcount, entries, photos, issues};
}
function isoWeekRange(dateStr){
  const dt = parseYMD(dateStr);
  const day = (dt.getDay()+6)%7; // Mon=0..Sun=6
  const mon = new Date(dt); mon.setDate(dt.getDate()-day);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {start:fmtYMD(mon), end:fmtYMD(sun)};
}
function logPeriodSummary(proj, date){
  const dayLogs = proj.logs.filter(l=> l.date===date);
  const wk = isoWeekKey(date);
  const weekLogs = proj.logs.filter(l=> isoWeekKey(l.date)===wk);
  const ym = date.slice(0,7);
  const monthLogs = proj.logs.filter(l=> l.date.slice(0,7)===ym);
  const range = isoWeekRange(date);
  const d = parseYMD(date);
  return {
    day: sumLogsRange(dayLogs),
    week: sumLogsRange(weekLogs),
    month: sumLogsRange(monthLogs),
    weekLabel: fmtDate(range.start)+' – '+fmtDate(range.end),
    monthLabel: (state.lang==='en'? ENMONTHS[d.getMonth()]+' '+d.getFullYear() : THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543)),
  };
}

        <div><div class="meta-lbl">${tf('รายการความคืบหน้า','Progress entries')}</div><b class="tabular">${st.entries}</b></div>
        <div><div class="meta-lbl">${tf('รูปภาพ','Photos')}</div><b class="tabular">${st.photos}</b></div>

      </div>

  return `

    ${block('🗓️', tf('สรุปสัปดาห์นี้','This week'), s.weekLabel, s.week)}

async function saveDailyLogAndReturnDate(){
  syncDailyDraftFromDom();
  const date = state.selectedLogDate;
  let log = P().logs.find(l=>l.date===date);
  const newPhotoIds = [];
  const newPhotoMeta = {};
  // Write each pending photo to IndexedDB individually, catching failures
  // per-photo rather than letting one bad photo (or a browser that blocks
  // IndexedDB entirely -- private browsing, some in-app webviews, storage
  // quota exceeded) throw out of the whole function. Without this, an
  // uncaught rejection here would abort the save before it ever reaches the
  // text fields below or saveData() -- the log looks unsaved with no error
  // shown, even though weather/workforce/entries/issues have nothing to do
  // with photo storage and should still be savable.
  let photoFailCount = 0;
  for(const p of pendingPhotos){
    const id=uid();
    try{
      await idbPut(id,p.dataUrl);
      newPhotoIds.push(id);
      newPhotoMeta[id] = {caption:p.caption||'', tag:p.tag||'', kind:p.kind||'image', name:p.name||''};
    }catch(err){
      photoFailCount++;
    }
  }
  if(!log){ log = {id:uid(),date,entries:[],photoIds:[]}; P().logs.push(log); }
  log.weather = dailyDraft.weather;
  log.workforce = dailyDraft.workforce.filter(w=> (w.team||'').trim()).map(w=>({team:w.team,count:w.count,workType:w.workType}));
  log.entries = dailyDraft.entries.slice();
  log.issues = dailyDraft.issues.filter(i=> (i.detail||'').trim());
  log.deliveryNote = dailyDraft.deliveryNote;
  log.photoIds = (log.photoIds||[]).concat(newPhotoIds);
  log.photoMeta = Object.assign(log.photoMeta||{}, newPhotoMeta);
  log.recordedAt = new Date().toISOString();
  P().logs.sort((a,b)=> a.date<b.date?-1:1);
  saveData();
  pendingPhotos=[];
  dailyDraft=null;
  // Returned as an object (not just the date string) so callers can fold
  // photoFailCount into a single combined toast -- calling toast() twice in
  // a row here would just have the second call silently overwrite the first
  // in the shared #toast element before the user ever reads it.
  return {date, photoFailCount};
}
function wireDailyLog(){
  const dateInput = $('#log-date');
  if(dateInput) dateInput.onchange = ()=>{ state.selectedLogDate = dateInput.value; pendingPhotos=[]; dailyDraft=null; render(); };
  const historyBtn = $('#btn-log-history');
  if(historyBtn) historyBtn.onclick = ()=>{ historyModalOpen=true; historyDate=state.selectedLogDate; historyViewing=false; render(); };

  const photoInput = $('#photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const existing = P().logs.find(l=>l.date===state.selectedLogDate);
    const savedCount = (existing&&existing.photoIds&&existing.photoIds.length)||0;
    const room = PHOTO_MAX - savedCount - pendingPhotos.length;
    if(room<=0){ toast(tf('ครบจำนวนสูงสุด 30 รูปแล้ว','Reached the maximum of 30 photos')); photoInput.value=''; return; }
    const toProcess = files.slice(0, room);
    if(files.length>toProcess.length) toast(tf('เพิ่มได้สูงสุด 30 รูป ระบบเลือกให้ ','Max 30 photos -- only the first ')+toProcess.length+tf(' รูปแรก',' were added'));
    const bar = $('#compress-progress'); bar.style.display='block';
    let skipped = 0;
    for(let i=0;i<toProcess.length;i++){
      $('#compress-bar').style.width = Math.round(((i)/toProcess.length)*100)+'%';
      $('#compress-label').textContent = tf('กำลังประมวลผล ','Processing ')+(i+1)+' / '+toProcess.length+'...';
      const f = toProcess[i];
      try{
        if(f.type==='application/pdf'){
          const dataUrl = await fileToDataUrl(f);
          pendingPhotos.push({dataUrl,caption:'',tag:'',kind:'pdf',name:f.name});
        } else if(f.type.indexOf('image/')===0){
          const dataUrl = await compressImage(f);
          pendingPhotos.push({dataUrl,caption:'',tag:'',kind:'image'});
        } else { skipped++; }
      }catch(err){ skipped++; }
      await new Promise(r=>setTimeout(r,0));
    }
    $('#compress-bar').style.width='100%';
    $('#compress-label').textContent = tf('เสร็จแล้ว ','Done ')+toProcess.length+tf(' รายการ',' item(s)');
    if(skipped) toast(tf('ข้าม ','Skipped ')+skipped+tf(' ไฟล์ที่ไม่รองรับ (รองรับเฉพาะรูปภาพและ PDF)',' unsupported file(s) -- only images and PDF are supported'));
    photoInput.value='';
    syncDailyDraftFromDom();
    render();
  };
  $$('[data-rm-photo]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); pendingPhotos.splice(Number(b.dataset.rmPhoto),1); render(); });
  $$('[data-caption]').forEach(inp=> inp.oninput = ()=>{ pendingPhotos[Number(inp.dataset.caption)].caption = inp.value; });
  $$('[data-photo-tag]').forEach(sel=> sel.onchange = ()=>{ pendingPhotos[Number(sel.dataset.photoTag)].tag = sel.value; });

  const wfAdd = $('#wf-add-line');
  if(wfAdd) wfAdd.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.workforce.push({team:'',count:'',workType:''}); render(); };
  $$('[data-rm-wf]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.workforce.splice(Number(b.dataset.rmWf),1); render(); });
  $$('[data-wf-mode]').forEach(sel=> sel.onchange = ()=>{
    syncDailyDraftFromDom();
    const idx = Number(sel.dataset.idx), field = sel.dataset.wfMode;
    const row = dailyDraft.workforce[idx]; if(!row) return;
    if(sel.value==='__other__'){ row[field]=''; row[field+'Other']=true; }
    else { row[field]=sel.value; row[field+'Other']=false; }
    render();
  });

  const issueAdd = $('#issue-add-line');
  if(issueAdd) issueAdd.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.issues.push({type:ISSUE_TYPES[0],detail:'',severity:'amber'}); render(); };
  $$('[data-rm-issue]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.issues.splice(Number(b.dataset.rmIssue),1); render(); });

  // The item-search field only re-renders on "change" (leaving the field, or
  // picking a datalist suggestion), not on every keystroke -- an oninput
  // handler that called render() on each character would rebuild the whole
  // form mid-keystroke and steal focus out from under the user, same reason
  // every other continuous-typing field in this app avoids it. "change"
  // still fires as soon as a suggestion is picked, so the "done so far /
  // remaining" hint and the unit field update the moment a real item is
  // chosen, without disrupting free typing before that.
  const itemSearchInp = $('#de-item-search');
  if(itemSearchInp){
    itemSearchInp.oninput = ()=>{ dailyEntryDraft.itemSearch = itemSearchInp.value; };
    itemSearchInp.onchange = ()=>{ syncDailyDraftFromDom(); render(); };
  }
  const deAdd = $('#de-add');
  if(deAdd) deAdd.onclick = ()=>{
    syncDailyDraftFromDom();
    const item = P().boq.find(i=> boqItemSearchLabel(i)===(dailyEntryDraft.itemSearch||''));
    const pct = parseFloat(dailyEntryDraft.qty); // entered as a % of the item's qtyTotal, see the note above renderDailyLog()'s itemHint
    if(!item || !pct || pct<=0){ toast(tf('กรุณาเลือกรายการงานจากตัวเลือกที่แนะนำ และใส่ % ให้ถูกต้อง','Please pick a work item from the suggestions and enter a valid %')); return; }
    if(!item.qtyTotal){ toast(tf('รายการนี้ไม่มีปริมาณรวมในแผน จึงคำนวณ % ไม่ได้','This item has no total quantity in the plan, so % can’t be calculated')); return; }
    // A single day's entry over 100% is almost always a typo or a leftover

    if(pct>100 && !confirm(tf(`ปริมาณที่กรอก (${pct}%) มากกว่า 100% ของรายการนี้ทั้งหมด ใช่ % จริงหรือไม่ (ไม่ใช่ปริมาณเป็นหน่วย)? กด OK เพื่อบันทึกต่อ`,`The entered amount (${pct}%) is over 100% of this item's total. Is that really a % (not a raw quantity)? Press OK to save it anyway.`))) return;
    // Convert the entered % straight to a real quantity so everything
    // downstream (actualCumAt, Dashboard, S-Curve) keeps summing plain

    const actualQty = (pct/100) * (item.qtyTotal||0);
    dailyDraft.entries.push({itemId:item.id, category:item.category||'', actualQty, note:(dailyEntryDraft.note||'').trim()});
    dailyEntryDraft = {itemSearch:'', itemId:'', qty:'', note:''};
    render();
  };
  $$('[data-rm-entry]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.entries.splice(Number(b.dataset.rmEntry),1); render(); });

  // All three handlers below wrap saveDailyLogAndReturnDate() in try/catch.
  // Without it, any exception the async save hits (a rejected IndexedDB

      // render() above kicks off wireReport()'s own refreshReportPhotos() call,

function genReqNo(dateStr){
  const ymd = dateStr.replace(/-/g,'');
  const countToday = P().materialRequests.filter(r=>r.createdAt.slice(0,10)===dateStr).length + 1;
  return 'REQ-'+ymd+'-'+pad2(countToday);
}

function reqsForDate(date){ return P().materialRequests.filter(r=> r.createdAt.slice(0,10)===date && !r.trashed); }

function isoWeekKey(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  const day = (dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-day+3);
  const firstThu = new Date(dt.getFullYear(),0,4);
  const diff = (dt-firstThu)/86400000;
  const wk = 1+Math.round((diff-((firstThu.getDay()+6)%7))/7);
  return dt.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
// Delivery-due reminder: flags a request 'overdue' or 'dueSoon' (within 3 days)
// based on its confirmed delivery date once scheduled, or the earliest
// "needed by" date on its material lines while still pending/approved.
// Rejected requests are never flagged.
function procureDueDate(r){
  if(r.status==='scheduled' && r.procurement && r.procurement.deliveryDate) return r.procurement.deliveryDate;
  return (r.lines||[]).reduce((min,l)=> (!min || (l.neededDate && l.neededDate<min)) ? l.neededDate : min, null);
}
function procureDueStatus(r){
  if(r.status==='rejected') return null;
  const due = procureDueDate(r);
  if(!due) return null;
  const daysLeft = daysBetween(todayStr(), due);
  if(daysLeft<0) return 'overdue';
  if(daysLeft<=3) return 'dueSoon';
  return null;
}
let approverSettingsOpen=false;
function procureSummary(requests){
  const todayKey = todayStr();
  const curWeek = isoWeekKey(todayKey);
  const sumLines = (arr)=> arr.reduce((s,r)=> s+r.lines.length,0);
  const todayReqs = requests.filter(r=> (r.createdAt||'').slice(0,10)===todayKey);
  const weekReqs = requests.filter(r=> isoWeekKey((r.createdAt||'').slice(0,10))===curWeek);
  return {
    today:{count:todayReqs.length, lines:sumLines(todayReqs), pending:todayReqs.filter(r=>r.status==='pending').length},
    week:{count:weekReqs.length, lines:sumLines(weekReqs), pending:weekReqs.filter(r=>r.status==='pending').length}
  };
}

// approverName / approval.by) -- used to find whose PIN must be checked.
function approverByName(name){ return (state.approvers||[]).find(a=>a.name===name); }
// Gate for every approve/reject action: if the named approver has a PIN set,
// prompt for it and refuse to proceed unless it matches. This is a light,
// client-side deterrent (not real authentication -- there is still no login
// system and no server-side check) meant to stop a teammate from simply
// switching their role view to "PM" and approving their own request; anyone
// who actually knows the approver's PIN can still approve from any device.
function requireApproverPin(name){
  const apv = approverByName(name);
  if(!apv || !apv.pin) return true;
  const entered = prompt(tf(`กรอกรหัส PIN ของ "${name}" เพื่อยืนยันการอนุมัติ/ปฏิเสธ:`,`Enter "${name}"'s PIN to confirm this approve/reject:`));
  if(entered===null) return false;
  if(entered.trim()!==String(apv.pin).trim()){ toast(tf('รหัส PIN ไม่ถูกต้อง','Incorrect PIN')); return false; }
  return true;
}

function wireRequestModal(){
  const bg=$('#req-modal-bg'); if(!bg) return;
  $('#req-modal-close').onclick=()=>{ creatingRequest=false; requestForm=null; render(); };
  bg.addEventListener('click', e=>{ if(e.target===bg){ creatingRequest=false; requestForm=null; render(); } });
  // Keep the top-level fields synced into requestForm as the user types --
  // otherwise any action that re-renders the modal (add/remove a line,
  // attach or remove a photo) would silently discard whatever was typed
  // here, since the template always reflects requestForm, not raw DOM state.
  const byInp=$('#rq-by'); if(byInp) byInp.oninput=()=>{ requestForm.requestedBy = byInp.value; };
  const worktypeInp=$('#rq-worktype'); if(worktypeInp) worktypeInp.oninput=()=>{ requestForm.workType = worktypeInp.value; };
  const areaInp=$('#rq-area'); if(areaInp) areaInp.oninput=()=>{ requestForm.area = areaInp.value; };
  const necessitySel=$('#rq-necessity'); if(necessitySel) necessitySel.onchange=()=>{ requestForm.necessityType = necessitySel.value; };
  const approverSel=$('#rq-approver'); if(approverSel) approverSel.onchange=()=>{ requestForm.approverName = approverSel.value; };
  const approverTxt=$('#rq-approver-text'); if(approverTxt) approverTxt.oninput=()=>{ requestForm.approverName = approverTxt.value; };
  $('#rq-add-line').onclick=()=>{ requestForm.lines.push({name:'',qty:'',unit:'',neededDate:addDays(todayStr(),2),category:'',taskId:'',photos:[]}); render(); };
  $$('[data-rm-line]').forEach(b=> b.onclick=()=>{ if(requestForm.lines.length>1){ requestForm.lines.splice(Number(b.dataset.rmLine),1); render(); } else toast(tf('ต้องมีอย่างน้อย 1 รายการ','At least one line is required')); });
  $$('[data-line]').forEach(inp=> inp.oninput=()=>{ requestForm.lines[Number(inp.dataset.idx)][inp.dataset.line] = inp.value; });
  // target defaults to the whole-request photo bucket (requestForm.photos);
  // pass a specific line's own photos array to attach files to that material
  // line instead -- same upload/compress logic either way.
  const processRequestFiles = async (fileList, target)=>{
    const bucket = target || requestForm.photos;
    const files = Array.from(fileList||[]);
    let skipped = 0;
    for(const f of files){
      try{
        if(f.type==='application/pdf'){
          const dataUrl = await fileToDataUrl(f);
          bucket.push({dataUrl, name:f.name, kind:'pdf'});
        } else if(f.type.indexOf('image/')===0){
          const dataUrl = await compressImage(f);
          bucket.push({dataUrl, name:f.name, kind:'image'});
        } else { skipped++; }
      }catch(err){ skipped++; }
      await new Promise(r=>setTimeout(r,0));
    }
    if(skipped) toast(tf('ข้าม ','Skipped ')+skipped+tf(' ไฟล์ที่ไม่รองรับ (รองรับเฉพาะรูปภาพและ PDF)',' unsupported file(s) -- only images and PDF are supported'));
  };
  const dropZone = $('#rq-drop-zone');
  if(dropZone){
    dropZone.ondragover = (e)=>{ e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = ()=>{ dropZone.classList.remove('drag-over'); };
    dropZone.ondrop = async (e)=>{ e.preventDefault(); dropZone.classList.remove('drag-over'); await processRequestFiles(e.dataTransfer.files); render(); };
  }
  const photoInput=$('#rq-photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    await processRequestFiles(e.target.files);
    photoInput.value=''; render();
  };
  $$('[data-rm-req-photo]').forEach(b=> b.onclick=()=>{ requestForm.photos.splice(Number(b.dataset.rmReqPhoto),1); render(); });
  $$('[data-line-photo-idx]').forEach(inp=> inp.onchange = async ()=>{
    const idx = Number(inp.dataset.linePhotoIdx);
    const line = requestForm.lines[idx]; if(!line) return;
    line.photos = line.photos||[];
    await processRequestFiles(inp.files, line.photos);
    inp.value=''; render();
  });
  $$('[data-rm-line-photo]').forEach(b=> b.onclick=()=>{
    const [li,pi] = b.dataset.rmLinePhoto.split(':').map(Number);
    const line = requestForm.lines[li]; if(!line || !line.photos) return;
    line.photos.splice(pi,1); render();
  });
  $('#rq-submit').onclick = async ()=>{
    const by=$('#rq-by').value.trim(), area=$('#rq-area').value.trim(), wt=$('#rq-worktype').value.trim();
    const necessityType = $('#rq-necessity') ? $('#rq-necessity').value : '';
    const approverSel = $('#rq-approver'), approverText = $('#rq-approver-text');
    const approverName = (approverSel? approverSel.value : (approverText? approverText.value : '')).trim();
    const lines = requestForm.lines.filter(l=>l.name.trim() && parseFloat(l.qty)>0 && l.unit.trim() && l.neededDate);
    if(!by || !area || lines.length===0){ toast(tf('กรอกผู้สั่งของ พื้นที่ และรายการวัสดุอย่างน้อย 1 รายการ','Please fill in requester, area, and at least one material line')); return; }
    if(!approverName){ toast(tf('กรุณาระบุชื่อผู้อนุมัติ','Please specify an approver')); return; }
    const date = todayStr();
    const reqNo = genReqNo(date);
    const photoIds=[]; const photoMeta={};
    for(const p of requestForm.photos){ const id=uid(); await idbPut(id,p.dataUrl); photoIds.push(id); photoMeta[id]={name:p.name||'', kind:p.kind||'image'}; }
    // Each material line can carry its own photos (e.g. a photo of the exact
    // tile/fitting wanted) in addition to the request-level attachments above
    // -- uploaded to IndexedDB the same way, just keyed onto the line itself.
    const savedLines = [];
    for(const l of lines){
      const linePhotoIds=[]; const linePhotoMeta={};
      for(const p of (l.photos||[])){ const id=uid(); await idbPut(id,p.dataUrl); linePhotoIds.push(id); linePhotoMeta[id]={name:p.name||'', kind:p.kind||'image'}; }
      savedLines.push({name:l.name.trim(),qty:parseFloat(l.qty),unit:l.unit.trim(),neededDate:l.neededDate,category:l.category||'',taskId:l.taskId||'',photoIds:linePhotoIds,photoMeta:linePhotoMeta});
    }
    P().materialRequests.push({
      id:uid(), reqNo, createdAt:new Date().toISOString(), requestedBy:by, area, workType:wt,
      necessityType, approverName,
      lines: savedLines,
      photoIds, photoMeta, status:'pending', approval:null, procurement:null,
      trashed:false
    });
    saveData(); creatingRequest=false; requestForm=null; toast(tf('ส่งใบสั่งของแล้ว รอการอนุมัติ','Request submitted, awaiting approval')); render();
  };
}

  bg.addEventListener('click', e=>{ if(e.target===bg){ procureDetailId=null; render(); } });
  const selectedApproverName = ()=>{
    const sel=$('#dt-approver'); if(sel) return sel.value;
    const txt=$('#dt-approver-text'); if(txt) return txt.value.trim()||currentActorName();
    return currentActorName();
  };
  const approveBtn=$('#dt-approve');
  if(approveBtn) approveBtn.onclick=()=>{
    const name = selectedApproverName();
    if(!requireApproverPin(name)) return;
    const r = P().materialRequests.find(x=>x.id===procureDetailId);
    r.status='approved'; r.approval={by:name, at:new Date().toISOString(), reason:$('#dt-reason').value.trim()};
    saveData(); procureDetailId=null; toast(tf('อนุมัติใบสั่งของแล้ว','Request approved')); render();
  };
  const rejectBtn=$('#dt-reject');
  if(rejectBtn) rejectBtn.onclick=()=>{
    const reason=$('#dt-reason').value.trim();
    if(!reason){ toast(tf('กรุณาระบุเหตุผลการปฏิเสธ','Please enter a reason for rejecting')); return; }
    const name = selectedApproverName();
    if(!requireApproverPin(name)) return;
    const r = P().materialRequests.find(x=>x.id===procureDetailId);
    r.status='rejected'; r.approval={by:name, at:new Date().toISOString(), reason};
    saveData(); procureDetailId=null; toast(tf('ปฏิเสธใบสั่งของแล้ว','Request rejected')); render();
  };
  const schedBtn=$('#dt-schedule');
  if(schedBtn) schedBtn.onclick=()=>{
    const dd=$('#dt-delivery').value; if(!dd){ toast(tf('กรุณาเลือกวันที่จัดส่ง','Please choose a delivery date')); return; }
    const r = P().materialRequests.find(x=>x.id===procureDetailId);
    const vendorEl=$('#dt-vendor'), poEl=$('#dt-po');
    r.status='scheduled';
    r.procurement={by:currentActorName(), at:new Date().toISOString(), deliveryDate:dd, note:$('#dt-note').value.trim(), vendor:(vendorEl?vendorEl.value.trim():''), poNumber:(poEl?poEl.value.trim():'')};
    // Actual purchase cost is optional per line -- only lines where the user
    // typed a unit cost get actualQty/actualUnitCost recorded, since those two
    // fields together are what the Budget tab treats as "this line was priced".
    $$('[data-cost-line]').forEach(inp=>{
      const idx = Number(inp.dataset.costLine);
      const line = r.lines[idx]; if(!line) return;
      if(inp.dataset.costField==='actualQty') line._actualQtyInput = inp.value;
      else line._actualUnitCostInput = inp.value;
    });
    r.lines.forEach(line=>{
      const rawCost = line._actualUnitCostInput;
      if(rawCost!==undefined && rawCost!==''){
        const uc = parseFloat(rawCost);
        if(!isNaN(uc) && uc>=0){
          const rawQty = line._actualQtyInput;
          const q = (rawQty!==undefined && rawQty!=='')? parseFloat(rawQty) : line.qty;
          line.actualQty = (!isNaN(q) && q>=0)? q : line.qty;
          line.actualUnitCost = uc;
        }
      }
      delete line._actualQtyInput; delete line._actualUnitCostInput;
    });
    saveData(); procureDetailId=null; toast(tf('ยืนยันวันจัดส่งแล้ว','Delivery date confirmed')); render();
  };
  const statusApplyBtn=$('#dt-status-apply');
  if(statusApplyBtn) statusApplyBtn.onclick=()=>{
    const newStatus = $('#dt-status-override').value;
    const r = P().materialRequests.find(x=>x.id===procureDetailId); if(!r) return;
    if(newStatus===r.status){ toast(tf('สถานะเดิมอยู่แล้ว','Already at that status')); return; }
    // Synthesize a minimal approval/procurement record when jumping straight
    // into a status that other screens (timeline, PDF report) assume carries
    // one -- keeps every existing r.approval.*/r.procurement.* access safe.
    const note = tf('(ปรับสถานะโดยฝ่ายจัดซื้อ)','(status changed by procurement)');
    if((newStatus==='approved'||newStatus==='scheduled'||newStatus==='rejected') && !r.approval){
      r.approval = {by:currentActorName(), at:new Date().toISOString(), reason:note};
    }
    if(newStatus==='scheduled' && !r.procurement){
      r.procurement = {by:currentActorName(), at:new Date().toISOString(), deliveryDate:addDays(todayStr(),2), note:note};
    }
    r.status = newStatus;
    saveData(); procureDetailId=null; toast(tf('อัปเดตสถานะแล้ว','Status updated')); render();
  };
  refreshDetailPhotos();
}
// ---------- Detail modal photo panel (request-level + per-line attachments) ----------
let dtPhotoCache = {}; // photo id -> dataUrl, shared cache for the detail modal's right-side gallery
async function loadReqPhoto(id){
  if(dtPhotoCache[id]!==undefined) return dtPhotoCache[id];
  const data = await idbGet(id);
  dtPhotoCache[id] = data;
  return data;
}
async function refreshDetailPhotos(){
  const r = P().materialRequests.find(x=>x.id===procureDetailId);
  const panel = $('#dt-photo-panel');
  if(!r || !panel) return;
  // Gather request-level attachments first, then each line's own photos
  // (tagged with that line's material name as a caption) -- shown together
  // as one gallery so nothing needs a second click to find.
  const items = [];
  (r.photoIds||[]).forEach(id=> items.push({id, meta:(r.photoMeta&&r.photoMeta[id])||{}, caption:null}));
  r.lines.forEach(l=> (l.photoIds||[]).forEach(id=> items.push({id, meta:(l.photoMeta&&l.photoMeta[id])||{}, caption:l.name})));
  if(!items.length){ panel.innerHTML = `<div class="dt-photo-empty">📎 ${tf('ไม่มีไฟล์แนบ','No attachments')}</div>`; return; }
  const cards=[];
  for(const it of items){
    const data = await loadReqPhoto(it.id);
    if(!data) continue;
    if(it.meta.kind==='pdf'){
      cards.push(`<div class="dt-photo-item dt-photo-pdf" data-view-pdf="${it.id}"><span class="ic">📄</span><span class="nm">${escapeHtml(it.meta.name||'PDF')}${it.caption? `<div class="hint">${escapeHtml(it.caption)}</div>`:''}</span></div>`);
    } else {
      cards.push(`<div class="dt-photo-item"><img src="${data}" alt="">${it.caption? `<div class="dt-photo-cap">${escapeHtml(it.caption)}</div>`:''}</div>`);
    }
  }
  panel.innerHTML = cards.join('') || `<div class="dt-photo-empty">${tf('โหลดรูปภาพไม่สำเร็จ','Failed to load attachments')}</div>`;
  $$('[data-view-pdf]').forEach(el=> el.onclick = async ()=>{
    const data = await loadReqPhoto(el.dataset.viewPdf);
    if(data) window.open(data, '_blank');
  });
}
function wireProcure(){
  const newBtn=$('#btn-new-request');
  if(newBtn) newBtn.onclick=()=>{ creatingRequest=true; requestForm=newRequestForm(); render(); };
  $$('[data-open-req]').forEach(c=> c.onclick=(e)=>{ if(e.target.closest('[data-stop-card-open]')) return; procureDetailId=c.dataset.openReq; render(); });
  const trashToggleBtn = $('#btn-toggle-trash');
  if(trashToggleBtn) trashToggleBtn.onclick = ()=>{ procureTrashOpen=true; render(); };
  const trashCloseBtn = $('#btn-close-trash');
  if(trashCloseBtn) trashCloseBtn.onclick = ()=>{ procureTrashOpen=false; render(); };
  $$('[data-trash-req]').forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();
    const r = P().materialRequests.find(x=>x.id===b.dataset.trashReq); if(!r) return;
    if(!confirm(tf('ย้ายใบสั่งของ "'+r.reqNo+'" ไปที่ถังขยะหรือไม่?','Move request "'+r.reqNo+'" to the trash?'))) return;
    r.trashed=true; r.trashedAt=new Date().toISOString(); r.trashedBy=currentActorName();
    saveData(); toast(tf('ย้ายไปถังขยะแล้ว','Moved to trash')); render();
  });
  $$('[data-restore-req]').forEach(b=> b.onclick=()=>{
    const r = P().materialRequests.find(x=>x.id===b.dataset.restoreReq); if(!r) return;
    r.trashed=false; r.trashedAt=null; r.trashedBy=null;
    saveData(); toast(tf('กู้คืนใบสั่งของแล้ว','Request restored')); render();
  });
  $$('[data-delete-forever-req]').forEach(b=> b.onclick= async ()=>{
    const r = P().materialRequests.find(x=>x.id===b.dataset.deleteForeverReq); if(!r) return;
    if(!confirm(tf('ลบใบสั่งของ "'+r.reqNo+'" ถาวร ไม่สามารถกู้คืนได้อีก ยืนยันหรือไม่?','Permanently delete request "'+r.reqNo+'"? This cannot be undone.'))) return;
    for(const pid of (r.photoIds||[])){ try{ await idbDelete(pid); }catch(err){} }
    for(const l of (r.lines||[])){ for(const pid of (l.photoIds||[])){ try{ await idbDelete(pid); }catch(err){} } }
    P().materialRequests = P().materialRequests.filter(x=>x.id!==r.id);
    saveData(); toast(tf('ลบถาวรแล้ว','Permanently deleted')); render();
  });
  const toggleApvBtn = $('[data-toggle-approver-settings]');
  if(toggleApvBtn) toggleApvBtn.onclick = ()=>{ approverSettingsOpen=!approverSettingsOpen; render(); };
  const apvAddBtn = $('#apv-add');
  if(apvAddBtn) apvAddBtn.onclick = ()=>{
    const name = $('#apv-new-name').value.trim();
    if(!name){ toast(tf('กรุณาระบุชื่อผู้อนุมัติ','Please enter an approver name')); return; }
    const pinEl = $('#apv-new-pin');
    const pin = pinEl? pinEl.value.trim() : '';
    state.approvers = state.approvers||[];
    state.approvers.push({id:uid(), name, active:true, pin});
    saveData(); render(); toast(tf('เพิ่มผู้อนุมัติแล้ว','Approver added'));
  };
  $$('[data-apv-active]').forEach(cb=> cb.onchange = ()=>{
    const a = (state.approvers||[]).find(x=>x.id===cb.dataset.apvActive); if(!a) return;
    a.active = cb.checked; saveData();
  });
  $$('[data-apv-set-pin]').forEach(b=> b.onclick = ()=>{
    const a = (state.approvers||[]).find(x=>x.id===b.dataset.apvSetPin); if(!a) return;
    const newPin = prompt(tf(`ตั้งรหัส PIN ใหม่สำหรับ "${a.name}" (เว้นว่างเพื่อยกเลิก PIN):`,`Set a new PIN for "${a.name}" (leave blank to remove the PIN):`), a.pin||'');
    if(newPin===null) return;
    a.pin = newPin.trim();
    saveData(); render(); toast(a.pin? tf('ตั้ง PIN แล้ว','PIN set') : tf('ยกเลิก PIN แล้ว','PIN removed'));
  });
  $$('[data-apv-remove]').forEach(b=> b.onclick = ()=>{
    state.approvers = (state.approvers||[]).filter(a=>a.id!==b.dataset.apvRemove);
    saveData(); render(); toast(tf('ลบผู้อนุมัติแล้ว','Approver removed'));
  });
  $$('[data-quick-approve]').forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();
    const r = P().materialRequests.find(x=>x.id===b.dataset.quickApprove); if(!r) return;
    const approverName = r.approverName || currentActorName();
    if(!requireApproverPin(approverName)) return;
    r.status='approved'; r.approval={by:approverName, at:new Date().toISOString(), reason:tf('อนุมัติด่วนจากหน้าจัดซื้อ','Quick-approved from procurement board')};
    saveData(); toast(tf('อนุมัติใบสั่งของแล้ว','Request approved')); render();
  });
  $$('[data-quick-reject]').forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();
    const reason = prompt(tf('เหตุผลการปฏิเสธ:','Reason for rejecting:'));
    if(!reason || !reason.trim()){ if(reason!==null) toast(tf('กรุณาระบุเหตุผล','Please enter a reason')); return; }
    const r = P().materialRequests.find(x=>x.id===b.dataset.quickReject); if(!r) return;
    const approverName = r.approverName || currentActorName();
    if(!requireApproverPin(approverName)) return;
    r.status='rejected'; r.approval={by:approverName, at:new Date().toISOString(), reason:reason.trim()};
    saveData(); toast(tf('ปฏิเสธใบสั่งของแล้ว','Request rejected')); render();
  });
}

/* ============================= SCREEN: PROCUREMENT COST LOG ============================= */
// A single, spreadsheet-style ledger of purchases -- distinct from the
// multi-step approval workflow above (ใบสั่งของ / material requests). Every
// row is typed straight into the table, no separate add/edit modal: date,
// PO number, work type/nature, item, an optional link to a Master Plan
// task, quantity & unit price (the total is always qty x unit price,
// recomputed live -- see wireCostLog() below), who ordered it, procurement
// status, and a note. Feeds into boqActualsMap()/projectActualCostTotal()
// below exactly like a priced, linked material-request line does, so the
// Budget tab stays the single source of truth for "actual cost" no matter
// which of the two flows was used to record the purchase -- though here
// only rows with status "ordered" or "delivered" count as committed spend;
// a "pending" row is still just a request, not money out the door yet.
let costLogStatusFilter='all';
// Cost Log is a small hub of its own rather than one flat table: 'menu'
// lists every BOQ work category as a button (with its own running total)
// so logging a cost starts with "which category" the same way the source
// spreadsheet is organised; 'category' is that category's own scoped table
// (history + keep adding, per the requested "click the category button
// first, see its history, keep typing" flow); 'all' is the old flat
// every-category table for a full listing; 'summary' is just the KPI cards
// + costLogCategoryChartHtml() breakdown, no table. costLogCategory holds
// the category string for the 'category' view ('' means the "not linked to
// a category" bucket, which is a valid selection, not "unset").
let costLogView='menu';
let costLogCategory='';
// Which project the top-level "จัดซื้อ" (Procurement) hub screen is currently
// logging costs into. Deliberately kept separate from state.currentProjectId
// -- that one drives the "inside a project" screens/nav (P(), back button,
// etc.), while this lets the hub-level page log a purchase for any project
// without ever entering it. Not persisted to localStorage; resets to the
// first project on reload, same as costLogStatusFilter above.
let purchasingProjectId=null;
function newCostLogEntry(){
  return {
    id: uid(), createdAt: new Date().toISOString(),
    date: todayStr(), po:'', workType:'', workNature:'main', itemName:'',
    taskId:'', unit:'', qty:null, unitCost:null, total:0, orderedBy:'',
    status:'pending', note:''
  };
}
function costLogRecalcTotal(c){ c.total = (c.qty||0) * (c.unitCost||0); return c.total; }
// Horizontal bar breakdown of every logged entry's total (regardless of
// status -- matches the page's own "ยอดซื้อรวมทั้งหมด" KPI, unlike the
// stricter "committed spend only" rule used for the Budget tab's rollup),
// grouped by the BOQ category it's linked to. Entries with no category
// link land in one "not linked" bucket at the end. Hand-rolled with plain
// divs (not SVG/canvas) since it's just proportional bar widths, matching
// the app's existing convention of building charts from scratch rather
// than pulling in a charting library.
function costLogCategoryChartHtml(all, proj=P()){
  if(!all.length) return '';
  const catOrder = boqCategoryGroups(proj.boq||[]).map(g=>g.cat).filter(Boolean);
  const totals = {};
  all.forEach(c=>{ const key = c.taskId||''; totals[key] = (totals[key]||0) + (c.total||0); });
  const keys = catOrder.filter(cat=>totals[cat]!=null);
  if(totals['']!=null) keys.push('');
  const grand = keys.reduce((s,k)=> s+totals[k], 0);
  if(!grand) return '';
  const maxVal = Math.max(...keys.map(k=>totals[k]));
  const rows = keys.map(k=>{
    const label = k? k : tf('ไม่ได้เชื่อมกับหมวดหมู่งาน','Not linked to a category');
    const val = totals[k];
    const pct = grand? (val/grand*100) : 0;
    const barPct = maxVal? (val/maxVal*100) : 0;
    return `<div class="cl-cat-row">
      <div class="cl-cat-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
      <div class="cl-cat-bar-track"><div class="cl-cat-bar-fill" style="width:${barPct}%"></div></div>
      <div class="cl-cat-amt tabular">${fmtCurrency(val)} <span class="hint">(${fmtNum(pct,1)}%)</span></div>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:16px">
    <b style="font-family:var(--font-display)">📊 ${tf('สรุปต้นทุนจัดซื้อแยกตามหมวดหมู่งาน (BOQ)','Purchase Cost by BOQ Category')}</b>
    <div class="cl-cat-chart" style="margin-top:12px">${rows}</div>
  </div>`;
}
// "เชื่อมงาน" links to a BOQ *category* (the main work heading, e.g. "4.
// งานไฟฟ้า-เดินสายไฟ") rather than one specific line item -- item-level
// granularity isn't needed here, and picking from a short category list is

// See costLogCategoryTotals()/renderBudget() for how this rolls up.
// One row's worth of the Cost Log table -- factored out so the 'all' view

  </tr>`;
}
// The status-filterable table section, shared by the 'all' view (scoped =
// every entry) and each category's own page (scoped = just that category's

    <th>${tf('ประเภทงาน','Work type')}</th><th>${tf('ลักษณะงาน','Work nature')}</th><th>${tf('รายการสินค้า','Item')}</th>
