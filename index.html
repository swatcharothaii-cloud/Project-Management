    <th>${tf('ยอดเงินรวม','Total')}</th><th>${tf('ผู้สั่ง','Ordered by')}</th><th>${tf('สถานะ','Status')}</th><th>${tf('หมายเหตุ','Note')}</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table></div>`}
  `;
}
// Landing page for the Cost Log hub: one button per BOQ category (plus one
// for the "not linked to a category" bucket, only shown once something has
// actually landed there) so logging a cost starts the same way the source
// spreadsheet is organised -- pick the work category first, then see its
// history and keep typing, instead of hunting through one giant flat table.
function renderCostLogMenu(all, boqCategories){
  const grandTotal = all.reduce((s,c)=> s+(c.total||0), 0);
  const catStats = {};
  all.forEach(c=>{
    const key = c.taskId || '';
    if(!catStats[key]) catStats[key] = {count:0, total:0};
    catStats[key].count++; catStats[key].total += (c.total||0);
  });
  const cards = boqCategories.map(cat=>{
    const stat = catStats[cat] || {count:0, total:0};
    return `<button class="cl-cat-card" data-cl-view="category" data-cl-category="${escapeHtml(cat)}">
      <div class="cl-cat-card-name">📁 ${escapeHtml(cat)}</div>
      <div class="cl-cat-card-stats"><span>${stat.count} ${tf('รายการ','entries')}</span><span class="tabular">${fmtCurrency(stat.total)}</span></div>
    </button>`;
  }).join('');
  const unlinkedStat = catStats[''];
  const unlinkedCard = unlinkedStat? `<button class="cl-cat-card cl-cat-card-unlinked" data-cl-view="category" data-cl-category="">
    <div class="cl-cat-card-name">🗂️ ${tf('ไม่ได้เชื่อมกับหมวดหมู่งาน','Not linked to a category')}</div>
    <div class="cl-cat-card-stats"><span>${unlinkedStat.count} ${tf('รายการ','entries')}</span><span class="tabular">${fmtCurrency(unlinkedStat.total)}</span></div>
  </button>` : '';
  return `
  <div class="grid cols-auto" style="margin-bottom:16px">
    <div class="card kpi"><div class="stat"><span class="lbl">💰 ${tf('ยอดซื้อรวมทั้งหมด','Total purchases')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(grandTotal)}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">🧾 ${tf('จำนวนรายการ','Entries')}</span><span class="num tabular" style="font-size:19px">${all.length}</span></div></div>
  </div>
  ${boqCategories.length? `<div class="cl-cat-grid">${cards}${unlinkedCard}</div>` : `<div class="empty"><span class="ic">📁</span>${tf('เพิ่มรายการงานในแผนงานหลักก่อน เพื่อให้มีหมวดงานให้เลือก','Add work items in the Master Plan first so there are categories to pick from')}</div>`}
  `;
}
// The 3-way sub-nav shown on every Cost Log page (เมนูหมวดงาน / หน้ารวม /
// สรุป) -- a category's own page isn't one of these three buttons (it's
// reached by clicking a category card, or navigated back out of via the
// breadcrumb costLogBreadcrumbHtml() renders), so none of them highlight
// while state.tab shows a category.
function costLogSubnavHtml(view){
  const items = [
    {v:'menu', label: '🗂️ ' + tf('เมนูหมวดงาน','Category menu')},
    {v:'all', label: '📋 ' + tf('หน้ารวม','All entries')},
    {v:'summary', label: '📊 ' + tf('สรุป','Summary')},
  ];
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${items.map(it=>`<button class="btn ${view===it.v?'primary':'ghost'} sm" data-cl-view="${it.v}">${it.label}</button>`).join('')}</div>`;
}
function renderCostLog(proj=P()){
  const all = proj.costLog||[];
  const boqCategories = boqCategoryGroups(proj.boq||[]).map(g=>g.cat).filter(Boolean);
  // Guard against stale state from a different project -- e.g. switching
  // projects on the top-level Purchasing Hub while parked on a category
  // page whose name doesn't exist in the newly-selected project's BOQ.
  if(costLogView==='category' && costLogCategory && !boqCategories.includes(costLogCategory)){
    costLogView = 'menu';
  }
  const showAddBtn = costLogView==='all' || costLogView==='category';
  const subHint = showAddBtn
    ? tf('กรอกรายการซื้อของแต่ละครั้งลงตารางได้เลย ยอดเงินรวมคำนวณอัตโนมัติจากจำนวน × ราคาต่อหน่วย · ใบสั่งซื้อเดียวกันมีได้หลายรายการ กด ➕🧾 ที่แถวเพื่อเพิ่มรายการถัดไปในใบสั่งซื้อเดิม','Type each purchase straight into the table -- the total is calculated automatically from quantity × unit price. One PO can have several items -- tap ➕🧾 on a row to add the next item under the same PO')
    : costLogView==='summary'
      ? tf('ภาพรวมต้นทุนจัดซื้อทั้งหมด แยกตามหมวดหมู่งาน','An overview of total purchase cost, broken down by work category')
      : tf('เลือกหมวดงานเพื่อดูประวัติและกรอกต้นทุนต่อในหมวดนั้น','Pick a work category to see its history and keep logging costs into it');
  const breadcrumb = costLogView==='category'
    ? `<div class="hint" style="margin:-8px 0 14px">🗂️ <button class="linklike" data-cl-view="menu">${tf('เมนูหมวดงาน','Category menu')}</button> ▸ 📁 ${escapeHtml(costLogCategory||tf('ไม่ได้เชื่อมกับหมวดหมู่งาน','Not linked to a category'))}</div>`
    : '';
  let body;
  if(costLogView==='summary'){
    const grandTotal = all.reduce((s,c)=> s+(c.total||0), 0);
    body = `
    <div class="grid cols-auto" style="margin-bottom:16px">
      <div class="card kpi"><div class="stat"><span class="lbl">💰 ${tf('ยอดซื้อรวมทั้งหมด','Total purchases')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(grandTotal)}</span></div></div>
      <div class="card kpi"><div class="stat"><span class="lbl">🧾 ${tf('จำนวนรายการ','Entries')}</span><span class="num tabular" style="font-size:19px">${all.length}</span></div></div>
    </div>
    ${costLogCategoryChartHtml(all, proj) || `<div class="empty"><span class="ic">📊</span>${tf('ยังไม่มีข้อมูลให้สรุป','Nothing to summarize yet')}</div>`}
    `;
  } else if(costLogView==='category'){
    const scoped = all.filter(c=>(c.taskId||'')===costLogCategory);
    body = costLogTableSectionHtml(scoped, boqCategories);
  } else if(costLogView==='all'){
    body = costLogTableSectionHtml(all, boqCategories);
  } else {
    body = renderCostLogMenu(all, boqCategories);
  }
  return `
  <div class="page-head">
    <div><h2>${tf('บันทึกต้นทุนการจัดซื้อ','Procurement Cost Log')}</h2><div class="sub">${subHint}</div></div>
    ${showAddBtn? `<button class="btn primary" id="btn-add-costlog">+ ${tf('เพิ่มรายการ','Add row')}</button>` : ''}
  </div>
  ${costLogSubnavHtml(costLogView)}
  ${breadcrumb}
  ${body}
  `;
}
function wireCostLog(proj=P()){
  const addBtn = $('#btn-add-costlog');
  if(addBtn) addBtn.onclick = ()=>{
    proj.costLog = proj.costLog||[];
    const entry = newCostLogEntry();
    // Adding from inside a category's own page: pre-link the new row to
    // that category so "click category, see history, keep typing" doesn't
    // also require re-picking the same category from the dropdown every
    // single row.
    if(costLogView==='category') entry.taskId = costLogCategory;
    proj.costLog.push(entry);
    saveData(); render();
  };
  // Hub sub-nav: เมนูหมวดงาน / หน้ารวม / สรุป, plus each category card on
  // the menu itself (those also carry data-cl-category, including "" for
  // the not-linked bucket -- checked via `in` since '' is falsy but still a
  // real, intentional selection).
  $$('[data-cl-view]').forEach(b=> b.onclick = ()=>{
    costLogView = b.dataset.clView;
    if('clCategory' in b.dataset) costLogCategory = b.dataset.clCategory;
    render(); window.scrollTo({top:0});
  });
  $$('[data-cl-filter]').forEach(b=> b.onclick = ()=>{ costLogStatusFilter=b.dataset.clFilter; render(); });
  // Inline "spreadsheet" editing: typing into a cell mutates the underlying
  // entry directly and, for qty/unit price, recomputes just that row's total
  // cell in place -- deliberately NOT calling render() on every keystroke,
  // since a full re-render rebuilds the DOM and would steal focus/cursor
  // position out from under whatever the user is still typing into (same
  // reasoning as the pattern used for material-request line inputs above).
  // The change is written to localStorage on blur, once the user leaves the
  // cell, not on every keystroke.
  $$('[data-cl-row]').forEach(row=>{
    const id = row.dataset.clRow;
    const entry = (proj.costLog||[]).find(c=>c.id===id);
    if(!entry) return;
    row.querySelectorAll('input[data-cl-field]').forEach(inp=>{
      const field = inp.dataset.clField;
      inp.oninput = ()=>{
        if(field==='qty' || field==='unitCost'){
          entry[field] = inp.value===''? null : parseNumLoose(inp.value);
          costLogRecalcTotal(entry);
          const totalCell = row.querySelector('[data-cl-total]');
          if(totalCell) totalCell.textContent = fmtCurrency(entry.total||0);
        } else {
          entry[field] = inp.value;
        }
      };
      inp.onblur = ()=> saveData();
    });
    row.querySelectorAll('select[data-cl-field]').forEach(sel=>{
      sel.onchange = ()=>{
        entry[sel.dataset.clField] = sel.value;
        saveData();
        render(); // status affects the filter-chip counts, so refresh those
      };
    });
  });
  $$('[data-cl-delete]').forEach(btn=>{
    btn.onclick = ()=>{
      if(!confirm(tf('ลบรายการนี้หรือไม่?','Delete this entry?'))) return;
      proj.costLog = (proj.costLog||[]).filter(c=>c.id!==btn.dataset.clDelete);
      saveData(); render();
    };
  });
  // "Add another item to this same PO": one PO number can cover several
  // line items (e.g. wire + sockets on the same purchase order), so this
  // inserts a fresh row right after the source row, pre-filled with the
  // fields that are normally shared across a whole PO (date, PO no., work
  // type/nature, linked category, ordered by, status) -- leaving only the
  // item-specific fields (item name, unit, qty, unit price, note) blank for
  // the user to fill in. The generic "+ เพิ่มรายการ" button above still adds
  // a fully blank row, for an unrelated purchase.
  $$('[data-cl-duplicate]').forEach(btn=>{
    btn.onclick = ()=>{
      const src = (proj.costLog||[]).find(c=>c.id===btn.dataset.clDuplicate);
      if(!src) return;
      const dup = newCostLogEntry();
      dup.date = src.date; dup.po = src.po; dup.workType = src.workType;
      dup.workNature = src.workNature; dup.taskId = src.taskId;
      dup.orderedBy = src.orderedBy; dup.status = src.status;
      const idx = proj.costLog.indexOf(src);
      proj.costLog.splice(idx+1, 0, dup);
      saveData(); render();
    };
  });
}

/* ============================= SCREEN: PURCHASING PLAN (แผนสั่งของ) =============================
   Per-project material ordering roadmap modelled on a real purchasing-plan
   spreadsheet the user shared. One row per BOQ item (never a separate,
   hand-maintained list -- so it can never drift out of sync with the BOQ),
   grouped by the same BOQ category headings and the same itemCode sort order
   as the Budget and Master Plan & BOQ screens (boqCategoryGroups()), which is
   what keeps "No." identical to the item's own BOQ code everywhere in the
   app. Need-on-site date is read straight from the item's Master Plan start
   date; order-by date is computed from that minus the item's own lead time.
   All the purchasing-specific fields (quotation/drawing qty, variance note,
   supplier, lead time, actual order qty, PO no., order status, delivery
   source, payment status, notes) live directly on the BOQ item itself
   (pp-prefixed fields), the same "extra fields bolted onto the BOQ item"
   pattern already used for procureOrderDateManual/etc. on the Master Plan
   chart -- so there's exactly one BOQ item record per line, never a second
   shadow copy that could disagree with it. */
function renderPurchasePlan(proj=P()){
  if(!proj.boq.length){
    return `<div class="page-head"><div><h2>${tf('แผนสั่งของ (Purchasing Plan)','Purchasing Plan')}</h2></div></div><div class="empty"><span class="ic">📦</span>${tf('เพิ่มรายการงานในแผนงานหลักก่อน เพื่อเริ่มวางแผนสั่งของ','Add work items in the Master Plan first to start planning material orders')}</div>`;
  }
  const groups = boqCategoryGroups(proj.boq);
  let overdueCount=0, dueSoonCount=0, notOrderedCount=0;
  const rows = groups.map(g=>{
    const label = g.cat? escapeHtml(g.cat) : tf('ไม่ระบุหมวดหมู่','Uncategorized');
    const catHeader = `<tr class="budget-cat-row"><td colspan="17">📁 ${label}</td></tr>`;
    const itemRows = g.items.map(item=>{
      const orderStatus = item.ppOrderStatus || 'not_ordered';
      const orderStatusDef = PP_ORDER_STATUS.find(s=>s.v===orderStatus) || PP_ORDER_STATUS[0];
      const paymentStatus = item.ppPaymentStatus || 'pending';
      const needDate = ppNeedOnSiteDate(item);
      const orderByDate = ppOrderByDate(item);
      const alert = ppAlertStatus(item);
      if(alert==='overdue') overdueCount++; else if(alert==='duesoon') dueSoonCount++;
      if(orderStatus==='not_ordered') notOrderedCount++;
      const alertHtml = alert==='overdue'? `<span class="badge pp-cancelled">🔴 ${tf('เกินกำหนด','Overdue')}</span>`
        : alert==='duesoon'? `<span class="badge pp-not-ordered">🟡 ${tf('ใกล้ถึงกำหนด','Due soon')}</span>` : '';
      const quotationQty = (item.ppQuotationQty!=null && item.ppQuotationQty!=='') ? item.ppQuotationQty : item.qtyTotal;
      const drawingQty = item.ppDrawingQty!=null? item.ppDrawingQty : '';
      // Highlight the drawing-qty/variance-note cells whenever a drawing qty
      // has been entered and disagrees with the quotation qty -- these are
      // exactly the "numbers worth double-checking before ordering for real"
      // cells the source spreadsheet calls out with a soft-yellow fill.
      const qtyMismatch = drawingQty!==''&&Number(drawingQty)!==Number(quotationQty);
      const orderStatusLabel = escapeHtml(tf(orderStatusDef.th,orderStatusDef.en));
      const paymentStatusDef = PP_PAYMENT_STATUS.find(s=>s.v===paymentStatus)||PP_PAYMENT_STATUS[0];
      const paymentStatusLabel = escapeHtml(tf(paymentStatusDef.th,paymentStatusDef.en));
      const deliverySourceDef = PP_DELIVERY_SOURCE.find(s=>s.v===item.ppDeliverySource);
      const deliverySourceLabel = deliverySourceDef? escapeHtml(tf(deliverySourceDef.th,deliverySourceDef.en)) : '-';
      return `<tr data-pp-row="${item.id}" class="${alert==='overdue'?'pp-row-overdue':alert==='duesoon'?'pp-row-duesoon':''}">
        <td class="tabular hint">${escapeHtml(item.itemCode||'-')}</td>
        <td title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</td>
        <td>${escapeHtml(item.unit)}</td>
        <td><input type="number" step="0.01" data-pp-field="ppQuotationQty" value="${quotationQty==null?'':quotationQty}"></td>
        <td${qtyMismatch?' style="background:var(--amber-50)"':''}><input type="number" step="0.01" data-pp-field="ppDrawingQty" value="${drawingQty}"></td>
        <td${qtyMismatch?' style="background:var(--amber-50)"':''}><input type="text" data-pp-field="ppVarianceNote" value="${escapeHtml(item.ppVarianceNote||'')}" placeholder="${tf('หมายเหตุ','note')}" title="${tf('หมายเหตุเปรียบเทียบ','comparison note')}"></td>
        <td class="tabular hint" title="${tf('อัตโนมัติจากวันเริ่มงานในแผนงานหลัก','Automatic from the Master Plan start date')}">${needDate? fmtDateShort(needDate) : '-'}</td>
        <td><input type="text" data-pp-field="ppSupplier" value="${escapeHtml(item.ppSupplier||'')}" placeholder="${tf('ซัพพลายเออร์','supplier')}" title="${escapeHtml(item.ppSupplier||'')}"></td>
        <td><input type="number" min="0" step="1" data-pp-field="ppLeadTimeDays" value="${item.ppLeadTimeDays==null?'':item.ppLeadTimeDays}" placeholder="${PP_DEFAULT_LEAD_DAYS}" title="${tf(`ค่าเริ่มต้น ${PP_DEFAULT_LEAD_DAYS} วัน ถ้าไม่ได้กรอก`,`Defaults to ${PP_DEFAULT_LEAD_DAYS} days if left blank`)}"></td>
        <td class="tabular hint" title="${tf(`คำนวณอัตโนมัติ = วันที่ต้องถึงหน้างาน − Lead Time (ค่าเริ่มต้น ${PP_DEFAULT_LEAD_DAYS} วัน ถ้าไม่ได้กรอก)`,`Computed automatically = need-on-site date − lead time (defaults to ${PP_DEFAULT_LEAD_DAYS} days if left blank)`)}">${orderByDate? fmtDateShort(orderByDate) : '-'}</td>
        <td>${alertHtml}</td>
        <td><input type="number" step="0.01" data-pp-field="ppActualOrderQty" value="${item.ppActualOrderQty==null?'':item.ppActualOrderQty}"></td>
        <td><input type="text" data-pp-field="ppPoNo" value="${escapeHtml(item.ppPoNo||'')}" placeholder="${tf('เลขที่ PO','PO no.')}" title="${escapeHtml(item.ppPoNo||'')}"></td>
        <td><select data-pp-field="ppOrderStatus" class="pp-status-select ${orderStatusDef.cls}" title="${orderStatusLabel}">${PP_ORDER_STATUS.map(s=>`<option value="${s.v}" ${orderStatus===s.v?'selected':''}>${escapeHtml(tf(s.th,s.en))}</option>`).join('')}</select></td>
        <td><select data-pp-field="ppDeliverySource" title="${deliverySourceLabel}"><option value="">-</option>${PP_DELIVERY_SOURCE.map(s=>`<option value="${s.v}" ${item.ppDeliverySource===s.v?'selected':''}>${escapeHtml(tf(s.th,s.en))}</option>`).join('')}</select></td>
        <td><select data-pp-field="ppPaymentStatus" class="pp-status-select ${paymentStatusDef.cls}" title="${paymentStatusLabel}">${PP_PAYMENT_STATUS.map(s=>`<option value="${s.v}" ${paymentStatus===s.v?'selected':''}>${escapeHtml(tf(s.th,s.en))}</option>`).join('')}</select></td>
        <td><input type="text" data-pp-field="ppNotes" value="${escapeHtml(item.ppNotes||'')}" placeholder="${tf('หมายเหตุ','note')}" title="${escapeHtml(item.ppNotes||'')}"></td>
      </tr>`;
    }).join('');
    return catHeader + itemRows;
  }).join('');
  const alertNote = overdueCount? `<div class="role-note" style="margin-bottom:16px;background:var(--coral-50);border-color:var(--coral-500);color:var(--coral-600)">🔴 ${overdueCount} ${tf('รายการเกินกำหนดสั่งซื้อแล้วแต่ยังไม่ได้สั่ง','item(s) are past their order-by date and still not ordered')}${dueSoonCount? ` · 🟡 ${dueSoonCount} ${tf('รายการใกล้ถึงกำหนด (ภายใน 3 วัน)','due within 3 days')}` : ''}</div>`
    : dueSoonCount? `<div class="role-note" style="margin-bottom:16px;background:var(--amber-50);border-color:var(--amber-500)">🟡 ${dueSoonCount} ${tf('รายการใกล้ถึงกำหนดสั่งซื้อ (ภายใน 3 วัน)','item(s) are due to be ordered within 3 days')}</div>` : '';
  return `
  <div class="page-head">
    <div><h2>${tf('แผนสั่งของ (Purchasing Plan)','Purchasing Plan')}</h2><div class="sub">${tf(`แผนสั่งของเข้าหน้างานของทุกรายการใน BOQ — วันที่ต้องถึงหน้างานดึงจากแผนงานหลักอัตโนมัติ ส่วนวันที่ต้องสั่งซื้อคำนวณจาก Lead Time ที่กรอกต่อรายการ (ค่าเริ่มต้น ${PP_DEFAULT_LEAD_DAYS} วันก่อนถึงหน้างาน ถ้าไม่ได้กรอก)`,`Material ordering plan for every BOQ item — the need-on-site date is pulled automatically from the Master Plan, and the order-by date is computed from the lead time entered per item (defaults to ${PP_DEFAULT_LEAD_DAYS} days before the need-on-site date if left blank)`)}</div></div>
  </div>
  ${alertNote}
  <div class="grid cols-auto" style="margin-bottom:16px">
    <div class="card kpi"><div class="stat"><span class="lbl">📦 ${tf('รายการทั้งหมด','Total items')}</span><span class="num tabular" style="font-size:19px">${proj.boq.length}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">🟡 ${tf('ยังไม่ได้สั่ง','Not yet ordered')}</span><span class="num tabular" style="font-size:19px">${notOrderedCount}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">🔴 ${tf('เกินกำหนดสั่งซื้อ','Overdue to order')}</span><span class="num tabular" style="font-size:19px;color:${overdueCount?'var(--coral-600)':'inherit'}">${overdueCount}</span></div></div>
  </div>
  <div class="table-topscroll pp-wrap-topscroll" id="pp-topscroll"><div id="pp-topscroll-spacer"></div></div>
  <div class="table-wrap pp-wrap" id="pp-table-wrap"><table class="budget-table pp-table"><thead><tr>
    <th>${tf('No.','No.')}</th><th>${tf('รายการวัสดุ/อุปกรณ์','Item')}</th><th>${tf('หน่วย','Unit')}</th>
    <th>${tf('จำนวนตามใบเสนอราคา','Quotation Qty')}</th><th>${tf('จำนวนตามแบบขออนุญาต','Drawing Qty')}</th><th>${tf('ส่วนต่าง/หมายเหตุ','Variance / Note')}</th>
    <th>${tf('วันที่ต้องถึงหน้างาน','Need-on-Site Date')}</th><th>${tf('ซัพพลายเออร์','Supplier')}</th><th>${tf('Lead Time (วัน)','Lead Time (days)')}</th>
    <th>${tf('วันที่ต้องสั่งซื้อ','Order-by Date')}</th><th>${tf('สถานะแจ้งเตือน','Alert')}</th>
    <th>${tf('จำนวนที่สั่งจริง','Actual Order Qty')}</th><th>${tf('เลขที่ใบสั่งซื้อ','PO No.')}</th><th>${tf('สถานะการสั่งของ','Order Status')}</th>
    <th>${tf('แหล่งจัดส่ง','Delivery Source')}</th><th>${tf('สถานะการจ่ายเงิน','Payment Status')}</th><th>${tf('หมายเหตุ','Notes')}</th>
  </tr></thead><tbody>${rows}</tbody></table></div>
  `;
}
// Mirrors wireMasterPlan()'s #gantt-topscroll sync exactly: a slim scrollbar
// pinned right above the table (reachable without scrolling all the way down
// past however many BOQ items there are) whose scrollLeft is kept in lockstep
// with the real table-wrap's own horizontal scroll, in both directions. The
// spacer div's width has to be set from JS (table.scrollWidth) rather than
// baked into the render-time HTML, since a plain <table> auto-sizes its
// columns from cell content and that width isn't known until after layout.
function wirePpTopscroll(){
  const wrap = $('#pp-table-wrap');
  const topScroll = $('#pp-topscroll');
  const spacer = $('#pp-topscroll-spacer');
  if(!wrap || !topScroll || !spacer) return;
  const table = wrap.querySelector('table');
  if(table) spacer.style.width = table.scrollWidth+'px';
  let syncing = false;
  topScroll.onscroll = ()=>{ if(syncing) return; syncing=true; wrap.scrollLeft = topScroll.scrollLeft; syncing=false; };
  wrap.onscroll = ()=>{ if(syncing) return; syncing=true; topScroll.scrollLeft = wrap.scrollLeft; syncing=false; };
}
function wirePurchasePlan(proj=P()){
  wirePpTopscroll();
  $$('[data-pp-row]').forEach(row=>{
    const item = proj.boq.find(i=>i.id===row.dataset.ppRow);
    if(!item) return;
    row.querySelectorAll('input[data-pp-field]').forEach(inp=>{
      const field = inp.dataset.ppField;
      inp.oninput = ()=>{
        item[field] = inp.value===''? null : (inp.type==='number'? parseNumLoose(inp.value) : inp.value);
        if(inp.hasAttribute('title')) inp.title = inp.value; // keep the hover tooltip in sync with the (narrowed) input's live value
      };
      // Fields that feed a computed column (need-on-site/order-by date,
      // overdue alert, the quotation-vs-drawing mismatch highlight) need a
      // full re-render on blur to refresh those read-only cells; free-text
      // fields (supplier, PO no., notes) just save quietly so a keystroke
      // never steals focus by rebuilding the row underneath the cursor.
      const affectsComputed = field==='ppLeadTimeDays' || field==='ppQuotationQty' || field==='ppDrawingQty';
      inp.onblur = ()=>{ saveData(); if(affectsComputed) render(); };
    });
    row.querySelectorAll('select[data-pp-field]').forEach(sel=>{
      sel.onchange = ()=>{
        item[sel.dataset.ppField] = sel.value;
        saveData();
        render(); // order status affects the alert column/KPI counts/row highlight
      };
    });
  });
}

// Per-project inspection ("ใบตรวจงาน") reports, modeled after the printed
// TC INSPECTION REPORT form: a header (project/work/quotation/PO/team/date),
// an unlimited list of inspection line items (each with photos, description,
// work-type code, %, pass/fail and a note), and a 4-role approval workflow
// (Inspector -> PM -> Management -> Accounting). Stored as proj.inspectionReports
// (guarded with `||[]` everywhere since older saved projects won't have the
// field yet) so it rides along with the rest of the project on every
// saveData()/cloud push -- no separate sync path needed.
const INSPECT_WORK_TYPES = [
  {v:'ST', th:'โครงสร้าง (ST)', en:'Structure (ST)'},
  {v:'AR', th:'สถาปัตยกรรม (AR)', en:'Architecture (AR)'},
  {v:'SN', th:'ระบบสุขาภิบาล (SN)', en:'Sanitary (SN)'},
  {v:'EE', th:'ระบบไฟฟ้า (EE)', en:'Electrical (EE)'},
  {v:'ME', th:'เครื่องกล (ME)', en:'Mechanical (ME)'},
  {v:'other', th:'งานอื่นๆ ระบุ', en:'Other (specify)'},
];
const INSPECT_APPROVAL_ROLES = [
  {role:'inspector', th:'ผู้ตรวจสอบ', en:'Inspector'},
  {role:'pm', th:'หัวหน้าโครงการ', en:'Project Manager'},
  {role:'management', th:'ผู้บริหาร', en:'Management'},
  {role:'accounting', th:'ฝ่ายบัญชี', en:'Accounting'},
];
let inspectionProjectId = null; // hub-level project selector, mirrors purchasingProjectId
let editingInspectionId = null; // null | 'new' | report id -- controls the editor modal
let inspectionDraft = null; // in-progress copy being edited; items[].pendingPhotos/existingPhotoIds/removedPhotoIds mirror the itemDraft photo pattern
// Document numbering: Inspec-<ProjectName>-<YYYYMMDD><seq>, where <seq> is a
// simple per-project running count (proj.inspectionReports.length + 1) --
// "separate per project" per the request, so each project's own report list
// starts counting from 1 regardless of date.
function genInspecNo(proj, dateStr){
  const ymd = (dateStr||todayStr()).replace(/-/g,'');
  const seq = (proj.inspectionReports||[]).length + 1;
  const slug = (proj.name||'Project').trim().replace(/\s+/g,'').slice(0,24) || 'Project';
  return 'Inspec-'+slug+'-'+ymd+String(seq).padStart(3,'0');
}
function blankInspectionItem(){
  return {id:uid(), description:'', workType:'', workTypeOther:'', percent:'', passStatus:'', note:'', existingPhotoIds:[], pendingPhotos:[], removedPhotoIds:[]};
}
function openInspectionDraft(proj, id){
  if(id==='new'){
    inspectionDraft = {
      reportNo: genInspecNo(proj, todayStr()),
      inspectionDate: todayStr(),
      projectName: proj.name||'',
      workName:'', quotationNo:'', poNo:'', teamName:'',
      items:[blankInspectionItem()],
      approvalSteps: INSPECT_APPROVAL_ROLES.map(r=>({role:r.role, name:'', approved:false, approvedAt:''})),
    };
  } else {
    const r = (proj.inspectionReports||[]).find(x=>x.id===id);
    if(!r) return;
    inspectionDraft = {
      reportNo: r.reportNo, inspectionDate: r.inspectionDate||todayStr(), projectName: r.projectName||'',
      workName: r.workName||'', quotationNo: r.quotationNo||'', poNo: r.poNo||'', teamName: r.teamName||'',
      items: (r.items&&r.items.length? r.items : [{}]).map(it=>({
        id: it.id||uid(), description: it.description||'', workType: it.workType||'', workTypeOther: it.workTypeOther||'',
        percent: it.percent==null?'':it.percent, passStatus: it.passStatus||'', note: it.note||'',
        existingPhotoIds: (it.photoIds||[]).slice(), pendingPhotos: [], removedPhotoIds: [],
      })),
      approvalSteps: (r.approvalSteps&&r.approvalSteps.length? r.approvalSteps : INSPECT_APPROVAL_ROLES.map(x=>({role:x.role,name:'',approved:false,approvedAt:''}))).map(s=>({...s})),
    };
  }
  editingInspectionId = id;
}

function wireInspectionEditor(proj){
  const bg = $('#insp-modal-bg');
  if(!bg) return;
  const d = inspectionDraft;
  $('#insp-modal-close').onclick = closeInspectionDraft;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeInspectionDraft(); });
  const nameInp=$('#insp-project-name'); if(nameInp) nameInp.oninput=()=>{ d.projectName=nameInp.value; };
  const workInp=$('#insp-work-name'); if(workInp) workInp.oninput=()=>{ d.workName=workInp.value; };
  const quotInp=$('#insp-quotation-no'); if(quotInp) quotInp.oninput=()=>{ d.quotationNo=quotInp.value; };
  const poInp=$('#insp-po-no'); if(poInp) poInp.oninput=()=>{ d.poNo=poInp.value; };
  const teamInp=$('#insp-team-name'); if(teamInp) teamInp.oninput=()=>{ d.teamName=teamInp.value; };
  const dateInp=$('#insp-date'); if(dateInp) dateInp.onchange=()=>{ d.inspectionDate=dateInp.value; };

  const syncItemFieldsFromDom = ()=>{
    $$('[data-insp-field]').forEach(el=>{
      const idx = Number(el.dataset.idx);
      const item = d.items[idx]; if(!item) return;
      item[el.dataset.inspField] = el.value;
    });
  };
  $$('[data-insp-field]').forEach(el=>{
    const evt = (el.tagName==='SELECT')? 'onchange':'oninput';
    el[evt] = ()=>{
      syncItemFieldsFromDom();
      if(el.dataset.inspField==='workType') render(); // reveal/hide the "other" free-text field
    };
  });
  $('#insp-add-item').onclick = ()=>{ syncItemFieldsFromDom(); d.items.push(blankInspectionItem()); render(); };
  $$('[data-rm-insp-item]').forEach(b=> b.onclick = ()=>{
    syncItemFieldsFromDom();
    if(d.items.length<=1){ toast(tf('ต้องมีอย่างน้อย 1 รายการ','At least one item is required')); return; }
    d.items.splice(Number(b.dataset.rmInspItem),1); render();
  });

  const processInspFiles = async (fileList, item)=>{
    const files = Array.from(fileList||[]);
    for(const f of files){
      if(f.type.indexOf('image/')!==0) continue;
      try{ const dataUrl = await compressImage(f); item.pendingPhotos.push({dataUrl}); }catch(err){}
      await new Promise(r=>setTimeout(r,0));
    }
  };
  d.items.forEach((item,idx)=>{
    const dz = $('#insp-drop-zone-'+idx);
    if(dz){
      dz.ondragover = (e)=>{ e.preventDefault(); dz.classList.add('drag-over'); };
      dz.ondragleave = ()=>{ dz.classList.remove('drag-over'); };
      dz.ondrop = async (e)=>{ e.preventDefault(); dz.classList.remove('drag-over'); syncItemFieldsFromDom(); await processInspFiles(e.dataTransfer.files, item); render(); };
    }
  });
  $$('[data-insp-photo-idx]').forEach(inp=> inp.onchange = async ()=>{
    syncItemFieldsFromDom();
    const item = d.items[Number(inp.dataset.inspPhotoIdx)]; if(!item) return;
    await processInspFiles(inp.files, item);
    inp.value=''; render();
  });
  $$('[data-rm-insp-existing-photo]').forEach(b=> b.onclick = ()=>{
    syncItemFieldsFromDom();
    const [idx,id] = b.dataset.rmInspExistingPhoto.split(':');
    const item = d.items[Number(idx)]; if(!item) return;
    item.removedPhotoIds.push(id); render();
  });
  $$('[data-rm-insp-pending-photo]').forEach(b=> b.onclick = ()=>{
    syncItemFieldsFromDom();
    const [idx,pIdx] = b.dataset.rmInspPendingPhoto.split(':').map(Number);
    const item = d.items[idx]; if(!item) return;
    item.pendingPhotos.splice(pIdx,1); render();
  });

  $$('[data-insp-approver-name]').forEach(inp=> inp.oninput = ()=>{
    d.approvalSteps[Number(inp.dataset.inspApproverName)].name = inp.value;
  });
  $$('[data-insp-approve]').forEach(b=> b.onclick = ()=>{
    syncItemFieldsFromDom();
    const idx = Number(b.dataset.inspApprove);
    const step = d.approvalSteps[idx];
    if(!step.name || !step.name.trim()){ toast(tf('กรุณาระบุชื่อผู้ลงนามก่อนอนุมัติ','Please enter the signer name before approving')); return; }
    step.approved = true; step.approvedAt = todayStr();
    render();
  });
  $$('[data-insp-unapprove]').forEach(b=> b.onclick = ()=>{
    syncItemFieldsFromDom();
    const idx = Number(b.dataset.inspUnapprove);
    d.approvalSteps[idx].approved = false; d.approvalSteps[idx].approvedAt = '';
    render();
  });

  $('#insp-save').onclick = async ()=>{
    syncItemFieldsFromDom();
    const projectName = d.projectName.trim();
    if(!projectName || !d.inspectionDate){ toast(tf('กรุณากรอกชื่อ Project และวันที่ตรวจงาน','Please fill in the project name and inspection date')); return; }
    const savedItems = [];
    for(const it of d.items){
      const keptExisting = it.existingPhotoIds.filter(id=>!it.removedPhotoIds.includes(id));
      const newIds=[];
      for(const p of it.pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newIds.push(id); }
      savedItems.push({
        id: it.id, description:(it.description||'').trim(), workType: it.workType||'', workTypeOther:(it.workTypeOther||'').trim(),
        percent: it.percent===''? null : parseFloat(it.percent), passStatus: it.passStatus||'', note:(it.note||'').trim(),
        photoIds: keptExisting.concat(newIds),
      });
    }
    const workName=d.workName.trim(), quotationNo=d.quotationNo.trim(), poNo=d.poNo.trim(), teamName=d.teamName.trim();
    const approvalSteps = d.approvalSteps.map(s=>({...s}));
    if(editingInspectionId==='new'){
      proj.inspectionReports = proj.inspectionReports || [];
      proj.inspectionReports.push({
        id: uid(), reportNo: d.reportNo, createdAt: new Date().toISOString(),
        inspectionDate: d.inspectionDate, projectName, workName, quotationNo, poNo, teamName,
        items: savedItems, approvalSteps,
      });
    } else {
      const r = (proj.inspectionReports||[]).find(x=>x.id===editingInspectionId);
      if(r) Object.assign(r, {inspectionDate:d.inspectionDate, projectName, workName, quotationNo, poNo, teamName, items:savedItems, approvalSteps});
    }
    saveData(); editingInspectionId=null; inspectionDraft=null; render(); toast(tf('บันทึกใบตรวจงานแล้ว','Inspection report saved'));
  };

  refreshInspectionPhotos();
}
async function refreshInspectionPhotos(){
  const imgs = $$('[data-insp-thumb-id]');
  for(const img of imgs){ const data = await loadRefPhoto(img.dataset.inspThumbId); if(data) img.src = data; }
}

/* ============================= SCREEN: BUDGET (BOQ vs. Actual) ============================= */
// Rolls up actual purchase cost from material-request lines against each BOQ
// item's planned budget (qtyTotal x unitPrice). A request line only counts
// toward a specific BOQ item's actual cost once it is BOTH linked to that
// item (line.taskId, set when the request was created) AND priced
// (line.actualUnitCost, entered by procurement at delivery confirmation) --
// see requestModalHtml() and the #dt-schedule handler in wireDetailModal().
// The Procurement Cost Log links each entry to a whole BOQ *category*
// (the main work heading, e.g. "4. งานไฟฟ้า-เดินสายไฟ") rather than one
// specific line item -- see the "เชื่อมงาน" field in renderCostLog()/
// wireCostLog() below. That coarser link means its costs can't be folded
// into this item-level map; they roll up separately by category in
// costLogCategoryTotals(), and renderBudget() displays that on each
// category's header row instead of any single item's row.
function boqActualsMap(){
  const map = {}; // taskId -> {qty, cost, refs:[{reqNo,poNumber,vendor,purchaseDate}]}
  P().materialRequests.filter(r=>!r.trashed).forEach(r=>{
    (r.lines||[]).forEach(l=>{
      if(!l.taskId || l.actualUnitCost==null) return;
      const qty = (l.actualQty!=null? l.actualQty : l.qty) || 0;
      const cost = qty * l.actualUnitCost;
      if(!map[l.taskId]) map[l.taskId] = {qty:0, cost:0, refs:[]};
      map[l.taskId].qty += qty;
      map[l.taskId].cost += cost;
      map[l.taskId].refs.push({reqNo:r.reqNo, poNumber:(r.procurement&&r.procurement.poNumber)||'', vendor:(r.procurement&&r.procurement.vendor)||'', purchaseDate:(r.procurement&&r.procurement.deliveryDate)||''});
    });
  });
  return map;
}
// Cost Log spend grouped by the BOQ category it's linked to (taskId now
// holds a category string, not an item id -- see the comment above
// boqActualsMap()). Only "ordered"/"delivered" entries count as committed
// spend, same rule as projectActualCostTotal() below; a "pending" entry is
// still just a request.
function costLogCategoryTotals(){
  const map = {}; // category string -> {cost, count}
  (P().costLog||[]).forEach(c=>{
    if(!c.taskId || c.status==='pending') return;
    if(!map[c.taskId]) map[c.taskId] = {cost:0, count:0};
    map[c.taskId].cost += (c.total||0);
    map[c.taskId].count += 1;
  });
  return map;
}
// Total actual spend across every priced line, linked or not -- this is the
// "real money spent" KPI, independent of whether it can be matched to a BOQ
// line item.
function projectActualCostTotal(){
  let total=0;
  P().materialRequests.filter(r=>!r.trashed).forEach(r=> (r.lines||[]).forEach(l=>{
    if(l.actualUnitCost==null) return;
    const qty = (l.actualQty!=null? l.actualQty : l.qty) || 0;
    total += qty*l.actualUnitCost;
  }));
  (P().costLog||[]).forEach(c=>{ if(c.status!=='pending') total += (c.total||0); });
  return total;
}
// Purchasing budget guardrail: material/procurement spend is capped at 70% of
// the project's total planned BOQ value, with an early warning once spend
// reaches 49% of that BOQ total (i.e. 70% of the 70% cap has already been
// used, leaving 30% of the cap still available). This is a soft guardrail --
// it warns loudly but never blocks creating or approving a request.
function purchaseBudgetStatus(){
  let totalBoqBudget=0;
  P().boq.forEach(item=>{ if(item.unitPrice!=null) totalBoqBudget += item.qtyTotal*item.unitPrice; });
  const totalActualAll = projectActualCostTotal();
  const cap = totalBoqBudget*0.7;
  const warnAt = totalBoqBudget*0.49;
  const pctOfCap = cap>0? (totalActualAll/cap*100) : 0;
  const level = (cap>0 && totalActualAll>=cap)? 'over' : (cap>0 && totalActualAll>=warnAt)? 'warn' : 'ok';
  return {totalBoqBudget, totalActualAll, cap, warnAt, pctOfCap, level};
}
function renderBudget(){
  const proj = P();
  if(!proj.boq.length){
    return `<div class="page-head"><div><h2>${tf('งบประมาณ (BOQ เทียบต้นทุนจริง)','Budget (BOQ vs. Actual)')}</h2></div></div><div class="empty"><span class="ic">💰</span>${tf('เพิ่มรายการงานในแผนงานหลักก่อน เพื่อเริ่มติดตามงบประมาณ','Add work items in the Master Plan first to start tracking budget')}</div>`;
  }
  const actuals = boqActualsMap();
  const catActuals = costLogCategoryTotals();
  const groups = boqCategoryGroups(proj.boq);
  let totalBoqBudget=0, no=0;
  const rows = groups.map(g=>{
    const label = g.cat? escapeHtml(g.cat) : tf('ไม่ระบุหมวดหมู่','Uncategorized');
    const ca = g.cat? catActuals[g.cat] : null;
    const catCostLogNote = ca? ` · 🧾 ${tf('ต้นทุนจากบันทึกจัดซื้อ','Cost log spend')}: <b class="tabular">${fmtCurrency(ca.cost)}</b> (${ca.count} ${tf('รายการ','entries')})` : '';
    const catHeader = `<tr class="budget-cat-row"><td colspan="17">📁 ${label}${catCostLogNote}</td></tr>`;
    const itemRows = g.items.map(item=>{
      no++;
      const boqQty = item.qtyTotal;
      const boqUnitPrice = item.unitPrice;
      const boqTotal = boqUnitPrice!=null? boqQty*boqUnitPrice : null;
      if(boqTotal!=null) totalBoqBudget += boqTotal;
      const a = actuals[item.id];
      const actualQty = a? a.qty : 0;
      const actualTotal = a? a.cost : 0;
      const actualUnitPrice = (a && actualQty>0)? actualTotal/actualQty : null;
      const priceVariance = (boqUnitPrice!=null && actualUnitPrice!=null)? (boqUnitPrice-actualUnitPrice)*actualQty : null;
      const qtyVariance = (boqUnitPrice!=null)? (boqQty-actualQty)*boqUnitPrice : null;
      const totalVariance = (boqTotal!=null)? boqTotal-actualTotal : null;
      let statusLabel, statusClass;
      if(boqUnitPrice==null){ statusLabel=tf('ยังไม่ตั้งราคา','No price set'); statusClass='idle'; }
      else if(!a){ statusLabel=tf('ยังไม่มีค่าใช้จ่าย','No spend yet'); statusClass='ok'; }
      else if(totalVariance>=0){ statusLabel=tf('ปกติ','On budget'); statusClass='ok'; }
      else { statusLabel=tf('เกินงบ','Over budget'); statusClass='bad'; }
      // Per-item purchasing cap: same 70%-of-BOQ rule as the project-wide KPI
      // card, applied to this single row's own BOQ total, with the same
      // early-warning point at 49% (= 70% of the 70% cap) already used there.
      const itemCap = boqTotal!=null? boqTotal*0.7 : null;
      const itemWarnAt = boqTotal!=null? boqTotal*0.49 : null;
      let capItemLabel, capItemClass;
      if(itemCap==null){ capItemLabel=tf('ยังไม่ตั้งราคา','No price set'); capItemClass='idle'; }
      else if(actualTotal>=itemCap){ capItemLabel=tf('🔴 เกินเพดาน','Over cap'); capItemClass='bad'; }
      else if(actualTotal>=itemWarnAt){ capItemLabel=tf('🟡 ใกล้เพดาน','Near cap'); capItemClass='warn'; }
      else { capItemLabel=tf('🟢 ปกติ','OK'); capItemClass='ok'; }
      const refs = a? a.refs : [];
      const refSummary = refs.length? refs.map(r=> [r.poNumber,r.vendor].filter(Boolean).join(' · ') || r.reqNo).join(', ') : '-';
      return `<tr data-edit-item="${item.id}" style="cursor:pointer">
        <td class="tabular">${no}</td>
        <td>${escapeHtml(item.itemCode||'-')}</td>
        <td>${escapeHtml(item.name)}</td>
        <td>${escapeHtml(item.unit)}</td>
        <td class="tabular">${fmtNum(boqQty,2)}</td>
        <td class="tabular">${boqUnitPrice!=null? fmtCurrency(boqUnitPrice):'-'}</td>
        <td class="tabular">${boqTotal!=null? fmtCurrency(boqTotal):'-'}</td>
        <td class="tabular">${itemCap!=null? fmtCurrency(itemCap):'-'}</td>
        <td class="tabular">${a? fmtNum(actualQty,2):'-'}</td>
        <td class="tabular">${actualUnitPrice!=null? fmtCurrency(actualUnitPrice):'-'}</td>
        <td class="tabular">${a? fmtCurrency(actualTotal):'-'}</td>
        <td class="tabular" style="color:${priceVariance!=null&&priceVariance<0?'var(--coral-600)':'inherit'}">${priceVariance!=null? fmtCurrency(priceVariance):'-'}</td>
        <td class="tabular" style="color:${qtyVariance!=null&&qtyVariance<0?'var(--coral-600)':'inherit'}">${qtyVariance!=null? fmtCurrency(qtyVariance):'-'}</td>
        <td class="tabular" style="color:${totalVariance!=null&&totalVariance<0?'var(--coral-600)':'inherit'}">${totalVariance!=null? fmtCurrency(totalVariance):'-'}</td>
        <td><span class="badge ${statusClass}">${statusLabel}</span></td>
        <td><span class="badge ${capItemClass}">${capItemLabel}</span></td>
        <td class="hint" style="white-space:normal;max-width:200px" title="${escapeHtml(refSummary)}">${escapeHtml(refSummary)}</td>
      </tr>`;
    }).join('');
    return catHeader + itemRows;
  }).join('');
  const totalActualAll = projectActualCostTotal();
  const remaining = totalBoqBudget - totalActualAll;
  // Whole-project total of confirmed cost-log entries (not just the ones
  // linked to a category, unlike costLogCategoryTotals() above) -- shown as
  // its own KPI card next to the purchasing cap so the cap's headline number
  // has its actual driver sitting right beside it, instead of only being
  // visible as small per-category notes scattered down the table.
  let costLogTotalAll=0, costLogCountAll=0;
  (proj.costLog||[]).forEach(c=>{ if(c.status==='pending') return; costLogTotalAll += (c.total||0); costLogCountAll++; });
  const purchaseCap = totalBoqBudget*0.7;
  const purchaseWarnAt = totalBoqBudget*0.49;
  const capPct = purchaseCap>0? (totalActualAll/purchaseCap*100) : 0;
  const capLevel = (purchaseCap>0 && totalActualAll>=purchaseCap)? 'over' : (purchaseCap>0 && totalActualAll>=purchaseWarnAt)? 'warn' : 'ok';
  const capAlert = capLevel==='over'
    ? `<div class="role-note" style="margin-bottom:16px;background:var(--coral-50);border-color:var(--coral-500);color:var(--coral-600)">🔴 ${tf('ใช้จ่ายเกินงบจัดซื้อแล้ว (เพดาน 70% ของ BOQ รวม)','Spending has exceeded the purchasing cap (70% of total BOQ)')} — ${tf('ใช้ไป','Spent')} ${fmtCurrency(totalActualAll)} / ${tf('เพดาน','cap')} ${fmtCurrency(purchaseCap)}</div>`
    : capLevel==='warn'
    ? `<div class="role-note" style="margin-bottom:16px;background:var(--amber-50);border-color:var(--amber-500)">🟡 ${tf('ใกล้ถึงเพดานงบจัดซื้อแล้ว (เพดาน 70% ของ BOQ รวม)','Approaching the purchasing cap (70% of total BOQ)')} — ${tf('ใช้ไป','Spent')} ${fmtCurrency(totalActualAll)} / ${tf('เพดาน','cap')} ${fmtCurrency(purchaseCap)} (${fmtNum(capPct,0)}%)</div>`
    : '';
  return `
  <div class="page-head">
    <div><h2>${tf('งบประมาณ (BOQ เทียบต้นทุนจริง)','Budget (BOQ vs. Actual)')}</h2><div class="sub">${tf('เปรียบเทียบงบประมาณตามแผน (BOQ) กับต้นทุนจ่ายจริงที่ยืนยันจากขั้นตอนจัดซื้อ · แตะแถวเพื่อตั้งราคาต่อหน่วยตามแผน','Compares the planned BOQ budget against actual costs confirmed during procurement -- tap a row to set its planned unit price')}</div></div>
  </div>
  ${capAlert}
  <div class="grid cols-auto" style="margin-bottom:16px">
    <div class="card kpi"><div class="stat"><span class="lbl">💰 ${tf('งบประมาณตั้งต้นรวม','Total BOQ budget')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(totalBoqBudget)}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">💸 ${tf('ต้นทุนจ่ายจริงรวม','Total actual cost')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(totalActualAll)}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${remaining>=0?'✅':'🔴'} ${tf('คงเหลืองบประมาณสุทธิ','Remaining budget')}</span><span class="num tabular" style="font-size:19px;color:${remaining>=0?'var(--mint-600)':'var(--coral-600)'}">${fmtCurrency(remaining)}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">🛒 ${tf('งบจัดซื้อ (เพดาน 70% ของ BOQ)','Purchasing cap (70% of BOQ)')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(purchaseCap)}</span></div>
      <div class="progress ${capLevel==='over'?'bad':capLevel==='warn'?'warn':'ok'}" style="margin-top:8px"><i style="width:${clamp(capPct,0,100)}%"></i></div>
      <div class="sub" style="margin-top:4px">${tf('ใช้ไปแล้ว','Used')} ${fmtNum(clamp(capPct,0,999),0)}% ${tf('ของเพดาน','of cap')} · ${tf('แจ้งเตือนที่','warns at')} ${fmtCurrency(purchaseWarnAt)}</div>
    </div>
    <div class="card kpi"><div class="stat"><span class="lbl">🧾 ${tf('ต้นทุนจากบันทึกจัดซื้อ','Cost log spend')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(costLogTotalAll)}</span></div>
      <div class="sub" style="margin-top:4px">${costLogCountAll} ${tf('รายการที่บันทึกไว้','logged entries')}</div>
    </div>
  </div>
  <div class="table-wrap"><table class="budget-table"><thead><tr>
    <th>${tf('No.','No.')}</th><th>${tf('รหัส','Code')}</th><th>${tf('รายการ','Description')}</th><th>${tf('หน่วย','Unit')}</th>
    <th>${tf('ปริมาณ BOQ','BOQ Qty')}</th><th>${tf('ราคา/หน่วย BOQ','BOQ Unit Price')}</th><th>${tf('รวม BOQ','BOQ Total')}</th>
    <th>${tf('งบจัดซื้อ (เพดาน 70%)','Purchase cap (70%)')}</th>
    <th>${tf('ปริมาณจริง','Actual Qty')}</th><th>${tf('ราคา/หน่วยจริง','Actual Unit Price')}</th><th>${tf('รวมจริง','Actual Total')}</th>
    <th>${tf('ผลต่างราคา','Price Variance')}</th><th>${tf('ผลต่างปริมาณ','Qty Variance')}</th><th>${tf('ผลต่างรวม','Total Variance')}</th><th>${tf('สถานะ','Status')}</th>
    <th>${tf('แจ้งเตือนงบจัดซื้อ','Purchase budget alert')}</th><th>${tf('อ้างอิง (PO/ผู้ขาย)','Reference (PO/Vendor)')}</th>
  </tr></thead><tbody>${rows}</tbody></table></div>
  `;
}
function wireBudget(){
  // Reuse the Master Plan item editor -- tapping a budget row opens the same
  // edit form (which now carries the itemCode/unitPrice fields) so setting a
  // planned price and reviewing the schedule stay in one place.
  $$('[data-edit-item]').forEach(row=> row.onclick = ()=>{ openItemDraft(row.dataset.editItem); render(); });
}

/* ============================= SCREEN: DASHBOARD ============================= */
function renderDashboard(){
  const asOf = todayStr();
  const proj = P();
  const summary = projectSummary(asOf, proj.boq, proj.logs);
  if(!proj.boq.length){
    return `<div class="page-head"><div><h2>${tf('แดชบอร์ดวิเคราะห์โปรเจกต์','Project Analytics Dashboard')}</h2></div></div><div class="empty"><span class="ic">📊</span>${tf('เพิ่มรายการงานในแผนงานหลักก่อน เพื่อเริ่มวิเคราะห์','Add work items in the Master Plan first to start the analysis')}</div>`;
  }
  const itemCards = proj.boq.map(item=>{
    const planned = plannedCumAt(item,asOf), actual = actualCumAt(item,asOf,proj.logs);
    const st = itemStatus(item,asOf,proj.logs);
    const pct = clamp((actual/item.qtyTotal)*100,0,100);
    const diff = actual-planned;

function buildSCurve(asOf){
  const proj = P();
  const starts = proj.boq.map(i=>i.startDate);
  const ends = proj.boq.map(i=>i.endDate);
  const summary0 = projectSummary(asOf, proj.boq, proj.logs);
  let rangeEnd = ends.reduce((a,b)=>a>b?a:b);
  if(summary0.predictedEnd && summary0.predictedEnd>rangeEnd) rangeEnd = summary0.predictedEnd;
  const rangeStart = starts.reduce((a,b)=>a<b?a:b);
  const totalDays = Math.max(daysBetween(rangeStart,rangeEnd),1);
  const W=760,H=220,padL=34,padR=14,padT=14,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xFor = (i)=> padL + (i/totalDays)*plotW;
  const yFor = (pct)=> padT + plotH - (clamp(pct,0,100)/100)*plotH;
  let plannedPts=[], actualPts=[];
  for(let d=0; d<=totalDays; d+=Math.max(1,Math.round(totalDays/60))){
    const dateStr = addDays(rangeStart,d);
    let pSum=0,n=0; proj.boq.forEach(it=>{ pSum+=clamp(plannedCumAt(it,dateStr)/(it.qtyTotal||1),0,1); n++; });
    plannedPts.push([xFor(d), yFor((pSum/n)*100)]);
    if(dateStr<=asOf){
      let aSum=0; proj.boq.forEach(it=>{ aSum+=clamp(actualCumAt(it,dateStr,proj.logs)/(it.qtyTotal||1),0,1); });
      actualPts.push([xFor(d), yFor((aSum/n)*100)]);
    }
  }
  const path = pts => 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
  const todayX = xFor(clamp(daysBetween(rangeStart,asOf),0,totalDays));
  const gridLines = [0,25,50,75,100].map(p=>`<line x1="${padL}" x2="${W-padR}" y1="${yFor(p)}" y2="${yFor(p)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-8}" y="${yFor(p)+3}" font-size="9" fill="var(--ink-300)" text-anchor="end" font-family="IBM Plex Mono">${p}</text>`).join('');
  const svg = `<svg class="svcurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <line x1="${todayX}" x2="${todayX}" y1="${padT}" y2="${H-padB}" stroke="var(--ink-300)" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="${todayX}" y="${H-padB+14}" font-size="9" fill="var(--ink-500)" text-anchor="middle" font-family="IBM Plex Mono">${tf('วันนี้','today')}</text>
    <path d="${path(plannedPts)}" fill="none" stroke="var(--purple-600)" stroke-width="2.4"/>
    ${actualPts.length>1? `<path d="${path(actualPts)}" fill="none" stroke="var(--mint-500)" stroke-width="2.4"/>` : ''}
    ${actualPts.length? `<circle cx="${actualPts[actualPts.length-1][0]}" cy="${actualPts[actualPts.length-1][1]}" r="3.6" fill="var(--mint-500)"/>` : ''}
  </svg>`;
  return {svg};
}

let reportPhotoCache = {}; // id -> dataUrl
async function loadReportPhotos(log, reqs){
  const out=[];
  // Each idbGet() is caught individually rather than letting one rejected
  // read (a corrupted entry, or a browser that blocks IndexedDB outright --
  // private browsing, some in-app webviews) throw out of the whole loop.
  // Before this, one bad photo id meant the report's photo grid stayed
  // stuck on "Loading photos..." forever, with no error shown and every
  // other photo silently withheld too.
  for(const pid of (log?log.photoIds:[])||[]){
    if(!reportPhotoCache[pid]){
      try{ reportPhotoCache[pid] = await idbGet(pid); }
      catch(err){ continue; }
    }
    if(reportPhotoCache[pid]){
      const meta = (log.photoMeta&&log.photoMeta[pid]) || (log._captions? {caption:log._captions[pid]} : {});
      const caption = (meta.tag? '['+meta.tag+'] ' : '') + (meta.caption || tf('ภาพหน้างาน','site photo'));
      const kind = meta.kind || dataUrlKind(reportPhotoCache[pid]);
      out.push({id:pid, dataUrl:reportPhotoCache[pid], kind, name:meta.name||'', caption});
    }
  }
  for(const r of (reqs||[])){
    for(const pid of (r.photoIds||[])){
      if(!reportPhotoCache[pid]){
        try{ reportPhotoCache[pid] = await idbGet(pid); }
        catch(err){ continue; }
      }
      if(reportPhotoCache[pid]){
        const meta = (r.photoMeta&&r.photoMeta[pid]) || {};
        const kind = meta.kind || dataUrlKind(reportPhotoCache[pid]);
        out.push({id:pid, dataUrl:reportPhotoCache[pid], kind, name:meta.name||'', caption:tf('อ้างอิงวัสดุ: ','material reference: ')+((r.lines[0]&&r.lines[0].name)||r.reqNo)});
      }
    }
  }
  return out;
}

    ${log && log.deliveryNote ? `<div class="rp-section"><h3>🚚 ${tf('การรับของหน้างานวันนี้','Today’s Material Deliveries')}</h3><p style="font-size:13px;line-height:1.7">${escapeHtml(log.deliveryNote)}</p></div>` : ''}
    ${dayReqs.length? `<div class="rp-section"><h3>🛒 ${tf('รายงานการสั่งซื้อวัสดุหน้างาน (Material Request & Procurement Status)','Material Request & Procurement Status')}</h3>${dayReqs.map(reqReportBlock).join('<hr style="border:none;border-top:1px dashed #E3E1F0;margin:2px 0">')}</div>` : ''}
    <div class="rp-section" id="rp-photo-section">
      <h3>📸 ${tf('ภาพถ่ายความคืบหน้าหน้างานประจำวัน','Daily Site Progress Photos')}</h3>
      <div class="rp-photogrid" id="rp-photogrid"><span class="sub">${tf('กำลังโหลดรูปภาพ...','Loading photos...')}</span></div>
    </div>
    <div class="rp-foot">
      <span>${escapeHtml(c.company||'Project Management')} · ${escapeHtml(c.fullname||'')}</span>
      <span>${tf('สร้างรายงานเมื่อ','Report generated')} ${fmtDate(todayStr())}</span>
    </div>
  `;
}
async function refreshReportPhotos(date){
  const grid = $('#rp-photogrid');
  try{
    const proj = P();
    const log = proj.logs.find(l=>l.date===date);
    const reqs = reqsForDate(date);
    const photos = await loadReportPhotos(log, reqs);
    if(!grid) return;
    if(photos.length){
      grid.innerHTML = photos.map(p=> p.kind==='pdf'?
        `<figure class="rp-pdf-figure"><a href="${p.dataUrl}" target="_blank" rel="noopener" download="${escapeHtml(p.name||'document.pdf')}"><div class="rp-pdf-icon">📄</div></a><figcaption>${escapeHtml(p.name||'PDF')}${p.caption? ' — '+escapeHtml(p.caption) : ''}</figcaption></figure>`
        : `<figure><img src="${p.dataUrl}"><figcaption>${escapeHtml(p.caption||tf('ภาพหน้างาน','site photo'))}</figcaption></figure>`
      ).join('');
    } else {
      // loadReportPhotos() silently drops any photo id it couldn't read (see
      // its own per-photo try/catch), so an expected count > 0 with zero
      // photos actually loaded means every read failed -- distinguish that
      // from "nothing was ever attached" instead of just saying "no photos".
      const expectedCount = ((log&&log.photoIds)||[]).length + (reqs||[]).reduce((s,r)=> s+((r.photoIds||[]).length), 0);
      grid.innerHTML = expectedCount>0
        ? `<span class="sub" style="color:var(--coral-600)">${tf('มีรูปภาพแนบไว้ แต่โหลดไม่สำเร็จ (เบราว์เซอร์นี้อาจบล็อกการจัดเก็บรูปภาพ)','Photos are attached, but failed to load (this browser may be blocking photo storage)')}</span>`
        : `<span class="sub">${tf('ไม่มีรูปภาพสำหรับวันนี้','No photos for this day')}</span>`;
    }
  }catch(err){
    // loadReportPhotos() already guards each individual photo read, so this
    // only fires on something unexpected (e.g. IndexedDB unavailable at all
    // in this browser) -- surface it instead of leaving the grid stuck on
    // "Loading photos..." forever with no explanation.
    console.error('Failed to load report photos', err);
    if(grid) grid.innerHTML = `<span class="sub" style="color:var(--coral-600)">${tf('โหลดรูปภาพไม่สำเร็จ (เบราว์เซอร์นี้อาจบล็อกการจัดเก็บรูปภาพ)','Failed to load photos (this browser may be blocking photo storage)')}</span>`;
  }
}
function wireReport(){
  refreshReportPhotos(state.reportDate);
  const sel = $('#report-date-select');
  if(sel) sel.onchange = ()=>{ state.reportDate = sel.value; $('#reportPrintable').innerHTML = reportBodyHtml(state.reportDate); refreshReportPhotos(state.reportDate); };
  $('#btn-print').onclick = ()=> window.print();
  $('#btn-export-img').onclick = exportReportAsImage;
}
function imgFallbackMsg(){
  return `<div class="card" style="margin-top:10px;background:var(--amber-50);border-color:var(--amber-500)">
  <b style="font-family:var(--font-display);font-size:13px">${tf('สร้างรูปภาพอัตโนมัติไม่สำเร็จในเบราว์เซอร์นี้','Automatic image generation failed in this browser')}</b>
  <p class="sub" style="margin-top:6px">${tf('เบราว์เซอร์บางตัวบล็อกการแปลงหน้าเว็บเป็นรูปภาพด้วยเหตุผลด้านความปลอดภัย วิธีสำรอง: (1) กดปุ่ม “พิมพ์ / บันทึกเป็น PDF” แล้วส่งไฟล์ PDF เข้ากลุ่ม LINE ได้โดยตรง หรือ (2) ใช้ฟีเจอร์ “จับภาพหน้าจอแบบเลื่อน (Scroll Capture / Long Screenshot)” ของมือถือถ่ายรายงานด้านล่างนี้แทน','Some browsers block converting a page to an image for security reasons. Workarounds: (1) tap “Print / Save as PDF” and send the PDF straight into a LINE group, or (2) use your phone’s “Scroll Capture / Long Screenshot” feature on the report below instead.')}</p>
</div>`;
}
async function exportReportAsImage(){
  const holder = $('#export-holder');
  holder.innerHTML = `<div class="sub" style="margin-top:10px">${tf('กำลังสร้างรูปภาพ...','Generating image...')}</div>`;
  // Previously this serialized the report into an <svg><foreignObject> and
  // drew *that* onto a canvas -- a technique Chromium (by far the most
  // common browser for on-site/Android users) treats as "tainting" the
  // canvas as a security precaution, regardless of the content actually
  // being same-origin. canvas.toDataURL() then threw a SecurityError on
  // every single use, which the try/catch below silently turned into the
  // "didn't work" fallback message -- i.e. the feature never actually
  // worked in the most common browser. html2canvas (vendored inline above)
  // sidesteps this entirely: it walks the DOM and repaints each element
  // onto the canvas itself instead of round-tripping through an <img>, so
  // there's no tainted-canvas step to fail on.
  if(typeof html2canvas !== 'function'){
    holder.innerHTML = imgFallbackMsg();
    return;
  }
  try{
    const node = $('#reportPrintable');
    const canvas = await html2canvas(node, {
      backgroundColor:'#ffffff',
      scale:2,
      useCORS:true,
      windowWidth: Math.max(node.scrollWidth, node.clientWidth, 640),
    });
    const pngUrl = canvas.toDataURL('image/png');
    holder.innerHTML = `<div class="exported-wrap"><img src="${pngUrl}" alt="report"><p>${tf('กดค้างที่รูป (มือถือ) หรือคลิกขวา &rarr; บันทึกรูปภาพ (คอมพิวเตอร์) เพื่อบันทึกและส่งเข้ากลุ่ม LINE','Press and hold the image (mobile) or right-click &rarr; save image (desktop) to save and send it to a LINE group')}</p></div>`;
  }catch(err){
    console.error('Export report as image failed', err);
    holder.innerHTML = imgFallbackMsg();
  }
}

/* ============================= WIRE SCREEN ROUTER ============================= */
function wireScreen(){
  if(FIELD_MODE){
    if(!state.currentProjectId) return;
    if(state.tab==='procure') return wireProcure();
    return wireDailyLog();
  }
  if(state.view==='hub') return wireHub();
  if(state.view==='purchasing') return wirePurchasingHub();
  if(state.view==='inspection') return wireInspectionHub();
  if(state.view==='profile') return wireProfile();
  if(state.view==='contractors') return wireContractors();
  if(state.view!=='project') return;
  if(state.tab==='masterplan') wireMasterPlan();
  else if(state.tab==='dailylog') wireDailyLog();
  else if(state.tab==='procure') wireProcure();
  else if(state.tab==='purchaseplan') wirePurchasePlan();
  else if(state.tab==='costlog') wireCostLog();
  else if(state.tab==='budget') wireBudget();
  else if(state.tab==='report') wireReport();
}

/* ============================= OFFLINE / CONNECTIVITY ============================= */
function updateNetStatus(){
  const dot = $('#net-dot');
  if(!dot) return;
  if(navigator.onLine){ dot.classList.remove('offline'); dot.title=tf('ออนไลน์','Online'); }
  else { dot.classList.add('offline'); dot.title=tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลบันทึกอยู่ในเครื่องนี้','Offline — you can keep working normally, data is saved on this device'); }
}
window.addEventListener('online', ()=>{ updateNetStatus(); toast(tf('กลับมาออนไลน์แล้ว','Back online')); });
window.addEventListener('offline', ()=>{ updateNetStatus(); toast(tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลจะถูกบันทึกในเครื่องนี้','Offline — you can keep working normally, data will be saved on this device')); });

/* ============================= INIT ============================= */
// Safety net: without this, dropping a file anywhere outside an actual drop
// zone makes the browser navigate away to that file, discarding whatever the
// user had open (e.g. a half-filled material request). Drop zones themselves
// call preventDefault() in their own handlers, so this never blocks them.
window.addEventListener('dragover', e=> e.preventDefault());
window.addEventListener('drop', e=> e.preventDefault());
bootstrap();
render();
updateNetStatus();
initCloudSync();
})();
</script>
