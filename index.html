/* ============================= STORAGE (IndexedDB for photos) ============================= */
let _dbp=null;
function idb(){
  if(_dbp) return _dbp;
  _dbp = new Promise((resolve,reject)=>{
    const req = indexedDB.open('sitepulse_photos',1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('photos');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbp;
}
async function idbPut(id,dataUrl){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').put(dataUrl,id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(id){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readonly');
    const r=tx.objectStore('photos').get(id);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbDelete(id){
  const db = await idb();
  return new Promise((res)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete=()=>res(true);
  });
}

/* ============================= IMAGE COMPRESSION ============================= */
function compressImage(file, maxDim, quality){
  maxDim = maxDim||1280; quality = quality==null?0.62:quality;
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

// Field-worker restricted link: opening the app with #field&project=<id> in the
// URL locks the whole UI to that project's Daily Log screen only -- no other
// tab, and no other project, is reachable. This is a UX-level lock (the app
// has no server/auth), meant for handing a simple "just fill today's report"
// link to a site contractor.
const FIELD_MODE = location.hash.replace('#','').split('&').includes('field');
function fieldProjectIdFromHash(){
  const parts = location.hash.replace('#','').split('&');
  const m = parts.find(s=> s.indexOf('project=')===0);
  return m ? decodeURIComponent(m.slice('project='.length)) : null;
}
function fieldLink(projectId){
  return location.origin + location.pathname + location.search + '#field&project=' + encodeURIComponent(projectId);
}

  }
  rebuildLangConstants();
  state.view='hub'; state.currentProjectId=null; state.tab='dashboard';
  state.selectedLogDate = todayStr();
  state.reportDate = todayStr();
  if(FIELD_MODE){
    const pid = fieldProjectIdFromHash();

    }
  }

/* ============================= CALC ENGINE ============================= */
// boq/logs are accepted as optional explicit params so the Hub and Overview
// screens can compute a summary for *any* project, not just the one open in
// P(). Every call from inside a project screen omits them and falls back to
// the currently open project via P().
function dailyTarget(item){
  const days = daysBetween(item.startDate,item.endDate)+1;
  return item.qtyTotal / Math.max(days,1);
}
function plannedCumAt(item,dateStr){
  const days = daysBetween(item.startDate,item.endDate)+1;
  const elapsed = clamp(daysBetween(item.startDate,dateStr)+1,0,days);
  return elapsed<=0 ? 0 : elapsed*dailyTarget(item);
}
function actualCumAt(item,dateStr,logs){
  logs = logs || P().logs;
  let sum=0;
  for(const log of logs){
    if(log.date>dateStr) continue;
    for(const e of log.entries) if(e.itemId===item.id) sum += Number(e.actualQty)||0;
  }
  return sum;
}
function todayQtyFor(item,dateStr,logs){
  logs = logs || P().logs;
  const log = logs.find(l=>l.date===dateStr);
  if(!log) return 0;
  return log.entries.filter(e=>e.itemId===item.id).reduce((s,e)=>s+(Number(e.actualQty)||0),0);
}
function itemLoggedDates(item,logs){
  logs = logs || P().logs;
  const set=[];
  for(const log of logs){ if(log.entries.some(e=>e.itemId===item.id)) set.push(log.date); }
  return set.sort();
}
function itemPrediction(item, asOf, logs){
  logs = logs || P().logs;
  const dates = itemLoggedDates(item,logs).filter(d=>d<=asOf);
  const actual = actualCumAt(item,asOf,logs);
  const remaining = Math.max(item.qtyTotal - actual,0);
  if(remaining<=0){
    const lastDate = dates.length? dates[dates.length-1] : item.startDate;
    return {finishDate:lastDate, burnRate:null, done:true};
  }
  if(dates.length===0) return {finishDate:item.endDate, burnRate:null, done:false};
  const span = Math.max(daysBetween(dates[0],asOf)+1,1);
  const burnRate = actual/span;
  if(burnRate<=0) return {finishDate:null, burnRate:0, done:false};
  const daysNeeded = Math.ceil(remaining/burnRate);
  return {finishDate: addDays(asOf,daysNeeded), burnRate, done:false};
}
function itemStatus(item,asOf,logs){
  logs = logs || P().logs;
  const planned = plannedCumAt(item,asOf), actual = actualCumAt(item,asOf,logs);
  if(planned<=0 && actual<=0) return 'idle';
  return actual+1e-9 >= planned ? 'ok' : 'bad';
}
function projectSummary(asOf, boq, logs){
  boq = boq || P().boq; logs = logs || P().logs;
  if(boq.length===0) return null;
  let plannedPct=0, actualPct=0, n=0;
  let contractEnd=null, predictedEnd=null, anyPrediction=false;
  for(const item of boq){
    const total = item.qtyTotal||1;
    plannedPct += clamp(plannedCumAt(item,asOf)/total,0,1);
    actualPct += clamp(actualCumAt(item,asOf,logs)/total,0,1);
    n++;
    if(!contractEnd || item.endDate>contractEnd) contractEnd=item.endDate;
    const pred = itemPrediction(item,asOf,logs);
    if(pred.finishDate){ anyPrediction=true; if(!predictedEnd || pred.finishDate>predictedEnd) predictedEnd=pred.finishDate; }
  }
  plannedPct = n? (plannedPct/n)*100 : 0;
  actualPct = n? (actualPct/n)*100 : 0;
  const delta = actualPct - plannedPct;
  const delayDays = (predictedEnd && contractEnd) ? daysBetween(contractEnd,predictedEnd) : null;
  return {plannedPct,actualPct,delta,contractEnd,predictedEnd,delayDays,anyPrediction};
}

function renderScreen(){

    return renderDailyLog();

  if(state.view==='hub') return renderHub();

function wireMasterPlan(){
  $('#btn-add-item').onclick = ()=>{ openItemDraft('new'); render(); };
  $$('[data-edit-item]').forEach(b=> b.onclick = ()=>{ openItemDraft(b.dataset.editItem); render(); });
  $$('[data-open-gallery]').forEach(el=> el.onclick = ()=>{ refGalleryItemId=el.dataset.openGallery; render(); });
  refreshMasterPlanThumbs();
  $$('[data-del-item]').forEach(b=> b.onclick = ()=>{
    if(!confirm(tf('ลบรายการงานนี้ และประวัติที่เกี่ยวข้องหรือไม่?','Delete this work item and its related history?'))) return;
    P().boq = P().boq.filter(i=>i.id!==b.dataset.delItem);
    P().logs.forEach(l=> l.entries = l.entries.filter(e=>e.itemId!==b.dataset.delItem));
    saveData(); render(); toast(tf('ลบรายการแล้ว','Item deleted'));
  });
  const importBtn = $('#btn-import');
  if(importBtn) importBtn.onclick = ()=>{
    const text = $('#import-text').value.trim();
    if(!text){ return; }
    let count=0;
    text.split('\n').forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<5) return;
      const [name,qty,unit,s,en,zone] = parts;
      const q = parseFloat(qty);
      if(!name||!q||!unit||!/^\d{4}-\d{2}-\d{2}$/.test(s)||!/^\d{4}-\d{2}-\d{2}$/.test(en)) return;
      P().boq.push({id:uid(),name,zone:zone||'',qtyTotal:q,unit,startDate:s,endDate:en}); count++;
    });
    if(count){ saveData(); $('#import-text').value=''; render(); toast(tf('นำเข้า ','Imported ')+count+tf(' รายการแล้ว',' item(s)')); }
    else toast(tf('ไม่พบรายการที่ถูกต้อง ตรวจสอบรูปแบบอีกครั้ง','No valid rows found -- please check the format'));
  };
}

function closeItemModal(){ editingItemId=null; itemDraft=null; render(); }
function wireItemModal(){
  const bg = $('#item-modal-bg');
  if(!bg) return;
  $('#item-modal-close').onclick = closeItemModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeItemModal(); });
  const photoInput = $('#im-photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    const newPhotos = [];
    for(const f of files){ try{ const dataUrl = await compressImage(f); newPhotos.push({dataUrl}); }catch(err){} await new Promise(r=>setTimeout(r,0)); }
    syncItemDraftFromDom();
    itemDraft.pendingPhotos.push(...newPhotos);
    photoInput.value=''; render();
  };
  $$('[data-rm-existing-photo]').forEach(b=> b.onclick = ()=>{
    syncItemDraftFromDom();
    itemDraft.removedPhotoIds.push(b.dataset.rmExistingPhoto);
    render();
  });
  $$('[data-rm-pending-photo]').forEach(b=> b.onclick = ()=>{
    syncItemDraftFromDom();
    itemDraft.pendingPhotos.splice(Number(b.dataset.rmPendingPhoto),1);
    render();
  });
  $('#im-save').onclick = async ()=>{
    syncItemDraftFromDom();
    const d = itemDraft;
    const name=d.name.trim(), zone=d.zone.trim(), qty=parseFloat(d.qtyTotal), unit=d.unit.trim();
    const s=d.startDate, en=d.endDate;
    if(!name || !qty || qty<=0 || !unit || !s || !en || en<s){ toast(tf('กรอกข้อมูลให้ครบและถูกต้อง','Please fill in all fields correctly')); return; }
    const keptExisting = d.existingPhotoIds.filter(id=>!d.removedPhotoIds.includes(id));
    const newIds = [];
    for(const p of d.pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newIds.push(id); }
    const refPhotoIds = keptExisting.concat(newIds);
    if(editingItemId==='new'){ P().boq.push({id:uid(),name,zone,qtyTotal:qty,unit,startDate:s,endDate:en,refPhotoIds}); }
    else { const it = P().boq.find(i=>i.id===editingItemId); Object.assign(it,{name,zone,qtyTotal:qty,unit,startDate:s,endDate:en,refPhotoIds}); }
    saveData(); editingItemId=null; itemDraft=null; render(); toast(tf('บันทึกรายการแล้ว','Item saved'));
  };
  refreshItemModalPhotos();
}
async function refreshItemModalPhotos(){
  const imgs = $$('[data-thumb-id]');
  for(const img of imgs){ const data = await loadRefPhoto(img.dataset.thumbId); if(data) img.src = data; }
}

let refPhotoCache = {}; // photo id -> dataUrl, shared cache for master-plan thumbs/gallery
async function loadRefPhoto(id){
  if(refPhotoCache[id]!==undefined) return refPhotoCache[id];
  const data = await idbGet(id);
  refPhotoCache[id] = data;
  return data;
}
async function refreshMasterPlanThumbs(){
  const imgs = $$('[data-mp-thumb]');
  for(const img of imgs){
    const item = P().boq.find(i=>i.id===img.dataset.mpThumb);
    if(!item || !item.refPhotoIds || !item.refPhotoIds.length) continue;
    const data = await loadRefPhoto(item.refPhotoIds[0]);
    if(data) img.src = data;
  }
}

  dailyDraft = {
    date,

    entries: existing ? (existing.entries||[]).map(e=>({...e})) : [],

function wireDailyLog(){
  const dateInput = $('#log-date');
  if(dateInput) dateInput.onchange = ()=>{ state.selectedLogDate = dateInput.value; pendingPhotos=[]; dailyDraft=null; render(); };

  const photoInput = $('#photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const bar = $('#compress-progress'); bar.style.display='block';
    for(let i=0;i<files.length;i++){
      $('#compress-bar').style.width = Math.round(((i)/files.length)*100)+'%';
      $('#compress-label').textContent = tf('กำลังบีบอัดรูป ','Compressing photo ')+(i+1)+' / '+files.length+'...';
      try{
        const dataUrl = await compressImage(files[i]);
        pendingPhotos.push({dataUrl,caption:'',tag:''});
      }catch(err){}
      await new Promise(r=>setTimeout(r,0));
    }
    $('#compress-bar').style.width='100%';
    $('#compress-label').textContent = tf('บีบอัดเสร็จแล้ว ','Done compressing ')+files.length+tf(' รูป',' photo(s)');
    photoInput.value='';
    syncDailyDraftFromDom();
    render();
  };
  $$('[data-rm-photo]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); pendingPhotos.splice(Number(b.dataset.rmPhoto),1); render(); });
  $$('[data-caption]').forEach(inp=> inp.oninput = ()=>{ pendingPhotos[Number(inp.dataset.caption)].caption = inp.value; });
  $$('[data-photo-tag]').forEach(sel=> sel.onchange = ()=>{ pendingPhotos[Number(sel.dataset.photoTag)].tag = sel.value; });

  const wfAdd = $('#wf-add-line');
  if(wfAdd) wfAdd.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.workforce.push({team:'',count:'',workType:''}); render(); };
  $$('[data-rm-wf]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.workforce.splice(Number(b.dataset.rmWf),1); render(); });

  const issueAdd = $('#issue-add-line');
  if(issueAdd) issueAdd.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.issues.push({type:ISSUE_TYPES[0],detail:'',severity:'amber'}); render(); };
  $$('[data-rm-issue]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.issues.splice(Number(b.dataset.rmIssue),1); render(); });

  const zoneSel = $('#de-zone');
  if(zoneSel) zoneSel.onchange = ()=>{ syncDailyDraftFromDom(); dailyEntryDraft.itemId=''; render(); };
  const itemSel = $('#de-item');
  if(itemSel) itemSel.onchange = ()=>{ syncDailyDraftFromDom(); render(); };
  const deAdd = $('#de-add');
  if(deAdd) deAdd.onclick = ()=>{
    syncDailyDraftFromDom();
    const itemId = dailyEntryDraft.itemId, qty = parseFloat(dailyEntryDraft.qty);
    if(!itemId || !qty || qty<=0){ toast(tf('กรุณาเลือกรายการงานและใส่ปริมาณให้ถูกต้อง','Please choose a work item and enter a valid quantity')); return; }
    dailyDraft.entries.push({itemId, zone:dailyEntryDraft.zone||'', actualQty:qty, note:(dailyEntryDraft.note||'').trim()});
    dailyEntryDraft = {zone:dailyEntryDraft.zone, itemId:'', qty:'', note:''};
    render();
  };
  $$('[data-rm-entry]').forEach(b=> b.onclick = ()=>{ syncDailyDraftFromDom(); dailyDraft.entries.splice(Number(b.dataset.rmEntry),1); render(); });

  const saveBtn = $('#btn-save-log');
  if(saveBtn) saveBtn.onclick = async ()=>{
    saveBtn.disabled = true; saveBtn.textContent=tf('กำลังบันทึก...','Saving...');
    syncDailyDraftFromDom();
    const date = state.selectedLogDate;
    let log = P().logs.find(l=>l.date===date);
    const newPhotoIds = [];
    const newPhotoMeta = {};
    for(const p of pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newPhotoIds.push(id); newPhotoMeta[id] = {caption:p.caption||'', tag:p.tag||''}; }
    if(!log){ log = {id:uid(),date,entries:[],photoIds:[]}; P().logs.push(log); }
    log.weather = dailyDraft.weather;
    log.workforce = dailyDraft.workforce.filter(w=> (w.team||'').trim());
    log.entries = dailyDraft.entries.slice();
    log.issues = dailyDraft.issues.filter(i=> (i.detail||'').trim());
    log.deliveryNote = dailyDraft.deliveryNote;
    log.photoIds = (log.photoIds||[]).concat(newPhotoIds);
    log.photoMeta = Object.assign(log.photoMeta||{}, newPhotoMeta);
    log.recordedAt = new Date().toISOString();
    P().logs.sort((a,b)=> a.date<b.date?-1:1);
    saveData();
    pendingPhotos=[];
    dailyDraft=null;
    toast(tf('บันทึกรายงานประจำวันแล้ว','Daily report saved'));
    state.reportDate = date;
    render();
  };
}

    for(const f of files){ try{ const dataUrl=await compressImage(f); requestForm.photos.push({dataUrl}); }catch(err){} await new Promise(r=>setTimeout(r,0)); }
    photoInput.value=''; render();
  };
  $$('[data-rm-req-photo]').forEach(b=> b.onclick=()=>{ requestForm.photos.splice(Number(b.dataset.rmReqPhoto),1); render(); });
  $('#rq-submit').onclick = async ()=>{
    const by=$('#rq-by').value.trim(), area=$('#rq-area').value.trim(), wt=$('#rq-worktype').value.trim();
    const lines = requestForm.lines.filter(l=>l.name.trim() && parseFloat(l.qty)>0 && l.unit.trim() && l.neededDate);
    if(!by || !area || lines.length===0){ toast(tf('กรอกผู้สั่งของ พื้นที่ และรายการวัสดุอย่างน้อย 1 รายการ','Please fill in requester, area, and at least one material line')); return; }
    const date = todayStr();
    const reqNo = genReqNo(date);
    const photoIds=[];
    for(const p of requestForm.photos){ const id=uid(); await idbPut(id,p.dataUrl); photoIds.push(id); }
    P().materialRequests.push({
      id:uid(), reqNo, createdAt:new Date().toISOString(), requestedBy:by, area, workType:wt,
      lines: lines.map(l=>({name:l.name.trim(),qty:parseFloat(l.qty),unit:l.unit.trim(),neededDate:l.neededDate})),
      photoIds, status:'pending', approval:null, procurement:null
    });
    saveData(); creatingRequest=false; requestForm=null; toast(tf('ส่งใบสั่งของแล้ว รอการอนุมัติ','Request submitted, awaiting approval')); render();
  };
}

function buildSCurve(asOf){
  const proj = P();
  const starts = proj.boq.map(i=>i.startDate);
  const ends = proj.boq.map(i=>i.endDate);
  const summary0 = projectSummary(asOf, proj.boq, proj.logs);
  let rangeEnd = ends.reduce((a,b)=>a>b?a:b);
  if(summary0.predictedEnd && summary0.predictedEnd>rangeEnd) rangeEnd = summary0.predictedEnd;
  const rangeStart = starts.reduce((a,b)=>a<b?a:b);
  const totalDays = Math.max(daysBetween(rangeStart,rangeEnd),1);
  const W=760,H=220,padL=34,padR=14,padT=14,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xFor = (i)=> padL + (i/totalDays)*plotW;
  const yFor = (pct)=> padT + plotH - (clamp(pct,0,100)/100)*plotH;
  let plannedPts=[], actualPts=[];
  for(let d=0; d<=totalDays; d+=Math.max(1,Math.round(totalDays/60))){
    const dateStr = addDays(rangeStart,d);
    let pSum=0,n=0; proj.boq.forEach(it=>{ pSum+=clamp(plannedCumAt(it,dateStr)/(it.qtyTotal||1),0,1); n++; });
    plannedPts.push([xFor(d), yFor((pSum/n)*100)]);
    if(dateStr<=asOf){
      let aSum=0; proj.boq.forEach(it=>{ aSum+=clamp(actualCumAt(it,dateStr,proj.logs)/(it.qtyTotal||1),0,1); });
      actualPts.push([xFor(d), yFor((aSum/n)*100)]);
    }
  }
  const path = pts => 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
  const todayX = xFor(clamp(daysBetween(rangeStart,asOf),0,totalDays));
  const gridLines = [0,25,50,75,100].map(p=>`<line x1="${padL}" x2="${W-padR}" y1="${yFor(p)}" y2="${yFor(p)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-8}" y="${yFor(p)+3}" font-size="9" fill="var(--ink-300)" text-anchor="end" font-family="IBM Plex Mono">${p}</text>`).join('');
  const svg = `<svg class="svcurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <line x1="${todayX}" x2="${todayX}" y1="${padT}" y2="${H-padB}" stroke="var(--ink-300)" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="${todayX}" y="${H-padB+14}" font-size="9" fill="var(--ink-500)" text-anchor="middle" font-family="IBM Plex Mono">${tf('วันนี้','today')}</text>
    <path d="${path(plannedPts)}" fill="none" stroke="var(--purple-600)" stroke-width="2.4"/>
    ${actualPts.length>1? `<path d="${path(actualPts)}" fill="none" stroke="var(--mint-500)" stroke-width="2.4"/>` : ''}
    ${actualPts.length? `<circle cx="${actualPts[actualPts.length-1][0]}" cy="${actualPts[actualPts.length-1][1]}" r="3.6" fill="var(--mint-500)"/>` : ''}
  </svg>`;
  return {svg};
}

let reportPhotoCache = {}; // id -> dataUrl
async function loadReportPhotos(log, reqs){
  const out=[];
  for(const pid of (log?log.photoIds:[])||[]){
    if(!reportPhotoCache[pid]) reportPhotoCache[pid] = await idbGet(pid);
    if(reportPhotoCache[pid]){
      const meta = (log.photoMeta&&log.photoMeta[pid]) || (log._captions? {caption:log._captions[pid]} : {});
      const caption = (meta.tag? '['+meta.tag+'] ' : '') + (meta.caption || tf('ภาพหน้างาน','site photo'));
      out.push({id:pid, dataUrl:reportPhotoCache[pid], caption});
    }
  }
  for(const r of (reqs||[])){
    for(const pid of (r.photoIds||[])){
      if(!reportPhotoCache[pid]) reportPhotoCache[pid] = await idbGet(pid);
      if(reportPhotoCache[pid]) out.push({id:pid, dataUrl:reportPhotoCache[pid], caption:tf('อ้างอิงวัสดุ: ','material reference: ')+((r.lines[0]&&r.lines[0].name)||r.reqNo)});
    }
  }
  return out;
}

function reqReportBlock(r){
  const lines = r.lines.map(l=>`${escapeHtml(l.name)} × ${fmtNum(l.qty,2)} ${escapeHtml(l.unit)} (${tf('ต้องใช้','needed')} ${fmtDate(l.neededDate)})`).join('<br>');
  let approvalHtml, procureHtml='';
  if(r.status==='pending') approvalHtml = `⚡ ${tf('สถานะการอนุมัติ:','Approval status:')} <b style="color:#B4740E">🟡 ${tf('รออนุมัติ','Pending approval')}</b>`;
  else if(r.status==='rejected') approvalHtml = `⚡ ${tf('สถานะการอนุมัติ:','Approval status:')} <b style="color:#DC3B3B">🔴 ${tf('ปฏิเสธ','Rejected')}</b> ${tf('โดย','by')} ${escapeHtml(r.approval.by)} (${fmtDateTime(r.approval.at)})${r.approval.reason?' — '+escapeHtml(r.approval.reason):''}`;
  else {
    approvalHtml = `⚡ ${tf('สถานะการอนุมัติ:','Approval status:')} <b style="color:#0D9668">🟢 ${tf('อนุมัติแล้ว','Approved')}</b> ${tf('โดย','by')} ${escapeHtml(r.approval.by)} (${fmtDateTime(r.approval.at)})${r.approval.reason?' — '+escapeHtml(r.approval.reason):''}`;
    if(r.status==='scheduled') procureHtml = `<br>🚚 ${tf('สถานะการจัดซื้อ:','Procurement status:')} <b style="color:#2563D9">🔵 ${tf('ยืนยันวันส่งมอบแล้ว','Delivery date confirmed')}</b> ${tf('โดย','by')} ${escapeHtml(r.procurement.by)} (${fmtDateTime(r.procurement.at)})<br>&gt;&gt; ${tf('ยืนยันของถึงหน้างานวันที่:','Confirmed on-site delivery date:')} <b>${fmtDate(r.procurement.deliveryDate)}</b>${r.procurement.note?' ('+escapeHtml(r.procurement.note)+')':''}`;
    else procureHtml = `<br>🚚 ${tf('สถานะการจัดซื้อ: รอฝ่ายจัดซื้อนัดส่งของ','Procurement status: awaiting delivery schedule')}`;
  }
  return `<div style="font-size:12.5px;line-height:1.85;padding:10px 0">
    <b class="tabular">[${tf('ใบงานที่:','Request:')} ${r.reqNo}]</b> ${tf('ทำรายการวันที่','created')} ${fmtDateTime(r.createdAt)}<br>
    • ${tf('ผู้สั่งของ:','Requested by:')} ${escapeHtml(r.requestedBy)}<br>
    • ${tf('พื้นที่ใช้ของ:','Area:')} ${escapeHtml(r.area||'-')} | ${tf('ประเภทงาน:','Work type:')} ${escapeHtml(r.workType||'-')}<br>
    • ${tf('รายการของ:','Materials:')} ${lines}<br>
    ${approvalHtml}${procureHtml}
  </div>`;
}
function reportBodyHtml(date){
  const proj = P();
  const log = proj.logs.find(l=>l.date===date);
  const summary = proj.boq.length? projectSummary(date, proj.boq, proj.logs) : null;
  const dayReqs = reqsForDate(date);
  const c = state.contractor||{};
  if(!proj.boq.length){
    return `<div class="rp-section"><div class="empty">${tf('ยังไม่มีข้อมูลแผนงานสำหรับสร้างรายงาน','No plan data yet to build a report')}</div></div>`;
  }
  const rows = proj.boq.map(item=>{
    const todayQty = todayQtyFor(item,date,proj.logs);
    const planned = plannedCumAt(item,date), actual = actualCumAt(item,date,proj.logs);
    const st = actual+1e-9>=planned ? 'ok' : 'bad';
    const pct = clamp((actual/item.qtyTotal)*100,0,100);
    const diff = actual-planned;
    return `<tr>
      <td>${escapeHtml(item.name)}</td>
      <td class="tabular">${fmtNum(todayQty,2)} ${escapeHtml(item.unit)}</td>
      <td class="tabular">${fmtNum(actual,2)} / ${fmtNum(planned,2)} ${escapeHtml(item.unit)}</td>
      <td style="min-width:120px"><div class="progress ${st}"><i style="width:${pct}%"></i></div></td>
      <td>${st==='ok'? `<span class="badge ok">🟢 ${tf('เร็วกว่า','ahead by')} ${fmtNum(Math.abs(diff),1)}</span>` : `<span class="badge bad">🔴 ${tf('ล่าช้า','behind by')} ${fmtNum(Math.abs(diff),1)}</span>`}</td>
    </tr>`;
  }).join('');
  return `
    <div class="rp-head">
      <div class="tag">Site Progress Report</div>
      <h1>${tf('รายงานความคืบหน้าและวิเคราะห์หน้างานตกแต่งภายใน','Interior Fit-Out Progress & Analysis Report')}</h1>
    </div>
    <div class="rp-meta">
      <div><b>${tf('โครงการ','Project')}</b>${escapeHtml(proj.name||'-')}${proj.zone?' ('+escapeHtml(proj.zone)+')':''}</div>
      <div><b>${tf('ประจำวันที่','Report date')}</b>${fmtDate(date)}</div>
      <div><b>${tf('ผู้รับเหมาดูแลหน้างาน','Site contractor')}</b>${escapeHtml(c.nickname||c.fullname||'-')}${c.phone?' | '+escapeHtml(c.phone):''}</div>
    </div>
    <div class="rp-section">
      <h3>${tf('สรุปสถานะโครงการประจำวันนี้','Today’s Project Status Summary')}</h3>
      <div class="rp-summary">
        <div class="box"><div class="sub">${tf('ภาพรวมทั้งโปรเจกต์','Overall project')}</div><div class="v" style="color:${summary.delta>=0?'#0D9668':'#DC3B3B'}">${summary.delta>=0?tf('เร็วกว่าแผนสะสม','Ahead of cumulative plan'):tf('ล่าช้ากว่าแผนสะสม','Behind cumulative plan')} ${fmtNum(Math.abs(summary.delta),1)}%</div></div>
        <div class="box"><div class="sub">${tf('คาดการณ์วันเสร็จสิ้น','Completion forecast')}</div><div class="v" style="font-size:13px">${summary.anyPrediction? (summary.delayDays>0? tf('ช้ากว่าแผน ','behind plan by ')+summary.delayDays+tf(' วัน (',' day(s) (')+fmtDate(summary.predictedEnd)+')' : summary.delayDays<0? tf('เร็วกว่าแผน ','ahead of plan by ')+Math.abs(summary.delayDays)+tf(' วัน (',' day(s) (')+fmtDate(summary.predictedEnd)+')' : tf('ตรงตามแผน (','on plan (')+fmtDate(summary.predictedEnd)+')') : tf('รอข้อมูลเพิ่มเติม','awaiting more data')}</div></div>
      </div>
    </div>
    <div class="rp-section">
      <h3>${tf('ตารางเปรียบเทียบปริมาณงาน (อ้างอิง Master Plan & BOQ)','Quantity Comparison (Master Plan & BOQ)')}</h3>
      <div class="table-wrap"><table><thead><tr><th>${tf('รายการงาน','Work item')}</th><th>${tf('ทำได้วันนี้','Done today')}</th><th>${tf('ทำจริงสะสม / แผนสะสม','Actual / planned to date')}</th><th>${tf('ความคืบหน้า','Progress')}</th><th>${tf('สถานะ','Status')}</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    ${log && (log.weather || (log.workforce&&log.workforce.length)) ? `<div class="rp-section"><h3>🌦️ ${tf('สภาพหน้างานและกำลังพล','Site Condition & Workforce')}</h3>
      ${log.weather? `<p style="font-size:13px;line-height:1.7"><b>${tf('สภาพหน้างาน:','Condition:')}</b> ${escapeHtml(log.weather)}</p>` : ''}
      ${(log.workforce&&log.workforce.length)? `<div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>${tf('ทีมงาน','Team')}</th><th>${tf('จำนวนคน','Headcount')}</th><th>${tf('ประเภทงาน','Work type')}</th></tr></thead><tbody>${log.workforce.map(w=>`<tr><td>${escapeHtml(w.team||'-')}</td><td class="tabular">${escapeHtml(String(w.count||'-'))}</td><td>${escapeHtml(w.workType||'-')}</td></tr>`).join('')}</tbody></table></div>` : ''}
    </div>` : ''}
    ${log && log.issues && log.issues.length ? `<div class="rp-section"><h3>⚠️ ${tf('ปัญหาและอุปสรรคหน้างาน','Site Issues & Defect Log')}</h3>
      ${log.issues.map(iss=>`<p style="font-size:13px;line-height:1.7">${severityInfo(iss.severity).ic} <b>${escapeHtml(iss.type||'')}</b> — ${escapeHtml(iss.detail||'')}</p>`).join('')}
    </div>` : (log && log.note ? `<div class="rp-section"><h3>⚠️ ${tf('บันทึกอุปสรรคหน้างาน','Site Issues & Notes')}</h3><p style="font-size:13px;line-height:1.7">${escapeHtml(log.note)}</p></div>` : '')}
    ${log && log.deliveryNote ? `<div class="rp-section"><h3>🚚 ${tf('การรับของหน้างานวันนี้','Today’s Material Deliveries')}</h3><p style="font-size:13px;line-height:1.7">${escapeHtml(log.deliveryNote)}</p></div>` : ''}
    ${dayReqs.length? `<div class="rp-section"><h3>🛒 ${tf('รายงานการสั่งซื้อวัสดุหน้างาน (Material Request & Procurement Status)','Material Request & Procurement Status')}</h3>${dayReqs.map(reqReportBlock).join('<hr style="border:none;border-top:1px dashed #E3E1F0;margin:2px 0">')}</div>` : ''}
    <div class="rp-section" id="rp-photo-section">
      <h3>📸 ${tf('ภาพถ่ายความคืบหน้าหน้างานประจำวัน','Daily Site Progress Photos')}</h3>
      <div class="rp-photogrid" id="rp-photogrid"><span class="sub">${tf('กำลังโหลดรูปภาพ...','Loading photos...')}</span></div>
    </div>
    <div class="rp-foot">
      <span>${escapeHtml(c.company||tf('ชีพจรไซต์งาน','Site Pulse'))} · ${escapeHtml(c.fullname||'')}</span>
      <span>${tf('สร้างรายงานเมื่อ','Report generated')} ${fmtDate(todayStr())}</span>
    </div>
  `;
}
async function refreshReportPhotos(date){
  const proj = P();
  const log = proj.logs.find(l=>l.date===date);
  const reqs = reqsForDate(date);
  const photos = await loadReportPhotos(log, reqs);
  const grid = $('#rp-photogrid');
  if(!grid) return;
  grid.innerHTML = photos.length? photos.map(p=>`<figure><img src="${p.dataUrl}"><figcaption>${escapeHtml(p.caption||tf('ภาพหน้างาน','site photo'))}</figcaption></figure>`).join('') : `<span class="sub">${tf('ไม่มีรูปภาพสำหรับวันนี้','No photos for this day')}</span>`;
}
function wireReport(){
  refreshReportPhotos(state.reportDate);
  const sel = $('#report-date-select');
  if(sel) sel.onchange = ()=>{ state.reportDate = sel.value; $('#reportPrintable').innerHTML = reportBodyHtml(state.reportDate); refreshReportPhotos(state.reportDate); };
  $('#btn-print').onclick = ()=> window.print();
  $('#btn-export-img').onclick = exportReportAsImage;
}
function imgFallbackMsg(){
  return `<div class="card" style="margin-top:10px;background:var(--amber-50);border-color:var(--amber-500)">
  <b style="font-family:var(--font-display);font-size:13px">${tf('สร้างรูปภาพอัตโนมัติไม่สำเร็จในเบราว์เซอร์นี้','Automatic image generation failed in this browser')}</b>
  <p class="sub" style="margin-top:6px">${tf('เบราว์เซอร์บางตัวบล็อกการแปลงหน้าเว็บเป็นรูปภาพด้วยเหตุผลด้านความปลอดภัย วิธีสำรอง: (1) กดปุ่ม “พิมพ์ / บันทึกเป็น PDF” แล้วส่งไฟล์ PDF เข้ากลุ่ม LINE ได้โดยตรง หรือ (2) ใช้ฟีเจอร์ “จับภาพหน้าจอแบบเลื่อน (Scroll Capture / Long Screenshot)” ของมือถือถ่ายรายงานด้านล่างนี้แทน','Some browsers block converting a page to an image for security reasons. Workarounds: (1) tap “Print / Save as PDF” and send the PDF straight into a LINE group, or (2) use your phone’s “Scroll Capture / Long Screenshot” feature on the report below instead.')}</p>
</div>`;
}
async function exportReportAsImage(){
  const holder = $('#export-holder');
  holder.innerHTML = `<div class="sub" style="margin-top:10px">${tf('กำลังสร้างรูปภาพ...','Generating image...')}</div>`;
  try{
    const node = $('#reportPrintable');
    const w = Math.max(node.clientWidth,640);
    const h = node.scrollHeight;
    const styleText = $$('style').map(s=>s.textContent).join('\n');
    // XMLSerializer (not .outerHTML) so void elements like <br> / <img> / <hr>
    // come out self-closed -- foreignObject content must be well-formed XML.
    const inner = new XMLSerializer().serializeToString(node);
    const svgData = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;font-family:Sarabun,sans-serif">
          <style>${styleText}</style>
          ${inner}
        </div>
      </foreignObject>
    </svg>`;
    const svgBlob = new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = ()=>{
      const scale=2;
      const canvas=document.createElement('canvas');
      canvas.width=w*scale; canvas.height=h*scale;
      const ctx=canvas.getContext('2d');
      ctx.scale(scale,scale);
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      try{
        ctx.drawImage(img,0,0,w,h);
        const pngUrl = canvas.toDataURL('image/png');
        holder.innerHTML = `<div class="exported-wrap"><img src="${pngUrl}" alt="report"><p>${tf('กดค้างที่รูป (มือถือ) หรือคลิกขวา &rarr; บันทึกรูปภาพ (คอมพิวเตอร์) เพื่อบันทึกและส่งเข้ากลุ่ม LINE','Press and hold the image (mobile) or right-click &rarr; save image (desktop) to save and send it to a LINE group')}</p></div>`;
      }catch(err){
        holder.innerHTML = imgFallbackMsg();
      }
      URL.revokeObjectURL(url);
    };
    img.onerror = ()=>{ holder.innerHTML = imgFallbackMsg(); URL.revokeObjectURL(url); };
    img.src = url;
  }catch(err){
    holder.innerHTML = imgFallbackMsg();
  }
}

/* ============================= WIRE SCREEN ROUTER ============================= */
function wireScreen(){
  if(FIELD_MODE){ if(state.currentProjectId) wireDailyLog(); return; }
  if(state.view==='hub') return wireHub();
  if(state.view==='profile') return wireProfile();
  if(state.view!=='project') return;
  if(state.tab==='masterplan') wireMasterPlan();
  else if(state.tab==='dailylog') wireDailyLog();
  else if(state.tab==='procure') wireProcure();
  else if(state.tab==='report') wireReport();
}

/* ============================= OFFLINE / CONNECTIVITY ============================= */
function updateNetStatus(){
  const dot = $('#net-dot');
  if(!dot) return;
  if(navigator.onLine){ dot.classList.remove('offline'); dot.title=tf('ออนไลน์','Online'); }
  else { dot.classList.add('offline'); dot.title=tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลบันทึกอยู่ในเครื่องนี้','Offline — you can keep working normally, data is saved on this device'); }
}
window.addEventListener('online', ()=>{ updateNetStatus(); toast(tf('กลับมาออนไลน์แล้ว','Back online')); });
window.addEventListener('offline', ()=>{ updateNetStatus(); toast(tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลจะถูกบันทึกในเครื่องนี้','Offline — you can keep working normally, data will be saved on this device')); });

/* ============================= INIT ============================= */
bootstrap();
render();
updateNetStatus();
})();
