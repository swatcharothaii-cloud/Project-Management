    steps.push({state:'done',title:tf('อนุมัติแล้ว','Approved'),sub: r.approval? (tf('โดย ','by ')+escapeHtml(r.approval.by)+' · '+fmtDateTime(r.approval.at)+(r.approval.reason?' — '+escapeHtml(r.approval.reason):'')) : tf('ปรับสถานะโดยฝ่ายจัดซื้อ (ไม่มีบันทึกการอนุมัติ)','Status changed by procurement (no approval record)')});
    if(r.status==='approved') steps.push({state:'wait',title:tf('รอฝ่ายจัดซื้อนัดส่ง','Awaiting delivery schedule'),sub:tf('ยังไม่ได้ระบุวันส่งมอบ','Delivery date not set yet')});
    else steps.push({state:'done',title:tf('ยืนยันวันจัดส่งแล้ว','Delivery confirmed'),sub: r.procurement? (tf('โดย ','by ')+escapeHtml(r.procurement.by)+' · '+fmtDateTime(r.procurement.at)+tf(' — ของถึงหน้างาน ',' — arriving on site ')+fmtDate(r.procurement.deliveryDate)) : tf('ปรับสถานะโดยฝ่ายจัดซื้อ (ไม่มีบันทึกการจัดส่ง)','Status changed by procurement (no delivery record)')});
  }
  const timeline = steps.map(s=>`<div class="tl-step"><div class="tl-dot ${s.state}">${s.state==='done'?'✓':s.state==='rej'?'✕':'…'}</div><div class="tl-body"><b>${s.title}</b><span>${s.sub}</span></div></div>`).join('');
  const dueStatus = procureDueStatus(r);
  const dueDate = procureDueDate(r);
  const dueNote = dueStatus? `<div class="role-note" style="margin-top:12px;background:${dueStatus==='overdue'?'var(--coral-50)':'var(--amber-50)'};border-color:${dueStatus==='overdue'?'var(--coral-500)':'var(--amber-500)'}">🔔 ${dueStatus==='overdue'? tf('เกินกำหนดส่งมอบแล้ว','Past the delivery due date') : tf('ใกล้ถึงกำหนดส่งมอบ (ภายใน 3 วัน)','Due within 3 days')} — ${fmtDate(dueDate)}</div>` : '';
  const activeApprovers = (state.approvers||[]).filter(a=>a.active!==false);
  let actions='';
  if(r.status==='pending' && state.role==='pm'){
    actions = `<div class="field" style="margin-top:14px"><label>${tf('ผู้อนุมัติ','Approver')}</label>
        ${activeApprovers.length? `<select id="dt-approver">${activeApprovers.map(a=>`<option value="${escapeHtml(a.name)}" ${r.approverName===a.name?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select>`
          : `<input type="text" id="dt-approver-text" value="${escapeHtml(currentActorName())}" placeholder="${tf('ชื่อผู้อนุมัติ','approver name')}">`}
      </div>
      <div class="field" style="margin-top:14px"><label>${tf('เหตุผล (จำเป็นเมื่อกดปฏิเสธ)','Reason (required to reject)')}</label><input type="text" id="dt-reason" placeholder="${tf('เช่น อนุมัติด่วนที่สุด / ปฏิเสธเนื่องจากสั่งซ้ำ','e.g. approved, urgent / rejected -- duplicate order')}"></div>
      <div class="action-row"><button class="btn approve" id="dt-approve">✅ ${tf('อนุมัติ (Approve)','Approve')}</button><button class="btn reject" id="dt-reject">🚫 ${tf('ปฏิเสธ (Reject)','Reject')}</button></div>`;
  } else if(r.status==='approved' && state.role==='procurement'){
    const costRows = r.lines.map((l,idx)=>`<tr>
        <td>${escapeHtml(l.name)}<div class="hint">${fmtNum(l.qty,2)} ${escapeHtml(l.unit)}</div></td>
        <td style="width:110px"><input type="number" step="0.01" min="0" class="tabular" data-cost-line="${idx}" data-cost-field="actualQty" value="${l.qty}"></td>

function wireDetailModal(){
  const bg=$('#dt-modal-bg'); if(!bg) return;
  $('#dt-modal-close').onclick=()=>{ procureDetailId=null; render(); };
  const trashBtn = $('#dt-trash');
  if(trashBtn) trashBtn.onclick = ()=>{
    const r = P().materialRequests.find(x=>x.id===procureDetailId); if(!r) return;
    if(!confirm(tf('ย้ายใบสั่งของ "'+r.reqNo+'" ไปที่ถังขยะหรือไม่?','Move request "'+r.reqNo+'" to the trash?'))) return;
    r.trashed=true; r.trashedAt=new Date().toISOString(); r.trashedBy=currentActorName();
    saveData(); procureDetailId=null; toast(tf('ย้ายไปถังขยะแล้ว','Moved to trash')); render();
  };
  bg.addEventListener('click', e=>{ if(e.target===bg){ procureDetailId=null; render(); } });
  const selectedApproverName = ()=>{
    const sel=$('#dt-approver'); if(sel) return sel.value;
    const txt=$('#dt-approver-text'); if(txt) return txt.value.trim()||currentActorName();
    return currentActorName();
  };
  const approveBtn=$('#dt-approve');
  if(approveBtn) approveBtn.onclick=()=>{
    const r = P().materialRequests.find(x=>x.id===procureDetailId);
    r.status='approved'; r.approval={by:selectedApproverName(), at:new Date().toISOString(), reason:$('#dt-reason').value.trim()};
    saveData(); procureDetailId=null; toast(tf('อนุมัติใบสั่งของแล้ว','Request approved')); render();
  };
  const rejectBtn=$('#dt-reject');
  if(rejectBtn) rejectBtn.onclick=()=>{
    const reason=$('#dt-reason').value.trim();
    if(!reason){ toast(tf('กรุณาระบุเหตุผลการปฏิเสธ','Please enter a reason for rejecting')); return; }
    const r = P().materialRequests.find(x=>x.id===procureDetailId);
    r.status='rejected'; r.approval={by:selectedApproverName(), at:new Date().toISOString(), reason};
    saveData(); procureDetailId=null; toast(tf('ปฏิเสธใบสั่งของแล้ว','Request rejected')); render();
  };
  const schedBtn=$('#dt-schedule');
  if(schedBtn) schedBtn.onclick=()=>{
    const dd=$('#dt-delivery').value; if(!dd){ toast(tf('กรุณาเลือกวันที่จัดส่ง','Please choose a delivery date')); return; }
    const r = P().materialRequests.find(x=>x.id===procureDetailId);
    const vendorEl=$('#dt-vendor'), poEl=$('#dt-po');
    r.status='scheduled';
    r.procurement={by:currentActorName(), at:new Date().toISOString(), deliveryDate:dd, note:$('#dt-note').value.trim(), vendor:(vendorEl?vendorEl.value.trim():''), poNumber:(poEl?poEl.value.trim():'')};
    // Actual purchase cost is optional per line -- only lines where the user
    // typed a unit cost get actualQty/actualUnitCost recorded, since those two
    // fields together are what the Budget tab treats as "this line was priced".
    $$('[data-cost-line]').forEach(inp=>{
      const idx = Number(inp.dataset.costLine);
      const line = r.lines[idx]; if(!line) return;
      if(inp.dataset.costField==='actualQty') line._actualQtyInput = inp.value;
      else line._actualUnitCostInput = inp.value;
    });
    r.lines.forEach(line=>{
      const rawCost = line._actualUnitCostInput;
      if(rawCost!==undefined && rawCost!==''){
        const uc = parseFloat(rawCost);
        if(!isNaN(uc) && uc>=0){
          const rawQty = line._actualQtyInput;
          const q = (rawQty!==undefined && rawQty!=='')? parseFloat(rawQty) : line.qty;
          line.actualQty = (!isNaN(q) && q>=0)? q : line.qty;
          line.actualUnitCost = uc;
        }
      }
      delete line._actualQtyInput; delete line._actualUnitCostInput;
    });
    saveData(); procureDetailId=null; toast(tf('ยืนยันวันจัดส่งแล้ว','Delivery date confirmed')); render();
  };
  const statusApplyBtn=$('#dt-status-apply');
  if(statusApplyBtn) statusApplyBtn.onclick=()=>{
    const newStatus = $('#dt-status-override').value;
    const r = P().materialRequests.find(x=>x.id===procureDetailId); if(!r) return;
    if(newStatus===r.status){ toast(tf('สถานะเดิมอยู่แล้ว','Already at that status')); return; }
    // Synthesize a minimal approval/procurement record when jumping straight
    // into a status that other screens (timeline, PDF report) assume carries
    // one -- keeps every existing r.approval.*/r.procurement.* access safe.
    const note = tf('(ปรับสถานะโดยฝ่ายจัดซื้อ)','(status changed by procurement)');
    if((newStatus==='approved'||newStatus==='scheduled'||newStatus==='rejected') && !r.approval){
      r.approval = {by:currentActorName(), at:new Date().toISOString(), reason:note};
    }
    if(newStatus==='scheduled' && !r.procurement){
      r.procurement = {by:currentActorName(), at:new Date().toISOString(), deliveryDate:addDays(todayStr(),2), note:note};
    }
    r.status = newStatus;
    saveData(); procureDetailId=null; toast(tf('อัปเดตสถานะแล้ว','Status updated')); render();
  };
}
function wireProcure(){

  $$('[data-open-req]').forEach(c=> c.onclick=(e)=>{ if(e.target.closest('[data-stop-card-open]')) return; procureDetailId=c.dataset.openReq; render(); });

  $$('[data-trash-req]').forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();

    if(!confirm(tf('ย้ายใบสั่งของ "'+r.reqNo+'" ไปที่ถังขยะหรือไม่?','Move request "'+r.reqNo+'" to the trash?'))) return;
    r.trashed=true; r.trashedAt=new Date().toISOString(); r.trashedBy=currentActorName();

  });
  $$('[data-restore-req]').forEach(b=> b.onclick=()=>{
    const r = P().materialRequests.find(x=>x.id===b.dataset.restoreReq); if(!r) return;
    r.trashed=false; r.trashedAt=null; r.trashedBy=null;
    saveData(); toast(tf('กู้คืนใบสั่งของแล้ว','Request restored')); render();
  });
  $$('[data-delete-forever-req]').forEach(b=> b.onclick= async ()=>{
    const r = P().materialRequests.find(x=>x.id===b.dataset.deleteForeverReq); if(!r) return;
    if(!confirm(tf('ลบใบสั่งของ "'+r.reqNo+'" ถาวร ไม่สามารถกู้คืนได้อีก ยืนยันหรือไม่?','Permanently delete request "'+r.reqNo+'"? This cannot be undone.'))) return;
    for(const pid of (r.photoIds||[])){ try{ await idbDelete(pid); }catch(err){} }
    P().materialRequests = P().materialRequests.filter(x=>x.id!==r.id);
    saveData(); toast(tf('ลบถาวรแล้ว','Permanently deleted')); render();
  });
  const toggleApvBtn = $('[data-toggle-approver-settings]');
  if(toggleApvBtn) toggleApvBtn.onclick = ()=>{ approverSettingsOpen=!approverSettingsOpen; render(); };
  const apvAddBtn = $('#apv-add');
  if(apvAddBtn) apvAddBtn.onclick = ()=>{
    const name = $('#apv-new-name').value.trim();
    if(!name){ toast(tf('กรุณาระบุชื่อผู้อนุมัติ','Please enter an approver name')); return; }
    state.approvers = state.approvers||[];
    state.approvers.push({id:uid(), name, active:true});
    saveData(); render(); toast(tf('เพิ่มผู้อนุมัติแล้ว','Approver added'));
  };
  $$('[data-apv-active]').forEach(cb=> cb.onchange = ()=>{
    const a = (state.approvers||[]).find(x=>x.id===cb.dataset.apvActive); if(!a) return;
    a.active = cb.checked; saveData();
  });
  $$('[data-apv-remove]').forEach(b=> b.onclick = ()=>{
    state.approvers = (state.approvers||[]).filter(a=>a.id!==b.dataset.apvRemove);
    saveData(); render(); toast(tf('ลบผู้อนุมัติแล้ว','Approver removed'));
  });
  $$('[data-quick-approve]').forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();
    const r = P().materialRequests.find(x=>x.id===b.dataset.quickApprove); if(!r) return;
    r.status='approved'; r.approval={by:r.approverName||currentActorName(), at:new Date().toISOString(), reason:tf('อนุมัติด่วนจากหน้าจัดซื้อ','Quick-approved from procurement board')};
    saveData(); toast(tf('อนุมัติใบสั่งของแล้ว','Request approved')); render();
  });
  $$('[data-quick-reject]').forEach(b=> b.onclick=(e)=>{
    e.stopPropagation();
    const reason = prompt(tf('เหตุผลการปฏิเสธ:','Reason for rejecting:'));
    if(!reason || !reason.trim()){ if(reason!==null) toast(tf('กรุณาระบุเหตุผล','Please enter a reason')); return; }
    const r = P().materialRequests.find(x=>x.id===b.dataset.quickReject); if(!r) return;
    r.status='rejected'; r.approval={by:currentActorName(), at:new Date().toISOString(), reason:reason.trim()};
    saveData(); toast(tf('ปฏิเสธใบสั่งของแล้ว','Request rejected')); render();
  });
}

/* ============================= SCREEN: PROCUREMENT COST LOG ============================= */
// A single, spreadsheet-style ledger of purchases -- distinct from the
// multi-step approval workflow above (ใบสั่งของ / material requests). Every
// row is typed straight into the table, no separate add/edit modal: date,
// PO number, work type/nature, item, an optional link to a Master Plan
// task, quantity & unit price (the total is always qty x unit price,
// recomputed live -- see wireCostLog() below), who ordered it, procurement
// status, and a note. Feeds into boqActualsMap()/projectActualCostTotal()
// below exactly like a priced, linked material-request line does, so the
// Budget tab stays the single source of truth for "actual cost" no matter
// which of the two flows was used to record the purchase -- though here
// only rows with status "ordered" or "delivered" count as committed spend;
// a "pending" row is still just a request, not money out the door yet.
let costLogStatusFilter='all';
function newCostLogEntry(){
  return {
    id: uid(), createdAt: new Date().toISOString(),
    date: todayStr(), po:'', workType:'', workNature:'main', itemName:'',
    taskId:'', unit:'', qty:null, unitCost:null, total:0, orderedBy:'',
    status:'pending', note:''
  };
}
function costLogRecalcTotal(c){ c.total = (c.qty||0) * (c.unitCost||0); return c.total; }
// Horizontal bar breakdown of every logged entry's total (regardless of
// status -- matches the page's own "ยอดซื้อรวมทั้งหมด" KPI, unlike the
// stricter "committed spend only" rule used for the Budget tab's rollup),
// grouped by the BOQ category it's linked to. Entries with no category
// link land in one "not linked" bucket at the end. Hand-rolled with plain
// divs (not SVG/canvas) since it's just proportional bar widths, matching
// the app's existing convention of building charts from scratch rather
// than pulling in a charting library.
function costLogCategoryChartHtml(all){
  if(!all.length) return '';
  const proj = P();
  const catOrder = boqCategoryGroups(proj.boq||[]).map(g=>g.cat).filter(Boolean);
  const totals = {};
  all.forEach(c=>{ const key = c.taskId||''; totals[key] = (totals[key]||0) + (c.total||0); });
  const keys = catOrder.filter(cat=>totals[cat]!=null);
  if(totals['']!=null) keys.push('');
  const grand = keys.reduce((s,k)=> s+totals[k], 0);
  if(!grand) return '';
  const maxVal = Math.max(...keys.map(k=>totals[k]));
  const rows = keys.map(k=>{
    const label = k? k : tf('ไม่ได้เชื่อมกับหมวดหมู่งาน','Not linked to a category');
    const val = totals[k];
    const pct = grand? (val/grand*100) : 0;
    const barPct = maxVal? (val/maxVal*100) : 0;
    return `<div class="cl-cat-row">
      <div class="cl-cat-label" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
      <div class="cl-cat-bar-track"><div class="cl-cat-bar-fill" style="width:${barPct}%"></div></div>
      <div class="cl-cat-amt tabular">${fmtCurrency(val)} <span class="hint">(${fmtNum(pct,1)}%)</span></div>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:16px">
    <b style="font-family:var(--font-display)">📊 ${tf('สรุปต้นทุนจัดซื้อแยกตามหมวดหมู่งาน (BOQ)','Purchase Cost by BOQ Category')}</b>
    <div class="cl-cat-chart" style="margin-top:12px">${rows}</div>
  </div>`;
}
function renderCostLog(){
  const proj = P();
  const all = proj.costLog||[];
  const filtered = costLogStatusFilter==='all'? all : all.filter(c=>c.status===costLogStatusFilter);
  const grandTotal = all.reduce((s,c)=> s+(c.total||0), 0);
  const filterChips = [{v:'all',label:tf('ทั้งหมด','All')}].concat(COSTLOG_STATUS.map(s=>({v:s.v,label:tf(s.th,s.en)}))).map(f=>{
    const count = f.v==='all'? all.length : all.filter(c=>c.status===f.v).length;

  // granularity isn't needed here, and picking from a short category list

      <td><select data-cl-field="taskId"><option value="">${tf('— ไม่เชื่อม —','— none —')}</option>${boqCategories.map(cat=>`<option value="${escapeHtml(cat)}" ${c.taskId===cat?'selected':''}>${escapeHtml(cat)}</option>`).join('')}</select></td>
      <td><input type="text" data-cl-field="unit" value="${escapeHtml(c.unit||'')}" placeholder="${tf('หน่วย','Unit')}" style="width:70px"></td>
      <td><input type="number" step="0.01" min="0" data-cl-field="qty" value="${c.qty==null?'':c.qty}" style="width:80px"></td>
      <td><input type="number" step="0.01" min="0" data-cl-field="unitCost" value="${c.unitCost==null?'':c.unitCost}" style="width:100px"></td>
      <td class="tabular" data-cl-total>${fmtCurrency(c.total||0)}</td>
      <td><input type="text" data-cl-field="orderedBy" value="${escapeHtml(c.orderedBy||'')}" placeholder="${tf('ผู้สั่ง','Ordered by')}" style="width:100px"></td>
      <td><select data-cl-field="status">${COSTLOG_STATUS.map(s=>`<option value="${s.v}" ${c.status===s.v?'selected':''}>${s.ic} ${escapeHtml(tf(s.th,s.en))}</option>`).join('')}</select></td>
      <td><input type="text" data-cl-field="note" value="${escapeHtml(c.note||'')}" placeholder="${tf('หมายเหตุ','Note')}" style="width:140px"></td>
      <td><button class="iconbtn" data-cl-delete="${c.id}" title="${tf('ลบ','Delete')}">🗑️</button></td>
    </tr>`;
  }).join('');

  // Inline "spreadsheet" editing: typing into a cell mutates the underlying
  // entry directly and, for qty/unit price, recomputes just that row's total
  // cell in place -- deliberately NOT calling render() on every keystroke,
  // since a full re-render rebuilds the DOM and would steal focus/cursor
  // position out from under whatever the user is still typing into (same
  // reasoning as the pattern used for material-request line inputs above).

  $$('[data-cl-row]').forEach(row=>{

      inp.oninput = ()=>{

  $$('[data-cl-delete]').forEach(btn=>{

/* ============================= SCREEN: BUDGET (BOQ vs. Actual) ============================= */
// Rolls up actual purchase cost from material-request lines against each BOQ
// item's planned budget (qtyTotal x unitPrice). A request line only counts
// toward a specific BOQ item's actual cost once it is BOTH linked to that
// item (line.taskId, set when the request was created) AND priced
// (line.actualUnitCost, entered by procurement at delivery confirmation) --
// see requestModalHtml() and the #dt-schedule handler in wireDetailModal().
// The Procurement Cost Log links each entry to a whole BOQ *category*
// (the main work heading, e.g. "4. งานไฟฟ้า-เดินสายไฟ") rather than one
// specific line item -- see the "เชื่อมงาน" field in renderCostLog()/
// wireCostLog() below. That coarser link means its costs can't be folded
// into this item-level map; they roll up separately by category in
// costLogCategoryTotals(), and renderBudget() displays that on each
// category's header row instead of any single item's row.
function boqActualsMap(){
  const map = {}; // taskId -> {qty, cost, refs:[{reqNo,poNumber,vendor,purchaseDate}]}
  P().materialRequests.filter(r=>!r.trashed).forEach(r=>{
    (r.lines||[]).forEach(l=>{
      if(!l.taskId || l.actualUnitCost==null) return;
      const qty = (l.actualQty!=null? l.actualQty : l.qty) || 0;
      const cost = qty * l.actualUnitCost;
      if(!map[l.taskId]) map[l.taskId] = {qty:0, cost:0, refs:[]};
      map[l.taskId].qty += qty;
      map[l.taskId].cost += cost;
      map[l.taskId].refs.push({reqNo:r.reqNo, poNumber:(r.procurement&&r.procurement.poNumber)||'', vendor:(r.procurement&&r.procurement.vendor)||'', purchaseDate:(r.procurement&&r.procurement.deliveryDate)||''});
    });
  });
  return map;
}
// Cost Log spend grouped by the BOQ category it's linked to (taskId now
// holds a category string, not an item id -- see the comment above
// boqActualsMap()). Only "ordered"/"delivered" entries count as committed
// spend, same rule as projectActualCostTotal() below; a "pending" entry is
// still just a request.
function costLogCategoryTotals(){
  const map = {}; // category string -> {cost, count}
  (P().costLog||[]).forEach(c=>{
    if(!c.taskId || c.status==='pending') return;
    if(!map[c.taskId]) map[c.taskId] = {cost:0, count:0};
    map[c.taskId].cost += (c.total||0);
    map[c.taskId].count += 1;
  });
  return map;
}
// Total actual spend across every priced line, linked or not -- this is the
// "real money spent" KPI, independent of whether it can be matched to a BOQ
// line item.
function projectActualCostTotal(){
  let total=0;
  P().materialRequests.filter(r=>!r.trashed).forEach(r=> (r.lines||[]).forEach(l=>{
    if(l.actualUnitCost==null) return;
    const qty = (l.actualQty!=null? l.actualQty : l.qty) || 0;
    total += qty*l.actualUnitCost;
  }));
  (P().costLog||[]).forEach(c=>{ if(c.status!=='pending') total += (c.total||0); });
  return total;
}
function renderBudget(){
  const proj = P();
  if(!proj.boq.length){
    return `<div class="page-head"><div><h2>${tf('งบประมาณ (BOQ เทียบต้นทุนจริง)','Budget (BOQ vs. Actual)')}</h2></div></div><div class="empty"><span class="ic">💰</span>${tf('เพิ่มรายการงานในแผนงานหลักก่อน เพื่อเริ่มติดตามงบประมาณ','Add work items in the Master Plan first to start tracking budget')}</div>`;
  }
  const actuals = boqActualsMap();
  const catActuals = costLogCategoryTotals();
  const groups = boqCategoryGroups(proj.boq);
  let totalBoqBudget=0, no=0;
  const rows = groups.map(g=>{
    const label = g.cat? escapeHtml(g.cat) : tf('ไม่ระบุหมวดหมู่','Uncategorized');
    const ca = g.cat? catActuals[g.cat] : null;
    const catCostLogNote = ca? ` · 🧾 ${tf('ต้นทุนจากบันทึกจัดซื้อ','Cost log spend')}: <b class="tabular">${fmtCurrency(ca.cost)}</b> (${ca.count} ${tf('รายการ','entries')})` : '';
    const catHeader = `<tr class="budget-cat-row"><td colspan="15">📁 ${label}${catCostLogNote}</td></tr>`;
    const itemRows = g.items.map(item=>{
      no++;
      const boqQty = item.qtyTotal;
      const boqUnitPrice = item.unitPrice;
      const boqTotal = boqUnitPrice!=null? boqQty*boqUnitPrice : null;
      if(boqTotal!=null) totalBoqBudget += boqTotal;
      const a = actuals[item.id];
      const actualQty = a? a.qty : 0;
      const actualTotal = a? a.cost : 0;
      const actualUnitPrice = (a && actualQty>0)? actualTotal/actualQty : null;
      const priceVariance = (boqUnitPrice!=null && actualUnitPrice!=null)? (boqUnitPrice-actualUnitPrice)*actualQty : null;
      const qtyVariance = (boqUnitPrice!=null)? (boqQty-actualQty)*boqUnitPrice : null;
      const totalVariance = (boqTotal!=null)? boqTotal-actualTotal : null;
      let statusLabel, statusClass;
      if(boqUnitPrice==null){ statusLabel=tf('ยังไม่ตั้งราคา','No price set'); statusClass='idle'; }
      else if(!a){ statusLabel=tf('ยังไม่มีค่าใช้จ่าย','No spend yet'); statusClass='ok'; }
      else if(totalVariance>=0){ statusLabel=tf('ปกติ','On budget'); statusClass='ok'; }
      else { statusLabel=tf('เกินงบ','Over budget'); statusClass='bad'; }
      const refs = a? a.refs : [];
      const refSummary = refs.length? refs.map(r=> [r.poNumber,r.vendor].filter(Boolean).join(' · ') || r.reqNo).join(', ') : '-';
      return `<tr data-edit-item="${item.id}" style="cursor:pointer">

        <td class="tabular">${boqTotal!=null? fmtCurrency(boqTotal):'-'}</td>
        <td class="tabular">${a? fmtNum(actualQty,2):'-'}</td>
        <td class="tabular">${actualUnitPrice!=null? fmtCurrency(actualUnitPrice):'-'}</td>
        <td class="tabular">${a? fmtCurrency(actualTotal):'-'}</td>
        <td class="tabular" style="color:${priceVariance!=null&&priceVariance<0?'var(--coral-600)':'inherit'}">${priceVariance!=null? fmtCurrency(priceVariance):'-'}</td>
        <td class="tabular" style="color:${qtyVariance!=null&&qtyVariance<0?'var(--coral-600)':'inherit'}">${qtyVariance!=null? fmtCurrency(qtyVariance):'-'}</td>
        <td class="tabular" style="color:${totalVariance!=null&&totalVariance<0?'var(--coral-600)':'inherit'}">${totalVariance!=null? fmtCurrency(totalVariance):'-'}</td>
        <td><span class="badge ${statusClass}">${statusLabel}</span></td>
        <td class="hint" style="white-space:normal;max-width:200px" title="${escapeHtml(refSummary)}">${escapeHtml(refSummary)}</td>
      </tr>`;
    }).join('');
    return catHeader + itemRows;
  }).join('');
  const totalActualAll = projectActualCostTotal();
  const remaining = totalBoqBudget - totalActualAll;
  return `
  <div class="page-head">
    <div><h2>${tf('งบประมาณ (BOQ เทียบต้นทุนจริง)','Budget (BOQ vs. Actual)')}</h2><div class="sub">${tf('เปรียบเทียบงบประมาณตามแผน (BOQ) กับต้นทุนจ่ายจริงที่ยืนยันจากขั้นตอนจัดซื้อ · แตะแถวเพื่อตั้งราคาต่อหน่วยตามแผน','Compares the planned BOQ budget against actual costs confirmed during procurement -- tap a row to set its planned unit price')}</div></div>
  </div>
  <div class="grid cols-auto" style="margin-bottom:16px">
    <div class="card kpi"><div class="stat"><span class="lbl">💰 ${tf('งบประมาณตั้งต้นรวม','Total BOQ budget')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(totalBoqBudget)}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">💸 ${tf('ต้นทุนจ่ายจริงรวม','Total actual cost')}</span><span class="num tabular" style="font-size:19px">${fmtCurrency(totalActualAll)}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${remaining>=0?'✅':'🔴'} ${tf('คงเหลืองบประมาณสุทธิ','Remaining budget')}</span><span class="num tabular" style="font-size:19px;color:${remaining>=0?'var(--mint-600)':'var(--coral-600)'}">${fmtCurrency(remaining)}</span></div></div>

    <th>${tf('ปริมาณ BOQ','BOQ Qty')}</th><th>${tf('ราคา/หน่วย BOQ','BOQ Unit Price')}</th><th>${tf('รวม BOQ','BOQ Total')}</th>
    <th>${tf('ปริมาณจริง','Actual Qty')}</th><th>${tf('ราคา/หน่วยจริง','Actual Unit Price')}</th><th>${tf('รวมจริง','Actual Total')}</th>
    <th>${tf('ผลต่างราคา','Price Variance')}</th><th>${tf('ผลต่างปริมาณ','Qty Variance')}</th><th>${tf('ผลต่างรวม','Total Variance')}</th><th>${tf('สถานะ','Status')}</th><th>${tf('อ้างอิง (PO/ผู้ขาย)','Reference (PO/Vendor)')}</th>

function buildSCurve(asOf){
  const proj = P();
  const starts = proj.boq.map(i=>i.startDate);
  const ends = proj.boq.map(i=>i.endDate);
  const summary0 = projectSummary(asOf, proj.boq, proj.logs);
  let rangeEnd = ends.reduce((a,b)=>a>b?a:b);
  if(summary0.predictedEnd && summary0.predictedEnd>rangeEnd) rangeEnd = summary0.predictedEnd;
  const rangeStart = starts.reduce((a,b)=>a<b?a:b);
  const totalDays = Math.max(daysBetween(rangeStart,rangeEnd),1);
  const W=760,H=220,padL=34,padR=14,padT=14,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xFor = (i)=> padL + (i/totalDays)*plotW;
  const yFor = (pct)=> padT + plotH - (clamp(pct,0,100)/100)*plotH;
  let plannedPts=[], actualPts=[];
  for(let d=0; d<=totalDays; d+=Math.max(1,Math.round(totalDays/60))){
    const dateStr = addDays(rangeStart,d);
    let pSum=0,n=0; proj.boq.forEach(it=>{ pSum+=clamp(plannedCumAt(it,dateStr)/(it.qtyTotal||1),0,1); n++; });
    plannedPts.push([xFor(d), yFor((pSum/n)*100)]);
    if(dateStr<=asOf){
      let aSum=0; proj.boq.forEach(it=>{ aSum+=clamp(actualCumAt(it,dateStr,proj.logs)/(it.qtyTotal||1),0,1); });
      actualPts.push([xFor(d), yFor((aSum/n)*100)]);
    }
  }
  const path = pts => 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
  const todayX = xFor(clamp(daysBetween(rangeStart,asOf),0,totalDays));
  const gridLines = [0,25,50,75,100].map(p=>`<line x1="${padL}" x2="${W-padR}" y1="${yFor(p)}" y2="${yFor(p)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-8}" y="${yFor(p)+3}" font-size="9" fill="var(--ink-300)" text-anchor="end" font-family="IBM Plex Mono">${p}</text>`).join('');
  const svg = `<svg class="svcurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <line x1="${todayX}" x2="${todayX}" y1="${padT}" y2="${H-padB}" stroke="var(--ink-300)" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="${todayX}" y="${H-padB+14}" font-size="9" fill="var(--ink-500)" text-anchor="middle" font-family="IBM Plex Mono">${tf('วันนี้','today')}</text>
    <path d="${path(plannedPts)}" fill="none" stroke="var(--purple-600)" stroke-width="2.4"/>
    ${actualPts.length>1? `<path d="${path(actualPts)}" fill="none" stroke="var(--mint-500)" stroke-width="2.4"/>` : ''}
    ${actualPts.length? `<circle cx="${actualPts[actualPts.length-1][0]}" cy="${actualPts[actualPts.length-1][1]}" r="3.6" fill="var(--mint-500)"/>` : ''}
  </svg>`;
  return {svg};
}

let reportPhotoCache = {}; // id -> dataUrl
async function loadReportPhotos(log, reqs){
  const out=[];
  // Each idbGet() is caught individually rather than letting one rejected
  // read (a corrupted entry, or a browser that blocks IndexedDB outright --
  // private browsing, some in-app webviews) throw out of the whole loop.
  // Before this, one bad photo id meant the report's photo grid stayed
  // stuck on "Loading photos..." forever, with no error shown and every
  // other photo silently withheld too.
  for(const pid of (log?log.photoIds:[])||[]){
    if(!reportPhotoCache[pid]){
      try{ reportPhotoCache[pid] = await idbGet(pid); }
      catch(err){ continue; }
    }
    if(reportPhotoCache[pid]){
      const meta = (log.photoMeta&&log.photoMeta[pid]) || (log._captions? {caption:log._captions[pid]} : {});
      const caption = (meta.tag? '['+meta.tag+'] ' : '') + (meta.caption || tf('ภาพหน้างาน','site photo'));
      const kind = meta.kind || dataUrlKind(reportPhotoCache[pid]);
      out.push({id:pid, dataUrl:reportPhotoCache[pid], kind, name:meta.name||'', caption});
    }
  }
  for(const r of (reqs||[])){
    for(const pid of (r.photoIds||[])){
      if(!reportPhotoCache[pid]){
        try{ reportPhotoCache[pid] = await idbGet(pid); }
        catch(err){ continue; }
      }
      if(reportPhotoCache[pid]){
        const meta = (r.photoMeta&&r.photoMeta[pid]) || {};
        const kind = meta.kind || dataUrlKind(reportPhotoCache[pid]);
        out.push({id:pid, dataUrl:reportPhotoCache[pid], kind, name:meta.name||'', caption:tf('อ้างอิงวัสดุ: ','material reference: ')+((r.lines[0]&&r.lines[0].name)||r.reqNo)});
      }
    }
  }
  return out;
}

async function refreshReportPhotos(date){
  const grid = $('#rp-photogrid');
  try{
    const proj = P();
    const log = proj.logs.find(l=>l.date===date);
    const reqs = reqsForDate(date);
    const photos = await loadReportPhotos(log, reqs);
    if(!grid) return;
    if(photos.length){
      grid.innerHTML = photos.map(p=> p.kind==='pdf'?
        `<figure class="rp-pdf-figure"><a href="${p.dataUrl}" target="_blank" rel="noopener" download="${escapeHtml(p.name||'document.pdf')}"><div class="rp-pdf-icon">📄</div></a><figcaption>${escapeHtml(p.name||'PDF')}${p.caption? ' — '+escapeHtml(p.caption) : ''}</figcaption></figure>`
        : `<figure><img src="${p.dataUrl}"><figcaption>${escapeHtml(p.caption||tf('ภาพหน้างาน','site photo'))}</figcaption></figure>`
      ).join('');
    } else {
      // loadReportPhotos() silently drops any photo id it couldn't read (see
      // its own per-photo try/catch), so an expected count > 0 with zero
      // photos actually loaded means every read failed -- distinguish that
      // from "nothing was ever attached" instead of just saying "no photos".
      const expectedCount = ((log&&log.photoIds)||[]).length + (reqs||[]).reduce((s,r)=> s+((r.photoIds||[]).length), 0);
      grid.innerHTML = expectedCount>0
        ? `<span class="sub" style="color:var(--coral-600)">${tf('มีรูปภาพแนบไว้ แต่โหลดไม่สำเร็จ (เบราว์เซอร์นี้อาจบล็อกการจัดเก็บรูปภาพ)','Photos are attached, but failed to load (this browser may be blocking photo storage)')}</span>`
        : `<span class="sub">${tf('ไม่มีรูปภาพสำหรับวันนี้','No photos for this day')}</span>`;
    }
  }catch(err){
    // loadReportPhotos() already guards each individual photo read, so this
    // only fires on something unexpected (e.g. IndexedDB unavailable at all
    // in this browser) -- surface it instead of leaving the grid stuck on
    // "Loading photos..." forever with no explanation.
    console.error('Failed to load report photos', err);
    if(grid) grid.innerHTML = `<span class="sub" style="color:var(--coral-600)">${tf('โหลดรูปภาพไม่สำเร็จ (เบราว์เซอร์นี้อาจบล็อกการจัดเก็บรูปภาพ)','Failed to load photos (this browser may be blocking photo storage)')}</span>`;
  }
}

async function exportReportAsImage(){
  const holder = $('#export-holder');
  holder.innerHTML = `<div class="sub" style="margin-top:10px">${tf('กำลังสร้างรูปภาพ...','Generating image...')}</div>`;
  try{
    const node = $('#reportPrintable');
    const w = Math.max(node.clientWidth,640);
    const h = node.scrollHeight;
    const styleText = $$('style').map(s=>s.textContent).join('\n');
    // XMLSerializer (not .outerHTML) so void elements like <br> / <img> / <hr>
    // come out self-closed -- foreignObject content must be well-formed XML.
    const inner = new XMLSerializer().serializeToString(node);
    const svgData = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;font-family:Sarabun,sans-serif">
          <style>${styleText}</style>
          ${inner}
        </div>
      </foreignObject>
    </svg>`;
    const svgBlob = new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = ()=>{
      const scale=2;
      const canvas=document.createElement('canvas');
      canvas.width=w*scale; canvas.height=h*scale;
      const ctx=canvas.getContext('2d');
      ctx.scale(scale,scale);
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      try{
        ctx.drawImage(img,0,0,w,h);
        const pngUrl = canvas.toDataURL('image/png');
        holder.innerHTML = `<div class="exported-wrap"><img src="${pngUrl}" alt="report"><p>${tf('กดค้างที่รูป (มือถือ) หรือคลิกขวา &rarr; บันทึกรูปภาพ (คอมพิวเตอร์) เพื่อบันทึกและส่งเข้ากลุ่ม LINE','Press and hold the image (mobile) or right-click &rarr; save image (desktop) to save and send it to a LINE group')}</p></div>`;
      }catch(err){
        holder.innerHTML = imgFallbackMsg();
      }
      URL.revokeObjectURL(url);
    };
    img.onerror = ()=>{ holder.innerHTML = imgFallbackMsg(); URL.revokeObjectURL(url); };
    img.src = url;
  }catch(err){
    holder.innerHTML = imgFallbackMsg();
  }
}

/* ============================= WIRE SCREEN ROUTER ============================= */
function wireScreen(){
  if(FIELD_MODE){
    if(!state.currentProjectId) return;
    if(state.tab==='procure') return wireProcure();
    return wireDailyLog();
  }
  if(state.view==='hub') return wireHub();
  if(state.view==='profile') return wireProfile();
  if(state.view==='contractors') return wireContractors();
  if(state.view!=='project') return;
  if(state.tab==='masterplan') wireMasterPlan();
  else if(state.tab==='dailylog') wireDailyLog();
  else if(state.tab==='procure') wireProcure();
  else if(state.tab==='costlog') wireCostLog();
  else if(state.tab==='budget') wireBudget();
  else if(state.tab==='report') wireReport();
}

/* ============================= OFFLINE / CONNECTIVITY ============================= */
function updateNetStatus(){
  const dot = $('#net-dot');
  if(!dot) return;
  if(navigator.onLine){ dot.classList.remove('offline'); dot.title=tf('ออนไลน์','Online'); }
  else { dot.classList.add('offline'); dot.title=tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลบันทึกอยู่ในเครื่องนี้','Offline — you can keep working normally, data is saved on this device'); }
}
window.addEventListener('online', ()=>{ updateNetStatus(); toast(tf('กลับมาออนไลน์แล้ว','Back online')); });
window.addEventListener('offline', ()=>{ updateNetStatus(); toast(tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลจะถูกบันทึกในเครื่องนี้','Offline — you can keep working normally, data will be saved on this device')); });

/* ============================= INIT ============================= */
// Safety net: without this, dropping a file anywhere outside an actual drop
// zone makes the browser navigate away to that file, discarding whatever the
// user had open (e.g. a half-filled material request). Drop zones themselves
// call preventDefault() in their own handlers, so this never blocks them.
window.addEventListener('dragover', e=> e.preventDefault());
window.addEventListener('drop', e=> e.preventDefault());
bootstrap();
render();
updateNetStatus();
})();
</script>
