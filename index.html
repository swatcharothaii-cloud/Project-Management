p{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--purple-100)}
:focus-visible{outline:2px solid var(--purple-600);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
.tabular{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

/* ============================= LAYOUT ============================= */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg,var(--purple-700),var(--purple-600));
  color:#fff;
  padding:14px 20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-md);
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
.net-dot{width:8px;height:8px;border-radius:50%;background:#6EF0B8;box-shadow:0 0 0 3px rgba(110,240,184,.28);flex:none}
.net-dot.offline{background:#D7D3F0;box-shadow:0 0 0 3px rgba(215,211,240,.22)}
.topbar .brand .mark{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
  border:1px solid rgba(255,255,255,.28);overflow:hidden;
}
.topbar .brand .mark img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:9px}
.topbar .brand .txt{min-width:64px;flex-shrink:1}
.topbar .brand .txt b{font-family:var(--font-display);font-weight:600;font-size:15.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.topbar .brand .txt span{font-size:12px;opacity:.82;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.status-pill{
  display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
  font-size:12.5px;font-weight:600;white-space:nowrap;
}
.status-pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.status-pill.ok .dot{background:var(--mint-500);box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.status-pill.bad .dot{background:#FCA5A5;box-shadow:0 0 0 3px rgba(252,165,165,.25)}
.status-pill.idle .dot{background:#E0E4FD}

.tabbar{
  position:sticky;top:66px;z-index:39;
  display:flex;gap:2px;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:0 10px;overflow-x:auto;scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none}
.tabbtn{
  flex:none;display:flex;align-items:center;gap:7px;
  padding:13px 15px;font-size:13.5px;font-weight:600;color:var(--ink-500);
  border:none;background:none;border-bottom:2.5px solid transparent;
  white-space:nowrap;
}
.tabbtn .ic{font-size:15px}
.tabbtn.active{color:var(--purple-700);border-bottom-color:var(--purple-600)}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 64px;}
.screen{display:flex;flex-direction:column;gap:18px;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:700}
.page-head .sub{color:var(--ink-500);font-size:13.5px;margin-top:3px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:18px;box-shadow:var(--shadow-sm);
}
.card.tint{background:var(--purple-50);border-color:var(--purple-100)}
.grid{display:grid;gap:14px}
.grid.cols-auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.cols-proj{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-700)}
.field .hint{font-size:11.5px;color:var(--ink-300);font-weight:400}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;
  background:var(--surface);color:var(--ink-900);width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--purple-600)}
textarea{resize:vertical;min-height:70px;font-family:var(--font-body)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 17px;border-radius:999px;border:1.5px solid transparent;
  font-weight:600;font-size:13.5px;transition:transform .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--purple-600),var(--purple-700));color:#fff;box-shadow:var(--shadow-md)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink-700)}
.btn.ghost:hover{border-color:var(--purple-500);color:var(--purple-700)}
.btn.danger{background:var(--coral-50);color:var(--coral-600);border-color:transparent}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.ok{background:var(--mint-50);color:var(--mint-600)}
.badge.bad{background:var(--coral-50);color:var(--coral-600)}
.badge.idle{background:var(--purple-50);color:var(--purple-700)}

.progress{height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden;position:relative}
.progress > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple-600),var(--purple-700))}
.progress.ok > i{background:linear-gradient(90deg,var(--mint-500),var(--mint-600))}
.progress.bad > i{background:linear-gradient(90deg,var(--coral-500),var(--coral-600))}

table{width:100%;border-collapse:collapse;font-size:13px}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--line)}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--purple-50);color:var(--purple-700);font-family:var(--font-display);font-weight:600;font-size:12.5px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.mp-thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.mp-thumb[data-open-gallery]{cursor:pointer}
.mp-thumb[data-open-gallery]:hover{border-color:var(--purple-500)}
.mp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mp-thumb-empty{font-size:17px;opacity:.35}
.mp-thumb-count{position:absolute;bottom:1px;right:1px;background:rgba(20,18,36,.68);color:#fff;font-size:9px;padding:1px 4px;border-radius:6px;line-height:1.3}
.mp-thumb[data-quick-attach]{cursor:pointer}
.mp-thumb[data-quick-attach]:hover{border-color:var(--purple-500)}
.budget-table{table-layout:auto}
.budget-table th,.budget-table td{white-space:nowrap;font-size:12px;padding:9px 10px}
.budget-table td:nth-child(3){white-space:normal;min-width:160px}
.cl-table td:nth-child(3){white-space:nowrap;min-width:0}
.cl-table td{padding:5px 6px;vertical-align:middle}
.cl-table input,.cl-table select{padding:6px 8px;font-size:12px;border-radius:6px;min-width:0}
.cl-table td[data-cl-total]{white-space:nowrap;font-weight:600;padding:9px 10px}
.cl-cat-chart{display:flex;flex-direction:column;gap:10px}
.cl-cat-row{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;align-items:center;gap:12px}
.cl-cat-label{font-size:12.5px;font-weight:600;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-cat-bar-track{height:10px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.cl-cat-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple-600),var(--purple-700));min-width:3px}
.cl-cat-amt{font-size:12.5px;font-weight:600;white-space:nowrap}
.budget-cat-row td{background:var(--purple-50);color:var(--purple-700);font-family:var(--font-display);font-weight:600;font-size:12.5px;white-space:normal}
.mp-table tr.mp-cat-row{cursor:pointer;user-select:none}
.mp-table tr.mp-cat-row td{background:var(--purple-50);color:var(--purple-700);font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:9px 12px;white-space:normal;transition:background .12s}
.mp-table tr.mp-cat-row:hover td{background:var(--purple-100,var(--purple-50))}
.mp-table tr.mp-cat-row.open td{border-bottom:1px solid var(--purple-100,var(--line))}
.mp-table{table-layout:fixed;width:100%}
.mp-table th,.mp-table td{white-space:normal;word-break:break-word;padding:9px 8px;vertical-align:top;font-size:12.5px}
.mp-table th:nth-child(1),.mp-table td:nth-child(1){width:5%}
.mp-table th:nth-child(2),.mp-table td:nth-child(2){width:15%}
.mp-table th:nth-child(3),.mp-table td:nth-child(3){width:11%}
.mp-table th:nth-child(4),.mp-table td:nth-child(4){width:11%}
.mp-table th:nth-child(5),.mp-table td:nth-child(5){width:8%}
.mp-table th:nth-child(6),.mp-table td:nth-child(6){width:9%}
.mp-table th:nth-child(7),.mp-table td:nth-child(7){width:9%}
.mp-table th:nth-child(8),.mp-table td:nth-child(8){width:5%}
.mp-table th:nth-child(9),.mp-table td:nth-child(9){width:9%}
.mp-table th:nth-child(10),.mp-table td:nth-child(10){width:9%}
.mp-table th:nth-child(11),.mp-table td:nth-child(11){width:9%}
.mp-table td:nth-child(11){display:flex;gap:5px;flex-wrap:wrap}
.mp-table td:nth-child(11) .btn{padding:6px 8px;min-width:0}
.mp-sub{display:block;font-size:11px;color:var(--ink-500);margin-top:3px;line-height:1.35;font-weight:400}
.mp-days-badge{display:inline-block;font-size:10px;color:var(--ink-500);background:var(--line-soft,var(--purple-50));padding:1px 6px;border-radius:8px;white-space:nowrap}
.mp-date-input{width:100%;font-size:11px;padding:4px 3px;border-radius:6px;border:1px solid var(--line);font-family:var(--font-mono);color:var(--ink-700);background:var(--surface)}
.mp-date-input:hover{border-color:var(--purple-400,var(--purple-500))}
.mp-date-input:focus{outline:2px solid var(--purple-100,var(--purple-50));border-color:var(--purple-500)}
.mp-progress-wrap{display:flex;flex-direction:column;gap:4px;width:100%}
.mp-progress-input{width:100%;font-size:11px;padding:3px 4px;border-radius:6px;border:1px solid var(--line);text-align:center;font-family:var(--font-mono);color:var(--ink-700);background:var(--surface)}
.mp-progress-input:hover{border-color:var(--purple-400,var(--purple-500))}
.mp-progress-input:focus{outline:2px solid var(--purple-100,var(--purple-50));border-color:var(--purple-500)}
.mp-progress-bar{height:6px;margin:0}
.mp-table tr.mp-row-on-track td{background:var(--blue-50)}
.mp-table tr.mp-row-near-due td{background:var(--amber-50)}
.mp-table tr.mp-row-overdue td{background:var(--coral-50)}
.mp-table tr.mp-row-done td{background:var(--mint-50)}
.mp-status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.mp-status-dot.on-track{background:var(--blue-500)}
.mp-status-dot.near-due{background:var(--amber-500)}
.mp-status-dot.overdue{background:var(--coral-500)}
.mp-status-dot.done{background:var(--mint-500)}
.mp-cat-chevron{display:inline-block;width:14px;margin-right:2px;font-size:11px;opacity:.7}
.mp-cat-count{font-weight:400;opacity:.75;font-size:11.5px}
.mp-expand-controls{display:flex;gap:8px;margin:0 0 12px}

.mp-view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px}
.mp-view-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-500);cursor:pointer}
.mp-view-toggle button.active{background:var(--surface);color:var(--purple-700);box-shadow:var(--shadow-sm)}

/* ---------- Master Plan: Gantt chart ---------- */
.gantt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gantt-toolbar .hint{font-size:11.5px;color:var(--ink-300)}
/* A second, synced horizontal scrollbar placed above the chart -- the real
   one lives at the bottom of .gantt-outer, which on a long BOQ can be
   hundreds of rows down and out of reach without scrolling the whole page
   first. This bar's own content is a 1px-tall spacer exactly as wide as the
   chart, so its native scrollbar thumb is proportioned to match, and
   wireMasterPlan() mirrors scrollLeft between the two in both directions. */
.gantt-topscroll{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:6px}
.gantt-topscroll>div{height:1px}
.gantt-scroll-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-700);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.gantt-scroll-btn:hover{background:var(--surface-2)}
.gantt-outer{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:16px;background:var(--surface)}
.gantt-inner{position:relative}
.gantt-deps-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.gantt-row{display:flex}
.gantt-label-col{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;font-size:12px;display:flex;flex-direction:column;justify-content:center;flex-shrink:0;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-label-col.item-cols{display:grid;grid-template-columns:1fr 52px 52px 34px 78px 40px;column-gap:6px;align-items:center}
.gantt-label-col.item-cols>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;color:var(--ink-500)}
.gantt-label-col.item-cols .gl-task{font-size:12px;color:var(--ink-900);display:flex;align-items:center;gap:4px}
.gantt-label-col.item-cols .gl-num{font-family:var(--font-mono);text-align:center}
.gantt-header-row .gantt-label-col{display:grid;grid-template-columns:1fr 52px 52px 34px 78px 40px;column-gap:6px;align-items:center;font-size:10px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.02em}
.gantt-header-row .gantt-label-col>div{text-align:center;white-space:nowrap;overflow:hidden}
.gantt-header-row .gantt-label-col>div:first-child{text-align:left}
.gantt-cat-label{background:var(--surface-2);font-family:var(--font-display);font-weight:600;color:var(--ink-700);font-size:12.5px;padding:0 10px}
.gantt-timeline-col{position:relative;flex-shrink:0;box-sizing:border-box}
.gantt-row:not(.gantt-header-row):not(.gantt-cat-row) .gantt-timeline-col{height:34px;border-bottom:1px solid var(--line-soft)}
.gantt-row:not(.gantt-header-row):not(.gantt-cat-row) .gantt-label-col{height:34px;border-bottom:1px solid var(--line-soft)}
.gantt-cat-row .gantt-timeline-col,.gantt-cat-row .gantt-label-col{height:28px;background:var(--surface-2)}
.gantt-header-row .gantt-timeline-col{height:42px}
.gantt-header-row .gantt-label-col{height:42px;border-bottom:1px solid var(--line)}
.gantt-months{display:flex;height:22px;box-sizing:border-box}
.gantt-month-band{flex-shrink:0;font-size:11px;font-weight:600;color:var(--ink-500);text-align:center;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;box-sizing:border-box}
.gantt-days{display:flex;height:20px;box-sizing:border-box}
.gantt-daycell{flex-shrink:0;font-size:9.5px;color:var(--ink-300);text-align:center;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft);box-sizing:border-box}
.gantt-daycell.weekend{background:var(--surface-2)}
.gantt-bar{position:absolute;top:5px;height:24px;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);display:flex;align-items:center}
.gantt-bar.on-track{background:var(--blue-500)}
.gantt-bar.near-due{background:var(--amber-500)}
.gantt-bar.overdue{background:var(--coral-500)}
.gantt-bar.done{background:var(--mint-500)}
.gantt-bar-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.32)}
.gantt-bar-label{position:relative;z-index:1;color:#fff;font-size:11px;font-weight:600;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.gantt-bar-label-outside{position:absolute;top:5px;height:24px;display:flex;align-items:center;font-size:11px;color:var(--ink-700);white-space:nowrap}
.gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--coral-500);z-index:3;pointer-events:none}

.empty{
  border:1.5px dashed var(--line);border-radius:var(--radius-md);
  padding:34px 20px;text-align:center;color:var(--ink-500);font-size:13.5px;
}
.empty .ic{font-size:30px;margin-bottom:8px;display:block}

.stat{display:flex;flex-direction:column;gap:4px}
.stat .num{font-family:var(--font-mono);font-weight:600;font-size:24px;color:var(--ink-900)}
.stat .lbl{font-size:12px;color:var(--ink-500);font-weight:600}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink-900);color:var(--surface);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:80;opacity:0;
  transition:opacity .25s ease, transform .25s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed;inset:0;background:rgba(20,18,36,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:22px 22px 0 0;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow-lg)}
@media(min-width:720px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:var(--radius-lg)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-500)}

/* ---------- Photo grid ---------- */
.photo-drop{
  border:1.5px dashed var(--purple-100);border-radius:var(--radius-md);background:var(--purple-50);
  padding:22px;text-align:center;color:var(--purple-700);cursor:pointer;font-size:13.5px;font-weight:600;
}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo-item{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.photo-item img{width:100%;height:98px;object-fit:cover;display:block}
.photo-item input,.photo-item select{border:none;border-top:1px solid var(--line);border-radius:0;font-size:10.5px;padding:5px 7px;background:var(--surface);width:100%;display:block}
.photo-item .rm{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(20,18,36,.62);color:#fff;border:none;font-size:12px;line-height:1}
.photo-pdf-icon{height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:28px;background:var(--surface-2);color:var(--ink-500)}
.photo-pdf-name{font-size:9.5px;padding:0 6px;text-align:center;word-break:break-word;line-height:1.2;max-height:2.4em;overflow:hidden}
.photo-drop.drag-over{background:var(--purple-100,var(--purple-50));border-color:var(--purple-500)}
.progressline{height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--purple-600)}

/* ---------- Dashboard ---------- */
.kpi{padding:18px}
.kpi .num{font-size:28px}
.svcurve{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-500)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* ---------- Report ---------- */

/* ============================= UTILS ============================= */

/* ============================= I18N ============================= */
// tf(thaiText, englishText) -- returns the string matching the current UI
// language. Kept as inline pairs (not a giant key dictionary) since most
// strings here are one-off and easier to review side-by-side at the call site.
function tf(th,en){ return state.lang==='en' ? en : th; }

function pad2(n){return String(n).padStart(2,'0')}
function parseYMD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtYMD(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(dateStr,n){ const d=parseYMD(dateStr); d.setDate(d.getDate()+n); return fmtYMD(d); }
function daysBetween(aStr,bStr){ const a=parseYMD(aStr), b=parseYMD(bStr); return Math.round((b-a)/86400000); }
function todayStr(){ return fmtYMD(new Date()); }
const THMONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const ENMONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtThai(dateStr){ if(!dateStr) return '-'; const d=parseYMD(dateStr); return d.getDate()+' '+THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543); }
function fmtEng(dateStr){ if(!dateStr) return '-'; const d=parseYMD(dateStr); return ENMONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function fmtDate(dateStr){ return state.lang==='en' ? fmtEng(dateStr) : fmtThai(dateStr); }
function isoAt(dateStr,hh,mm){ const d=parseYMD(dateStr); d.setHours(hh,mm,0,0); return d.toISOString(); }
function fmtDateTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(state.lang==='en') return ENMONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  return d.getDate()+' '+THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+' น.';
}
function fmtNum(n,dec){ if(n==null||isNaN(n)) return '-'; dec = dec==null?1:dec; const v=Number(n); const r = Math.round(v*Math.pow(10,dec))/Math.pow(10,dec); return r.toLocaleString(state.lang==='en'?'en-US':'th-TH',{minimumFractionDigits:0,maximumFractionDigits:dec}); }
// Baht-formatted money for the Budget tab and cost fields elsewhere -- always
// 2 decimals so unit prices/variances stay legible, prefixed with ฿ rather
// than a locale currency code since this app is single-currency (THB) only.
function fmtCurrency(n){ if(n==null||isNaN(n)) return '-'; const v=Number(n); return '฿'+v.toLocaleString(state.lang==='en'?'en-US':'th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ============================= STORAGE (localStorage) ============================= */
const LS_KEY='sitepulse_v1';
function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;

}

/* ============================= STORAGE (IndexedDB for photos) ============================= */
let _dbp=null;
function idb(){
  if(_dbp) return _dbp;
  _dbp = new Promise((resolve,reject)=>{
    const req = indexedDB.open('sitepulse_photos',1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('photos');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbp;
}
async function idbPut(id,dataUrl){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').put(dataUrl,id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(id){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readonly');
    const r=tx.objectStore('photos').get(id);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbDelete(id){
  const db = await idb();
  return new Promise((res)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete=()=>res(true);
  });
}

/* ============================= IMAGE COMPRESSION ============================= */
function compressImage(file, maxDim, quality){
  maxDim = maxDim||1280; quality = quality==null?0.62:quality;
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataUrlKind(dataUrl){
  if(!dataUrl) return 'file';
  if(dataUrl.indexOf('data:image/')===0) return 'image';
  if(dataUrl.indexOf('data:application/pdf')===0) return 'pdf';
  return 'file';
}

// Field-worker restricted link: opening the app with #field&project=<id> in the
// URL locks the whole UI to that project's Daily Log screen only -- no other
// tab, and no other project, is reachable. This is a UX-level lock (the app
// has no server/auth), meant for handing a simple "just fill today's report"
// link to a site contractor.
const FIELD_MODE = location.hash.replace('#','').split('&').includes('field');
function fieldProjectIdFromHash(){
  const parts = location.hash.replace('#','').split('&');
  const m = parts.find(s=> s.indexOf('project=')===0);
  return m ? decodeURIComponent(m.slice('project='.length)) : null;
}
function fieldLink(projectId){
  return location.origin + location.pathname + location.search + '#field&project=' + encodeURIComponent(projectId);
}
// Direct project link: opening the app with #open&project=<id> in the URL
// skips the "All Projects" hub and lands straight inside that project's
// dashboard, with the normal full UI (every tab, role switch, etc.) --
// unlike the field link above, nothing is locked down. This is just a
// bookmark/share-friendly shortcut into a specific project for people who
// already have full access (PM, procurement, etc.), not a restricted link.
const OPEN_PROJECT_MODE = !FIELD_MODE && location.hash.replace('#','').split('&').includes('open');
function projectLink(projectId){
  return location.origin + location.pathname + location.search + '#open&project=' + encodeURIComponent(projectId);
}

/* ============================= CALC ENGINE ============================= */
// boq/logs are accepted as optional explicit params so the Hub and Overview
// screens can compute a summary for *any* project, not just the one open in
// P(). Every call from inside a project screen omits them and falls back to
// the currently open project via P().
function dailyTarget(item){
  const days = daysBetween(item.startDate,item.endDate)+1;
  return item.qtyTotal / Math.max(days,1);
}
function plannedCumAt(item,dateStr){
  const days = daysBetween(item.startDate,item.endDate)+1;
  const elapsed = clamp(daysBetween(item.startDate,dateStr)+1,0,days);
  return elapsed<=0 ? 0 : elapsed*dailyTarget(item);
}
function actualCumAt(item,dateStr,logs){
  logs = logs || P().logs;
  let sum=0;
  for(const log of logs){
    if(log.date>dateStr) continue;
    for(const e of log.entries) if(e.itemId===item.id) sum += Number(e.actualQty)||0;
  }
  return sum;
}
function todayQtyFor(item,dateStr,logs){
  logs = logs || P().logs;
  const log = logs.find(l=>l.date===dateStr);
  if(!log) return 0;
  return log.entries.filter(e=>e.itemId===item.id).reduce((s,e)=>s+(Number(e.actualQty)||0),0);
}
function itemLoggedDates(item,logs){
  logs = logs || P().logs;
  const set=[];
  for(const log of logs){ if(log.entries.some(e=>e.itemId===item.id)) set.push(log.date); }
  return set.sort();
}
function itemPrediction(item, asOf, logs){
  logs = logs || P().logs;
  const dates = itemLoggedDates(item,logs).filter(d=>d<=asOf);
  const actual = actualCumAt(item,asOf,logs);
  const remaining = Math.max(item.qtyTotal - actual,0);
  if(remaining<=0){
    const lastDate = dates.length? dates[dates.length-1] : item.startDate;
    return {finishDate:lastDate, burnRate:null, done:true};
  }
  if(dates.length===0) return {finishDate:item.endDate, burnRate:null, done:false};
  const span = Math.max(daysBetween(dates[0],asOf)+1,1);
  const burnRate = actual/span;
  if(burnRate<=0) return {finishDate:null, burnRate:0, done:false};
  const daysNeeded = Math.ceil(remaining/burnRate);
  return {finishDate: addDays(asOf,daysNeeded), burnRate, done:false};
}
function itemStatus(item,asOf,logs){
  logs = logs || P().logs;
  const planned = plannedCumAt(item,asOf), actual = actualCumAt(item,asOf,logs);
  if(planned<=0 && actual<=0) return 'idle';
  return actual+1e-9 >= planned ? 'ok' : 'bad';
}
function projectSummary(asOf, boq, logs){
  boq = boq || P().boq; logs = logs || P().logs;
  if(boq.length===0) return null;
  let plannedPct=0, actualPct=0, n=0;
  let contractEnd=null, predictedEnd=null, anyPrediction=false;
  for(const item of boq){
    const total = item.qtyTotal||1;
    plannedPct += clamp(plannedCumAt(item,asOf)/total,0,1);
    actualPct += clamp(actualCumAt(item,asOf,logs)/total,0,1);
    n++;
    if(!contractEnd || item.endDate>contractEnd) contractEnd=item.endDate;
    const pred = itemPrediction(item,asOf,logs);
    if(pred.finishDate){ anyPrediction=true; if(!predictedEnd || pred.finishDate>predictedEnd) predictedEnd=pred.finishDate; }
  }
  plannedPct = n? (plannedPct/n)*100 : 0;
  actualPct = n? (actualPct/n)*100 : 0;
  const delta = actualPct - plannedPct;
  const delayDays = (predictedEnd && contractEnd) ? daysBetween(contractEnd,predictedEnd) : null;
  return {plannedPct,actualPct,delta,contractEnd,predictedEnd,delayDays,anyPrediction};
}

/* ============================= BOQ IMPORT (new-project attach) ============================= */
// Lets "New project" optionally attach a BOQ file/paste and pre-fill the
// project's boq[] instead of starting empty. Everything funnels into one
// shared shape -- boqImport.rows (array of string arrays) -- regardless of
// source (pasted table, CSV, Excel, PDF text layer), then one column-mapping
// + preview UI (in projectModalHtml) lets the user confirm/fix the guess
// before creating the project. This is a static site with no backend, so
// Excel and PDF parsing load their libraries from a CDN on demand (only when
// that file type is actually used) rather than bundling them unconditionally.
function parseNumLoose(s){
  if(s==null) return null;
  const t = String(s).replace(/[,\s]/g,'').replace(/บาท|บ\.|฿/g,'').trim();
  if(t===''||t==='-') return null;
  const n = parseFloat(t);
  return isNaN(n)? null : n;
}
function parseCsvLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','||c===';'){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parseDelimitedText(text){
  const lines = text.replace(/\r\n?/g,'\n').split('\n').filter(l=>l.trim()!=='');
  const useTab = lines.some(l=>l.includes('\t'));
  return lines.map(l=> useTab? l.split('\t').map(s=>s.trim()) : parseCsvLine(l));
}
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[data-dyn-src="${src}"]`)){
      const existing = document.querySelector(`script[data-dyn-src="${src}"]`);
      if(existing.dataset.loaded==='1') resolve(); else existing.addEventListener('load',()=>resolve());
      return;
    }
    const s=document.createElement('script');
    s.src=src; s.dataset.dynSrc=src;
    s.onload=()=>{ s.dataset.loaded='1'; resolve(); };
    s.onerror=()=>reject(new Error('โหลดไลบรารีไม่สำเร็จ (ต้องใช้อินเทอร์เน็ต)'));
    document.head.appendChild(s);
  });
}
async function parseXlsxFile(file){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = window.XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
  return rows.map(r=> r.map(c=> String(c==null?'':c).trim())).filter(r=> r.some(c=>c!==''));
}
async function parsePdfFile(file){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let totalChars=0;
  const allLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    totalChars += content.items.reduce((s,it)=>s+(it.str||'').length,0);
    const items = content.items.map(it=>({str:it.str, x:it.transform[4], y:it.transform[5]})).filter(it=>it.str.trim()!=='');
    items.sort((a,b)=> b.y-a.y || a.x-b.x);
    let curY=null, curLine=[];
    const lines=[];
    const TOL=3;
    items.forEach(it=>{
      if(curY===null || Math.abs(it.y-curY)>TOL){ if(curLine.length) lines.push(curLine); curLine=[it]; curY=it.y; }
      else curLine.push(it);
    });
    if(curLine.length) lines.push(curLine);
    lines.forEach(line=>{
      line.sort((a,b)=>a.x-b.x);
      const cells=[]; let cur=''; let lastX=null;
      line.forEach(it=>{
        if(lastX!==null && (it.x-lastX)>10){ cells.push(cur.trim()); cur=''; }
        cur += (cur?' ':'') + it.str;
        lastX = it.x + it.str.length*3;
      });
      if(cur.trim()) cells.push(cur.trim());
      if(cells.length) allLines.push(cells);
    });
  }
  const avgCharsPerPage = pdf.numPages? totalChars/pdf.numPages : 0;
  return {rows:allLines, avgCharsPerPage, numPages:pdf.numPages};
}
function guessBoqColumns(headerRow){
  const norm = s => String(s||'').toLowerCase().replace(/[()]/g,'').trim();
  const h = (headerRow||[]).map(norm);
  const find = (keywords)=>{ for(let i=0;i<h.length;i++){ if(keywords.some(k=>h[i].includes(k))) return i; } return -1; };
  return {
    code: find(['รหัส','item id','item code','code','wbs','no.','no ','ลำดับ']),
    name: find(['รายการ','description','item name','name','งาน','material','วัสดุ']),
    unit: find(['หน่วย','unit']),
    qty: find(['ปริมาณ','qty','quantity','จำนวน']),
    price: find(['ราคาต่อหน่วย','ราคา/หน่วย','unit price','unit cost','ราคา','price','cost']),
  };
}
function defaultBoqImportMapping(rows){
  const header = rows[0]||[];
  const guess = guessBoqColumns(header);
  // A confident guess needs at least name+qty found in what looks like a
  // real header row (not the first data row) -- otherwise assume there's no
  // header and fall back to the most common column order.
  const looksLikeHeader = guess.name>=0 && (guess.qty>=0 || guess.price>=0);
  if(looksLikeHeader) return {hasHeader:true, mapping:guess};
  const w = (rows[0]||[]).length;
  return {hasHeader:false, mapping:{code: w>4?0:-1, name: w>4?1:0, unit: w>4?2:1, qty: w>4?3:2, price: w>4?4:3}};
}
function boqImportParsedItems(){
  if(!boqImport || !boqImport.rows || !boqImport.rows.length) return [];
  const {rows, hasHeader, mapping} = boqImport;
  const dataRows = hasHeader? rows.slice(1) : rows;
  const items=[];
  dataRows.forEach(r=>{
    const name = mapping.name>=0? (r[mapping.name]||'').trim() : '';
    if(!name) return;
    const qty = mapping.qty>=0? parseNumLoose(r[mapping.qty]) : null;
    const price = mapping.price>=0? parseNumLoose(r[mapping.price]) : null;
    items.push({
      itemCode: mapping.code>=0? (r[mapping.code]||'').trim() : '',
      name,
      unit: mapping.unit>=0? (r[mapping.unit]||'').trim() : '',
      qtyTotal: qty!=null? qty : 1,
      unitPrice: price,
    });
  });
  return items;
}
function buildBoqFromImport(){
  const items = boqImportParsedItems();
  if(!items.length) return [];
  const start = todayStr();
  return items.map(it=> ({
    id: uid(), itemCode: it.itemCode||'', name: it.name, zone:'', category:'',
    qtyTotal: it.qtyTotal, unit: it.unit||tf('หน่วย','unit'), unitPrice: it.unitPrice,
    startDate: start, endDate: addDays(start,7), actualStartDate:'', actualEndDate:'',
    notes:'', team:'', leader:'', manpower:'', workType:'', allowedHours:'', dependsOn:[], refPhotoIds:[]
  }));
}

function closeProjectModal(){ projectDraft=null; editingProjectId=null; boqImport=null; render(); }
function wireProjectModal(){
  const bg=$('#proj-modal-bg'); if(!bg) return;
  $('#proj-modal-close').onclick = closeProjectModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeProjectModal(); });
  // The name/zone fields aren't two-way-bound to projectDraft (read only at
  // final save, like every other modal in this app) -- but the BOQ-import
  // controls below call render() mid-edit (to refresh the preview table),
  // which rebuilds the whole modal from projectDraft. Without syncing first,
  // that render would silently blank out whatever the user already typed.
  const syncProjectFields = ()=>{
    const nameEl=$('#pm-name'), zoneEl=$('#pm-zone');
    if(nameEl) projectDraft.name = nameEl.value;
    if(zoneEl) projectDraft.zone = zoneEl.value;
  };
  const applyParsedRows = (rows)=>{
    if(!rows.length){ boqImport = {rows:[], warning:tf('ไม่พบข้อมูลตาราง','No table data found')}; return; }
    const def = defaultBoqImportMapping(rows);
    boqImport = {rows, hasHeader:def.hasHeader, mapping:def.mapping, warning:''};
  };
  const parseBtn = $('#boq-parse-paste');
  if(parseBtn) parseBtn.onclick = ()=>{
    const text = $('#boq-paste').value;
    if(!text || !text.trim()){ toast(tf('กรุณาวางข้อมูลก่อน','Please paste some data first')); return; }
    syncProjectFields();
    applyParsedRows(parseDelimitedText(text));
    render();
  };
  const fileInput = $('#boq-file-input');
  if(fileInput) fileInput.onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const fname = file.name.toLowerCase();
    syncProjectFields();
    boqImport = {loading:true, rows:[], hasHeader:true, mapping:{code:-1,name:-1,unit:-1,qty:-1,price:-1}, warning:''};
    render();
    try{
      if(fname.endsWith('.csv')){
        applyParsedRows(parseDelimitedText(await file.text()));
      } else if(fname.endsWith('.xlsx') || fname.endsWith('.xls')){
        applyParsedRows(await parseXlsxFile(file));
      } else if(fname.endsWith('.pdf')){
        const res = await parsePdfFile(file);
        if(res.avgCharsPerPage < 15){
          boqImport = {rows:[], warning: tf('ไฟล์ PDF นี้ดูเหมือนเป็นภาพสแกน (ไม่มีข้อความให้คัดลอก) ระบบดึงข้อมูลอัตโนมัติไม่ได้ กรุณาวางข้อมูลด้วยตนเองในช่องด้านบนแทน หรือแปลงไฟล์เป็น Excel/CSV ก่อน','This PDF looks like a scanned image (no extractable text) -- automatic extraction isn’t possible. Please paste the data into the box above instead, or convert the file to Excel/CSV first.')};
        } else {
          applyParsedRows(res.rows);
        }
      } else {
        toast(tf('รองรับเฉพาะไฟล์ .csv, .xlsx, .xls, .pdf','Only .csv, .xlsx, .xls, .pdf files are supported'));
        boqImport = null;
      }
    }catch(err){
      boqImport = {rows:[], warning: tf('เกิดข้อผิดพลาดขณะอ่านไฟล์ (ต้องใช้อินเทอร์เน็ตเพื่อโหลดตัวอ่านไฟล์ครั้งแรก): ','Error reading file (an internet connection is needed the first time, to load the file reader): ')+((err&&err.message)||err)};
    }
    render();
  };
  const hdrChk = $('#boq-has-header');
  if(hdrChk) hdrChk.onchange = ()=>{ syncProjectFields(); boqImport.hasHeader = hdrChk.checked; render(); };
  ['code','name','unit','qty','price'].forEach(field=>{
    const sel = $('#boq-map-'+field);
    if(sel) sel.onchange = ()=>{ syncProjectFields(); boqImport.mapping[field] = parseInt(sel.value,10); render(); };
  });
  $('#pm-save').onclick = ()=>{
    const name=$('#pm-name').value.trim(), zone=$('#pm-zone').value.trim();
    if(!name){ toast(tf('กรุณาระบุชื่อโครงการ','Please enter a project name')); return; }
    if(editingProjectId==='new'){
      const importedBoq = buildBoqFromImport();
      state.projects.push({id:uid(), name, zone, boq:importedBoq, logs:[], materialRequests:[], costLog:[], createdAt:new Date().toISOString()});
      saveData(); closeProjectModal();
      toast(importedBoq.length? tf('สร้างโปรเจ็คใหม่แล้ว พร้อม BOQ ','Project created with a BOQ of ')+importedBoq.length+tf(' รายการ',' items') : tf('สร้างโปรเจ็คใหม่แล้ว','Project created'));
    } else {
      const pr=state.projects.find(p=>p.id===editingProjectId);
      Object.assign(pr,{name,zone});
      saveData(); closeProjectModal(); toast(tf('บันทึกโปรเจ็คแล้ว','Project saved'));
    }
  };
}

/* ============================= SCREEN: CONTRACTORS (SHARED WORKER/CONTRACTOR ROSTER) ============================= */
// Master roster of contractors/crews, shared across every project (state.contractors).
// "Linked" work history is auto-derived by matching a contractor's name against
// the team names typed into each project's Daily Log workforce entries -- no
// duplicate data entry needed as long as the names match.
function contractorLinkedStats(name){
  const n = (name||'').trim();
  if(!n) return {days:0, headcount:0, lastDate:null, projects:[]};
  let days=0, headcount=0, lastDate=null;
  const projSet = new Set();
  state.projects.forEach(pr=>{
    (pr.logs||[]).forEach(l=>{
      const rows = (l.workforce||[]).filter(w=> (w.team||'').trim()===n);
      if(rows.length){
        days++;
        headcount += rows.reduce((s,w)=> s+(Number(w.count)||0),0);
        if(!lastDate || l.date>lastDate) lastDate=l.date;
        projSet.add(pr.name || tf('(ไม่มีชื่อโปรเจ็ค)','(untitled project)'));
      }
    });
  });
  return {days, headcount, lastDate, projects:Array.from(projSet)};
}

function boqCategoryGroups(boq){
  const used = Array.from(new Set(boq.map(i=>i.category||'').filter(Boolean)));
  const extra = used.filter(c=>!BOQ_CATEGORIES.includes(c));
  const order = BOQ_CATEGORIES.concat(extra);
  const groups = order.map(cat=>({cat, items:boq.filter(i=>(i.category||'')===cat)})).filter(g=>g.items.length);
  const uncategorized = boq.filter(i=>!i.category);
  if(uncategorized.length) groups.push({cat:'', items:uncategorized});
  return groups;
}
const SCHEDULE_STATUS_LABEL = {

  'done': ['เสร็จแล้ว','Done']
};
function itemScheduleStatus(item){
  const progress = (item.progress==null || item.progress==='')? 0 : Number(item.progress);
  if(progress>=100) return 'done';
  if(!item.endDate) return 'on-track';
  const daysLeft = daysBetween(todayStr(), item.endDate); // endDate - today; negative = past due
  if(daysLeft<0) return 'overdue';
  if(daysLeft<=3) return 'near-due';
  return 'on-track';
}
let mpView='table'; // 'table' | 'gantt' -- Master Plan & BOQ display mode, not persisted (resets to table on reload)
function fmtMonthYear(dateStr){
  const d = parseYMD(dateStr);
  return state.lang==='en' ? (ENMONTHS[d.getMonth()]+' '+d.getFullYear()) : (THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543));
}
// Compact day/month numeric date for the narrow Gantt table columns -- e.g.
// "26/8" -- deliberately plain-numeric (no month name/year) so it fits.
function fmtDateShort(dateStr){
  const d = parseYMD(dateStr);
  return d.getDate()+'/'+(d.getMonth()+1);
}
function ganttDayWidth(totalDays){
  if(totalDays<=21) return 36;
  if(totalDays<=45) return 26;
  if(totalDays<=90) return 16;
  if(totalDays<=180) return 10;
  return 6;
}
const GANTT_HEADER_H = 42, GANTT_CAT_ROW_H = 28, GANTT_ITEM_ROW_H = 34;
// Draws an orthogonal "elbow" connector from a predecessor bar's right edge
// to a successor bar's left edge (classic finish-to-start Gantt dependency
// line), routed via a short horizontal stub so it reads clearly even when
// the two rows are far apart vertically or the successor sits to the left
// of the predecessor (out-of-order dates -- still drawn, just crosses back).
function ganttElbowPath(x1,y1,x2,y2){
  const stub = 10;
  const midX = x1+stub;
  if(Math.abs(y1-y2)<1) return `M ${x1} ${y1} L ${x2} ${y2}`;
  const kneeX = Math.max(midX, x2-stub);
  return `M ${x1} ${y1} L ${kneeX} ${y1} L ${kneeX} ${y2} L ${x2} ${y2}`;
}
// Renders the whole Master Plan & BOQ timeline as a horizontally-scrollable
// Gantt chart: a sticky multi-column task table (name/start/end/duration/
// assignee/progress) on the left, a day-scaled timeline with month/day
// header bands on the right, one bar per dated BOQ item (colored by the
// same schedule-status used in the table view) with a translucent
// progress-fill overlay, a "today" marker line, and finish-to-start
// dependency connector arrows drawn from an item's predecessor(s) (set via
// the "Predecessor tasks" field in the item editor). Items without both
// dates are skipped since they have no span to draw; category grouping
// mirrors the table view but always shows every item (ignores the table's
// collapse/expand state, since a timeline is most useful seen in full).
function ganttChartHtml(groups){
  const datedGroups = groups.map(g=> ({...g, items:g.items.filter(i=>i.startDate && i.endDate)})).filter(g=>g.items.length);
  const allItems = datedGroups.flatMap(g=>g.items);
  if(!allItems.length){
    return `<div class="empty"><span class="ic">📊</span>${tf('ยังไม่มีรายการที่ระบุวันเริ่มและวันสิ้นสุด ใส่วันที่ในรายการงานเพื่อดู Gantt chart','No items with both a start and end date yet -- add dates to your work items to see the Gantt chart')}</div>`;
  }
  let minDate = allItems.reduce((m,i)=> i.startDate<m? i.startDate : m, allItems[0].startDate);
  let maxDate = allItems.reduce((m,i)=> i.endDate>m? i.endDate : m, allItems[0].endDate);
  minDate = addDays(minDate,-1);
  maxDate = addDays(maxDate,1);
  const totalDays = daysBetween(minDate,maxDate)+1;
  const dayW = ganttDayWidth(totalDays);
  const totalW = totalDays*dayW;
  const labelW = 460;
  const today = todayStr();
  const showTodayLine = today>=minDate && today<=maxDate;
  const todayOffset = daysBetween(minDate,today)*dayW;

  const months=[];
  let cursor=minDate;
  while(cursor<=maxDate){
    const d = parseYMD(cursor);
    const monthStart = fmtYMD(new Date(d.getFullYear(),d.getMonth(),1));
    const monthEndRaw = fmtYMD(new Date(d.getFullYear(),d.getMonth()+1,0));
    const bandStart = monthStart<minDate? minDate : monthStart;
    const bandEnd = monthEndRaw>maxDate? maxDate : monthEndRaw;
    months.push({label:fmtMonthYear(bandStart), width:(daysBetween(bandStart,bandEnd)+1)*dayW});
    cursor = addDays(bandEnd,1);
  }
  const showDayLabel = dayW>=14;
  const dayLabelEvery = dayW>=14? 1 : (dayW>=8? 7 : 14);
  let dayTicks='';
  for(let i=0;i<totalDays;i++){
    const d = parseYMD(addDays(minDate,i));
    const isWeekend = (d.getDay()===0||d.getDay()===6);
    const showLabel = showDayLabel || (i%dayLabelEvery===0);
    dayTicks += `<div class="gantt-daycell${isWeekend?' weekend':''}" style="width:${dayW}px">${showLabel? `<span>${d.getDate()}</span>` : ''}</div>`;
  }

  // Build rows top-to-bottom while tracking each item's vertical center in
  // px, so the dependency-arrow SVG overlay (built afterward) can connect
  // exact row positions regardless of how many category groups precede them.
  let y = GANTT_HEADER_H;
  const itemCenterY = {};
  const rowsHtml = datedGroups.map(g=>{
    const label = g.cat? escapeHtml(g.cat) : tf('ไม่ระบุหมวดหมู่','Uncategorized');
    const catHeader = `<div class="gantt-row gantt-cat-row">
      <div class="gantt-label-col gantt-cat-label" style="width:${labelW}px">📁 ${label}</div>
      <div class="gantt-timeline-col" style="width:${totalW}px"></div>
    </div>`;
    y += GANTT_CAT_ROW_H;
    const itemRows = g.items.map(item=>{
      const status = itemScheduleStatus(item);
      const statusLabel = tf(SCHEDULE_STATUS_LABEL[status][0], SCHEDULE_STATUS_LABEL[status][1]);
      const progress = (item.progress==null || item.progress==='')? 0 : Number(item.progress);
      const days = daysBetween(item.startDate,item.endDate)+1;
      const assignee = item.leader || item.team || '-';
      const offset = daysBetween(minDate,item.startDate)*dayW;
      const width = Math.max((daysBetween(item.startDate,item.endDate)+1)*dayW, 10);
      const showInside = width>=90;
      const title = `${item.name} · ${fmtDate(item.startDate)} - ${fmtDate(item.endDate)} · ${statusLabel} · ${progress}%`;
      itemCenterY[item.id] = y + GANTT_ITEM_ROW_H/2;
      y += GANTT_ITEM_ROW_H;
      return `<div class="gantt-row">
        <div class="gantt-label-col item-cols" style="width:${labelW}px" data-edit-item="${item.id}" title="${escapeHtml(title)}">
          <div class="gl-task"><span class="mp-status-dot ${status}"></span>${escapeHtml(item.name)}</div>
          <div class="gl-num">${fmtDateShort(item.startDate)}</div>
          <div class="gl-num">${fmtDateShort(item.endDate)}</div>
          <div class="gl-num">${days}${tf('ว','d')}</div>
          <div>${escapeHtml(assignee)}</div>
          <div class="gl-num">${progress}%</div>
        </div>
        <div class="gantt-timeline-col" style="width:${totalW}px">
          <div class="gantt-bar ${status}" style="left:${offset}px;width:${width}px" data-edit-item="${item.id}" title="${escapeHtml(title)}">
            <div class="gantt-bar-fill" style="width:${clamp(progress,0,100)}%"></div>
            ${showInside? `<span class="gantt-bar-label">${escapeHtml(item.name)}</span>` : ''}
          </div>
          ${!showInside? `<span class="gantt-bar-label-outside" style="left:${offset+width+8}px">${escapeHtml(item.name)}</span>` : ''}
        </div>
      </div>`;
    }).join('');
    return catHeader + itemRows;
  }).join('');
  const contentH = y;

  const edges=[];
  allItems.forEach(item=>{
    (item.dependsOn||[]).forEach(predId=>{
      if(predId===item.id) return;
      const pred = allItems.find(i=>i.id===predId);
      if(!pred || itemCenterY[predId]==null || itemCenterY[item.id]==null) return;
      const predOffset = daysBetween(minDate,pred.startDate)*dayW;
      const predWidth = Math.max((daysBetween(pred.startDate,pred.endDate)+1)*dayW,10);
      const succOffset = daysBetween(minDate,item.startDate)*dayW;
      edges.push({x1:labelW+predOffset+predWidth, y1:itemCenterY[predId], x2:labelW+succOffset, y2:itemCenterY[item.id]});
    });
  });
  const depsSvg = edges.length? `
  <svg class="gantt-deps-svg" width="${labelW+totalW}" height="${contentH}">
    <defs>
      <marker id="gantt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-300)"></path>
      </marker>
    </defs>
    ${edges.map(e=>`<path d="${ganttElbowPath(e.x1,e.y1,e.x2,e.y2)}" style="fill:none;stroke:var(--ink-300);stroke-width:1.5" marker-end="url(#gantt-arrow)"></path>`).join('')}
  </svg>` : '';

  return `
  <div class="gantt-toolbar">
    <button class="gantt-scroll-btn" id="gantt-scroll-left" title="${tf('เลื่อนซ้าย','Scroll left')}">◀</button>
    <button class="gantt-scroll-btn" id="gantt-scroll-right" title="${tf('เลื่อนขวา','Scroll right')}">▶</button>
    <button class="btn ghost sm" id="gantt-scroll-today">📍 ${tf('วันนี้','Today')}</button>
    <span class="hint">${tf('เลื่อนแนวนอนเพื่อดูวันที่/เดือนอื่น','Scroll horizontally to see other dates/months')}</span>
  </div>
  <div class="gantt-topscroll" id="gantt-topscroll"><div style="width:${labelW+totalW}px"></div></div>
  <div class="gantt-outer" id="gantt-scroll-container">
    <div class="gantt-inner" style="width:${labelW+totalW}px">
      ${depsSvg}
      ${showTodayLine? `<div class="gantt-today-line" style="left:${labelW+todayOffset}px" title="${tf('วันนี้','Today')}"></div>` : ''}
      <div class="gantt-row gantt-header-row">
        <div class="gantt-label-col" style="width:${labelW}px">
          <div>${tf('รายการงาน','Task')}</div>
          <div>${tf('เริ่ม','Start')}</div>
          <div>${tf('สิ้นสุด','End')}</div>
          <div>${tf('วัน','Dur')}</div>
          <div>${tf('ผู้รับผิดชอบ','Assignee')}</div>
          <div>%</div>
        </div>
        <div class="gantt-timeline-col" style="width:${totalW}px">
          <div class="gantt-months">${months.map(m=>`<div class="gantt-month-band" style="width:${m.width}px">${m.label}</div>`).join('')}</div>
          <div class="gantt-days">${dayTicks}</div>
        </div>
      </div>
      ${rowsHtml}
    </div>
  </div>`;
}
function itemRowHtml(item){
  const days = daysBetween(item.startDate,item.endDate)+1;
  const photoCount = (item.refPhotoIds||[]).length;
  const hasActual = item.actualStartDate && item.actualEndDate;

  const workTypeMain = item.workType? (()=>{const w=workTypeInfo(item.workType); return w? w.ic+' '+escapeHtml(tf(w.th,w.en)) : '<span class="hint">-</span>';})() : '<span class="hint">-</span>';
  const progress = (item.progress==null || item.progress==='')? 0 : Number(item.progress);

    <td data-label="${tf('ทีมงาน','Team')}">${item.team? escapeHtml(item.team) : '<span class="hint">-</span>'}${teamSub? `<span class="mp-sub">${teamSub}</span>` : ''}</td>
    <td data-label="${tf('ลักษณะงาน','Work type')}">${workTypeMain}${item.allowedHours? `<span class="mp-sub">${escapeHtml(item.allowedHours)}</span>` : ''}</td>
    <td data-label="${tf('ปริมาณรวม','Total qty')}" class="tabular">${fmtNum(item.qtyTotal,2)} ${escapeHtml(item.unit)}<span class="mp-sub">${tf('เป้าหมาย','Target')} ${fmtNum(dailyTarget(item),2)}/${tf('วัน','day')}</span></td>
    <td data-label="${tf('วันเริ่ม','Start date')}" class="tabular"><input type="date" class="mp-date-input" data-date-item="${item.id}" data-date-field="startDate" value="${item.startDate}">${hasActual? `<span class="mp-sub">${tf('จริง','Actual')}: ${fmtDate(item.actualStartDate)}</span>` : ''}</td>

    <td data-label="${tf('ความคืบหน้า','Progress')}" class="tabular">
      <div class="mp-progress-wrap">
        <input type="number" min="0" max="100" step="5" class="mp-progress-input" data-progress-item="${item.id}" value="${progress}">

    </td>
  </tr>`;
}

function wireMasterPlan(){
  $('#btn-add-item').onclick = ()=>{ openItemDraft('new'); render(); };
  $$('[data-mp-view]').forEach(b=> b.onclick = ()=>{ if(mpView===b.dataset.mpView) return; mpView=b.dataset.mpView; render(); });
  const ganttScroll = $('#gantt-scroll-container');
  if(ganttScroll){
    const scrollLeftBtn = $('#gantt-scroll-left');
    const scrollRightBtn = $('#gantt-scroll-right');
    const scrollTodayBtn = $('#gantt-scroll-today');
    if(scrollLeftBtn) scrollLeftBtn.onclick = ()=> ganttScroll.scrollBy({left:-240});
    if(scrollRightBtn) scrollRightBtn.onclick = ()=> ganttScroll.scrollBy({left:240});
    if(scrollTodayBtn) scrollTodayBtn.onclick = ()=>{
      const todayLine = $('.gantt-today-line');
      if(todayLine) ganttScroll.scrollTo({left: Math.max(0, todayLine.offsetLeft - ganttScroll.clientWidth/2)});
    };
    // Mirror scrollLeft both ways so the thin bar above the chart (reachable
    // without scrolling the page past a long BOQ) and the chart's own
    // bottom scrollbar always agree -- a flag guards against the two onscroll
    // handlers re-triggering each other in an infinite ping-pong.
    const topScroll = $('#gantt-topscroll');
    if(topScroll){
      let syncing = false;
      topScroll.onscroll = ()=>{ if(syncing) return; syncing=true; ganttScroll.scrollLeft = topScroll.scrollLeft; syncing=false; };
      ganttScroll.onscroll = ()=>{ if(syncing) return; syncing=true; topScroll.scrollLeft = ganttScroll.scrollLeft; syncing=false; };
    }
  }
  $$('[data-toggle-cat]').forEach(row=> row.onclick = ()=>{
    const key = row.dataset.toggleCat;
    if(mpExpandedCats.has(key)) mpExpandedCats.delete(key); else mpExpandedCats.add(key);
    render();
  });
  const expandAllBtn = $('#btn-expand-all-cat');
  if(expandAllBtn) expandAllBtn.onclick = ()=>{
    boqCategoryGroups(P().boq).forEach(g=> mpExpandedCats.add(g.cat || '__uncategorized__'));
    render();
  };
  const collapseAllBtn = $('#btn-collapse-all-cat');
  if(collapseAllBtn) collapseAllBtn.onclick = ()=>{ mpExpandedCats.clear(); render(); };
  $$('[data-date-item]').forEach(inp=> inp.onchange = ()=>{
    const it = P().boq.find(i=>i.id===inp.dataset.dateItem);
    if(!it || !inp.value) return;
    const field = inp.dataset.dateField;
    const otherVal = field==='startDate'? it.endDate : it.startDate;
    if(field==='startDate' && otherVal && inp.value>otherVal){ toast(tf('วันเริ่มต้องไม่เกินวันสิ้นสุด','Start date cannot be after end date')); render(); return; }
    if(field==='endDate' && otherVal && inp.value<otherVal){ toast(tf('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม','End date cannot be before start date')); render(); return; }
    it[field] = inp.value;
    saveData(); render(); toast(tf('อัปเดตวันที่แล้ว','Date updated'));
  });
  $$('[data-progress-item]').forEach(inp=> inp.onchange = ()=>{
    const it = P().boq.find(i=>i.id===inp.dataset.progressItem);
    if(!it) return;
    let v = parseInt(inp.value,10);
    if(isNaN(v)) v=0;
    v = clamp(v,0,100);
    it.progress = v;
    saveData(); render(); toast(tf('อัปเดตความคืบหน้าแล้ว','Progress updated'));
  });
  $$('[data-edit-item]').forEach(b=> b.onclick = ()=>{ openItemDraft(b.dataset.editItem); render(); });
  $$('[data-open-gallery]').forEach(el=> el.onclick = ()=>{ refGalleryItemId=el.dataset.openGallery; render(); });
  $$('[data-quick-attach]').forEach(el=> el.onclick = ()=>{
    const itemId = el.dataset.quickAttach;
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.multiple=true;
    inp.onchange = async ()=>{
      const files = Array.from(inp.files||[]);
      if(!files.length) return;
      const it = P().boq.find(i=>i.id===itemId); if(!it) return;
      it.refPhotoIds = it.refPhotoIds||[];
      for(const f of files){ try{ const dataUrl = await compressImage(f); const pid=uid(); await idbPut(pid,dataUrl); it.refPhotoIds.push(pid); }catch(err){} }
      saveData(); render(); toast(tf('แนบรูปแล้ว','Photo attached'));
    };
    inp.click();
  });
  refreshMasterPlanThumbs();
  $$('[data-del-item]').forEach(b=> b.onclick = ()=>{
    if(!confirm(tf('ลบรายการงานนี้ และประวัติที่เกี่ยวข้องหรือไม่?','Delete this work item and its related history?'))) return;
    const delId = b.dataset.delItem;
    P().boq = P().boq.filter(i=>i.id!==delId);
    P().boq.forEach(i=>{ if(i.dependsOn && i.dependsOn.includes(delId)) i.dependsOn = i.dependsOn.filter(pid=>pid!==delId); });
    P().logs.forEach(l=> l.entries = l.entries.filter(e=>e.itemId!==delId));
    // Unlink (not delete) any material-request lines that pointed at this
    // item -- their cost history stays on the request, it just stops
    // rolling up into a Budget-tab row that no longer exists.
    P().materialRequests.forEach(r=> (r.lines||[]).forEach(l=>{ if(l.taskId===delId) l.taskId=''; }));
    saveData(); render(); toast(tf('ลบรายการแล้ว','Item deleted'));
  });
  const importBtn = $('#btn-import');
  if(importBtn) importBtn.onclick = ()=>{
    const text = $('#import-text').value.trim();
    if(!text){ return; }
    let count=0;
    text.split('\n').forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<5) return;
      const [name,qty,unit,s,en,zone,category,team] = parts;
      const q = parseFloat(qty);
      if(!name||!q||!unit||!/^\d{4}-\d{2}-\d{2}$/.test(s)||!/^\d{4}-\d{2}-\d{2}$/.test(en)) return;
      P().boq.push({id:uid(),name,zone:zone||'',category:category||'',team:team||'',qtyTotal:q,unit,startDate:s,endDate:en}); count++;
    });
    if(count){ saveData(); $('#import-text').value=''; render(); toast(tf('นำเข้า ','Imported ')+count+tf(' รายการแล้ว',' item(s)')); }
    else toast(tf('ไม่พบรายการที่ถูกต้อง ตรวจสอบรูปแบบอีกครั้ง','No valid rows found -- please check the format'));
  };
}

function closeItemModal(){ editingItemId=null; itemDraft=null; render(); }
function wireItemModal(){
  const bg = $('#item-modal-bg');
  if(!bg) return;
  $('#item-modal-close').onclick = closeItemModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeItemModal(); });
  const photoInput = $('#im-photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    const newPhotos = [];
    for(const f of files){ try{ const dataUrl = await compressImage(f); newPhotos.push({dataUrl}); }catch(err){} await new Promise(r=>setTimeout(r,0)); }
    syncItemDraftFromDom();
    itemDraft.pendingPhotos.push(...newPhotos);
    photoInput.value=''; render();
  };
  $$('[data-rm-existing-photo]').forEach(b=> b.onclick = ()=>{
    syncItemDraftFromDom();
    itemDraft.removedPhotoIds.push(b.dataset.rmExistingPhoto);
    render();
  });
  $$('[data-rm-pending-photo]').forEach(b=> b.onclick = ()=>{
    syncItemDraftFromDom();
    itemDraft.pendingPhotos.splice(Number(b.dataset.rmPendingPhoto),1);
    render();
  });
  $('#im-save').onclick = async ()=>{
    syncItemDraftFromDom();
    const d = itemDraft;
    const name=d.name.trim(), category=d.category.trim(), zone=d.zone.trim(), team=d.team.trim(), qty=parseFloat(d.qtyTotal), unit=d.unit.trim();
    const leader=d.leader.trim(), manpower=d.manpower===''?null:parseInt(d.manpower,10), workType=d.workType||'', allowedHours=d.allowedHours.trim();
    const itemCode=d.itemCode.trim(), unitPrice=d.unitPrice===''?null:parseFloat(d.unitPrice);
    const s=d.startDate, en=d.endDate, actualStartDate=d.actualStartDate, actualEndDate=d.actualEndDate, notes=d.notes.trim();
    if(!name || !qty || qty<=0 || !unit || !s || !en || en<s){ toast(tf('กรอกข้อมูลให้ครบและถูกต้อง','Please fill in all fields correctly')); return; }
    if(actualStartDate && actualEndDate && actualEndDate<actualStartDate){ toast(tf('วันสิ้นสุดจริงต้องไม่ก่อนวันเริ่มต้นจริง','Actual end date cannot be before actual start date')); return; }
    if(unitPrice!==null && (isNaN(unitPrice) || unitPrice<0)){ toast(tf('ราคาต่อหน่วยตามแผนต้องเป็นตัวเลขที่มากกว่าหรือเท่ากับ 0','Planned unit price must be a number >= 0')); return; }
    const keptExisting = d.existingPhotoIds.filter(id=>!d.removedPhotoIds.includes(id));
    const newIds = [];
    for(const p of d.pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newIds.push(id); }
    const refPhotoIds = keptExisting.concat(newIds);
    const dependsOn = (d.dependsOn||[]).filter(pid=>pid!==editingItemId);
    if(editingItemId==='new'){ P().boq.push({id:uid(),name,category,zone,team,leader,manpower,workType,allowedHours,itemCode,qtyTotal:qty,unit,unitPrice,startDate:s,endDate:en,actualStartDate,actualEndDate,notes,refPhotoIds,dependsOn}); }
    else { const it = P().boq.find(i=>i.id===editingItemId); Object.assign(it,{name,category,zone,team,leader,manpower,workType,allowedHours,itemCode,qtyTotal:qty,unit,unitPrice,startDate:s,endDate:en,actualStartDate,actualEndDate,notes,refPhotoIds,dependsOn}); }
    saveData(); editingItemId=null; itemDraft=null; render(); toast(tf('บันทึกรายการแล้ว','Item saved'));
  };
  refreshItemModalPhotos();
}
async function refreshItemModalPhotos(){
  const imgs = $$('[data-thumb-id]');
  for(const img of imgs){ const data = await loadRefPhoto(img.dataset.thumbId); if(data) img.src = data; }
}

let refPhotoCache = {}; // photo id -> dataUrl, shared cache for master-plan thumbs/gallery
async function loadRefPhoto(id){
  if(refPhotoCache[id]!==undefined) return refPhotoCache[id];
  const data = await idbGet(id);
  refPhotoCache[id] = data;
  return data;
}
async function refreshMasterPlanThumbs(){
  const imgs = $$('[data-mp-thumb]');
  for(const img of imgs){
    const item = P().boq.find(i=>i.id===img.dataset.mpThumb);
    if(!item || !item.refPhotoIds || !item.refPhotoIds.length) continue;
    const data = await loadRefPhoto(item.refPhotoIds[0]);
    if(data) img.src = data;
  }
}

async function refreshGalleryPhotos(){

function severityInfo(v){ return SEVERITY.find(s=>s.v===v) || SEVERITY[1]; }
function categoriesInBoq(boq){
  const used = Array.from(new Set(boq.map(i=>i.category||'').filter(Boolean)));
  const extra = used.filter(c=>!BOQ_CATEGORIES.includes(c));
  return BOQ_CATEGORIES.filter(c=>used.includes(c)).concat(extra);
}

function ensureDailyDraft(){
  const date = state.selectedLogDate;
  if(dailyDraft && dailyDraft.date===date) return;
  const existing = P().logs.find(l=>l.date===date);
  dailyDraft = {
    date,
    weather: existing ? (existing.weather||'') : '',
    workforce: existing ? (existing.workforce||[]).map(w=>({...w})) : [],
    entries: existing ? (existing.entries||[]).map(e=>({...e})) : [],
    issues: existing ? (existing.issues && existing.issues.length ? existing.issues.map(i=>({...i})) : (existing.note ? [{type:tf('อื่นๆ','Other'),detail:existing.note,severity:'amber'}] : [])) : [],
    deliveryNote: existing ? (existing.deliveryNote||'') : '',
  };
  dailyEntryDraft = {category:'', itemId:'', qty:'', note:''};
}
function syncDailyDraftFromDom(){
  if(!dailyDraft) return;
  const g = (sel)=>{ const el=$(sel); return el?el.value:undefined; };
  const w=g('#log-weather'); if(w!==undefined) dailyDraft.weather=w;
  const dn=g('#log-delivery'); if(dn!==undefined) dailyDraft.deliveryNote=dn;
  $$('[data-wf]').forEach(inp=>{ const row=dailyDraft.workforce[Number(inp.dataset.idx)]; if(row) row[inp.dataset.wf]=inp.value; });
  $$('[data-issue]').forEach(inp=>{ const row=dailyDraft.issues[Number(inp.dataset.idx)]; if(row) row[inp.dataset.issue]=inp.value; });
  const cat=g('#de-category'); if(cat!==undefined) dailyEntryDraft.category=cat;
  const it=g('#de-item'); if(it!==undefined) dailyEntryDraft.itemId=it;
  const q=g('#de-qty'); if(q!==undefined) dailyEntryDraft.qty=q;
  const n=g('#de-note'); if(n!==undefined) dailyEntryDraft.note=n;
}

/* ---- Daily / weekly / monthly log summary (aggregated from proj.logs) ---- */
function sumLogsRange(arr){
  let headcount=0, entries=0, photos=0, issues=0;
  arr.forEach(l=>{
    headcount += (l.workforce||[]).reduce((s,w)=> s+(Number(w.count)||0), 0);
    entries += (l.entries||[]).length;
    photos += (l.photoIds||[]).length;
    issues += (l.issues||[]).length;
  });
  return {days:arr.length, headcount, entries, photos, issues};
}
function isoWeekRange(dateStr){
  const dt = parseYMD(dateStr);
  const day = (dt.getDay()+6)%7; // Mon=0..Sun=6
  const mon = new Date(dt); mon.setDate(dt.getDate()-day);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {start:fmtYMD(mon), end:fmtYMD(sun)};
}
function logPeriodSummary(proj, date){
  const dayLogs = proj.logs.filter(l=> l.date===date);
  const wk = isoWeekKey(date);
  const weekLogs = proj.logs.filter(l=> isoWeekKey(l.date)===wk);
  const ym = date.slice(0,7);
  const monthLogs = proj.logs.filter(l=> l.date.slice(0,7)===ym);
  const range = isoWeekRange(date);
  const d = parseYMD(date);
  return {
    day: sumLogsRange(dayLogs),
    week: sumLogsRange(weekLogs),
    month: sumLogsRange(monthLogs),
    weekLabel: fmtDate(range.start)+' – '+fmtDate(range.end),
    monthLabel: (state.lang==='en'? ENMONTHS[d.getMonth()]+' '+d.getFullYear() : THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543)),
  };
}

async function saveDailyLogAndReturnDate(){
  syncDailyDraftFromDom();
  const date = state.selectedLogDate;
  let log = P().logs.find(l=>l.date===date);
  const newPhotoIds = [];
  const newPhotoMeta = {};
  // Write each pending photo to IndexedDB individually, catching failures
  // per-photo rather than letting one bad photo (or a browser that blocks
  // IndexedDB entirely -- private browsing, some in-app webviews, storage
  // quota exceeded) throw out of the whole function. Without this, an
  // uncaught rejection here would abort the save before it ever reaches the
  // text fields below or saveData() -- the log looks unsaved with no error
  // shown, even though weather/workforce/entries/issues have nothing to do
  // with photo storage and should still be savable.
  let photoFailCount = 0;
  for(const p of pendingPhotos){
    const id=uid();
    try{
      await idbPut(id,p.dataUrl);
      newPhotoIds.push(id);
      newPhotoMeta[id] = {caption:p.caption||'', tag:p.tag||'', kind:p.kind||'image', name:p.name||''};
    }catch(err){
      photoFailCount++;
    }
  }
  if(!log){ log = {id:uid(),date,entries:[],photoIds:[]}; P().logs.push(log); }
  log.weather = dailyDraft.weather;
  log.workforce = dailyDraft.workforce.filter(w=> (w.team||'').trim()).map(w=>({team:w.team,count:w.count,workType:w.workType}));
  log.entries = dailyDraft.entries.slice();
  log.issues = dailyDraft.issues.filter(i=> (i.detail||'').trim());
  log.deliveryNote = dailyDraft.deliveryNote;
  log.photoIds = (log.photoIds||[]).concat(newPhotoIds);
  log.photoMeta = Object.assign(log.photoMeta||{}, newPhotoMeta);
  log.recordedAt = new Date().toISOString();
  P().logs.sort((a,b)=> a.date<b.date?-1:1);
  saveData();
  pendingPhotos=[];
  dailyDraft=null;
  // Returned as an object (not just the date string) so callers can fold
  // photoFailCount into a single combined toast -- calling toast() twice in
  // a row here would just have the second call silently overwrite the first
  // in the shared #toast element before the user ever reads it.
  return {date, photoFailCount};
}

function isoWeekKey(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  const day = (dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-day+3);
  const firstThu = new Date(dt.getFullYear(),0,4);
  const diff = (dt-firstThu)/86400000;
  const wk = 1+Math.round((diff-((firstThu.getDay()+6)%7))/7);
  return dt.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
// Delivery-due reminder: flags a request 'overdue' or 'dueSoon' (within 3 days)
// based on its confirmed delivery date once scheduled, or the earliest
// "needed by" date on its material lines while still pending/approved.
// Rejected requests are never flagged.
function procureDueDate(r){
  if(r.status==='scheduled' && r.procurement && r.procurement.deliveryDate) return r.procurement.deliveryDate;
  return (r.lines||[]).reduce((min,l)=> (!min || (l.neededDate && l.neededDate<min)) ? l.neededDate : min, null);
}
function procureDueStatus(r){
  if(r.status==='rejected') return null;
  const due = procureDueDate(r);
  if(!due) return null;
  const daysLeft = daysBetween(todayStr(), due);
  if(daysLeft<0) return 'overdue';
  if(daysLeft<=3) return 'dueSoon';
  return null;
}
let approverSettingsOpen=false;
function procureSummary(requests){
  const todayKey = todayStr();
  const curWeek = isoWeekKey(todayKey);
  const sumLines = (arr)=> arr.reduce((s,r)=> s+r.lines.length,0);
  const todayReqs = requests.filter(r=> (r.createdAt||'').slice(0,10)===todayKey);
  const weekReqs = requests.filter(r=> isoWeekKey((r.createdAt||'').slice(0,10))===curWeek);
  return {
    today:{count:todayReqs.length, lines:sumLines(todayReqs), pending:todayReqs.filter(r=>r.status==='pending').length},
    week:{count:weekReqs.length, lines:sumLines(weekReqs), pending:weekReqs.filter(r=>r.status==='pending').length}
  };
}

function wireRequestModal(){
  const bg=$('#req-modal-bg'); if(!bg) return;
  $('#req-modal-close').onclick=()=>{ creatingRequest=false; requestForm=null; render(); };
  bg.addEventListener('click', e=>{ if(e.target===bg){ creatingRequest=false; requestForm=null; render(); } });
  $('#rq-add-line').onclick=()=>{ requestForm.lines.push({name:'',qty:'',unit:'',neededDate:addDays(todayStr(),2),category:'',taskId:''}); render(); };
  $$('[data-rm-line]').forEach(b=> b.onclick=()=>{ if(requestForm.lines.length>1){ requestForm.lines.splice(Number(b.dataset.rmLine),1); render(); } else toast(tf('ต้องมีอย่างน้อย 1 รายการ','At least one line is required')); });
  $$('[data-line]').forEach(inp=> inp.oninput=()=>{ requestForm.lines[Number(inp.dataset.idx)][inp.dataset.line] = inp.value; });
  const processRequestFiles = async (fileList)=>{
    const files = Array.from(fileList||[]);
    let skipped = 0;
    for(const f of files){
      try{
        if(f.type==='application/pdf'){
          const dataUrl = await fileToDataUrl(f);
          requestForm.photos.push({dataUrl, name:f.name, kind:'pdf'});
        } else if(f.type.indexOf('image/')===0){
          const dataUrl = await compressImage(f);
          requestForm.photos.push({dataUrl, name:f.name, kind:'image'});
        } else { skipped++; }
      }catch(err){ skipped++; }
      await new Promise(r=>setTimeout(r,0));
    }
    if(skipped) toast(tf('ข้าม ','Skipped ')+skipped+tf(' ไฟล์ที่ไม่รองรับ (รองรับเฉพาะรูปภาพและ PDF)',' unsupported file(s) -- only images and PDF are supported'));
  };
  const dropZone = $('#rq-drop-zone');
  if(dropZone){
    dropZone.ondragover = (e)=>{ e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = ()=>{ dropZone.classList.remove('drag-over'); };
    dropZone.ondrop = async (e)=>{ e.preventDefault(); dropZone.classList.remove('drag-over'); await processRequestFiles(e.dataTransfer.files); render(); };
  }
  const photoInput=$('#rq-photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    await processRequestFiles(e.target.files);
    photoInput.value=''; render();
  };
  $$('[data-rm-req-photo]').forEach(b=> b.onclick=()=>{ requestForm.photos.splice(Number(b.dataset.rmReqPhoto),1); render(); });
  $('#rq-submit').onclick = async ()=>{
    const by=$('#rq-by').value.trim(), area=$('#rq-area').value.trim(), wt=$('#rq-worktype').value.trim();
    const necessityType = $('#rq-necessity') ? $('#rq-necessity').value : '';
    const approverSel = $('#rq-approver'), approverText = $('#rq-approver-text');
    const approverName = (approverSel? approverSel.value : (approverText? approverText.value : '')).trim();
    const lines = requestForm.lines.filter(l=>l.name.trim() && parseFloat(l.qty)>0 && l.unit.trim() && l.neededDate);
    if(!by || !area || lines.length===0){ toast(tf('กรอกผู้สั่งของ พื้นที่ และรายการวัสดุอย่างน้อย 1 รายการ','Please fill in requester, area, and at least one material line')); return; }
    if(!approverName){ toast(tf('กรุณาระบุชื่อผู้อนุมัติ','Please specify an approver')); return; }
    const date = todayStr();
    const reqNo = genReqNo(date);
    const photoIds=[]; const photoMeta={};
    for(const p of requestForm.photos){ const id=uid(); await idbPut(id,p.dataUrl); photoIds.push(id); photoMeta[id]={name:p.name||'', kind:p.kind||'image'}; }
    P().materialRequests.push({
      id:uid(), reqNo, createdAt:new Date().toISOString(), requestedBy:by, area, workType:wt,
      necessityType, approverName,
      lines: lines.map(l=>({name:l.name.trim(),qty:parseFloat(l.qty),unit:l.unit.trim(),neededDate:l.neededDate,category:l.category||'',taskId:l.taskId||''})),
      photoIds, photoMeta, status:'pending', approval:null, procurement:null,
      trashed:false
    });
    saveData(); creatingRequest=false; requestForm=null; toast(tf('ส่งใบสั่งของแล้ว รอการอนุมัติ','Request submitted, awaiting approval')); render();
  };
}
function detailModalHtml(){
  const r = P().materialRequests.find(x=>x.id===procureDetailId);
  if(!r) return '';
  const hasAnyActualCost = r.lines.some(l=> l.actualUnitCost!=null);
  const lines = r.lines.map(l=>{
    const task = l.taskId? P().boq.find(i=>i.id===l.taskId) : null;
    const actualCell = hasAnyActualCost? `<td class="tabular">${l.actualUnitCost!=null? fmtNum(l.actualQty!=null?l.actualQty:l.qty,2)+' × '+fmtCurrency(l.actualUnitCost)+' = '+fmtCurrency((l.actualQty!=null?l.actualQty:l.qty)*l.actualUnitCost) : '-'}</td>` : '';
    return `<tr><td>${escapeHtml(l.name)}${l.category? `<div class="hint">${escapeHtml(procureCategoryLabel(l.category))}</div>`:''}${task? `<div class="hint">🔗 ${escapeHtml(task.name)}</div>`:''}</td><td class="tabular">${fmtNum(l.qty,2)} ${escapeHtml(l.unit)}</td><td class="tabular">${fmtDate(l.neededDate)}</td>${actualCell}</tr>`;
  }).join('');
  // Note: r.approval / r.procurement can be missing even when r.status is
  // 'approved'/'rejected'/'scheduled' if the status was set via the manual
  // procurement status-override control below -- every access here is
  // guarded so the timeline never assumes they exist.
  const steps=[{state:'done',title:tf('สร้างใบสั่งของ','Request created'),sub:escapeHtml(r.requestedBy)+' · '+fmtDateTime(r.createdAt)}];
  if(r.status==='pending'){
    steps.push({state:'wait',title:tf('รอการอนุมัติ','Awaiting approval'),sub:tf('PM / ผู้บริหารยังไม่ได้ตัดสินใจ','PM / owner has not decided yet')});
  } else if(r.status==='rejected'){
