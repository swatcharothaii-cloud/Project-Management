p{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--purple-100)}
:focus-visible{outline:2px solid var(--purple-600);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
.tabular{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

/* ============================= LAYOUT ============================= */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg,var(--purple-700),var(--purple-600));
  color:#fff;
  padding:14px 20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-md);
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
.net-dot{width:8px;height:8px;border-radius:50%;background:#6EF0B8;box-shadow:0 0 0 3px rgba(110,240,184,.28);flex:none}
.net-dot.offline{background:#D7D3F0;box-shadow:0 0 0 3px rgba(215,211,240,.22)}
.topbar .brand .mark{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
  border:1px solid rgba(255,255,255,.28);overflow:hidden;
}
.topbar .brand .mark img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:9px}
.topbar .brand .txt{min-width:64px;flex-shrink:1}
.topbar .brand .txt b{font-family:var(--font-display);font-weight:600;font-size:15.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.topbar .brand .txt span{font-size:12px;opacity:.82;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.status-pill{
  display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
  font-size:12.5px;font-weight:600;white-space:nowrap;
}
.status-pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.status-pill.ok .dot{background:var(--mint-500);box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.status-pill.bad .dot{background:#FCA5A5;box-shadow:0 0 0 3px rgba(252,165,165,.25)}
.status-pill.idle .dot{background:#E0E4FD}

.tabbar{
  position:sticky;top:66px;z-index:39;
  display:flex;gap:2px;background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:0 10px;overflow-x:auto;scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none}
.tabbtn{
  flex:none;display:flex;align-items:center;gap:7px;
  padding:13px 15px;font-size:13.5px;font-weight:600;color:var(--ink-500);
  border:none;background:none;border-bottom:2.5px solid transparent;
  white-space:nowrap;
}
.tabbtn .ic{font-size:15px}
.tabbtn.active{color:var(--purple-700);border-bottom-color:var(--purple-600)}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 64px;}
.screen{display:flex;flex-direction:column;gap:18px;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:700}
.page-head .sub{color:var(--ink-500);font-size:13.5px;margin-top:3px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:18px;box-shadow:var(--shadow-sm);
}
.card.tint{background:var(--purple-50);border-color:var(--purple-100)}
.grid{display:grid;gap:14px}
.grid.cols-auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.cols-proj{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-700)}
.field .hint{font-size:11.5px;color:var(--ink-300);font-weight:400}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;
  background:var(--surface);color:var(--ink-900);width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--purple-600)}
textarea{resize:vertical;min-height:70px;font-family:var(--font-body)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 17px;border-radius:999px;border:1.5px solid transparent;
  font-weight:600;font-size:13.5px;transition:transform .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--purple-600),var(--purple-700));color:#fff;box-shadow:var(--shadow-md)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink-700)}
.btn.ghost:hover{border-color:var(--purple-500);color:var(--purple-700)}
.btn.danger{background:var(--coral-50);color:var(--coral-600);border-color:transparent}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.ok{background:var(--mint-50);color:var(--mint-600)}
.badge.bad{background:var(--coral-50);color:var(--coral-600)}
.badge.idle{background:var(--purple-50);color:var(--purple-700)}

.progress{height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden;position:relative}
.progress > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple-600),var(--purple-700))}
.progress.ok > i{background:linear-gradient(90deg,var(--mint-500),var(--mint-600))}
.progress.bad > i{background:linear-gradient(90deg,var(--coral-500),var(--coral-600))}

table{width:100%;border-collapse:collapse;font-size:13px}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--line)}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--purple-50);color:var(--purple-700);font-family:var(--font-display);font-weight:600;font-size:12.5px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.mp-thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.mp-thumb[data-open-gallery]{cursor:pointer}
.mp-thumb[data-open-gallery]:hover{border-color:var(--purple-500)}
.mp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mp-thumb-empty{font-size:17px;opacity:.35}
.mp-thumb-count{position:absolute;bottom:1px;right:1px;background:rgba(20,18,36,.68);color:#fff;font-size:9px;padding:1px 4px;border-radius:6px;line-height:1.3}
.mp-thumb[data-quick-attach]{cursor:pointer}
.mp-thumb[data-quick-attach]:hover{border-color:var(--purple-500)}
.mp-table tr.mp-cat-row td{background:var(--purple-50);color:var(--purple-700);font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:9px 12px;white-space:normal}
.mp-cat-count{font-weight:400;opacity:.75;font-size:11.5px}

.empty{
  border:1.5px dashed var(--line);border-radius:var(--radius-md);
  padding:34px 20px;text-align:center;color:var(--ink-500);font-size:13.5px;
}
.empty .ic{font-size:30px;margin-bottom:8px;display:block}

.stat{display:flex;flex-direction:column;gap:4px}
.stat .num{font-family:var(--font-mono);font-weight:600;font-size:24px;color:var(--ink-900)}
.stat .lbl{font-size:12px;color:var(--ink-500);font-weight:600}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink-900);color:var(--surface);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:80;opacity:0;
  transition:opacity .25s ease, transform .25s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed;inset:0;background:rgba(20,18,36,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:22px 22px 0 0;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow-lg)}
@media(min-width:720px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:var(--radius-lg)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-500)}

/* ---------- Photo grid ---------- */
.photo-drop{
  border:1.5px dashed var(--purple-100);border-radius:var(--radius-md);background:var(--purple-50);
  padding:22px;text-align:center;color:var(--purple-700);cursor:pointer;font-size:13.5px;font-weight:600;
}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo-item{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.photo-item img{width:100%;height:98px;object-fit:cover;display:block}
.photo-item input,.photo-item select{border:none;border-top:1px solid var(--line);border-radius:0;font-size:10.5px;padding:5px 7px;background:var(--surface);width:100%;display:block}
.photo-item .rm{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(20,18,36,.62);color:#fff;border:none;font-size:12px;line-height:1}
.progressline{height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--purple-600)}

/* ---------- Dashboard ---------- */
.kpi{padding:18px}
.kpi .num{font-size:28px}
.svcurve{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-500)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* ---------- Report ---------- */
#reportPrintable{background:#fff;color:#1E1B31;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.rp-head{background:linear-gradient(135deg,#4F46E5,#6366F1);color:#fff;padding:26px 26px 22px}
.rp-head .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.rp-head h1{font-size:20px;margin-top:6px;font-family:'Kanit',sans-serif}
.rp-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 20px;padding:18px 26px;background:#EEF2FF;font-size:12.5px;border-bottom:1px solid #E3E1F0}
.rp-meta b{display:block;color:#4F46E5;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.rp-section{padding:20px 26px;border-bottom:1px solid #E3E1F0}
.rp-section:last-child{border-bottom:none}
.rp-section h3{font-size:13.5px;color:#4F46E5;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;font-family:'Kanit',sans-serif}
.rp-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rp-summary .box{background:#F7F8FE;border:1px solid #E3E1F0;border-radius:14px;padding:14px}
.rp-summary .box .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px}
.rp-photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rp-photogrid figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid #E3E1F0}
.rp-photogrid img{width:100%;height:110px;object-fit:cover;display:block}
.rp-photogrid figcaption{font-size:10.5px;padding:6px 8px;background:#F7F8FE;color:#3E3A57}
.rp-foot{padding:16px 26px;font-size:11px;color:#6B6784;display:flex;justify-content:space-between;background:#F7F8FE}

/* ---------- Role switcher ---------- */
.role-switch{
  display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:4px;
}
.role-switch button{
  border:none;background:none;color:rgba(255,255,255,.78);font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:999px;white-space:nowrap;
}
.role-switch button.active{background:#fff;color:var(--purple-700)}
.role-note{font-size:11.5px;color:var(--ink-500);display:flex;align-items:center;gap:6px;background:var(--purple-50);border:1px solid var(--purple-100);padding:8px 12px;border-radius:var(--radius-sm)}

/* ---------- Language switcher ---------- */
.lang-switch{
  display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:4px;
}
.lang-switch button{
  border:none;background:none;color:rgba(255,255,255,.78);font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:999px;white-space:nowrap;
}
.lang-switch button.active{background:#fff;color:var(--purple-700)}

/* ---------- Daily log: meta strip + mini rows (progress entries) ---------- */
.meta-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--purple-700);font-weight:700;margin-bottom:2px}
.mini-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.mini-row .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini-row .txt .t1{font-weight:600;font-size:13px;color:var(--ink-900)}
.mini-row .txt .t2{font-size:11.5px;color:var(--ink-500)}

/* ---------- Badges: approval states ---------- */
.badge.pending{background:var(--amber-50);color:var(--amber-600)}
.badge.approved{background:var(--mint-50);color:var(--mint-600)}
.badge.rejected{background:var(--coral-50);color:var(--coral-600)}
.badge.scheduled{background:var(--blue-50);color:var(--blue-600)}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:10px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.kcol-head b{font-family:var(--font-display);font-size:13px}
.kcol-head .count{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:700;color:var(--ink-500)}
.kcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow-sm);
  border-left:3px solid var(--line);
}
.kcard:hover{border-color:var(--purple-500)}
.kcard.pending{border-left-color:var(--amber-500)}
.kcard.approved{border-left-color:var(--mint-500)}
.kcard.rejected{border-left-color:var(--coral-500)}
.kcard.scheduled{border-left-color:var(--blue-500)}
.kcard .reqno{font-family:var(--font-mono);font-size:11px;color:var(--ink-300)}
.kcard .title{font-weight:600;font-size:13.5px}
.kcard .meta{font-size:11.5px;color:var(--ink-500)}
.empty-col{border:1.5px dashed var(--line);border-radius:var(--radius-md);padding:18px;text-align:center;color:var(--ink-300);font-size:12px}

/* ---------- Request detail / timeline ---------- */
.rq-lines{display:flex;flex-direction:column;gap:8px}
.rq-line-row{display:grid;grid-template-columns:1.6fr .7fr .7fr 1fr auto;gap:8px;align-items:center}
@media(max-width:640px){.rq-line-row{grid-template-columns:1fr 1fr;}.rq-line-row input{width:100%}}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl-step:last-child{border-bottom:none}
.tl-dot{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.tl-dot.done{background:var(--mint-50);border-color:var(--mint-500)}
.tl-dot.rej{background:var(--coral-50);border-color:var(--coral-500)}
.tl-dot.wait{background:var(--amber-50);border-color:var(--amber-500)}
.tl-body b{font-size:12.5px;display:block}
.tl-body span{font-size:11.5px;color:var(--ink-500)}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn.approve{background:linear-gradient(135deg,var(--mint-500),var(--mint-600));color:#fff}
.btn.reject{background:linear-gradient(135deg,var(--coral-500),var(--coral-600));color:#fff}
.btn.schedule{background:linear-gradient(135deg,var(--blue-500),var(--blue-600));color:#fff}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.split{grid-template-columns:.9fr 1.3fr}}

@media print{
  body *{visibility:hidden}
  #reportPrintable,#reportPrintable *{visibility:visible}
  #reportPrintable{position:absolute;left:0;top:0;width:100%;box-shadow:none;border:none}
}
.exported-wrap{margin-top:10px;text-align:center}
.exported-wrap img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.exported-wrap p{font-size:11.5px;color:var(--ink-500);margin-top:8px}

@media (max-width:640px){
  .topbar{padding:12px 14px;gap:8px}
  .topbar .status-pill{display:none}
  .topbar .brand .txt span{display:none}
  .topbar .lang-switch,.topbar .role-switch{gap:2px;padding:3px}
  .topbar .lang-switch button,.topbar .role-switch button{padding:5px 8px;font-size:11px}
  main{padding:16px 12px 90px}
  .rp-head,.rp-meta,.rp-section,.rp-foot{padding-left:16px;padding-right:16px}
}
@media (max-width:400px){
  .topbar .brand .mark{width:32px;height:32px}
  .topbar .brand .txt b{font-size:13.5px}
}

/* Master Plan / BOQ table -> stacked cards on narrow screens, so long item
   names and 7 data columns never force horizontal scrolling. */
@media (max-width:760px){
  .mp-wrap{overflow-x:visible;border:none;border-radius:0}
  .mp-table, .mp-table tbody{display:block;width:100%}
  .mp-table thead{display:none}
  .mp-table tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;padding:4px 14px;box-shadow:var(--shadow-sm)}
  .mp-table td{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;white-space:normal;text-align:right;border-bottom:1px solid var(--line);padding:9px 0}
  .mp-table tr td:last-child{border-bottom:none}
  .mp-table td[data-label]:not([data-label=""])::before{content:attr(data-label);flex:none;color:var(--ink-500);font-size:12px;text-align:left;padding-top:1px}
  .mp-table td:first-child{justify-content:center;padding:12px 0}
  .mp-table td.mp-name-cell{text-align:left;justify-content:flex-start;font-weight:600}
  .mp-table td:last-child{justify-content:flex-end;gap:8px}
  .mp-table tr.mp-cat-row{display:block;background:none;border:none;box-shadow:none;padding:0;margin:18px 2px 8px}
  .mp-table tr.mp-cat-row td{display:block;background:var(--purple-50);color:var(--purple-700);border:none;border-radius:var(--radius-sm);padding:9px 12px}
  .mp-table tr.mp-cat-row td::before{content:none}
}
</style>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

/* ============================= UTILS ============================= */
const $ = (s,el)=> (el||document).querySelector(s);
const $$ = (s,el)=> Array.from((el||document).querySelectorAll(s));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const escapeHtml = (s)=> String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================= I18N ============================= */
// tf(thaiText, englishText) -- returns the string matching the current UI
// language. Kept as inline pairs (not a giant key dictionary) since most
// strings here are one-off and easier to review side-by-side at the call site.
function tf(th,en){ return state.lang==='en' ? en : th; }

function pad2(n){return String(n).padStart(2,'0')}
function parseYMD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtYMD(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(dateStr,n){ const d=parseYMD(dateStr); d.setDate(d.getDate()+n); return fmtYMD(d); }
function daysBetween(aStr,bStr){ const a=parseYMD(aStr), b=parseYMD(bStr); return Math.round((b-a)/86400000); }
function todayStr(){ return fmtYMD(new Date()); }
const THMONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const ENMONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtThai(dateStr){ if(!dateStr) return '-'; const d=parseYMD(dateStr); return d.getDate()+' '+THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543); }
function fmtEng(dateStr){ if(!dateStr) return '-'; const d=parseYMD(dateStr); return ENMONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function fmtDate(dateStr){ return state.lang==='en' ? fmtEng(dateStr) : fmtThai(dateStr); }
function isoAt(dateStr,hh,mm){ const d=parseYMD(dateStr); d.setHours(hh,mm,0,0); return d.toISOString(); }
function fmtDateTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(state.lang==='en') return ENMONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  return d.getDate()+' '+THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+' น.';
}
function fmtNum(n,dec){ if(n==null||isNaN(n)) return '-'; dec = dec==null?1:dec; const v=Number(n); const r = Math.round(v*Math.pow(10,dec))/Math.pow(10,dec); return r.toLocaleString(state.lang==='en'?'en-US':'th-TH',{minimumFractionDigits:0,maximumFractionDigits:dec}); }

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================= STORAGE (localStorage) ============================= */
const LS_KEY='sitepulse_v1';
function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveData(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({contractor:state.contractor,projects:state.projects,role:state.role,lang:state.lang})); }
  catch(e){ toast(tf('บันทึกไม่สำเร็จ (พื้นที่จัดเก็บเต็ม)','Save failed (storage is full)')); }
}

/* ============================= STORAGE (IndexedDB for photos) ============================= */
let _dbp=null;
function idb(){
  if(_dbp) return _dbp;
  _dbp = new Promise((resolve,reject)=>{
    const req = indexedDB.open('sitepulse_photos',1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('photos');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbp;
}
async function idbPut(id,dataUrl){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').put(dataUrl,id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(id){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readonly');
    const r=tx.objectStore('photos').get(id);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbDelete(id){
  const db = await idb();
  return new Promise((res)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete=()=>res(true);
  });
}

/* ============================= IMAGE COMPRESSION ============================= */
function compressImage(file, maxDim, quality){
  maxDim = maxDim||1280; quality = quality==null?0.62:quality;
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

/* ============================= CALC ENGINE ============================= */
// boq/logs are accepted as optional explicit params so the Hub and Overview
// screens can compute a summary for *any* project, not just the one open in
// P(). Every call from inside a project screen omits them and falls back to
// the currently open project via P().
function dailyTarget(item){
  const days = daysBetween(item.startDate,item.endDate)+1;
  return item.qtyTotal / Math.max(days,1);
}
function plannedCumAt(item,dateStr){
  const days = daysBetween(item.startDate,item.endDate)+1;
  const elapsed = clamp(daysBetween(item.startDate,dateStr)+1,0,days);
  return elapsed<=0 ? 0 : elapsed*dailyTarget(item);
}
function actualCumAt(item,dateStr,logs){
  logs = logs || P().logs;
  let sum=0;
  for(const log of logs){
    if(log.date>dateStr) continue;
    for(const e of log.entries) if(e.itemId===item.id) sum += Number(e.actualQty)||0;
  }
  return sum;
}
function todayQtyFor(item,dateStr,logs){
  logs = logs || P().logs;
  const log = logs.find(l=>l.date===dateStr);
  if(!log) return 0;
  return log.entries.filter(e=>e.itemId===item.id).reduce((s,e)=>s+(Number(e.actualQty)||0),0);
}
function itemLoggedDates(item,logs){
  logs = logs || P().logs;
  const set=[];
  for(const log of logs){ if(log.entries.some(e=>e.itemId===item.id)) set.push(log.date); }
  return set.sort();
}
function itemPrediction(item, asOf, logs){
  logs = logs || P().logs;
  const dates = itemLoggedDates(item,logs).filter(d=>d<=asOf);
  const actual = actualCumAt(item,asOf,logs);
  const remaining = Math.max(item.qtyTotal - actual,0);
  if(remaining<=0){
    const lastDate = dates.length? dates[dates.length-1] : item.startDate;
    return {finishDate:lastDate, burnRate:null, done:true};
  }
  if(dates.length===0) return {finishDate:item.endDate, burnRate:null, done:false};
  const span = Math.max(daysBetween(dates[0],asOf)+1,1);
  const burnRate = actual/span;
  if(burnRate<=0) return {finishDate:null, burnRate:0, done:false};
  const daysNeeded = Math.ceil(remaining/burnRate);
  return {finishDate: addDays(asOf,daysNeeded), burnRate, done:false};
}
function itemStatus(item,asOf,logs){
  logs = logs || P().logs;
  const planned = plannedCumAt(item,asOf), actual = actualCumAt(item,asOf,logs);
  if(planned<=0 && actual<=0) return 'idle';
  return actual+1e-9 >= planned ? 'ok' : 'bad';
}
function projectSummary(asOf, boq, logs){
  boq = boq || P().boq; logs = logs || P().logs;
  if(boq.length===0) return null;
  let plannedPct=0, actualPct=0, n=0;
  let contractEnd=null, predictedEnd=null, anyPrediction=false;
  for(const item of boq){
    const total = item.qtyTotal||1;
    plannedPct += clamp(plannedCumAt(item,asOf)/total,0,1);
    actualPct += clamp(actualCumAt(item,asOf,logs)/total,0,1);
    n++;
    if(!contractEnd || item.endDate>contractEnd) contractEnd=item.endDate;
    const pred = itemPrediction(item,asOf,logs);
    if(pred.finishDate){ anyPrediction=true; if(!predictedEnd || pred.finishDate>predictedEnd) predictedEnd=pred.finishDate; }
  }
  plannedPct = n? (plannedPct/n)*100 : 0;
  actualPct = n? (actualPct/n)*100 : 0;
  const delta = actualPct - plannedPct;
  const delayDays = (predictedEnd && contractEnd) ? daysBetween(contractEnd,predictedEnd) : null;
  return {plannedPct,actualPct,delta,contractEnd,predictedEnd,delayDays,anyPrediction};
}

function renderScreen(){
  if(FIELD_MODE){
    if(!state.currentProjectId) return `<div class="empty"><span class="ic">🔗</span>${tf('ไม่พบโปรเจ็คสำหรับลิงก์นี้ กรุณาขอลิงก์ใหม่จากผู้ดูแลโปรเจ็ค','This link is not linked to any project. Please ask the project owner for a new link.')}</div>`;
    return renderDailyLog();
  }
  if(state.view==='hub') return renderHub();
  if(state.view==='overview') return renderOverview();
  if(state.view==='profile') return renderProfile();
  switch(state.tab){
    case 'masterplan': return renderMasterPlan();
    case 'dailylog': return renderDailyLog();
    case 'procure': return renderProcure();
    case 'dashboard': return renderDashboard();
    case 'report': return renderReport();
    default: return renderMasterPlan();
  }
}

function resetTransient(){
  pendingPhotos=[];
  editingItemId=null; itemDraft=null;
  creatingRequest=false; requestForm=null; procureDetailId=null; refGalleryItemId=null;
  projectDraft=null; editingProjectId=null;
  dailyDraft=null; dailyEntryDraft={zone:'',itemId:'',qty:'',note:''};
}
function goToHub(){
  resetTransient();
  state.currentProjectId=null; state.view='hub';
  render(); window.scrollTo({top:0});
}
function enterProject(id){
  resetTransient();
  state.currentProjectId=id; state.view='project'; state.tab='dashboard';
  const proj = P();
  const lastLog = proj.logs[proj.logs.length-1];
  state.selectedLogDate = todayStr();
  state.reportDate = lastLog ? lastLog.date : todayStr();
  render(); window.scrollTo({top:0});
}

function wireGlobal(){
  if(!FIELD_MODE){
    $$('[data-nav]').forEach(b=> b.onclick = ()=>{ state.tab=b.dataset.nav; render(); window.scrollTo({top:0}); });
    $$('[data-view]').forEach(b=> b.onclick = ()=>{ resetTransient(); state.currentProjectId=null; state.view=b.dataset.view; render(); window.scrollTo({top:0}); });
    const backBtn = $('[data-back-hub]'); if(backBtn) backBtn.onclick = goToHub;
    const brandEl = $('.brand'); if(brandEl){ brandEl.style.cursor='pointer'; brandEl.onclick = goToHub; }
    $$('[data-role]').forEach(b=> b.onclick = ()=>{ state.role=b.dataset.role; saveData(); render(); toast(tf('สลับมุมมองเป็น: ','Switched view to: ')+ROLE_LABEL[state.role]); });
    $$('[data-lang]').forEach(b=> b.onclick = ()=>{ if(state.lang===b.dataset.lang) return; state.lang=b.dataset.lang; rebuildLangConstants(); saveData(); render(); });
    $$('[data-open-project]').forEach(b=> b.onclick = ()=> enterProject(b.dataset.openProject));
  }
  wireItemModal();
  wireRequestModal();
  wireDetailModal();
  wireGalleryModal();
  wireProjectModal();
}

/* ============================= SCREEN: HUB (ALL PROJECTS) ============================= */

    const pillText = !summary? tf('ยังไม่มีข้อมูลเพียงพอ','Not enough data yet')
      : (summary.delta>=0? tf('เร็วกว่าแผน ','Ahead of plan ')+fmtNum(Math.abs(summary.delta),1)+'%' : tf('ล่าช้ากว่าแผน ','Behind plan ')+fmtNum(Math.abs(summary.delta),1)+'%');

      <div class="proj-card-head">
        <div>

          ${pr.zone? `<div class="sub">${escapeHtml(pr.zone)}</div>` : ''}
        </div>
        <span class="badge ${st}">${st==='ok'?'🟢':st==='bad'?'🔴':'⏳'} ${pillText}</span>
      </div>

      <div class="sub" style="margin-top:6px">${tf('ความคืบหน้าจริง','Actual progress')} <b class="tabular" style="color:var(--ink-700)">${fmtNum(summary.actualPct,1)}%</b> ${tf('จากแผน','vs. planned')} <span class="tabular">${fmtNum(summary.plannedPct,1)}%</span></div>`
      : `<div class="empty" style="margin-top:10px;padding:16px">${tf('ยังไม่มีรายการงานใน BOQ','No BOQ items yet')}</div>`}
      <div class="sub" style="margin-top:6px">${pr.boq.length} ${tf('รายการงาน','work items')} · ${tf('บันทึกล่าสุด','last log')} ${lastLog? fmtDate(lastLog.date) : tf('ยังไม่มีบันทึก','none yet')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">

        <button class="btn ghost sm" data-edit-project="${pr.id}">${tf('แก้ไข','Edit')}</button>
        <button class="btn ghost sm" data-copy-field="${pr.id}">🔗 ${tf('ลิงก์บันทึกประจำวัน','Daily log link')}</button>

    <div><h2>${tf('โปรเจ็คทั้งหมด','All Projects')}</h2><div class="sub">${state.contractor&&state.contractor.company? escapeHtml(state.contractor.company)+' · ' : ''}${tf('จัดการหลายโปรเจ็คในที่เดียว กดเข้าโปรเจ็คเพื่อบันทึกงานประจำวันหรือดูแดชบอร์ด','Manage every project in one place -- open a project to log daily work or check its dashboard.')}</div></div>

  </div>

let projectDraft=null, editingProjectId=null;
function openProjectDraft(id){
  if(id==='new'){ projectDraft={name:'',zone:''}; editingProjectId='new'; }
  else { const pr=state.projects.find(p=>p.id===id); projectDraft={name:pr.name,zone:pr.zone||''}; editingProjectId=id; }
}
function projectModalHtml(){

  return `<div class="modal-bg" id="proj-modal-bg"><div class="modal">
    <div class="modal-head"><h3>${editingProjectId==='new'? tf('สร้างโปรเจ็คใหม่','New project') : tf('แก้ไขโปรเจ็ค','Edit project')}</h3><button class="iconbtn" id="proj-modal-close">✕</button></div>
    <div class="field"><label>${tf('ชื่อโครงการ','Project name')}</label><input type="text" id="pm-name" value="${escapeHtml(d.name)}" placeholder="${tf('เช่น รีโนเวททาวน์โฮม 3 ชั้น','e.g. 3-storey townhome renovation')}"></div>
    <div class="field" style="margin-top:12px"><label>${tf('โซน/พื้นที่ทำงาน','Zone / work area')}</label><input type="text" id="pm-zone" value="${escapeHtml(d.zone)}" placeholder="${tf('เช่น Master Bedroom & Living Room','e.g. Master Bedroom & Living Room')}"></div>
    <button class="btn primary block" style="margin-top:16px" id="pm-save">${tf('บันทึกโปรเจ็ค','Save project')}</button>
  </div></div>`;
}
function closeProjectModal(){ projectDraft=null; editingProjectId=null; render(); }
function wireProjectModal(){
  const bg=$('#proj-modal-bg'); if(!bg) return;
  $('#proj-modal-close').onclick = closeProjectModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeProjectModal(); });
  $('#pm-save').onclick = ()=>{
    const name=$('#pm-name').value.trim(), zone=$('#pm-zone').value.trim();
    if(!name){ toast(tf('กรุณาระบุชื่อโครงการ','Please enter a project name')); return; }
    if(editingProjectId==='new'){
      state.projects.push({id:uid(), name, zone, boq:[], logs:[], materialRequests:[], createdAt:new Date().toISOString()});
      saveData(); closeProjectModal(); toast(tf('สร้างโปรเจ็คใหม่แล้ว','Project created'));
    } else {
      const pr=state.projects.find(p=>p.id===editingProjectId);
      Object.assign(pr,{name,zone});
      saveData(); closeProjectModal(); toast(tf('บันทึกโปรเจ็คแล้ว','Project saved'));
    }
  };
}
function wireHub(){
  $('#btn-add-project').onclick = ()=>{ openProjectDraft('new'); render(); };
  $$('[data-edit-project]').forEach(b=> b.onclick = ()=>{ openProjectDraft(b.dataset.editProject); render(); });
  $$('[data-del-project]').forEach(b=> b.onclick = ()=>{
    const pr = state.projects.find(p=>p.id===b.dataset.delProject);
    if(!confirm(tf('ลบโปรเจ็ค "'+(pr?pr.name:'')+'" และข้อมูลทั้งหมด (แผนงาน บันทึก รูปภาพ) หรือไม่?','Delete project "'+(pr?pr.name:'')+'" and all its data (plan, logs, photos)?'))) return;
    state.projects = state.projects.filter(p=>p.id!==b.dataset.delProject);
    saveData(); render(); toast(tf('ลบโปรเจ็คแล้ว','Project deleted'));
  });
  $$('[data-copy-field]').forEach(b=> b.onclick = async ()=>{
    const link = fieldLink(b.dataset.copyField);
    try{ await navigator.clipboard.writeText(link); toast(tf('คัดลอกลิงก์บันทึกประจำวันแล้ว','Daily log link copied')); }
    catch(err){ prompt(tf('คัดลอกลิงก์นี้:','Copy this link:'), link); }
  });
}

function renderOverview(){
  const asOf = todayStr();
  const rows = state.projects.map(pr=> ({pr, summary: pr.boq.length? projectSummary(asOf, pr.boq, pr.logs) : null}));
  const withData = rows.filter(r=>r.summary);
  const aheadCount = withData.filter(r=>r.summary.delta>=0).length;
  const behindCount = withData.filter(r=>r.summary.delta<0).length;
  const avgActual = withData.length? withData.reduce((s,r)=>s+r.summary.actualPct,0)/withData.length : 0;
  const tableRows = rows.map(({pr,summary})=>{
    if(!summary){
      return `<tr>
        <td>${escapeHtml(pr.name||tf('(ไม่มีชื่อโปรเจ็ค)','(untitled project)'))}</td>
        <td class="tabular">-</td><td class="tabular">-</td><td><span class="badge idle">⏳ ${tf('ยังไม่มีข้อมูล','No data')}</span></td><td class="tabular">-</td>
        <td><button class="btn ghost sm" data-open-project="${pr.id}">${tf('เปิด','Open')}</button></td>
      </tr>`;
    }
    const st = summary.delta>=0?'ok':'bad';
    return `<tr>
      <td>${escapeHtml(pr.name||tf('(ไม่มีชื่อโปรเจ็ค)','(untitled project)'))}${pr.zone?` <span class="sub" style="font-weight:400">(${escapeHtml(pr.zone)})</span>`:''}</td>
      <td class="tabular">${fmtNum(summary.plannedPct,1)}%</td>
      <td class="tabular">${fmtNum(summary.actualPct,1)}%</td>
      <td><span class="badge ${st}">${st==='ok'? '🟢 '+tf('เร็วกว่า/ตรงแผน','Ahead / on plan') : '🔴 '+tf('ล่าช้า','Behind')} ${fmtNum(Math.abs(summary.delta),1)}%</span></td>
      <td class="tabular">${summary.anyPrediction? fmtDate(summary.predictedEnd) : tf('รอข้อมูล','Pending data')}</td>
      <td><button class="btn ghost sm" data-open-project="${pr.id}">${tf('เปิด','Open')}</button></td>
    </tr>`;
  }).join('');
  return `
  <div class="page-head"><div><h2>${tf('ภาพรวมทุกโปรเจ็ค','All-Project Overview')}</h2><div class="sub">${tf('สรุปสถานะรวมของทุกโปรเจ็คที่กำลังดำเนินการ อัปเดตล่าสุด','Combined status of every active project, updated')} ${fmtDate(asOf)}</div></div></div>
  ${state.projects.length===0? `<div class="empty"><span class="ic">📈</span>${tf('ยังไม่มีโปรเจ็ค กลับไปหน้าโปรเจ็คทั้งหมดเพื่อสร้างโปรเจ็คแรก','No projects yet -- go to All Projects to create your first one')}</div>` : `
  <div class="grid cols-auto">
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('โปรเจ็คทั้งหมด','Total projects')}</span><span class="num">${state.projects.length}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('เร็วกว่า/ตรงตามแผน','Ahead / on plan')}</span><span class="num" style="color:var(--mint-600)">${aheadCount}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('ล่าช้ากว่าแผน','Behind plan')}</span><span class="num" style="color:var(--coral-600)">${behindCount}</span></div></div>
    <div class="card kpi"><div class="stat"><span class="lbl">${tf('ความคืบหน้าเฉลี่ยจริง','Avg. actual progress')}</span><span class="num">${fmtNum(avgActual,1)}%</span></div></div>
  </div>
  <div class="card">
    <b style="font-family:var(--font-display)">${tf('ตารางเปรียบเทียบแต่ละโปรเจ็ค','Project comparison')}</b>
    <div class="table-wrap" style="margin-top:12px"><table>
      <thead><tr><th>${tf('โปรเจ็ค','Project')}</th><th>${tf('ตามแผน','Planned')}</th><th>${tf('ทำได้จริง','Actual')}</th><th>${tf('สถานะ','Status')}</th><th>${tf('คาดเสร็จ','Est. finish')}</th><th></th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table></div>
  </div>`}
  `;
}

  '5. งานประตู','6. งานไฟฟ้าแสงสว่าง','7. งานปลั๊ก/สายไฟ','8. งานสุขภัณฑ์',

];
const STANDARD_TEAMS = [
  'ทีมเตรียมการ/ป้องกันหน้างาน','ทีมประสานงาน/เอกสาร','ทีมรื้อถอน','ทีมโครงสร้าง/ผนังเบา',
  'ทีม Finishing (ฉาบ/สี)','ทีมกระเบื้อง/พื้น','ทีมประตู-หน้าต่าง','ทีมไฟฟ้า','ทีมสุขภัณฑ์/ประปา',
  'ทีมเฟอร์นิเจอร์บิ้วอิน','ทีมผ้าม่าน','ทีมแอร์','ทีมระบบป้องกันอัคคีภัย','ทีมทำความสะอาดหน้างาน'
];
function boqCategoryGroups(boq){
  const used = Array.from(new Set(boq.map(i=>i.category||'').filter(Boolean)));
  const extra = used.filter(c=>!BOQ_CATEGORIES.includes(c));
  const order = BOQ_CATEGORIES.concat(extra);
  const groups = order.map(cat=>({cat, items:boq.filter(i=>(i.category||'')===cat)})).filter(g=>g.items.length);
  const uncategorized = boq.filter(i=>!i.category);
  if(uncategorized.length) groups.push({cat:'', items:uncategorized});
  return groups;
}

function wireMasterPlan(){

    const itemId = el.dataset.quickAttach;

    inp.type='file'; inp.accept='image/*'; inp.multiple=true;
    inp.onchange = async ()=>{
      const files = Array.from(inp.files||[]);
      if(!files.length) return;
      const it = P().boq.find(i=>i.id===itemId); if(!it) return;
      it.refPhotoIds = it.refPhotoIds||[];
      for(const f of files){ try{ const dataUrl = await compressImage(f); const pid=uid(); await idbPut(pid,dataUrl); it.refPhotoIds.push(pid); }catch(err){} }
      saveData(); render(); toast(tf('แนบรูปแล้ว','Photo attached'));
    };
    inp.click();
  });
  refreshMasterPlanThumbs();
  $$('[data-del-item]').forEach(b=> b.onclick = ()=>{
    if(!confirm(tf('ลบรายการงานนี้ และประวัติที่เกี่ยวข้องหรือไม่?','Delete this work item and its related history?'))) return;
    P().boq = P().boq.filter(i=>i.id!==b.dataset.delItem);
    P().logs.forEach(l=> l.entries = l.entries.filter(e=>e.itemId!==b.dataset.delItem));

  });
  const importBtn = $('#btn-import');
  if(importBtn) importBtn.onclick = ()=>{
    const text = $('#import-text').value.trim();
    if(!text){ return; }
    let count=0;
    text.split('\n').forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<5) return;
      const [name,qty,unit,s,en,zone,category,team] = parts;
      const q = parseFloat(qty);
      if(!name||!q||!unit||!/^\d{4}-\d{2}-\d{2}$/.test(s)||!/^\d{4}-\d{2}-\d{2}$/.test(en)) return;
      P().boq.push({id:uid(),name,zone:zone||'',category:category||'',team:team||'',qtyTotal:q,unit,startDate:s,endDate:en}); count++;
    });
    if(count){ saveData(); $('#import-text').value=''; render(); toast(tf('นำเข้า ','Imported ')+count+tf(' รายการแล้ว',' item(s)')); }

function wireItemModal(){

    if(!name || !qty || qty<=0 || !unit || !s || !en || en<s){ toast(tf('กรอกข้อมูลให้ครบและถูกต้อง','Please fill in all fields correctly')); return; }

    const keptExisting = d.existingPhotoIds.filter(id=>!d.removedPhotoIds.includes(id));
    const newIds = [];
    for(const p of d.pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newIds.push(id); }
    const refPhotoIds = keptExisting.concat(newIds);
    if(editingItemId==='new'){ P().boq.push({id:uid(),name,category,zone,team,qtyTotal:qty,unit,startDate:s,endDate:en,actualStartDate,actualEndDate,notes,refPhotoIds}); }

    saveData(); editingItemId=null; itemDraft=null; render(); toast(tf('บันทึกรายการแล้ว','Item saved'));
  };
  refreshItemModalPhotos();
}

/* ---- Daily / weekly / monthly log summary (aggregated from proj.logs) ---- */
function sumLogsRange(arr){
  let headcount=0, entries=0, photos=0, issues=0;
  arr.forEach(l=>{
    headcount += (l.workforce||[]).reduce((s,w)=> s+(Number(w.count)||0), 0);
    entries += (l.entries||[]).length;
    photos += (l.photoIds||[]).length;
    issues += (l.issues||[]).length;
  });
  return {days:arr.length, headcount, entries, photos, issues};
}
function isoWeekRange(dateStr){
  const dt = parseYMD(dateStr);
  const day = (dt.getDay()+6)%7; // Mon=0..Sun=6
  const mon = new Date(dt); mon.setDate(dt.getDate()-day);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {start:fmtYMD(mon), end:fmtYMD(sun)};
}
function logPeriodSummary(proj, date){
  const dayLogs = proj.logs.filter(l=> l.date===date);
  const wk = isoWeekKey(date);
  const weekLogs = proj.logs.filter(l=> isoWeekKey(l.date)===wk);
  const ym = date.slice(0,7);
  const monthLogs = proj.logs.filter(l=> l.date.slice(0,7)===ym);
  const range = isoWeekRange(date);
  const d = parseYMD(date);
  return {
    day: sumLogsRange(dayLogs),
    week: sumLogsRange(weekLogs),
    month: sumLogsRange(monthLogs),
    weekLabel: fmtDate(range.start)+' – '+fmtDate(range.end),
    monthLabel: (state.lang==='en'? ENMONTHS[d.getMonth()]+' '+d.getFullYear() : THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543)),
  };
}

async function saveDailyLogAndReturnDate(){
  syncDailyDraftFromDom();
  const date = state.selectedLogDate;
  let log = P().logs.find(l=>l.date===date);
  const newPhotoIds = [];
  const newPhotoMeta = {};
  for(const p of pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newPhotoIds.push(id); newPhotoMeta[id] = {caption:p.caption||'', tag:p.tag||''}; }
  if(!log){ log = {id:uid(),date,entries:[],photoIds:[]}; P().logs.push(log); }
  log.weather = dailyDraft.weather;
  log.workforce = dailyDraft.workforce.filter(w=> (w.team||'').trim()).map(w=>({team:w.team,count:w.count,workType:w.workType}));
  log.entries = dailyDraft.entries.slice();
  log.issues = dailyDraft.issues.filter(i=> (i.detail||'').trim());
  log.deliveryNote = dailyDraft.deliveryNote;
  log.photoIds = (log.photoIds||[]).concat(newPhotoIds);
  log.photoMeta = Object.assign(log.photoMeta||{}, newPhotoMeta);
  log.recordedAt = new Date().toISOString();
  P().logs.sort((a,b)=> a.date<b.date?-1:1);
  saveData();
  pendingPhotos=[];
  dailyDraft=null;
  return date;
}
function wireDailyLog(){
  const dateInput = $('#log-date');
  if(dateInput) dateInput.onchange = ()=>{ state.selectedLogDate = dateInput.value; pendingPhotos=[]; dailyDraft=null; render(); };

  const photoInput = $('#photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const existing = P().logs.find(l=>l.date===state.selectedLogDate);
    const savedCount = (existing&&existing.photoIds&&existing.photoIds.length)||0;
    const room = PHOTO_MAX - savedCount - pendingPhotos.length;
    if(room<=0){ toast(tf('ครบจำนวนสูงสุด 30 รูปแล้ว','Reached the maximum of 30 photos')); photoInput.value=''; return; }
    const toProcess = files.slice(0, room);
    if(files.length>toProcess.length) toast(tf('เพิ่มได้สูงสุด 30 รูป ระบบเลือกให้ ','Max 30 photos -- only the first ')+toProcess.length+tf(' รูปแรก',' were added'));
    const bar = $('#compress-progress'); bar.style.display='block';
    for(let i=0;i<toProcess.length;i++){
      $('#compress-bar').style.width = Math.round(((i)/toProcess.length)*100)+'%';
      $('#compress-label').textContent = tf('กำลังบีบอัดรูป ','Compressing photo ')+(i+1)+' / '+toProcess.length+'...';
      try{
        const dataUrl = await compressImage(toProcess[i]);
        pendingPhotos.push({dataUrl,caption:'',tag:''});

    dailyDraft.entries.push({itemId, category:dailyEntryDraft.category||'', actualQty:qty, note:(dailyEntryDraft.note||'').trim()});
    dailyEntryDraft = {category:dailyEntryDraft.category, itemId:'', qty:'', note:''};

  const saveBtn = $('#btn-save-log');
  if(saveBtn) saveBtn.onclick = async ()=>{
    saveBtn.disabled = true; saveBtn.textContent=tf('กำลังบันทึก...','Saving...');
    const date = await saveDailyLogAndReturnDate();
    toast(tf('บันทึกรายงานประจำวันแล้ว','Daily report saved'));

    const date = await saveDailyLogAndReturnDate();

function isoWeekKey(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  const day = (dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-day+3);
  const firstThu = new Date(dt.getFullYear(),0,4);
  const diff = (dt-firstThu)/86400000;
  const wk = 1+Math.round((diff-((firstThu.getDay()+6)%7))/7);
  return dt.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
function procureSummary(requests){
  const todayKey = todayStr();
  const curWeek = isoWeekKey(todayKey);
  const sumLines = (arr)=> arr.reduce((s,r)=> s+r.lines.length,0);
  const todayReqs = requests.filter(r=> (r.createdAt||'').slice(0,10)===todayKey);
  const weekReqs = requests.filter(r=> isoWeekKey((r.createdAt||'').slice(0,10))===curWeek);
  return {
    today:{count:todayReqs.length, lines:sumLines(todayReqs), pending:todayReqs.filter(r=>r.status==='pending').length},
    week:{count:weekReqs.length, lines:sumLines(weekReqs), pending:weekReqs.filter(r=>r.status==='pending').length}
  };
}

function buildSCurve(asOf){
  const proj = P();
  const starts = proj.boq.map(i=>i.startDate);
  const ends = proj.boq.map(i=>i.endDate);
  const summary0 = projectSummary(asOf, proj.boq, proj.logs);
  let rangeEnd = ends.reduce((a,b)=>a>b?a:b);
  if(summary0.predictedEnd && summary0.predictedEnd>rangeEnd) rangeEnd = summary0.predictedEnd;
  const rangeStart = starts.reduce((a,b)=>a<b?a:b);
  const totalDays = Math.max(daysBetween(rangeStart,rangeEnd),1);
  const W=760,H=220,padL=34,padR=14,padT=14,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xFor = (i)=> padL + (i/totalDays)*plotW;
  const yFor = (pct)=> padT + plotH - (clamp(pct,0,100)/100)*plotH;
  let plannedPts=[], actualPts=[];
  for(let d=0; d<=totalDays; d+=Math.max(1,Math.round(totalDays/60))){
    const dateStr = addDays(rangeStart,d);
    let pSum=0,n=0; proj.boq.forEach(it=>{ pSum+=clamp(plannedCumAt(it,dateStr)/(it.qtyTotal||1),0,1); n++; });
    plannedPts.push([xFor(d), yFor((pSum/n)*100)]);
    if(dateStr<=asOf){
      let aSum=0; proj.boq.forEach(it=>{ aSum+=clamp(actualCumAt(it,dateStr,proj.logs)/(it.qtyTotal||1),0,1); });
      actualPts.push([xFor(d), yFor((aSum/n)*100)]);
    }
  }
  const path = pts => 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
  const todayX = xFor(clamp(daysBetween(rangeStart,asOf),0,totalDays));
  const gridLines = [0,25,50,75,100].map(p=>`<line x1="${padL}" x2="${W-padR}" y1="${yFor(p)}" y2="${yFor(p)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-8}" y="${yFor(p)+3}" font-size="9" fill="var(--ink-300)" text-anchor="end" font-family="IBM Plex Mono">${p}</text>`).join('');
  const svg = `<svg class="svcurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <line x1="${todayX}" x2="${todayX}" y1="${padT}" y2="${H-padB}" stroke="var(--ink-300)" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="${todayX}" y="${H-padB+14}" font-size="9" fill="var(--ink-500)" text-anchor="middle" font-family="IBM Plex Mono">${tf('วันนี้','today')}</text>
    <path d="${path(plannedPts)}" fill="none" stroke="var(--purple-600)" stroke-width="2.4"/>
    ${actualPts.length>1? `<path d="${path(actualPts)}" fill="none" stroke="var(--mint-500)" stroke-width="2.4"/>` : ''}
    ${actualPts.length? `<circle cx="${actualPts[actualPts.length-1][0]}" cy="${actualPts[actualPts.length-1][1]}" r="3.6" fill="var(--mint-500)"/>` : ''}
  </svg>`;
  return {svg};
}

let reportPhotoCache = {}; // id -> dataUrl
async function loadReportPhotos(log, reqs){
  const out=[];
  for(const pid of (log?log.photoIds:[])||[]){
    if(!reportPhotoCache[pid]) reportPhotoCache[pid] = await idbGet(pid);
    if(reportPhotoCache[pid]){
      const meta = (log.photoMeta&&log.photoMeta[pid]) || (log._captions? {caption:log._captions[pid]} : {});
      const caption = (meta.tag? '['+meta.tag+'] ' : '') + (meta.caption || tf('ภาพหน้างาน','site photo'));
      out.push({id:pid, dataUrl:reportPhotoCache[pid], caption});
    }
  }
  for(const r of (reqs||[])){
    for(const pid of (r.photoIds||[])){
      if(!reportPhotoCache[pid]) reportPhotoCache[pid] = await idbGet(pid);
      if(reportPhotoCache[pid]) out.push({id:pid, dataUrl:reportPhotoCache[pid], caption:tf('อ้างอิงวัสดุ: ','material reference: ')+((r.lines[0]&&r.lines[0].name)||r.reqNo)});
    }
  }
  return out;
}

    <div class="field" style="min-width:200px">
      <select id="report-date-select">${options || `<option value="${state.reportDate}">${fmtDate(state.reportDate)} (${tf('ยังไม่มีบันทึก','no log yet')})</option>`}</select>
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn primary" id="btn-print">🖨️ ${tf('พิมพ์ / บันทึกเป็น PDF','Print / Save as PDF')}</button>

function reqReportBlock(r){
  const lines = r.lines.map(l=>`${escapeHtml(l.name)} × ${fmtNum(l.qty,2)} ${escapeHtml(l.unit)} (${tf('ต้องใช้','needed')} ${fmtDate(l.neededDate)})`).join('<br>');
  let approvalHtml, procureHtml='';
  if(r.status==='pending') approvalHtml = `⚡ ${tf('สถานะการอนุมัติ:','Approval status:')} <b style="color:#B4740E">🟡 ${tf('รออนุมัติ','Pending approval')}</b>`;
  else if(r.status==='rejected') approvalHtml = `⚡ ${tf('สถานะการอนุมัติ:','Approval status:')} <b style="color:#DC3B3B">🔴 ${tf('ปฏิเสธ','Rejected')}</b> ${tf('โดย','by')} ${escapeHtml(r.approval.by)} (${fmtDateTime(r.approval.at)})${r.approval.reason?' — '+escapeHtml(r.approval.reason):''}`;
  else {
    approvalHtml = `⚡ ${tf('สถานะการอนุมัติ:','Approval status:')} <b style="color:#0D9668">🟢 ${tf('อนุมัติแล้ว','Approved')}</b> ${tf('โดย','by')} ${escapeHtml(r.approval.by)} (${fmtDateTime(r.approval.at)})${r.approval.reason?' — '+escapeHtml(r.approval.reason):''}`;
    if(r.status==='scheduled') procureHtml = `<br>🚚 ${tf('สถานะการจัดซื้อ:','Procurement status:')} <b style="color:#2563D9">🔵 ${tf('ยืนยันวันส่งมอบแล้ว','Delivery date confirmed')}</b> ${tf('โดย','by')} ${escapeHtml(r.procurement.by)} (${fmtDateTime(r.procurement.at)})<br>&gt;&gt; ${tf('ยืนยันของถึงหน้างานวันที่:','Confirmed on-site delivery date:')} <b>${fmtDate(r.procurement.deliveryDate)}</b>${r.procurement.note?' ('+escapeHtml(r.procurement.note)+')':''}`;
    else procureHtml = `<br>🚚 ${tf('สถานะการจัดซื้อ: รอฝ่ายจัดซื้อนัดส่งของ','Procurement status: awaiting delivery schedule')}`;
  }
  return `<div style="font-size:12.5px;line-height:1.85;padding:10px 0">
    <b class="tabular">[${tf('ใบงานที่:','Request:')} ${r.reqNo}]</b> ${tf('ทำรายการวันที่','created')} ${fmtDateTime(r.createdAt)}<br>
    • ${tf('ผู้สั่งของ:','Requested by:')} ${escapeHtml(r.requestedBy)}<br>
    • ${tf('พื้นที่ใช้ของ:','Area:')} ${escapeHtml(r.area||'-')} | ${tf('ประเภทงาน:','Work type:')} ${escapeHtml(r.workType||'-')}<br>
    • ${tf('รายการของ:','Materials:')} ${lines}<br>
    ${approvalHtml}${procureHtml}
  </div>`;
}
function reportBodyHtml(date){
  const proj = P();
  const log = proj.logs.find(l=>l.date===date);
  const summary = proj.boq.length? projectSummary(date, proj.boq, proj.logs) : null;
  const dayReqs = reqsForDate(date);
  const c = state.contractor||{};
  if(!proj.boq.length){
    return `<div class="rp-section"><div class="empty">${tf('ยังไม่มีข้อมูลแผนงานสำหรับสร้างรายงาน','No plan data yet to build a report')}</div></div>`;
  }
  const rows = proj.boq.map(item=>{
    const todayQty = todayQtyFor(item,date,proj.logs);
    const planned = plannedCumAt(item,date), actual = actualCumAt(item,date,proj.logs);
    const st = actual+1e-9>=planned ? 'ok' : 'bad';
    const pct = clamp((actual/item.qtyTotal)*100,0,100);
    const diff = actual-planned;
    return `<tr>
      <td>${escapeHtml(item.name)}</td>
      <td class="tabular">${fmtNum(todayQty,2)} ${escapeHtml(item.unit)}</td>
      <td class="tabular">${fmtNum(actual,2)} / ${fmtNum(planned,2)} ${escapeHtml(item.unit)}</td>
      <td style="min-width:120px"><div class="progress ${st}"><i style="width:${pct}%"></i></div></td>
      <td>${st==='ok'? `<span class="badge ok">🟢 ${tf('เร็วกว่า','ahead by')} ${fmtNum(Math.abs(diff),1)}</span>` : `<span class="badge bad">🔴 ${tf('ล่าช้า','behind by')} ${fmtNum(Math.abs(diff),1)}</span>`}</td>
    </tr>`;
  }).join('');
  return `
    <div class="rp-head">
      <div style="display:flex;align-items:center;gap:14px">
        ${c.logo? `<img src="${c.logo}" alt="" style="width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;flex:none">` : ''}
        <div>
          <div class="tag">Site Progress Report</div>
          <h1>${tf('รายงานความคืบหน้าและวิเคราะห์หน้างานตกแต่งภายใน','Interior Fit-Out Progress & Analysis Report')}</h1>
        </div>
      </div>
      ${c.company? `<div style="margin-top:10px;font-size:12.5px;opacity:.92;line-height:1.6">
        <b style="font-weight:600">${escapeHtml(c.company)}</b>
        ${c.address? `<br>${escapeHtml(c.address)}` : ''}
        ${(c.taxId||c.email)? `<br>${c.taxId? tf('เลขผู้เสียภาษี ','Tax ID ')+escapeHtml(c.taxId) : ''}${c.taxId&&c.email?' · ':''}${c.email? escapeHtml(c.email) : ''}` : ''}
      </div>` : ''}
    </div>
    <div class="rp-meta">
      <div><b>${tf('โครงการ','Project')}</b>${escapeHtml(proj.name||'-')}${proj.zone?' ('+escapeHtml(proj.zone)+')':''}</div>
      <div><b>${tf('ประจำวันที่','Report date')}</b>${fmtDate(date)}</div>
      <div><b>${tf('ผู้รับเหมาดูแลหน้างาน','Site contractor')}</b>${escapeHtml(c.nickname||c.fullname||'-')}${c.phone?' | '+escapeHtml(c.phone):''}</div>
    </div>
    <div class="rp-section">
      <h3>${tf('สรุปสถานะโครงการประจำวันนี้','Today’s Project Status Summary')}</h3>
      <div class="rp-summary">
        <div class="box"><div class="sub">${tf('ภาพรวมทั้งโปรเจกต์','Overall project')}</div><div class="v" style="color:${summary.delta>=0?'#0D9668':'#DC3B3B'}">${summary.delta>=0?tf('เร็วกว่าแผนสะสม','Ahead of cumulative plan'):tf('ล่าช้ากว่าแผนสะสม','Behind cumulative plan')} ${fmtNum(Math.abs(summary.delta),1)}%</div></div>
        <div class="box"><div class="sub">${tf('คาดการณ์วันเสร็จสิ้น','Completion forecast')}</div><div class="v" style="font-size:13px">${summary.anyPrediction? (summary.delayDays>0? tf('ช้ากว่าแผน ','behind plan by ')+summary.delayDays+tf(' วัน (',' day(s) (')+fmtDate(summary.predictedEnd)+')' : summary.delayDays<0? tf('เร็วกว่าแผน ','ahead of plan by ')+Math.abs(summary.delayDays)+tf(' วัน (',' day(s) (')+fmtDate(summary.predictedEnd)+')' : tf('ตรงตามแผน (','on plan (')+fmtDate(summary.predictedEnd)+')') : tf('รอข้อมูลเพิ่มเติม','awaiting more data')}</div></div>
      </div>
    </div>
    <div class="rp-section">
      <h3>${tf('ตารางเปรียบเทียบปริมาณงาน (อ้างอิง Master Plan & BOQ)','Quantity Comparison (Master Plan & BOQ)')}</h3>
      <div class="table-wrap"><table><thead><tr><th>${tf('รายการงาน','Work item')}</th><th>${tf('ทำได้วันนี้','Done today')}</th><th>${tf('ทำจริงสะสม / แผนสะสม','Actual / planned to date')}</th><th>${tf('ความคืบหน้า','Progress')}</th><th>${tf('สถานะ','Status')}</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    ${log && (log.weather || (log.workforce&&log.workforce.length)) ? `<div class="rp-section"><h3>🌦️ ${tf('สภาพหน้างานและกำลังพล','Site Condition & Workforce')}</h3>
      ${log.weather? `<p style="font-size:13px;line-height:1.7"><b>${tf('สภาพหน้างาน:','Condition:')}</b> ${escapeHtml(log.weather)}</p>` : ''}
      ${(log.workforce&&log.workforce.length)? `<div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>${tf('ทีมงาน','Team')}</th><th>${tf('จำนวนคน','Headcount')}</th><th>${tf('ประเภทงาน','Work type')}</th></tr></thead><tbody>${log.workforce.map(w=>`<tr><td>${escapeHtml(w.team||'-')}</td><td class="tabular">${escapeHtml(String(w.count||'-'))}</td><td>${escapeHtml(w.workType||'-')}</td></tr>`).join('')}</tbody></table></div>` : ''}
    </div>` : ''}
    ${log && log.issues && log.issues.length ? `<div class="rp-section"><h3>⚠️ ${tf('ปัญหาและอุปสรรคหน้างาน','Site Issues & Defect Log')}</h3>
      ${log.issues.map(iss=>`<p style="font-size:13px;line-height:1.7">${severityInfo(iss.severity).ic} <b>${escapeHtml(iss.type||'')}</b> — ${escapeHtml(iss.detail||'')}</p>`).join('')}
    </div>` : (log && log.note ? `<div class="rp-section"><h3>⚠️ ${tf('บันทึกอุปสรรคหน้างาน','Site Issues & Notes')}</h3><p style="font-size:13px;line-height:1.7">${escapeHtml(log.note)}</p></div>` : '')}
    ${log && log.deliveryNote ? `<div class="rp-section"><h3>🚚 ${tf('การรับของหน้างานวันนี้','Today’s Material Deliveries')}</h3><p style="font-size:13px;line-height:1.7">${escapeHtml(log.deliveryNote)}</p></div>` : ''}
    ${dayReqs.length? `<div class="rp-section"><h3>🛒 ${tf('รายงานการสั่งซื้อวัสดุหน้างาน (Material Request & Procurement Status)','Material Request & Procurement Status')}</h3>${dayReqs.map(reqReportBlock).join('<hr style="border:none;border-top:1px dashed #E3E1F0;margin:2px 0">')}</div>` : ''}
    <div class="rp-section" id="rp-photo-section">
      <h3>📸 ${tf('ภาพถ่ายความคืบหน้าหน้างานประจำวัน','Daily Site Progress Photos')}</h3>
      <div class="rp-photogrid" id="rp-photogrid"><span class="sub">${tf('กำลังโหลดรูปภาพ...','Loading photos...')}</span></div>
    </div>
    <div class="rp-foot">
      <span>${escapeHtml(c.company||'Project Management')} · ${escapeHtml(c.fullname||'')}</span>
      <span>${tf('สร้างรายงานเมื่อ','Report generated')} ${fmtDate(todayStr())}</span>
    </div>
  `;
}
async function refreshReportPhotos(date){
  const proj = P();
  const log = proj.logs.find(l=>l.date===date);
  const reqs = reqsForDate(date);
  const photos = await loadReportPhotos(log, reqs);
  const grid = $('#rp-photogrid');
  if(!grid) return;
  grid.innerHTML = photos.length? photos.map(p=>`<figure><img src="${p.dataUrl}"><figcaption>${escapeHtml(p.caption||tf('ภาพหน้างาน','site photo'))}</figcaption></figure>`).join('') : `<span class="sub">${tf('ไม่มีรูปภาพสำหรับวันนี้','No photos for this day')}</span>`;
}
function wireReport(){
  refreshReportPhotos(state.reportDate);
  const sel = $('#report-date-select');
  if(sel) sel.onchange = ()=>{ state.reportDate = sel.value; $('#reportPrintable').innerHTML = reportBodyHtml(state.reportDate); refreshReportPhotos(state.reportDate); };
  $('#btn-print').onclick = ()=> window.print();
  $('#btn-export-img').onclick = exportReportAsImage;
}
function imgFallbackMsg(){
  return `<div class="card" style="margin-top:10px;background:var(--amber-50);border-color:var(--amber-500)">
  <b style="font-family:var(--font-display);font-size:13px">${tf('สร้างรูปภาพอัตโนมัติไม่สำเร็จในเบราว์เซอร์นี้','Automatic image generation failed in this browser')}</b>
  <p class="sub" style="margin-top:6px">${tf('เบราว์เซอร์บางตัวบล็อกการแปลงหน้าเว็บเป็นรูปภาพด้วยเหตุผลด้านความปลอดภัย วิธีสำรอง: (1) กดปุ่ม “พิมพ์ / บันทึกเป็น PDF” แล้วส่งไฟล์ PDF เข้ากลุ่ม LINE ได้โดยตรง หรือ (2) ใช้ฟีเจอร์ “จับภาพหน้าจอแบบเลื่อน (Scroll Capture / Long Screenshot)” ของมือถือถ่ายรายงานด้านล่างนี้แทน','Some browsers block converting a page to an image for security reasons. Workarounds: (1) tap “Print / Save as PDF” and send the PDF straight into a LINE group, or (2) use your phone’s “Scroll Capture / Long Screenshot” feature on the report below instead.')}</p>
</div>`;
}
async function exportReportAsImage(){
  const holder = $('#export-holder');
  holder.innerHTML = `<div class="sub" style="margin-top:10px">${tf('กำลังสร้างรูปภาพ...','Generating image...')}</div>`;
  try{
    const node = $('#reportPrintable');
    const w = Math.max(node.clientWidth,640);
    const h = node.scrollHeight;
    const styleText = $$('style').map(s=>s.textContent).join('\n');
    // XMLSerializer (not .outerHTML) so void elements like <br> / <img> / <hr>
    // come out self-closed -- foreignObject content must be well-formed XML.
    const inner = new XMLSerializer().serializeToString(node);
    const svgData = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;font-family:Sarabun,sans-serif">
          <style>${styleText}</style>
          ${inner}
        </div>
      </foreignObject>
    </svg>`;
    const svgBlob = new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = ()=>{
      const scale=2;
      const canvas=document.createElement('canvas');
      canvas.width=w*scale; canvas.height=h*scale;
      const ctx=canvas.getContext('2d');
      ctx.scale(scale,scale);
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      try{
        ctx.drawImage(img,0,0,w,h);
        const pngUrl = canvas.toDataURL('image/png');
        holder.innerHTML = `<div class="exported-wrap"><img src="${pngUrl}" alt="report"><p>${tf('กดค้างที่รูป (มือถือ) หรือคลิกขวา &rarr; บันทึกรูปภาพ (คอมพิวเตอร์) เพื่อบันทึกและส่งเข้ากลุ่ม LINE','Press and hold the image (mobile) or right-click &rarr; save image (desktop) to save and send it to a LINE group')}</p></div>`;
      }catch(err){
        holder.innerHTML = imgFallbackMsg();
      }
      URL.revokeObjectURL(url);
    };
    img.onerror = ()=>{ holder.innerHTML = imgFallbackMsg(); URL.revokeObjectURL(url); };
    img.src = url;
  }catch(err){
    holder.innerHTML = imgFallbackMsg();
  }
}

/* ============================= WIRE SCREEN ROUTER ============================= */
function wireScreen(){
  if(FIELD_MODE){ if(state.currentProjectId) wireDailyLog(); return; }
  if(state.view==='hub') return wireHub();
  if(state.view==='profile') return wireProfile();
  if(state.view!=='project') return;
  if(state.tab==='masterplan') wireMasterPlan();
  else if(state.tab==='dailylog') wireDailyLog();
  else if(state.tab==='procure') wireProcure();
  else if(state.tab==='report') wireReport();
}

/* ============================= OFFLINE / CONNECTIVITY ============================= */
function updateNetStatus(){
  const dot = $('#net-dot');
  if(!dot) return;
  if(navigator.onLine){ dot.classList.remove('offline'); dot.title=tf('ออนไลน์','Online'); }
  else { dot.classList.add('offline'); dot.title=tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลบันทึกอยู่ในเครื่องนี้','Offline — you can keep working normally, data is saved on this device'); }
}
window.addEventListener('online', ()=>{ updateNetStatus(); toast(tf('กลับมาออนไลน์แล้ว','Back online')); });
window.addEventListener('offline', ()=>{ updateNetStatus(); toast(tf('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลจะถูกบันทึกในเครื่องนี้','Offline — you can keep working normally, data will be saved on this device')); });

/* ============================= INIT ============================= */
bootstrap();
render();
updateNetStatus();
})();
</script>
