<script>
(function(){

/* ============================= UTILS ============================= */

const $$ = (s,el)=> Array.from((el||document).querySelectorAll(s));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const escapeHtml = (s)=> String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pad2(n){return String(n).padStart(2,'0')}
function parseYMD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtYMD(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(dateStr,n){ const d=parseYMD(dateStr); d.setDate(d.getDate()+n); return fmtYMD(d); }
function daysBetween(aStr,bStr){ const a=parseYMD(aStr), b=parseYMD(bStr); return Math.round((b-a)/86400000); }
function todayStr(){ return fmtYMD(new Date()); }
const THMONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fmtThai(dateStr){ if(!dateStr) return '-'; const d=parseYMD(dateStr); return d.getDate()+' '+THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543); }
function isoAt(dateStr,hh,mm){ const d=parseYMD(dateStr); d.setHours(hh,mm,0,0); return d.toISOString(); }
function fmtDateTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.getDate()+' '+THMONTHS[d.getMonth()]+' '+(d.getFullYear()+543)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+' น.'; }
function fmtNum(n,dec){ if(n==null||isNaN(n)) return '-'; dec = dec==null?1:dec; const v=Number(n); const r = Math.round(v*Math.pow(10,dec))/Math.pow(10,dec); return r.toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:dec}); }

/* ============================= STORAGE (localStorage) ============================= */
const LS_KEY='sitepulse_v1';

  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;

/* ============================= STORAGE (IndexedDB for photos) ============================= */
let _dbp=null;
function idb(){
  if(_dbp) return _dbp;
  _dbp = new Promise((resolve,reject)=>{
    const req = indexedDB.open('sitepulse_photos',1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('photos');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbp;
}
async function idbPut(id,dataUrl){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').put(dataUrl,id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(id){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos','readonly');
    const r=tx.objectStore('photos').get(id);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);

async function idbDelete(id){

    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete=()=>res(true);

/* ============================= IMAGE COMPRESSION ============================= */
function compressImage(file, maxDim, quality){

    const url = URL.createObjectURL(file);

      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

/* ============================= CALC ENGINE ============================= */
function dailyTarget(item){
  const days = daysBetween(item.startDate,item.endDate)+1;
  return item.qtyTotal / Math.max(days,1);
}
function plannedCumAt(item,dateStr){
  const days = daysBetween(item.startDate,item.endDate)+1;
  const elapsed = clamp(daysBetween(item.startDate,dateStr)+1,0,days);
  return elapsed<=0 ? 0 : elapsed*dailyTarget(item);
}
function actualCumAt(item,dateStr){
  let sum=0;
  for(const log of state.logs){
    if(log.date>dateStr) continue;
    for(const e of log.entries) if(e.itemId===item.id) sum += Number(e.actualQty)||0;
  }
  return sum;
}
function todayQtyFor(item,dateStr){
  const log = state.logs.find(l=>l.date===dateStr);
  if(!log) return 0;
  return log.entries.filter(e=>e.itemId===item.id).reduce((s,e)=>s+(Number(e.actualQty)||0),0);
}
function itemLoggedDates(item){
  const set=[];
  for(const log of state.logs){ if(log.entries.some(e=>e.itemId===item.id)) set.push(log.date); }
  return set.sort();
}
function itemPrediction(item, asOf){
  const dates = itemLoggedDates(item).filter(d=>d<=asOf);
  const actual = actualCumAt(item,asOf);
  const remaining = Math.max(item.qtyTotal - actual,0);
  if(remaining<=0){
    const lastDate = dates.length? dates[dates.length-1] : item.startDate;
    return {finishDate:lastDate, burnRate:null, done:true};
  }
  if(dates.length===0) return {finishDate:item.endDate, burnRate:null, done:false};
  const span = Math.max(daysBetween(dates[0],asOf)+1,1);
  const burnRate = actual/span;
  if(burnRate<=0) return {finishDate:null, burnRate:0, done:false};
  const daysNeeded = Math.ceil(remaining/burnRate);
  return {finishDate: addDays(asOf,daysNeeded), burnRate, done:false};
}
function itemStatus(item,asOf){
  const planned = plannedCumAt(item,asOf), actual = actualCumAt(item,asOf);
  if(planned<=0 && actual<=0) return 'idle';
  return actual+1e-9 >= planned ? 'ok' : 'bad';
}
function projectSummary(asOf){
  if(state.boq.length===0) return null;
  let plannedPct=0, actualPct=0, n=0;
  let contractEnd=null, predictedEnd=null, anyPrediction=false;
  for(const item of state.boq){
    const total = item.qtyTotal||1;
    plannedPct += clamp(plannedCumAt(item,asOf)/total,0,1);
    actualPct += clamp(actualCumAt(item,asOf)/total,0,1);
    n++;
    if(!contractEnd || item.endDate>contractEnd) contractEnd=item.endDate;
    const pred = itemPrediction(item,asOf);
    if(pred.finishDate){ anyPrediction=true; if(!predictedEnd || pred.finishDate>predictedEnd) predictedEnd=pred.finishDate; }
  }
  plannedPct = n? (plannedPct/n)*100 : 0;
  actualPct = n? (actualPct/n)*100 : 0;
  const delta = actualPct - plannedPct;
  const delayDays = (predictedEnd && contractEnd) ? daysBetween(contractEnd,predictedEnd) : null;
  return {plannedPct,actualPct,delta,contractEnd,predictedEnd,delayDays,anyPrediction};
}

let itemDraft=null; // {name,qtyTotal,unit,startDate,endDate,existingPhotoIds,pendingPhotos,removedPhotoIds} -- persists across re-renders (e.g. photo add/remove) so in-progress typing is never lost
function openItemDraft(id){
  if(id==='new'){
    itemDraft = {name:'',qtyTotal:'',unit:'ตร.ม.',startDate:todayStr(),endDate:addDays(todayStr(),3),existingPhotoIds:[],pendingPhotos:[],removedPhotoIds:[]};
  } else {
    const it = state.boq.find(i=>i.id===id);
    itemDraft = {name:it.name,qtyTotal:it.qtyTotal,unit:it.unit,startDate:it.startDate,endDate:it.endDate,existingPhotoIds:(it.refPhotoIds||[]).slice(),pendingPhotos:[],removedPhotoIds:[]};
  }
  editingItemId = id;
}
function syncItemDraftFromDom(){

  const g = (sel)=> { const el=$(sel); return el?el.value:undefined; };

  const qty=g('#im-qty'); if(qty!==undefined) itemDraft.qtyTotal=qty;
  const unit=g('#im-unit'); if(unit!==undefined) itemDraft.unit=unit;
  const s=g('#im-start'); if(s!==undefined) itemDraft.startDate=s;
  const en=g('#im-end'); if(en!==undefined) itemDraft.endDate=en;
}

function wireMasterPlan(){
  $('#btn-add-item').onclick = ()=>{ openItemDraft('new'); render(); };
  $$('[data-edit-item]').forEach(b=> b.onclick = ()=>{ openItemDraft(b.dataset.editItem); render(); });
  $$('[data-open-gallery]').forEach(el=> el.onclick = ()=>{ refGalleryItemId=el.dataset.openGallery; render(); });
  refreshMasterPlanThumbs();
  $$('[data-del-item]').forEach(b=> b.onclick = ()=>{
    if(!confirm('ลบรายการงานนี้ และประวัติที่เกี่ยวข้องหรือไม่?')) return;
    state.boq = state.boq.filter(i=>i.id!==b.dataset.delItem);
    state.logs.forEach(l=> l.entries = l.entries.filter(e=>e.itemId!==b.dataset.delItem));
    saveData(); render(); toast('ลบรายการแล้ว');
  });
  const importBtn = $('#btn-import');
  if(importBtn) importBtn.onclick = ()=>{
    const text = $('#import-text').value.trim();
    if(!text){ return; }
    let count=0;
    text.split('\n').forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<5) return;
      const [name,qty,unit,s,en] = parts;
      const q = parseFloat(qty);
      if(!name||!q||!unit||!/^\d{4}-\d{2}-\d{2}$/.test(s)||!/^\d{4}-\d{2}-\d{2}$/.test(en)) return;
      state.boq.push({id:uid(),name,qtyTotal:q,unit,startDate:s,endDate:en}); count++;
    });
    if(count){ saveData(); $('#import-text').value=''; render(); toast('นำเข้า '+count+' รายการแล้ว'); }
    else toast('ไม่พบรายการที่ถูกต้อง ตรวจสอบรูปแบบอีกครั้ง');
  };
}

function closeItemModal(){ editingItemId=null; itemDraft=null; render(); }
function wireItemModal(){
  const bg = $('#item-modal-bg');
  if(!bg) return;
  $('#item-modal-close').onclick = closeItemModal;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeItemModal(); });
  const photoInput = $('#im-photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    const newPhotos = [];
    for(const f of files){ try{ const dataUrl = await compressImage(f); newPhotos.push({dataUrl}); }catch(err){} await new Promise(r=>setTimeout(r,0)); }
    syncItemDraftFromDom();
    itemDraft.pendingPhotos.push(...newPhotos);
    photoInput.value=''; render();
  };
  $$('[data-rm-existing-photo]').forEach(b=> b.onclick = ()=>{
    syncItemDraftFromDom();
    itemDraft.removedPhotoIds.push(b.dataset.rmExistingPhoto);
    render();
  });
  $$('[data-rm-pending-photo]').forEach(b=> b.onclick = ()=>{
    syncItemDraftFromDom();
    itemDraft.pendingPhotos.splice(Number(b.dataset.rmPendingPhoto),1);
    render();
  });
  $('#im-save').onclick = async ()=>{
    syncItemDraftFromDom();
    const d = itemDraft;
    const name=d.name.trim(), qty=parseFloat(d.qtyTotal), unit=d.unit.trim();
    const s=d.startDate, en=d.endDate;
    if(!name || !qty || qty<=0 || !unit || !s || !en || en<s){ toast('กรอกข้อมูลให้ครบและถูกต้อง'); return; }
    const keptExisting = d.existingPhotoIds.filter(id=>!d.removedPhotoIds.includes(id));
    const newIds = [];
    for(const p of d.pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newIds.push(id); }
    const refPhotoIds = keptExisting.concat(newIds);
    if(editingItemId==='new'){ state.boq.push({id:uid(),name,qtyTotal:qty,unit,startDate:s,endDate:en,refPhotoIds}); }
    else { const it = state.boq.find(i=>i.id===editingItemId); Object.assign(it,{name,qtyTotal:qty,unit,startDate:s,endDate:en,refPhotoIds}); }
    saveData(); editingItemId=null; itemDraft=null; render(); toast('บันทึกรายการแล้ว');
  };
  refreshItemModalPhotos();
}
async function refreshItemModalPhotos(){
  const imgs = $$('[data-thumb-id]');

async function loadRefPhoto(id){

  const data = await idbGet(id);
  refPhotoCache[id] = data;
  return data;
}
async function refreshMasterPlanThumbs(){
  const imgs = $$('[data-mp-thumb]');

    if(data) img.src = data;
  }
}

function wireDailyLog(){
  const dateInput = $('#log-date');
  if(dateInput) dateInput.onchange = ()=>{ state.selectedLogDate = dateInput.value; pendingPhotos=[]; render(); };
  const photoInput = $('#photo-input');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const bar = $('#compress-progress'); bar.style.display='block';
    for(let i=0;i<files.length;i++){
      $('#compress-bar').style.width = Math.round(((i)/files.length)*100)+'%';
      $('#compress-label').textContent = `กำลังบีบอัดรูป ${i+1} / ${files.length}...`;
      try{
        const dataUrl = await compressImage(files[i]);
        pendingPhotos.push({dataUrl,caption:''});
      }catch(err){}
      await new Promise(r=>setTimeout(r,0));
    }
    $('#compress-bar').style.width='100%';
    $('#compress-label').textContent = `บีบอัดเสร็จแล้ว ${files.length} รูป`;
    photoInput.value='';
    render();
  };
  $$('[data-rm-photo]').forEach(b=> b.onclick = ()=>{ pendingPhotos.splice(Number(b.dataset.rmPhoto),1); render(); });
  $$('[data-caption]').forEach(inp=> inp.oninput = ()=>{ pendingPhotos[Number(inp.dataset.caption)].caption = inp.value; });
  const saveBtn = $('#btn-save-log');
  if(saveBtn) saveBtn.onclick = async ()=>{
    saveBtn.disabled = true; saveBtn.textContent='กำลังบันทึก...';
    const date = state.selectedLogDate;
    const entries = $$('.qty-input').map(inp=>({itemId:inp.dataset.item, actualQty: inp.value===''?0:parseFloat(inp.value)})).filter(e=>e.actualQty>0 || e.actualQty===0);
    const note = $('#log-note').value.trim();
    let log = state.logs.find(l=>l.date===date);
    const newPhotoIds = [];
    for(const p of pendingPhotos){ const id=uid(); await idbPut(id,p.dataUrl); newPhotoIds.push({id,caption:p.caption}); }
    if(!log){ log = {id:uid(),date,entries:[],note:'',photoIds:[]}; state.logs.push(log); }
    log.entries = entries;
    log.note = note;
    log.photoIds = (log.photoIds||[]).concat(newPhotoIds.map(p=>p.id));
    log._captions = Object.assign(log._captions||{}, Object.fromEntries(newPhotoIds.map(p=>[p.id,p.caption])));
    state.logs.sort((a,b)=> a.date<b.date?-1:1);
    saveData();
    pendingPhotos=[];
    toast('บันทึกรายงานประจำวันแล้ว');
    state.reportDate = date;
    render();
  };
}

function buildSCurve(asOf){
  const starts = state.boq.map(i=>i.startDate);
  const ends = state.boq.map(i=>i.endDate);
  const summary0 = projectSummary(asOf);
  let rangeEnd = ends.reduce((a,b)=>a>b?a:b);
  if(summary0.predictedEnd && summary0.predictedEnd>rangeEnd) rangeEnd = summary0.predictedEnd;
  const rangeStart = starts.reduce((a,b)=>a<b?a:b);
  const totalDays = Math.max(daysBetween(rangeStart,rangeEnd),1);
  const W=760,H=220,padL=34,padR=14,padT=14,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xFor = (i)=> padL + (i/totalDays)*plotW;
  const yFor = (pct)=> padT + plotH - (clamp(pct,0,100)/100)*plotH;
  let plannedPts=[], actualPts=[];
  for(let d=0; d<=totalDays; d+=Math.max(1,Math.round(totalDays/60))){
    const dateStr = addDays(rangeStart,d);
    let pSum=0,n=0; state.boq.forEach(it=>{ pSum+=clamp(plannedCumAt(it,dateStr)/(it.qtyTotal||1),0,1); n++; });
    plannedPts.push([xFor(d), yFor((pSum/n)*100)]);
    if(dateStr<=asOf){
      let aSum=0; state.boq.forEach(it=>{ aSum+=clamp(actualCumAt(it,dateStr)/(it.qtyTotal||1),0,1); });
      actualPts.push([xFor(d), yFor((aSum/n)*100)]);
    }
  }
  const path = pts => 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
  const todayX = xFor(clamp(daysBetween(rangeStart,asOf),0,totalDays));
  const gridLines = [0,25,50,75,100].map(p=>`<line x1="${padL}" x2="${W-padR}" y1="${yFor(p)}" y2="${yFor(p)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-8}" y="${yFor(p)+3}" font-size="9" fill="var(--ink-300)" text-anchor="end" font-family="IBM Plex Mono">${p}</text>`).join('');
  const svg = `<svg class="svcurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <line x1="${todayX}" x2="${todayX}" y1="${padT}" y2="${H-padB}" stroke="var(--ink-300)" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="${todayX}" y="${H-padB+14}" font-size="9" fill="var(--ink-500)" text-anchor="middle" font-family="IBM Plex Mono">วันนี้</text>
    <path d="${path(plannedPts)}" fill="none" stroke="var(--purple-600)" stroke-width="2.4"/>
    ${actualPts.length>1? `<path d="${path(actualPts)}" fill="none" stroke="var(--mint-500)" stroke-width="2.4"/>` : ''}
    ${actualPts.length? `<circle cx="${actualPts[actualPts.length-1][0]}" cy="${actualPts[actualPts.length-1][1]}" r="3.6" fill="var(--mint-500)"/>` : ''}
  </svg>`;
  return {svg};
}

let reportPhotoCache = {}; // id -> dataUrl
async function loadReportPhotos(log, reqs){
  const out=[];
  for(const pid of (log?log.photoIds:[])||[]){
    if(!reportPhotoCache[pid]) reportPhotoCache[pid] = await idbGet(pid);
    if(reportPhotoCache[pid]) out.push({id:pid, dataUrl:reportPhotoCache[pid], caption:(log._captions&&log._captions[pid])||'ภาพหน้างาน'});
  }
  for(const r of (reqs||[])){
    for(const pid of (r.photoIds||[])){
      if(!reportPhotoCache[pid]) reportPhotoCache[pid] = await idbGet(pid);
      if(reportPhotoCache[pid]) out.push({id:pid, dataUrl:reportPhotoCache[pid], caption:'อ้างอิงวัสดุ: '+((r.lines[0]&&r.lines[0].name)||r.reqNo)});
    }
  }
  return out;
}
function renderReport(){
  const dateSet = new Set([...state.logs.map(l=>l.date), ...state.materialRequests.map(r=>r.createdAt.slice(0,10))]);
  const allDates = Array.from(dateSet).sort((a,b)=> a<b?1:-1);
  const options = allDates.map(d=>`<option value="${d}" ${d===state.reportDate?'selected':''}>${fmtThai(d)}</option>`).join('');
  return `
  <div class="page-head">
    <div><h2>ส่งออกรายงาน</h2><div class="sub">รูปแบบนิตยสารสีม่วง-ขาว พร้อมพิมพ์เป็น PDF หรือลองสร้างรูปภาพยาวส่งกลุ่ม LINE</div></div>
    <div class="field" style="min-width:200px">
      <select id="report-date-select">${options || `<option value="${state.reportDate}">${fmtThai(state.reportDate)} (ยังไม่มีบันทึก)</option>`}</select>
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn primary" id="btn-print">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
    <button class="btn ghost" id="btn-export-img">🖼️ ลองสร้างรูปภาพยาว</button>
  </div>
  <div class="role-note">💡 PDF คือช่องทางที่ใช้งานได้แน่นอนที่สุด — LINE ส่งไฟล์ PDF เข้าแชทได้โดยตรง ปุ่ม “ลองสร้างรูปภาพยาว” อาจใช้ไม่ได้ในบางเบราว์เซอร์เนื่องจากข้อจำกัดด้านความปลอดภัย ถ้าใช้ไม่ได้ให้ใช้ฟีเจอร์ “จับภาพหน้าจอแบบเลื่อน (Scroll Capture)” ของมือถือถ่ายรายงานด้านล่างแทน</div>
  <div id="reportPrintable">${reportBodyHtml(state.reportDate)}</div>
  <div id="export-holder"></div>
  `;
}
function reqReportBlock(r){
  const lines = r.lines.map(l=>`${escapeHtml(l.name)} × ${fmtNum(l.qty,2)} ${escapeHtml(l.unit)} (ต้องใช้ ${fmtThai(l.neededDate)})`).join('<br>');
  let approvalHtml, procureHtml='';
  if(r.status==='pending') approvalHtml = `⚡ สถานะการอนุมัติ: <b style="color:#B4740E">🟡 รออนุมัติ</b>`;
  else if(r.status==='rejected') approvalHtml = `⚡ สถานะการอนุมัติ: <b style="color:#DC3B3B">🔴 ปฏิเสธ</b> โดย ${escapeHtml(r.approval.by)} (${fmtDateTime(r.approval.at)})${r.approval.reason?' — '+escapeHtml(r.approval.reason):''}`;
  else {
    approvalHtml = `⚡ สถานะการอนุมัติ: <b style="color:#0D9668">🟢 อนุมัติแล้ว</b> โดย ${escapeHtml(r.approval.by)} (${fmtDateTime(r.approval.at)})${r.approval.reason?' — '+escapeHtml(r.approval.reason):''}`;
    if(r.status==='scheduled') procureHtml = `<br>🚚 สถานะการจัดซื้อ: <b style="color:#2563D9">🔵 ยืนยันวันส่งมอบแล้ว</b> โดย ${escapeHtml(r.procurement.by)} (${fmtDateTime(r.procurement.at)})<br>&gt;&gt; ยืนยันของถึงหน้างานวันที่: <b>${fmtThai(r.procurement.deliveryDate)}</b>${r.procurement.note?' ('+escapeHtml(r.procurement.note)+')':''}`;
    else procureHtml = `<br>🚚 สถานะการจัดซื้อ: รอฝ่ายจัดซื้อนัดส่งของ`;
  }
  return `<div style="font-size:12.5px;line-height:1.85;padding:10px 0">
    <b class="tabular">[ใบงานที่: ${r.reqNo}]</b> ทำรายการวันที่ ${fmtDateTime(r.createdAt)}<br>
    • ผู้สั่งของ: ${escapeHtml(r.requestedBy)}<br>
    • พื้นที่ใช้ของ: ${escapeHtml(r.area||'-')} | ประเภทงาน: ${escapeHtml(r.workType||'-')}<br>
    • รายการของ: ${lines}<br>
    ${approvalHtml}${procureHtml}
  </div>`;
}
function reportBodyHtml(date){
  const log = state.logs.find(l=>l.date===date);
  const summary = projectSummary(date);
  const dayReqs = reqsForDate(date);
  const c = state.contractor||{};
  if(!state.boq.length){
    return `<div class="rp-section"><div class="empty">ยังไม่มีข้อมูลแผนงานสำหรับสร้างรายงาน</div></div>`;
  }
  const rows = state.boq.map(item=>{
    const todayQty = todayQtyFor(item,date);
    const planned = plannedCumAt(item,date), actual = actualCumAt(item,date);
    const st = actual+1e-9>=planned ? 'ok' : 'bad';
    const pct = clamp((actual/item.qtyTotal)*100,0,100);
    const diff = actual-planned;
    return `<tr>
      <td>${escapeHtml(item.name)}</td>
      <td class="tabular">${fmtNum(todayQty,2)} ${escapeHtml(item.unit)}</td>
      <td class="tabular">${fmtNum(actual,2)} / ${fmtNum(planned,2)} ${escapeHtml(item.unit)}</td>
      <td style="min-width:120px"><div class="progress ${st}"><i style="width:${pct}%"></i></div></td>
      <td>${st==='ok'? `<span class="badge ok">🟢 เร็วกว่า ${fmtNum(Math.abs(diff),1)}</span>` : `<span class="badge bad">🔴 ล่าช้า ${fmtNum(Math.abs(diff),1)}</span>`}</td>
    </tr>`;
  }).join('');
  return `
    <div class="rp-head">
      <div class="tag">Site Progress Report</div>
      <h1>รายงานความคืบหน้าและวิเคราะห์หน้างานตกแต่งภายใน</h1>
    </div>
    <div class="rp-meta">
      <div><b>โครงการ</b>${escapeHtml(state.project.name||'-')}${state.project.zone?' ('+escapeHtml(state.project.zone)+')':''}</div>
      <div><b>ประจำวันที่</b>${fmtThai(date)}</div>
      <div><b>ผู้รับเหมาดูแลหน้างาน</b>${escapeHtml(c.nickname||c.fullname||'-')}${c.phone?' | '+escapeHtml(c.phone):''}</div>
    </div>
    <div class="rp-section">
      <h3>สรุปสถานะโครงการประจำวันนี้</h3>
      <div class="rp-summary">
        <div class="box"><div class="sub">ภาพรวมทั้งโปรเจกต์</div><div class="v" style="color:${summary.delta>=0?'#0D9668':'#DC3B3B'}">${summary.delta>=0?'เร็วกว่าแผนสะสม':'ล่าช้ากว่าแผนสะสม'} ${fmtNum(Math.abs(summary.delta),1)}%</div></div>
        <div class="box"><div class="sub">คาดการณ์วันเสร็จสิ้น</div><div class="v" style="font-size:13px">${summary.anyPrediction? (summary.delayDays>0? `ช้ากว่าแผน ${summary.delayDays} วัน (${fmtThai(summary.predictedEnd)})` : summary.delayDays<0? `เร็วกว่าแผน ${Math.abs(summary.delayDays)} วัน (${fmtThai(summary.predictedEnd)})` : `ตรงตามแผน (${fmtThai(summary.predictedEnd)})`) : 'รอข้อมูลเพิ่มเติม'}</div></div>
      </div>
    </div>
    <div class="rp-section">
      <h3>ตารางเปรียบเทียบปริมาณงาน (อ้างอิง Master Plan &amp; BOQ)</h3>
      <div class="table-wrap"><table><thead><tr><th>รายการงาน</th><th>ทำได้วันนี้</th><th>ทำจริงสะสม / แผนสะสม</th><th>ความคืบหน้า</th><th>สถานะ</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    ${log && log.note ? `<div class="rp-section"><h3>⚠️ บันทึกอุปสรรคหน้างาน</h3><p style="font-size:13px;line-height:1.7">${escapeHtml(log.note)}</p></div>` : ''}
    ${dayReqs.length? `<div class="rp-section"><h3>🛒 รายงานการสั่งซื้อวัสดุหน้างาน (Material Request &amp; Procurement Status)</h3>${dayReqs.map(reqReportBlock).join('<hr style="border:none;border-top:1px dashed #E3E1F0;margin:2px 0">')}</div>` : ''}
    <div class="rp-section" id="rp-photo-section">
      <h3>📸 ภาพถ่ายความคืบหน้าหน้างานประจำวัน</h3>
      <div class="rp-photogrid" id="rp-photogrid"><span class="sub">กำลังโหลดรูปภาพ...</span></div>
    </div>
    <div class="rp-foot">
      <span>${escapeHtml(c.company||'ชีพจรไซต์งาน')} · ${escapeHtml(c.fullname||'')}</span>
      <span>สร้างรายงานเมื่อ ${fmtThai(todayStr())}</span>
    </div>
  `;
}
async function refreshReportPhotos(date){
  const log = state.logs.find(l=>l.date===date);
  const reqs = reqsForDate(date);
  const photos = await loadReportPhotos(log, reqs);
  const grid = $('#rp-photogrid');
  if(!grid) return;
  grid.innerHTML = photos.length? photos.map(p=>`<figure><img src="${p.dataUrl}"><figcaption>${escapeHtml(p.caption||'ภาพหน้างาน')}</figcaption></figure>`).join('') : `<span class="sub">ไม่มีรูปภาพสำหรับวันนี้</span>`;
}
function wireReport(){
  refreshReportPhotos(state.reportDate);
  const sel = $('#report-date-select');
  if(sel) sel.onchange = ()=>{ state.reportDate = sel.value; $('#reportPrintable').innerHTML = reportBodyHtml(state.reportDate); refreshReportPhotos(state.reportDate); };
  $('#btn-print').onclick = ()=> window.print();
  $('#btn-export-img').onclick = exportReportAsImage;
}
const IMG_FALLBACK_MSG = `<div class="card" style="margin-top:10px;background:var(--amber-50);border-color:var(--amber-500)">
  <b style="font-family:var(--font-display);font-size:13px">สร้างรูปภาพอัตโนมัติไม่สำเร็จในเบราว์เซอร์นี้</b>
  <p class="sub" style="margin-top:6px">เบราว์เซอร์บางตัวบล็อกการแปลงหน้าเว็บเป็นรูปภาพด้วยเหตุผลด้านความปลอดภัย วิธีสำรอง: (1) กดปุ่ม “พิมพ์ / บันทึกเป็น PDF” แล้วส่งไฟล์ PDF เข้ากลุ่ม LINE ได้โดยตรง หรือ (2) ใช้ฟีเจอร์ “จับภาพหน้าจอแบบเลื่อน (Scroll Capture / Long Screenshot)” ของมือถือถ่ายรายงานด้านล่างนี้แทน</p>
</div>`;
async function exportReportAsImage(){
  const holder = $('#export-holder');
  holder.innerHTML = `<div class="sub" style="margin-top:10px">กำลังสร้างรูปภาพ...</div>`;
  try{
    const node = $('#reportPrintable');
    const w = Math.max(node.clientWidth,640);
    const h = node.scrollHeight;
    const styleText = $$('style').map(s=>s.textContent).join('\n');
    // XMLSerializer (not .outerHTML) so void elements like <br> / <img> / <hr>
    // come out self-closed -- foreignObject content must be well-formed XML.
    const inner = new XMLSerializer().serializeToString(node);
    const svgData = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;font-family:Sarabun,sans-serif">
          <style>${styleText}</style>
          ${inner}
        </div>
      </foreignObject>
    </svg>`;
    const svgBlob = new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = ()=>{
      const scale=2;
      const canvas=document.createElement('canvas');
      canvas.width=w*scale; canvas.height=h*scale;
      const ctx=canvas.getContext('2d');
      ctx.scale(scale,scale);
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      try{
        ctx.drawImage(img,0,0,w,h);
        const pngUrl = canvas.toDataURL('image/png');
        holder.innerHTML = `<div class="exported-wrap"><img src="${pngUrl}" alt="รายงาน"><p>กดค้างที่รูป (มือถือ) หรือคลิกขวา &rarr; บันทึกรูปภาพ (คอมพิวเตอร์) เพื่อบันทึกและส่งเข้ากลุ่ม LINE</p></div>`;
      }catch(err){
        holder.innerHTML = IMG_FALLBACK_MSG;
      }
      URL.revokeObjectURL(url);
    };
    img.onerror = ()=>{ holder.innerHTML = IMG_FALLBACK_MSG; URL.revokeObjectURL(url); };
    img.src = url;
  }catch(err){
    holder.innerHTML = IMG_FALLBACK_MSG;
  }
}

  if(state.tab==='profile') wireProfile();
  else if(state.tab==='masterplan') wireMasterPlan();
  else if(state.tab==='dailylog') wireDailyLog();

function updateNetStatus(){
  const dot = $('#net-dot');
  if(!dot) return;
  if(navigator.onLine){ dot.classList.remove('offline'); dot.title='ออนไลน์'; }
  else { dot.classList.add('offline'); dot.title='ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลบันทึกอยู่ในเครื่องนี้'; }
}
window.addEventListener('online', ()=>{ updateNetStatus(); toast('กลับมาออนไลน์แล้ว'); });
window.addEventListener('offline', ()=>{ updateNetStatus(); toast('ออฟไลน์ — ใช้งานต่อได้ตามปกติ ข้อมูลจะถูกบันทึกในเครื่องนี้'); });

/* ============================= INIT ============================= */
bootstrap();
render();
updateNetStatus();
})();
